  .c .sub2 { position: absolute; left: 64px; top: 520px; font-size: 64px; font-weight: 900; white-space: nowrap; }
  .c .fig { left: 760px; top: 96px; width: 470px; height: 470px; padding: 36px; background: #FFFFFF; border: 2px solid #E3E5EA; border-radius: 36px; }

  .hot { position: absolute; z-index: 1; font-weight: 900; letter-spacing: -0.04em; line-height: 1; white-space: nowrap; }

  .d .band { position: absolute; left: 0; right: 0; bottom: 0; height: 132px; background: #000000; color: #FFE500;
    display: flex; align-items: center; padding-left: 64px; font-size: 64px; font-weight: 900; letter-spacing: -0.02em; }

  .f { background: #111111; }
  .f .glow { position: absolute; left: 760px; top: 110px; width: 460px; height: 460px; }
  .f .glow svg { width: 100%; height: 100%; }
</style>
</head>

      "018": {
        badge: "SQLD",
        d: { l1: "정규화하면 조회는", big: "무조건 느림?", band: "느려질 수도, 빨라질 수도" },
        fig: () => `<svg viewBox="0 0 360 360">
          <rect x="0" y="10" width="360" height="92" rx="14" fill="#000" />
          <path d="M120 22 V90 M240 22 V90" stroke="#FFF" stroke-width="4" />
          <path d="M180 114 V156" stroke="${RED}" stroke-width="14" /><path d="M152 148 L180 192 L208 148 Z" fill="${RED}" />
          <rect x="0" y="210" width="106" height="140" rx="14" fill="#000" />
          <rect x="127" y="210" width="106" height="140" rx="14" fill="#000" />
          <rect x="254" y="210" width="106" height="140" rx="14" fill="#000" />
        </svg>`
      },
      "019": {
        badge: "SQLD",
        d: { l1: "다 지우는 세 명령", big: "똑같다?", band: "롤백되는 건 DELETE뿐" },
        fig: () => `<svg viewBox="0 0 360 360">
          <rect x="0" y="20" width="100" height="320" rx="14" fill="#000" />
          <rect x="130" y="20" width="100" height="320" rx="14" fill="#FFF" stroke="#000" stroke-width="8" />
          <rect x="262" y="22" width="96" height="316" rx="14" fill="none" stroke="${RED}" stroke-width="8" stroke-dasharray="18 12" />
        </svg>`
      },
      "020": {
        badge: "SQLD",
        d: { l1: "ROUND(125, -1)", big: "125?", band: "함수 결과 맞히기 한 번에" },
        fig: () => `<svg viewBox="0 0 360 360">
          <text x="180" y="160" text-anchor="middle" font-family="Paperlogy" font-weight="900" font-size="140" fill="#000">f(x)</text>
          <rect x="50" y="216" width="260" height="116" rx="18" fill="${RED}" stroke="#000" stroke-width="7" />
          <text x="180" y="300" text-anchor="middle" font-family="Paperlogy" font-weight="900" font-size="84" fill="#FFF">130</text>
        </svg>`
      },
      "021": {
        badge: "SQLD",
        d: { l1: "일련번호 PK", big: "만능?", band: "본질식별자 vs 인조식별자" },
        fig: () => `<svg viewBox="0 0 360 360">
          <rect x="0" y="20" width="150" height="130" rx="10" fill="#FFF" stroke="#000" stroke-width="7" />
          <rect x="16" y="34" width="118" height="22" rx="6" fill="${RED}" /><path d="M0 66 H150" stroke="#000" stroke-width="6" />
          <rect x="210" y="20" width="150" height="130" rx="10" fill="#FFF" stroke="#000" stroke-width="7" />
          <path d="M210 66 H360" stroke="#000" stroke-width="6" /><path d="M150 90 H210" stroke="#000" stroke-width="8" />
          <rect x="105" y="215" width="150" height="130" rx="10" fill="#FFF" stroke="#000" stroke-width="7" />
          <path d="M105 261 H255" stroke="#000" stroke-width="6" />
          <path d="M290 150 V285 H255" stroke="${RED}" stroke-width="8" stroke-dasharray="16 10" fill="none" />
        </svg>`
      },
      "022": {
        badge: "SQLD",
        d: { l1: "PIVOT 결과 행 수", big: "부서 수?", band: "남은 열로 묶이는 PIVOT" },
        fig: () => `<svg viewBox="0 0 360 360">
          ${[0, 1, 2, 3, 4].map((i) => `<rect x="0" y="${20 + i * 66}" width="110" height="52" rx="10" fill="#000" />`).join("")}
          <path d="M130 180 H200" stroke="${RED}" stroke-width="14" /><path d="M196 152 L238 180 L196 208 Z" fill="${RED}" />
          ${[0, 1].map((r) => [0, 1, 2].map((c) => `<rect x="${250 + c * 37}" y="${86 + r * 66}" width="30" height="52" rx="6" fill="#000" />`).join("")).join("")}
          <rect x="250" y="218" width="104" height="52" rx="8" fill="${RED}" stroke="#000" stroke-width="5" />
        </svg>`
      },
      "023": {
        badge: "SQLD",
        d: { l1: "숫자 세 자리 찾기", big: "2행?", band: "일부만 맞아도 참이 된다" },
        fig: () => `<svg viewBox="0 0 360 360">
          <rect x="0" y="20" width="360" height="110" rx="18" fill="#000" />
          <text x="180" y="98" text-anchor="middle" font-family="Consolas, monospace" font-weight="700" font-size="62" fill="#FFF">[0-9]{3}</text>
          ${["A101", "205", "4096"].map((s, i) => `<rect x="${i * 124}" y="196" width="112" height="76" rx="12" fill="${i === 1 ? "#000" : RED}" stroke="#000" stroke-width="5" />
            <text x="${i * 124 + 56}" y="246" text-anchor="middle" font-family="Paperlogy" font-weight="900" font-size="34" fill="#FFF">${s}</text>`).join("")}
        </svg>`
      },
      "002": {
        badge: "ADsP · 빅분기",
        title: "ROC 곡선", sub1: "가로축은", sub2: "1 − 특이도",
        cTitle: "ROC 곡선 · AUC", cNum: "0.72", cQ: "곡선 아래 넓이?",
        // 자극형: d = 틀린 답에 ✕, e = 헷갈리는 자리에 빨간 동그라미, f = 큰 숫자
        d: { l1: "ROC 곡선 가로축", big: "특이도?", band: "헷갈리면 바로 감점" },
        e: { tag: "ROC 곡선", lines: ["이거", "헷갈리면", "감점!"], mark: "1 − 특이도" },
        f: { tag: "AUC", big: "0.72", l2: "이 숫자의 정체" },
        fig: (ink, acc) => `<svg viewBox="0 0 360 360">
          <path d="M0 360 L0 216 L72 216 L72 144 L144 144 L144 72 L288 72 L288 0 L360 0 L360 360 Z" fill="${acc}" fill-opacity="0.18" />
          <path d="M0 360 L360 0" stroke="#A1A1AA" stroke-width="6" stroke-dasharray="14 12" fill="none" />
          <path d="M0 0 L0 360 L360 360" stroke="${ink}" stroke-width="7" fill="none" />
          <path d="M0 360 L0 216 L72 216 L72 144 L144 144 L144 72 L288 72 L288 0 L360 0" stroke="${acc}" stroke-width="11" stroke-linejoin="round" fill="none" />
        </svg>`
      }
    };
    const q = new URLSearchParams(location.search);
    const epId = q.get("ep") || "002", ep = EP[epId], style = q.get("style") || "a";
    // 편 → 주제 묶음(topics.json의 group). 새 편을 넣을 때 여기에도 적는다. ?group=으로 색만 미리 볼 수 있다
    const EPG = { "001": "모델 평가", "002": "모델 평가", "003": "모델 평가", "004": "모델 평가", "005": "모델 평가", "006": "연관분석",
                  "007": "SQL 기본", "008": "SQL 기본", "009": "SQL 기본", "010": "SQL 활용", "011": "SQL 활용",
                  "012": "SQL 활용", "013": "SQL 활용", "014": "관리 구문", "015": "SQL 활용", "016": "SQL 활용", "017": "SQL 활용",
                  "018": "데이터 모델링", "019": "관리 구문", "020": "SQL 기본", "021": "데이터 모델링", "022": "SQL 활용", "023": "SQL 활용" };
    const bg = GROUP[q.get("group") || EPG[epId]] || C10.노랑;
    const t = document.getElementById("t");
    // 테두리 글자: data-t를 ::before가 검은 테두리로 한 번 더 그린다
    const hot = (txt, css) => `<div class="hot" data-t="${txt}" style="${css}">${txt}</div>`;
    const badge = q.get("badge") === "1" ? ep.badge : "";
    if (style === "d") {
      t.className = "d";
      t.style.background = bg;
      t.innerHTML = (badge ? `<div class="tag" style="left: 64px; top: 40px">${badge}</div>` : "")
        + `<div class="hot" style="left: 64px; top: 150px; font-size: 96px; color: #000000">${ep.d.l1}</div>`
        + hot(ep.d.big, "left: 58px; top: 270px; font-size: 230px; color: #FFFFFF").replace('class="hot"', 'class="hot" id="big"')
        + `<div class="xbar" style="transform: rotate(28deg)"></div><div class="xbar" style="transform: rotate(-28deg)"></div>`
        + `<div class="fig" style="left: 900px; top: 150px; width: 320px; height: 320px; padding: 26px; background: #FFFFFF; border: 6px solid #000000; border-radius: 28px">${ep.fig("#000000", "#E60012")}</div>`
        + `<div class="band" style="color: ${bg}">${ep.d.band}</div>`;
      // 글꼴이 들어온 뒤: 큰 글자가 그림 앞(x 860)을 넘으면 줄이고, ✕는 물음표를 뺀 글자 가운데에
      document.fonts.ready.then(() => {
        const big = document.getElementById("big");
        let fs = 230;
        while (big.getBoundingClientRect().right > 860 && fs > 150) { fs -= 10; big.style.fontSize = fs + "px"; }
        const r = big.getBoundingClientRect(), cx = r.left + r.width * (ep.d.big.endsWith("?") ? 0.42 : 0.5), cy = r.top + r.height * 0.52;
        // ✕는 글자가 비쳐 읽히도록 가늘고 낮게 기울인다
        const w = Math.min(420, r.width * 0.66);
        document.querySelectorAll(".xbar").forEach((b, k) => {
          b.style.width = w + "px"; b.style.left = cx - w / 2 + "px"; b.style.top = cy - 15 + "px";
          b.style.transform = `rotate(${k ? -20 : 20}deg)`;
        });
      });
    } else if (style === "e") {
      t.className = "e";
      const [a1, a2, a3] = ep.e.lines;
      t.innerHTML = `<div class="tag" style="left: 64px; top: 46px">${ep.e.tag}</div>`
        + hot(a1, "left: 60px; top: 150px; font-size: 150px; color: #FFE500")
        + hot(a2, "left: 60px; top: 312px; font-size: 128px; color: #FFFFFF")
        + hot(a3, "left: 60px; top: 460px; font-size: 150px; color: #E60012")
        + `<div class="bigfig">${ep.fig("#000000", "#6B3FE6")}</div>`
        + `<div class="xl">${ep.e.mark}</div><div class="circle"></div>`
        + (badge ? `<div style="position: absolute; left: 64px; top: 640px; padding: 6px 16px; background: #000000; color: #FFFFFF; font-size: 34px; font-weight: 900; border-radius: 8px">${badge}</div>` : "");
    } else if (style === "f") {
      t.className = "f";
      t.innerHTML = `<div class="tag" style="left: 64px; top: 56px">${ep.f.tag}</div>`
        + (badge ? `<div style="position: absolute; left: 250px; top: 66px; color: #A1A1AA; font-size: 40px; font-weight: 900">${badge}</div>` : "")
        + `<div class="hot" style="left: 44px; top: 190px; font-size: 260px; color: #FFE500">${ep.f.big}</div>`
        + `<div style="position: absolute; left: 64px; top: 490px; width: 540px; height: 22px; background: #E60012; transform: rotate(-2deg)"></div>`
        + `<div class="hot" style="left: 64px; top: 560px; font-size: 88px; color: #FFFFFF">${ep.f.l2}</div>`
        + `<div class="glow">${ep.fig("#FFFFFF", "#FFE500")}</div>`;
    }
    if (["d", "e", "f"].includes(style)) throw "done"; // 자극형은 여기서 끝(아래는 a·b·c)
    t.className = style + (q.get("badge") === "1" ? " show-badge" : "");
    const set = (id, v) => { document.getElementById(id).textContent = v; };
    set("badge", ep.badge);
    if (style === "c") { set("title", ep.cTitle); set("sub1", ep.cNum); set("sub2", ep.cQ); }
    else { set("title", ep.title); set("sub1", ep.sub1); set("sub2", ep.sub2); }
    const ink = style === "b" ? "#1E2687" : "#18181B", acc = style === "b" ? "#1E2687" : "#6B3FE6";
    document.getElementById("fig").innerHTML = ep.fig(ink, acc);
    // 시험 이름이 있으면 제목을 조금 내린다(a·b)
    if (q.get("badge") === "1" && style !== "c") document.getElementById("title").style.marginTop = "18px";
  </script>
</body>
</html>
