<template>

  <style>

  </style>
  <div id="root" data-composition-id="s06" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.5,4,7,12,17,21,27]"},{"id":"dur","type":"number","label":"장면 길이","default":32},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>

      <div class="s06-c x-card" id="s06-c2" style="top: 371px"><div class="s06-ring"></div><div class="s06-n">2</div><div class="s06-t">모델 단순하게<span>변수 줄이기 · 가지치기</span></div></div>

  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 32;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const rings = gsap.utils.toArray(".s06-ring");

    // 33 과대적합을 줄이는 방법
    ft("#s06-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    // 34~38 다섯 가지가 한 문장씩 — 지금 말하는 카드만 테두리
    [1, 2, 3, 4, 5].forEach(k => {
      ft(`#s06-c${k}`, { opacity: 0, x: -20 }, { opacity: 1, x: 0 }, at(k, 0.2));
      fade(rings[k - 1], at(k, 0.2), 0, 1);
      if (k > 1) fade(rings[k - 2], at(k, 0.2), 1, 0);
    });
    // 39 과소적합이라면 반대로
    fade(rings[4], at(6, 0.2), 1, 0);
    ft("#s06-side", { opacity: 0, x: 24 }, { opacity: 1, x: 0 }, at(6, 0.3));
    if (String(V.exit) !== "false") ft("#s06-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s06"] = tl;
  </script>
