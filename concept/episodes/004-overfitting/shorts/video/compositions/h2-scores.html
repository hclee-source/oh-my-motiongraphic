<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .h2-g { position: absolute; top: 360px; width: 440px; height: 640px; padding: 40px 40px; opacity: 0; }
    .h2-name { position: absolute; left: 0; right: 0; bottom: 36px; text-align: center; font-size: 56px; font-weight: 900; opacity: 0; }
    /* 막대: 바닥 y 560(카드 안), 100점 = 420 px */
    .h2-bar { position: absolute; bottom: 160px; width: 120px; height: 420px; border-radius: 16px 16px 4px 4px; transform-origin: center bottom; }
    .h2-bl { position: absolute; bottom: 110px; width: 160px; text-align: center; font-size: 36px; font-weight: 800; color: var(--color-ink2, #71717A); }
  </style>
  <div id="root" data-composition-id="h2" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.3,5]"},{"id":"dur","type":"number","label":"장면 길이","default":8},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h2-all">
      <div class="h2-g x-card" id="h2-g1" style="left: 80px">
        <div class="h2-bar" id="h2-a1" style="left: 80px; background: var(--color-ink, #18181B)"></div>
        <div class="h2-bar" id="h2-a2" style="left: 240px; background: var(--color-accent, #6B3FE6)"></div>
        <div class="h2-bl" style="left: 60px">훈련</div><div class="h2-bl" style="left: 220px">검증</div>
        <div class="h2-name x-acc" id="h2-n1">과대적합</div>
      </div>
      <div class="h2-g x-card" id="h2-g2" style="left: 560px">
        <div class="h2-bar" id="h2-b1" style="left: 80px; background: var(--color-ink, #18181B)"></div>
        <div class="h2-bar" id="h2-b2" style="left: 240px; background: var(--color-accent, #6B3FE6)"></div>
        <div class="h2-bl" style="left: 60px">훈련</div><div class="h2-bl" style="left: 220px">검증</div>
        <div class="h2-name x-ink2" id="h2-n2">과소적합</div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 8;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const bar = (sel, t, v) => tl.fromTo(sel, { scaleY: 0 }, { scaleY: v, duration: 0.5 * S, ease: "power3.out", immediateRender: false }, t);
    gsap.set(".h2-bar", { scaleY: 0 });

    // 3 훈련 높고 검증 낮으면 과대적합
    fade("#h2-g1", at(0, 0.1), 0, 1);
    bar("#h2-a1", at(0, 0.6), 0.95);
    bar("#h2-a2", at(0, 1.8), 0.45);
    fade("#h2-n1", at(0, 3.0), 0, 1);
    // 4 둘 다 낮으면 과소적합
    fade("#h2-g2", at(1, 0.1), 0, 1);
    bar("#h2-b1", at(1, 0.5), 0.4);
    bar("#h2-b2", at(1, 0.8), 0.35);
    fade("#h2-n2", at(1, 1.4), 0, 1);
    if (String(V.exit) !== "false") ft("#h2-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.35);
    window.__timelines["h2"] = tl;
  </script>
</template>
