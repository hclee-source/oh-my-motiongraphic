  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 35.4;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, t);
    const rise = (sel, t) => ft(sel, { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, t);
    let cnt = null;
    const count = (id, t) => { if (cnt) fade(cnt, t, 1, 0); fade(id, t + 0.1, 0, 1); cnt = id; };
    const MEM = ["#h1-m1", "#h1-m2", "#h1-m3"];

    // 1 회원 표 세 행을 모두 지우는 명령은 세 가지
    rise("#h1-mem", at(0, 0));
    MEM.forEach((m, j) => rise(m, at(0, 0.3 + j * 0.15)));
    count("#h1-c3", at(0, 0.6));
    // 2 DELETE, TRUNCATE, 그리고 DROP — 셋 다 행을 지운다
    rise("#h1-grid", at(1, 0));
    rise("#h1-h1", X("d1", at(1, 0.1)));
    rise("#h1-h2", X("d2", at(1, 0.9)));
    rise("#h1-h3", X("d3", at(1, 2.2)));
    fade(MEM, X("d3", at(1, 2.2)) + 0.6, 1, 0.15);
    count("#h1-c0", X("d3", at(1, 2.2)) + 0.7);
    // 3 데이터를 다루는 DML은 DELETE뿐, 구조를 다루는 DDL
    fade(["#h1-s1", "#h1-s2", "#h1-s3", "#h1-s4"], at(2, 0), 0, 1);
    fade("#h1-l1", at(2, 0.1), 0, 1);
    stamp("#h1-a1", X("k1", at(2, 1.0)));
    stamp("#h1-a2", X("k2", at(2, 3.4)) - 0.6);
    stamp("#h1-a3", X("k2", at(2, 3.4)) - 0.4);
    // 4 COMMIT 전에 ROLLBACK 하면 DELETE만 세 행이 돌아온다
    fade("#h1-l2", at(3, 0.1), 0, 1);
    const rb = X("rb", at(3, 1.0));
    stamp("#h1-b1", rb + 0.2);
    stamp("#h1-b2", rb + 0.4);
    stamp("#h1-b3", rb + 0.5);
    const r3 = X("r3", at(3, 2.8));
    fade(MEM, r3 - 0.2, 0.15, 1);
    count("#h1-c3b", r3);
    fade("#h1-b1s", r3, 0, 1);
    // 5 DDL은 실행하자마자 자동으로 커밋
    fade(["#h1-b2s", "#h1-b3s"], X("ac", at(4, 1.2)), 0, 1);
    // 6 지운 뒤 남는 것 — 회원 표는 흐리게
    fade("#h1-mem", at(5, 0.1), 1, 0.4);
    fade("#h1-l3", at(5, 0.2), 0, 1);
    // 7 DELETE는 표와 저장 공간, TRUNCATE는 빈 표
    stamp("#h1-c1", X("m1", at(6, 0.1)));
    stamp("#h1-c2", X("m2", at(6, 2.0)));
    // 8 DROP은 구조까지 통째로
    stamp("#h1-c3x", at(7, 0.2));
    // 9 골라 지우는 WHERE는 DELETE뿐
    fade("#h1-l4", at(8, 0.1), 0, 1);
    stamp("#h1-w1", X("wh", at(8, 1.6)));
    stamp("#h1-w2", X("wd", at(8, 2.6)));
    stamp("#h1-w3", X("wd", at(8, 2.6)) + 0.15);
    if (String(V.exit) !== "false") ft("#h1-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h1"] = tl;
