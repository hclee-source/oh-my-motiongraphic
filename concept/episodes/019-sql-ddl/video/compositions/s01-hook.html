  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 27;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);

    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);
    const rise = (sel, t) => ft(sel, { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, t);

    // 1 주문 표 다섯 행, 지우는 명령은 세 가지

    // 3 셋 다 데이터가 사라진다

    // 4 그렇다면 ROLLBACK 하면?

    // 5 DELETE는 다섯 행이 돌아오고, TRUNCATE는 빈 표, DROP은 표 자체가 없다

    fade(".s01-rw1", at(4, 0.4), 0, 1);
    stamp("#s01-c1", at(4, 0.7));
    const r1 = X("r1", at(4, 2.4)), r2 = X("r2", at(4, 4.2));
    stamp("#s01-c2", r1 + 0.2);
    fade(["#s01-t3", "#s01-k3"], r2, 1, 0);
    fade("#s01-g3", r2 + 0.1, 0, 1);
