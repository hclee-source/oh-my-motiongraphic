  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 45;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, t);
    let note = null;
    const say = (id, t) => { if (note) fade(note, t, 1, 0); fade(id, t + 0.15, 0, 1); note = id; };

    // 22 부서 표와 사원 표, 제약 조건 다섯 가지

    ft("#s05-dp", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.4));
    ft("#s05-em", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.7));
    // 23 PRIMARY KEY = UNIQUE + NOT NULL
    stamp("#s05-pk1", at(1, 0.6));
    stamp("#s05-pk2", at(1, 0.9));
    ft("#s05-note", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(1, 1.0));
    say("#s05-n1", at(1, 1.0));
    // 24 표마다 하나, 여러 열을 묶어도 하나
    say("#s05-n2", at(2, 0.3));
    // 25 UNIQUE — 부서명처럼 중복만 막고 NULL은 허용
    stamp("#s05-uq", at(3, 0.4));
    say("#s05-n3", at(3, 0.4));
    // 26 NOT NULL은 빈칸을, CHECK는 값의 조건을
    stamp("#s05-nn", X("nn", at(4, 0.2)));
    say("#s05-n4", X("nn", at(4, 0.2)));
    stamp("#s05-ck", X("ck", at(4, 2.0)));
    // 27 FOREIGN KEY — 부서 표에 있는 번호여야
    stamp("#s05-fk", at(5, 0.5));
    say("#s05-n5", at(5, 0.5));
    // 28 부서는 부모, 사원은 자식
    stamp("#s05-pa", X("pa", at(6, 2.0)));
    stamp("#s05-ch", X("ch", at(6, 3.6)));
    say("#s05-n6", at(6, 0.4));
    // 29 참조되는 열은 기본키나 UNIQUE — 부서번호 PK와 FK를 함께
    fade(["#s05-o1", "#s05-o2"], at(7, 0.5), 0, 1);
    say("#s05-n7", at(7, 0.5));
    if (String(V.exit) !== "false") ft("#s05-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s05"] = tl;
