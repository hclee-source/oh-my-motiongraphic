<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .s01-lab { position: absolute; top: 262px; width: 744px; text-align: center; font-size: 44px; font-weight: 900; }
    .s01-code { top: 330px; width: 744px; }
    .s01-code .q-ln { font-size: 32px; padding: 0 40px; }
    #s01-ca { left: 192px; }
    #s01-cb { left: 984px; }
    #s01-la { left: 192px; }
    #s01-lb { left: 984px; }
    .s01-chip { top: 690px; width: 300px; }
    #s01-q { position: absolute; left: 192px; width: 1536px; top: 800px; text-align: center; font-size: 56px; font-weight: 900; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s01" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,6,10,16,19]"},{"id":"dur","type":"number","label":"장면 길이","default":25},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s01-all">
      <div class="s01-lab x-hide" id="s01-la">SQL 가</div>
      <div class="s01-lab x-hide" id="s01-lb">SQL 나</div>
      <div id="s01-ca" class="x-dark q-code s01-code x-hide">
        <div class="q-ln s01-l"><span><span class="q-k">SELECT</span> <span class="q-k">LEVEL</span>, 이름</span></div>
        <div class="q-ln s01-l"><span><span class="q-k">FROM</span> 사원</span></div>
        <div class="q-ln s01-l"><span><span class="q-k">START WITH</span> 관리자번호 <span class="q-k">IS NULL</span></span></div>
        <div class="q-ln"><div class="q-hi" id="s01-ha"></div><span><span class="q-k">CONNECT BY PRIOR</span> 사원번호 = 관리자번호</span></div>
      </div>
      <div id="s01-cb" class="x-dark q-code s01-code x-hide">
        <div class="q-ln s01-l"><span><span class="q-k">SELECT</span> <span class="q-k">LEVEL</span>, 이름</span></div>
        <div class="q-ln s01-l"><span><span class="q-k">FROM</span> 사원</span></div>
        <div class="q-ln s01-l"><span><span class="q-k">START WITH</span> 관리자번호 <span class="q-k">IS NULL</span></span></div>
        <div class="q-ln"><div class="q-hi" id="s01-hb"></div><span><span class="q-k">CONNECT BY PRIOR</span> 관리자번호 = 사원번호</span></div>
      </div>
      <div class="q-chip q-ok s01-chip" id="s01-c7" style="left:552px">7행</div>
      <div class="q-chip q-ng s01-chip" id="s01-c1" style="left:1068px">1행</div>
      <div id="s01-q">아래로 내려가는 쪽은 어느 SQL일까요?</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 25;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);

    // 1 사원 표에서 김대표부터 시작해 위에서 아래로
    ft("#s01-ca", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    ft("#s01-cb", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.6));
    fade(["#s01-la", "#s01-lb"], at(0, 0.9), 0, 1);
    // 2 CONNECT BY 줄에서 PRIOR의 자리만 다르다
    fade(".s01-l", at(1, 0.2), 1, 0.35);
    fade(["#s01-ha", "#s01-hb"], at(1, 0.4), 0, 1);
    // 3 한쪽은 7행, 다른 쪽은 1행
    stamp("#s01-c7", at(2, 2.0));
    stamp("#s01-c1", at(2, 3.4));
    // 4 아래로 내려가는 쪽은 어느 SQL일까요
    ft("#s01-q", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(3, 0.1));
    if (String(V.exit) !== "false") ft("#s01-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s01"] = tl;
  </script>
</template>
