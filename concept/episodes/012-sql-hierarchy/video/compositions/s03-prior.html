<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #s03-code { left: 192px; top: 262px; width: 820px; }
    #s03-ex { position: absolute; left: 192px; top: 584px; width: 820px; height: 262px; }
    .s03-col { position: absolute; top: 40px; width: 360px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
    .s03-ex { font-size: 44px; font-weight: 900; white-space: nowrap; }
    .s03-eq { position: absolute; left: 400px; top: 42px; width: 20px; font-size: 44px; font-weight: 900; text-align: center; }
    .s03-ch { position: relative; opacity: 0; height: 64px; font-size: 32px; padding: 0 26px; }
    #s03-org { position: absolute; left: 1052px; top: 262px; width: 676px; height: 584px; }
    .org-svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    .org-svg path { fill: none; stroke: #D3D6DD; stroke-width: 4; }
    .org-n { position: absolute; box-sizing: border-box; border: 3px solid #D3D6DD; background: #FFFFFF; border-radius: 20px;
      display: flex; align-items: center; justify-content: center; font-weight: 900; white-space: nowrap; }
    #s03-root { left: 500px; top: 42px; width: 120px; height: 56px; font-size: 30px; }
    #s03-r7 { left: 380px; top: 454px; width: 230px; height: 72px; }
  </style>
  <div id="root" data-composition-id="s03" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,7,11,15,24]"},{"id":"dur","type":"number","label":"장면 길이","default":29},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"kw","type":"number","label":"관리자번호로 시각","default":20},{"id":"bh","type":"number","label":"부하를 시각","default":22},{"id":"r7","type":"number","label":"7행이 시각","default":27},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s03-all">
      <div id="s03-head" class="x-head">START WITH와 PRIOR</div>
      <div id="s03-code" class="x-dark q-code x-hide">
        <div class="q-ln"><span><span class="q-k">SELECT</span> <span class="q-k">LEVEL</span>, 이름</span></div>
        <div class="q-ln"><span><span class="q-k">FROM</span> 사원</span></div>
        <div class="q-ln"><div class="q-hi" id="s03-h3"></div><span><span class="q-k">START WITH</span> 관리자번호 <span class="q-k">IS NULL</span></span></div>
        <div class="q-ln"><div class="q-hi" id="s03-h4"></div><span><span class="q-k">CONNECT BY PRIOR</span> 사원번호 = 관리자번호</span></div>
      </div>
      <div id="s03-ex" class="x-card x-hide">
        <div class="s03-col" style="left:24px"><div class="s03-ex"><span class="x-acc">PRIOR</span> 사원번호</div><div class="q-chip q-ok s03-ch" id="s03-ca">방금 읽은 행</div></div>
        <div class="s03-eq">=</div>
        <div class="s03-col" style="left:436px"><div class="s03-ex">관리자번호</div><div class="q-chip q-ng s03-ch" id="s03-cb">다음 행</div></div>
      </div>
      <div id="s03-org" class="x-card x-hide"></div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 29;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d = 0) => Number(V[k]) + d;
    const ACC = "#6B3FE6", INK = "#18181B";

    const NODES = { 1: ["김대표", 0, 395], 2: ["이부장", 1, 230], 3: ["박부장", 1, 560], 4: ["최과장", 2, 130], 5: ["정대리", 2, 330], 7: ["윤과장", 2, 560], 6: ["한사원", 3, 130] };
    const EDGES = [[1, 2], [1, 3], [2, 4], [2, 5], [4, 6], [3, 7]];
    const G = { w: 160, h: 80, ys: [30, 170, 310, 450], font: 38 };
    const host = document.getElementById("s03-org");
    let html = '<svg class="org-svg" viewBox="0 0 676 584">';
    EDGES.forEach(([a, b]) => {
      const pa = NODES[a], pb = NODES[b];
      const x1 = pa[2], y1 = G.ys[pa[1]] + G.h + 8, x2 = pb[2], y2 = G.ys[pb[1]] - 8, ym = (y1 + y2) / 2;
      html += `<path id="s03-e${a}_${b}" d="M ${x1} ${y1} L ${x1} ${ym} L ${x2} ${ym} L ${x2} ${y2}" />`;
    });
    html += "</svg>";
    Object.keys(NODES).forEach((id) => {
      const [nm, lv, cx] = NODES[id];
      html += `<div class="org-n" id="s03-n${id}" style="left:${cx - G.w / 2}px;top:${G.ys[lv]}px;width:${G.w}px;height:${G.h}px;font-size:${G.font}px">${nm}</div>`;
    });
    html += '<div class="q-chip q-ok" id="s03-root">루트</div><div class="q-chip q-ok" id="s03-r7">7행</div>';
    host.innerHTML = html;

    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);
    const OFF = { backgroundColor: "#FFFFFF", color: INK, borderColor: "#D3D6DD" };
    const ACT = { backgroundColor: ACC, color: "#FFFFFF", borderColor: ACC };
    const KID = { backgroundColor: "#ECE6FD", color: ACC, borderColor: "#BFA9F5" };
    const st = (id, t, a, b) => ft(`#s03-n${id}`, a, b, t);

    // 10 START WITH는 출발 행, 김대표가 루트
    ft("#s03-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s03-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    ft("#s03-org", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.6));
    fade("#s03-h3", at(0, 1.2), 0, 1);
    st(1, at(0, 3.2), OFF, ACT);
    stamp("#s03-root", at(0, 4.6));
    // 11 CONNECT BY는 다음에 이어 읽을 행을 찾는 조건
    fade("#s03-h3", at(1, 0), 1, 0);
    fade("#s03-h4", at(1, 0.2), 0, 1);
    // 12 PRIOR가 붙은 열은 방금 읽은 행의 값
    ft("#s03-ex", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(2, 0.1));
    stamp("#s03-ca", at(2, 1.4));
    // 13 PRIOR 사원번호 = 관리자번호 → 방금 읽은 사람의 사원번호를 관리자번호로 가진 행, 곧 부하
    stamp("#s03-cb", X("kw", -0.1));
    ft("#s03-e1_2", { stroke: "#D3D6DD" }, { stroke: ACC }, X("bh", 0));
    ft("#s03-e1_3", { stroke: "#D3D6DD" }, { stroke: ACC }, X("bh", 0));
    st(2, X("bh", 0), OFF, KID);
    st(3, X("bh", 0.1), OFF, KID);
    // 14 부하를 찾아 내려가니 7행이 나오는 쪽이 이 SQL
    stamp("#s03-r7", X("r7", -0.1));
    if (String(V.exit) !== "false") ft("#s03-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s03"] = tl;
  </script>
</template>
