<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #s02-tb { left: 192px; top: 284px; width: 700px; height: 562px; }
    #s02-tb .q-th, #s02-tb .q-tr { grid-template-columns: 190px 200px 254px; }
    #s02-tb .q-th { top: 24px; }
    #s02-tb .q-th > div { font-size: 30px; }
    #s02-tb .q-tr > div { font-size: 38px; }
    #s02-org { position: absolute; left: 932px; top: 284px; width: 796px; height: 562px; }
    .org-svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    .org-svg path { fill: none; stroke: #B9BDC8; stroke-width: 4; opacity: 0; }
    .org-n { position: absolute; box-sizing: border-box; border: 3px solid #D3D6DD; background: #FFFFFF; border-radius: 20px;
      display: flex; align-items: center; justify-content: center; font-weight: 900; white-space: nowrap; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s02" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,5,11,17]"},{"id":"dur","type":"number","label":"장면 길이","default":22},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"b1","type":"number","label":"이부장과 시각","default":8},{"id":"y1","type":"number","label":"윤과장은 시각","default":14},{"id":"h1","type":"number","label":"한사원은 시각","default":16},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s02-all">
      <div id="s02-head" class="x-head">사원 표 안의 조직도</div>
      <div id="s02-sub" class="x-sub">한 표 안의 위아래 관계를 따라 읽기 = 계층형 질의</div>
      <div id="s02-tb" class="x-card q-tb x-hide">
        <div class="q-th"><div>사원번호</div><div>이름</div><div id="s02-hm">관리자번호</div></div>
        <div class="q-tr" id="s02-r1" style="top:100px"><div>1</div><div>김대표</div><div class="q-null s02-m">NULL</div></div>
        <div class="q-tr" id="s02-r2" style="top:164px"><div>2</div><div>이부장</div><div class="s02-m">1</div></div>
        <div class="q-tr" id="s02-r3" style="top:228px"><div>3</div><div>박부장</div><div class="s02-m">1</div></div>
        <div class="q-tr" id="s02-r4" style="top:292px"><div>4</div><div>최과장</div><div class="s02-m">2</div></div>
        <div class="q-tr" id="s02-r5" style="top:356px"><div>5</div><div>정대리</div><div class="s02-m">2</div></div>
        <div class="q-tr" id="s02-r6" style="top:420px"><div>6</div><div>한사원</div><div class="s02-m">4</div></div>
        <div class="q-tr" id="s02-r7" style="top:484px"><div>7</div><div>윤과장</div><div class="s02-m">3</div></div>
      </div>
      <div id="s02-org" class="x-card x-hide"></div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 22;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d = 0) => Number(V[k]) + d;
    const ACC = "#6B3FE6", INK = "#18181B", GREY = "#8A8A93";

    // 조직도 그리기(결정적): 사원번호 → [이름, 단, 가운데 x]
    const NODES = { 1: ["김대표", 0, 455], 2: ["이부장", 1, 260], 3: ["박부장", 1, 650], 4: ["최과장", 2, 150], 5: ["정대리", 2, 370], 7: ["윤과장", 2, 650], 6: ["한사원", 3, 150] };
    const EDGES = [[1, 2], [1, 3], [2, 4], [2, 5], [4, 6], [3, 7]];
    const G = { w: 180, h: 80, ys: [30, 170, 310, 450], font: 40 };
    const host = document.getElementById("s02-org");
    let svg = '<svg class="org-svg" viewBox="0 0 796 562">';
    EDGES.forEach(([a, b]) => {
      const pa = NODES[a], pb = NODES[b];
      const x1 = pa[2], y1 = G.ys[pa[1]] + G.h + 8, x2 = pb[2], y2 = G.ys[pb[1]] - 8, ym = (y1 + y2) / 2;
      svg += `<path id="s02-e${a}_${b}" d="M ${x1} ${y1} L ${x1} ${ym} L ${x2} ${ym} L ${x2} ${y2}" />`;
    });
    svg += "</svg>";
    let html = svg;
    Object.keys(NODES).forEach((id) => {
      const [nm, lv, cx] = NODES[id];
      html += `<div class="org-n" id="s02-n${id}" style="left:${cx - G.w / 2}px;top:${G.ys[lv]}px;width:${G.w}px;height:${G.h}px;font-size:${G.font}px">${nm}</div>`;
    });
    host.innerHTML = html;

    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);
    const paint = (sel, t, a, b) => ft(sel, { color: a }, { color: b }, t);
    const node = (id, t) => stamp(`#s02-n${id}`, t);
    const edge = (a, b, t) => fade(`#s02-e${a}_${b}`, t, 0, 1);
    const row = (i, t, back) => {  // 그 행의 관리자번호를 강조색으로, 다음 순서에 되돌림
      const c = `#s02-r${i} .s02-m`;
      paint(c, t, i === 1 ? GREY : INK, ACC);
      if (back != null) paint(c, back, ACC, i === 1 ? GREY : INK);
    };

    // 6 관리자번호 칸에는 직속 상사의 사원번호
    ft("#s02-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s02-tb", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    ft("#s02-org", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.6));
    paint("#s02-hm", at(0, 1.6), "#71717A", ACC);
    // 7 김대표는 NULL, 이부장과 박부장은 김대표 밑
    node(1, at(1, 0.3));
    row(1, at(1, 0.3), X("b1", -0.2));
    paint("#s02-hm", at(1, 0.2), ACC, "#71717A");
    node(2, X("b1", 0)); node(3, X("b1", 0.5));
    edge(1, 2, X("b1", 0.2)); edge(1, 3, X("b1", 0.7));
    row(2, X("b1", 0), at(2, 0)); row(3, X("b1", 0.5), at(2, 0));
    // 8 최과장 · 정대리는 이부장 밑, 윤과장은 박부장 밑, 한사원은 최과장 밑
    node(4, at(2, 0.1)); node(5, at(2, 0.6));
    edge(2, 4, at(2, 0.3)); edge(2, 5, at(2, 0.8));
    row(4, at(2, 0.1), X("y1", -0.2)); row(5, at(2, 0.6), X("y1", -0.2));
    node(7, X("y1", 0)); edge(3, 7, X("y1", 0.2));
    row(7, X("y1", 0), X("h1", -0.2));
    node(6, X("h1", 0)); edge(4, 6, X("h1", 0.2));
    row(6, X("h1", 0), at(3, 0));
    // 9 위아래 관계를 따라 읽는 것이 계층형 질의
    ft("#s02-sub", { opacity: 0, y: 8 }, { opacity: 1, y: 0 }, at(3, 0.1));
    if (String(V.exit) !== "false") ft("#s02-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s02"] = tl;
  </script>
</template>
