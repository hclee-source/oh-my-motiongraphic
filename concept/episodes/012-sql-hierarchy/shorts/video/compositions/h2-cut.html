<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #h2-code { left: 60px; top: 290px; width: 960px; }
    #h2-code .q-ln { font-size: 44px; height: 72px; justify-content: center; }
    .h2-ti { position: absolute; top: 430px; width: 460px; text-align: center; font-size: 56px; font-weight: 900; color: #71717A; opacity: 0; }
    #h2-tl { left: 60px; }
    #h2-tr { left: 560px; }
    .h2-card { position: absolute; top: 510px; width: 460px; height: 470px; }
    #h2-L { left: 60px; }
    #h2-R { left: 560px; }
    .org-svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    .org-svg path { fill: none; stroke: #B9BDC8; stroke-width: 5; }
    .org-n { position: absolute; box-sizing: border-box; border: 4px solid #D3D6DD; background: #FFFFFF; border-radius: 24px;
      display: flex; align-items: center; justify-content: center; font-weight: 900; white-space: nowrap; }
    .org-n > span { display: block; }
    .h2-cx { position: absolute; width: 60px; height: 60px; border-radius: 30px; background: #18181B; opacity: 0; }
    .h2-cx::before, .h2-cx::after { content: ""; position: absolute; left: 27px; top: 13px; width: 6px; height: 34px; border-radius: 3px; background: #FFFFFF; }
    .h2-cx::before { transform: rotate(45deg); }
    .h2-cx::after { transform: rotate(-45deg); }
    .h2-c { position: absolute; top: 1010px; width: 280px; height: 96px; font-size: 48px; }
    #h2-cl { left: 60px; }
    #h2-cr { left: 560px; }
  </style>
  <div id="root" data-composition-id="h2" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.2,5]"},{"id":"dur","type":"number","label":"장면 길이","default":10},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"g1","type":"number","label":"과일 한 시각","default":2.5},{"id":"n3","type":"number","label":"남습니다 시각","default":3.8},{"id":"g2","type":"number","label":"통째로 시각","default":8},{"id":"n2","type":"number","label":"잘립니다 시각","default":9},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h2-all">
      <div id="h2-code" class="x-dark q-code x-hide"><div class="q-ln"><span>조건 분류 &lt;&gt; ‘과일’</span></div></div>
      <div class="h2-ti" id="h2-tl">WHERE</div>
      <div class="h2-ti" id="h2-tr">CONNECT BY</div>
      <div class="h2-card x-card x-hide" id="h2-L"></div>
      <div class="h2-card x-card x-hide" id="h2-R"></div>
      <div class="q-chip q-ok h2-c" id="h2-cl">3행</div>
      <div class="q-chip q-ng h2-c" id="h2-cr">2행</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 10;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d = 0) => Number(V[k]) + d;
    const ACC = "#6B3FE6", INK = "#18181B", INK2 = "#71717A";

    const NODES = { 1: ["식품", 0, 230], 2: ["과일", 1, 125], 3: ["채소", 1, 335], 4: ["사과", 2, 125] };
    const EDGES = [[1, 2], [1, 3], [2, 4]];
    const G = { w: 190, h: 90, ys: [24, 184, 344], font: 46 };
    ["L", "R"].forEach((p) => {
      let html = '<svg class="org-svg" viewBox="0 0 460 470">';
      EDGES.forEach(([a, b]) => {
        const pa = NODES[a], pb = NODES[b];
        const x1 = pa[2], y1 = G.ys[pa[1]] + G.h + 8, x2 = pb[2], y2 = G.ys[pb[1]] - 8, ym = (y1 + y2) / 2;
        html += `<path d="M ${x1} ${y1} L ${x1} ${ym} L ${x2} ${ym} L ${x2} ${y2}" />`;
      });
      html += "</svg>";
      Object.keys(NODES).forEach((id) => {
        const [nm, lv, cx] = NODES[id];
        html += `<div class="org-n" id="h2-${p}n${id}" style="left:${cx - G.w / 2}px;top:${G.ys[lv]}px;width:${G.w}px;height:${G.h}px;font-size:${G.font}px"><span>${nm}</span></div>`;
      });
      // 빠진 표시(동그란 ✕)는 노드 오른쪽 위 모서리
      [2, 4].forEach((id) => {
        const [, lv, cx] = NODES[id];
        html += `<div class="h2-cx" id="h2-${p}x${id}" style="left:${cx + G.w / 2 - 34}px;top:${G.ys[lv] - 32}px"></div>`;
      });
      document.getElementById(`h2-${p}`).innerHTML = html;
    });

    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);
    const paint = (sel, t, a, b) => ft(sel, { color: a }, { color: b }, t);
    const gone = (p, id, t) => {
      ft(`#h2-${p}n${id}`, { backgroundColor: "#FFFFFF", color: INK, borderColor: "#D3D6DD" }, { backgroundColor: "#F1F2F5", color: "#8A8A93", borderColor: "#E3E5EA" }, t);
      stamp(`#h2-${p}x${id}`, t);
    };

    // 8 과일을 빼는 조건을 WHERE에 적으면 과일 한 행만 빠지고 사과는 남는다
    ft("#h2-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.1));
    ft("#h2-L", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    ft("#h2-R", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.5));
    fade("#h2-tl", at(0, 0.6), 0, 1);
    fade("#h2-tr", at(0, 0.8), 0, 1);
    paint("#h2-tl", at(0, 1.0), INK2, ACC);
    gone("L", 2, X("g1", -0.1));
    stamp("#h2-cl", X("n3", -0.1));
    // 9 같은 조건을 CONNECT BY에 적으면 과일 아래 가지까지 통째로
    paint("#h2-tl", at(1, 0), ACC, INK2);
    paint("#h2-tr", at(1, 0.1), INK2, ACC);
    gone("R", 2, X("g2", -0.1));
    gone("R", 4, X("g2", 0.15));
    stamp("#h2-cr", X("n2", -0.1));
    if (String(V.exit) !== "false") ft("#h2-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h2"] = tl;
  </script>
</template>
