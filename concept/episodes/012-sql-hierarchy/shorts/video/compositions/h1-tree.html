<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #h1-cols { position: absolute; left: 60px; width: 960px; top: 290px; text-align: center; font-size: 42px; font-weight: 800; color: var(--color-ink2, #71717A); opacity: 0; }
    #h1-tree { position: absolute; left: 60px; top: 350px; width: 960px; height: 500px; }
    .org-svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    .org-svg path { fill: none; stroke: #D3D6DD; stroke-width: 5; }
    .org-n { position: absolute; box-sizing: border-box; border: 4px solid #D3D6DD; background: #FFFFFF; border-radius: 24px;
      display: flex; align-items: center; justify-content: center; font-weight: 900; white-space: nowrap; }
    .org-b { position: absolute; right: -24px; top: -28px; width: 60px; height: 60px; border-radius: 30px; background: #6B3FE6; color: #FFFFFF;
      font-size: 38px; font-weight: 900; display: flex; align-items: center; justify-content: center; opacity: 0; }
    .h1-p { position: absolute; left: 80px; width: 880px; height: 96px; font-size: 40px; padding: 0 24px; border-radius: 48px; }
    #h1-c0 { top: 880px; }
    .h1-ex { position: absolute; left: 80px; width: 880px; height: 110px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 36px; opacity: 0; }
    .h1-ex > div { font-size: 42px; font-weight: 900; white-space: nowrap; }
    .h1-ex .tg { font-size: 42px; font-weight: 800; color: #71717A; }
    #h1-A { top: 1010px; }
    #h1-B { top: 1130px; }
    #h1-p1 { top: 880px; }
    #h1-p2 { top: 1010px; }
    #h1-p3 { top: 1130px; }
  </style>
  <div id="root" data-composition-id="h1" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.2,4,10,15.4,19.6,24.7,29.4]"},{"id":"dur","type":"number","label":"장면 길이","default":35},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"f2","type":"number","label":"찾아(아래) 시각","default":6.5},{"id":"d2","type":"number","label":"아래로 시각","default":8.5},{"id":"f3","type":"number","label":"찾아(위) 시각","default":12.5},{"id":"u3","type":"number","label":"위로 시각","default":14},{"id":"o1","type":"number","label":"식품 시각","default":20},{"id":"o2","type":"number","label":"과일 시각","default":21},{"id":"o3","type":"number","label":"사과까지 시각","default":22.5},{"id":"o4","type":"number","label":"채소입니다 시각","default":23.8},{"id":"l1","type":"number","label":"출발 행 시각","default":25.5},{"id":"l2","type":"number","label":"한 단계 시각","default":27},{"id":"l3","type":"number","label":"1씩 시각","default":28.4},{"id":"sb","type":"number","label":"ORDER 시각","default":31},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h1-all">
      <div id="h1-cols">표의 칸: 분류 · 상위분류</div>
      <div id="h1-tree" class="x-card x-hide"></div>
      <div class="q-chip q-ok h1-p" id="h1-c0">PRIOR = 방금 읽은 행</div>
      <div class="x-card h1-ex" id="h1-A"><div><span class="x-acc">PRIOR</span> 분류 = 상위분류</div><div class="tg" id="h1-ta">아래로</div></div>
      <div class="x-card h1-ex" id="h1-B"><div><span class="x-acc">PRIOR</span> 상위분류 = 분류</div><div class="tg" id="h1-tb">위로</div></div>
      <div class="q-chip q-ok h1-p" id="h1-p1">끝까지 먼저, 그다음 옆 형제</div>
      <div class="q-chip q-ok h1-p" id="h1-p2">LEVEL = 출발 행 1, 한 단계마다 +1</div>
      <div class="q-chip q-ok h1-p" id="h1-p3">ORDER SIBLINGS BY 분류 = 이름 순</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 35;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d = 0) => Number(V[k]) + d;
    const ACC = "#6B3FE6", INK = "#18181B", INK2 = "#71717A";

    // 노드: 1 식품, 2 과일, 3 채소, 4 사과
    const NODES = { 1: ["식품", 0, 480], 2: ["과일", 1, 270], 3: ["채소", 1, 690], 4: ["사과", 2, 270] };
    const EDGES = [[1, 2], [1, 3], [2, 4]];
    const G = { w: 280, h: 100, ys: [30, 200, 370], font: 54 };
    const LV = { 1: 1, 2: 2, 3: 2, 4: 3 };
    const host = document.getElementById("h1-tree");
    let html = '<svg class="org-svg" viewBox="0 0 960 500">';
    EDGES.forEach(([a, b]) => {
      const pa = NODES[a], pb = NODES[b];
      const x1 = pa[2], y1 = G.ys[pa[1]] + G.h + 8, x2 = pb[2], y2 = G.ys[pb[1]] - 8, ym = (y1 + y2) / 2;
      html += `<path id="h1-e${a}_${b}" d="M ${x1} ${y1} L ${x1} ${ym} L ${x2} ${ym} L ${x2} ${y2}" />`;
    });
    html += "</svg>";
    Object.keys(NODES).forEach((id) => {
      const [nm, lv, cx] = NODES[id];
      html += `<div class="org-n" id="h1-n${id}" style="left:${cx - G.w / 2}px;top:${G.ys[lv]}px;width:${G.w}px;height:${G.h}px;font-size:${G.font}px">${nm}<div class="org-b" id="h1-b${id}">${LV[id]}</div></div>`;
    });
    host.innerHTML = html;

    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);
    const paint = (sel, t, a, b) => ft(sel, { color: a }, { color: b }, t);
    const OFF = { backgroundColor: "#FFFFFF", color: INK, borderColor: "#D3D6DD" };
    const ACT = { backgroundColor: ACC, color: "#FFFFFF", borderColor: ACC };
    const KID = { backgroundColor: "#ECE6FD", color: ACC, borderColor: "#BFA9F5" };
    const st = (id, t, a, b) => ft(`#h1-n${id}`, a, b, t);
    const edge = (a, b, t, on) => ft(`#h1-e${a}_${b}`, { stroke: on ? "#D3D6DD" : ACC }, { stroke: on ? ACC : "#D3D6DD" }, t);

    // 1 PRIOR는 방금 읽은 행
    ft("#h1-cols", { opacity: 0, y: 8 }, { opacity: 1, y: 0 }, at(0, 0.1));
    ft("#h1-tree", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.2));
    stamp("#h1-c0", at(0, 1.4));
    // 2 PRIOR 분류 = 상위분류 → 식품에서 과일로 아래로
    fade("#h1-c0", at(1, 0), 1, 0);
    ft("#h1-A", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(1, 0.2));
    st(1, at(1, 1.6), OFF, ACT);
    st(2, X("f2", -0.1), OFF, KID);
    edge(1, 2, X("f2", -0.1), true);
    paint("#h1-ta", X("d2", -0.1), INK2, ACC);
    // 3 PRIOR 상위분류 = 분류 → 사과에서 과일로 위로
    st(1, at(2, 0), ACT, OFF);
    st(2, at(2, 0), KID, OFF);
    edge(1, 2, at(2, 0), false);
    paint("#h1-ta", at(2, 0), ACC, INK2);
    ft("#h1-B", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(2, 0.2));
    st(4, at(2, 1.2), OFF, ACT);
    st(2, X("f3", -0.1), OFF, KID);
    edge(2, 4, X("f3", -0.1), true);
    paint("#h1-tb", X("u3", -0.1), INK2, ACC);
    // 4 한 가지를 끝까지 내려간 뒤에 옆 형제로
    fade(["#h1-A", "#h1-B"], at(3, 0), 1, 0);
    st(4, at(3, 0), ACT, OFF);
    st(2, at(3, 0), KID, OFF);
    edge(2, 4, at(3, 0), false);
    stamp("#h1-p1", at(3, 0.5));
    // 5 식품 → 과일 → 사과 → 채소
    st(1, X("o1", -0.1), OFF, ACT);
    st(2, X("o2", -0.1), OFF, ACT); st(1, X("o2", -0.1), ACT, KID); edge(1, 2, X("o2", -0.1), true);
    st(4, X("o3", -0.1), OFF, ACT); st(2, X("o3", -0.1), ACT, KID); edge(2, 4, X("o3", -0.1), true);
    st(3, X("o4", -0.1), OFF, ACT); st(4, X("o4", -0.1), ACT, KID); edge(1, 3, X("o4", -0.1), true);
    // 6 LEVEL은 출발 행이 1, 한 단계마다 1씩
    stamp("#h1-p2", at(5, 0.4));
    stamp("#h1-b1", X("l1", -0.1));
    stamp(["#h1-b2", "#h1-b3"], X("l2", -0.1));
    stamp("#h1-b4", X("l3", -0.1));
    // 7 과일이 채소보다 먼저인 건 ORDER SIBLINGS BY로 이름 순
    stamp("#h1-p3", X("sb", -0.1));
    if (String(V.exit) !== "false") ft("#h1-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h1"] = tl;
  </script>
</template>
