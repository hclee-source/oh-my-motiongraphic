<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .h1-c { position: absolute; width: 440px; height: 220px; padding: 30px 40px; }
    .h1-cap { font-size: 36px; font-weight: 700; color: var(--color-ink2, #71717A); }
    .h1-big { margin-top: 8px; font-size: 110px; font-weight: 900; line-height: 1; letter-spacing: -0.02em; }
    #h1-eq { position: absolute; left: 80px; top: 880px; font-size: 72px; font-weight: 900; white-space: nowrap; opacity: 0; }
    #h1-zero { position: absolute; left: 400px; top: 830px; font-size: 180px; font-weight: 900; line-height: 1; color: var(--color-accent, #6B3FE6); opacity: 0; }
    .h1-m { position: absolute; top: 1110px; font-size: 56px; font-weight: 900; opacity: 0; }
  </style>
  <div id="root" data-composition-id="h1" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.3,5]"},{"id":"dur","type":"number","label":"장면 길이","default":8},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h1-all">
      <div class="h1-c x-card x-hide" style="left: 80px; top: 340px"><div class="h1-cap">2분 일찍</div><div class="h1-big">+2</div></div>
      <div class="h1-c x-card x-hide" style="left: 560px; top: 340px"><div class="h1-cap">2분 늦게</div><div class="h1-big">−2</div></div>
      <div class="h1-c x-card x-hide" style="left: 80px; top: 590px"><div class="h1-cap">2분 일찍</div><div class="h1-big">+2</div></div>
      <div class="h1-c x-card x-hide" style="left: 560px; top: 590px"><div class="h1-cap">2분 늦게</div><div class="h1-big">−2</div></div>
      <div id="h1-eq">합 =</div>
      <div id="h1-zero">0</div>
      <div class="h1-m" style="left: 80px">MAE</div>
      <div class="h1-m" style="left: 300px">MSE</div>
      <div class="h1-m" style="left: 500px">RMSE</div>
      <div class="h1-m" style="left: 750px">MAPE</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 8;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, t);

    // 1 2분 빠르고 2분 늦고, 더하면 0
    gsap.utils.toArray(".h1-c").forEach((c, k) => stamp(c, at(0, 0.1 + k * 0.35)));
    ft("#h1-eq", { opacity: 0, y: 10 }, { opacity: 1, y: 0 }, at(0, 2.2));
    ft("#h1-zero", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, at(0, 3.0));
    // 2 지표 네 개
    gsap.utils.toArray(".h1-m").forEach((m, k) => ft(m, { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, at(1, 0.8 + k * 0.3)));
    if (String(V.exit) !== "false") ft("#h1-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.35);
    window.__timelines["h1"] = tl;
  </script>
</template>
