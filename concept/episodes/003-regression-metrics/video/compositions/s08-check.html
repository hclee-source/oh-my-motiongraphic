<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .s08-c { position: absolute; left: 192px; width: 928px; height: 176px; padding: 0 44px; box-sizing: border-box;
      display: grid; grid-template-columns: 84px 1fr; align-items: center; }
    #s08-c1 { top: 262px; }
    #s08-c2 { top: 466px; }
    #s08-c3 { top: 670px; }
    .s08-ring { position: absolute; inset: -2px; border-radius: 28px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
    .s08-n { font-size: 72px; font-weight: 900; color: var(--color-ink2, #71717A); }
    .s08-t { font-size: 44px; font-weight: 800; }
    .s08-d { margin-top: 8px; font-size: 30px; font-weight: 600; color: var(--color-ink2, #71717A); opacity: 0; }
    #s08-side { top: 262px; height: 584px; padding: 44px 48px; }
    #s08-plus { font-size: 30px; font-weight: 700; color: var(--color-ink2, #71717A); }
    #s08-sname { margin-top: 10px; font-size: 60px; font-weight: 900; }
    #s08-sdef { margin-top: 26px; font-size: 40px; font-weight: 800; color: var(--color-accent, #6B3FE6); line-height: 1.4; }
    #s08-smean { margin-top: 18px; font-size: 32px; font-weight: 700; color: var(--color-ink2, #71717A); line-height: 1.45; }
  </style>
  <div id="root" data-composition-id="s08" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.5,3,8,11,16,20]"},{"id":"dur","type":"number","label":"장면 길이","default":25},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s08-all">
      <div id="s08-head" class="x-head">시험장 체크</div>
      <div class="s08-c x-card x-hide" id="s08-c1"><div class="s08-ring" id="s08-r1"></div><div class="s08-n" id="s08-n1">1</div>
        <div><div class="s08-t">MSE · RMSE는 이상값에 민감</div><div class="s08-d" id="s08-d1">덜 민감한 쪽은 MAE</div></div></div>
      <div class="s08-c x-card x-hide" id="s08-c2"><div class="s08-ring" id="s08-r2"></div><div class="s08-n" id="s08-n2">2</div>
        <div><div class="s08-t">단위를 구분</div><div class="s08-d" id="s08-d2">MAE·RMSE 원래 단위 · MSE 제곱 · MAPE %</div></div></div>
      <div class="s08-c x-card x-hide" id="s08-c3"><div class="s08-ring" id="s08-r3"></div><div class="s08-n" id="s08-n3">3</div>
        <div><div class="s08-t">MAPE는 실제값 0이면 불가</div><div class="s08-d" id="s08-d3">0으로 나눌 수 없다</div></div></div>
      <div id="s08-side" class="x-side x-card x-hide">
        <div id="s08-plus">덧붙여</div>
        <div id="s08-sname">네 지표 모두</div>
        <div id="s08-sdef">0에 가까울수록<br />좋은 모델</div>
        <div id="s08-smean">작을수록 좋다</div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 25;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, t);
    const ACC = "#6B3FE6", INK2 = "#71717A";

    // 40 세 가지
    ft("#s08-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    // 지금 말하는 카드만 테두리와 번호가 강조색
    const focus = (k, t) => {
      stamp(`#s08-c${k}`, t);
      fade(`#s08-r${k}`, t, 0, 1);
      ft(`#s08-n${k}`, { color: INK2 }, { color: ACC }, t);
      if (k > 1) {
        fade(`#s08-r${k - 1}`, t, 1, 0);
        ft(`#s08-n${k - 1}`, { color: ACC }, { color: INK2 }, t);
      }
    };
    // 41~42 이상값에 민감한 쪽
    focus(1, at(1, 0.2));
    fade("#s08-d1", at(2, 0.3), 0, 1);
    // 43 단위
    focus(2, at(3, 0.2));
    fade("#s08-d2", at(3, 2.6), 0, 1);
    // 44 MAPE는 실제값 0이면 불가
    focus(3, at(4, 0.2));
    fade("#s08-d3", at(4, 2.4), 0, 1);
    // 45 덧붙여 모두 0에 가까울수록 좋다
    fade("#s08-r3", at(5, 0.2), 1, 0);
    ft("#s08-n3", { color: ACC }, { color: INK2 }, at(5, 0.2));
    ft("#s08-side", { opacity: 0, x: 24 }, { opacity: 1, x: 0 }, at(5, 0.3));
    if (String(V.exit) !== "false") ft("#s08-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s08"] = tl;
  </script>
