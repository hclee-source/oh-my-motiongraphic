<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .s01-c { position: absolute; top: 262px; width: 332px; height: 260px; padding: 34px 36px; box-sizing: border-box; }
    .s01-cap { font-size: 30px; font-weight: 700; color: var(--color-ink2, #71717A); }
    .s01-big { margin-top: 10px; font-size: 104px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
    .s01-sub { margin-top: 12px; font-size: 30px; font-weight: 700; }
    #s01-sum { position: absolute; left: 192px; top: 596px; font-size: 72px; font-weight: 900; letter-spacing: -0.01em; white-space: nowrap; opacity: 0; }
    #s01-zero { position: absolute; left: 1262px; top: 560px; font-size: 140px; font-weight: 900; line-height: 1; color: var(--color-accent, #6B3FE6); opacity: 0; }
    #s01-ring { position: absolute; left: 1214px; top: 540px; width: 180px; height: 180px; border-radius: 50%; border: 6px solid var(--color-accent, #6B3FE6);
      box-sizing: border-box; opacity: 0; }
    #s01-q { position: absolute; left: 1430px; top: 580px; font-size: 96px; font-weight: 900; color: var(--color-ink2, #71717A); opacity: 0; }
    .s01-m { position: absolute; top: 760px; font-size: 64px; font-weight: 900; letter-spacing: -0.01em; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s01" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0,4,9,14,17,21]"},{"id":"dur","type":"number","label":"장면 길이","default":27},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s01-all">
      <div class="s01-c x-card x-hide" style="left: 192px"><div class="s01-cap">주문 1</div><div class="s01-big">+2</div><div class="s01-sub">2분 일찍</div></div>
      <div class="s01-c x-card x-hide" style="left: 548px"><div class="s01-cap">주문 2</div><div class="s01-big">−2</div><div class="s01-sub">2분 늦게</div></div>
      <div class="s01-c x-card x-hide" style="left: 904px"><div class="s01-cap">주문 3</div><div class="s01-big">+2</div><div class="s01-sub">2분 일찍</div></div>
      <div class="s01-c x-card x-hide" style="left: 1260px"><div class="s01-cap">주문 4</div><div class="s01-big">−2</div><div class="s01-sub">2분 늦게</div></div>
      <div id="s01-sum">(+2) + (−2) + (+2) + (−2) =</div>
      <div id="s01-zero">0</div>
      <div id="s01-ring"></div>
      <div id="s01-q">?</div>
      <div class="s01-m" style="left: 192px">MAE</div>
      <div class="s01-m" style="left: 520px">MSE</div>
      <div class="s01-m" style="left: 846px">RMSE</div>
      <div class="s01-m" style="left: 1240px">MAPE</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 27;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, t);

    // 2 네 번 주문, 2분 일찍·2분 늦게 — 카드가 한 장씩
    gsap.utils.toArray(".s01-c").forEach((c, k) => stamp(c, at(1, 0.4 + k * 0.9)));
    // 3 그냥 더하면 0
    ft("#s01-sum", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(2, 0.3));
    ft("#s01-zero", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, at(2, 3.0));
    // 4 다 틀렸는데 0이라니
    fade("#s01-ring", at(3, 0.2), 0, 1);
    ft("#s01-q", { opacity: 0, x: -10 }, { opacity: 1, x: 0 }, at(3, 0.8));
    // 6 네 가지 지표
    fade(".s01-c, #s01-sum, #s01-zero, #s01-ring, #s01-q", at(5, 0.1), 1, 0.3);
    gsap.utils.toArray(".s01-m").forEach((m, k) => ft(m, { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(5, 1.6 + k * 0.6)));
    if (String(V.exit) !== "false") ft("#s01-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s01"] = tl;
  </script>
</template>
