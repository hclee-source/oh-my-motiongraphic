<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #h3-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
    .en { position: absolute; box-sizing: border-box; display: flex; flex-direction: column; padding-bottom: 8px; left: 60px; width: 380px; }
    .en-n { height: 64px; padding-top: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 900; }
    .en-pk { position: relative; min-height: 64px; }
    .en-at { position: relative; min-height: var(--a, 20px); }
    .en-dv { height: 5px; background: #18181B; border-radius: 3px; }
    .en-r { position: relative; height: 64px; display: flex; align-items: center; padding-left: 36px; font-size: 40px; font-weight: 800; white-space: nowrap; }
    .en-pk .en-r { color: var(--color-accent, #6B3FE6); }
    .en-at .en-r { color: #3F3F46; }
    .bd { position: absolute; left: 12px; right: 12px; top: 3px; bottom: 3px; border-radius: 12px; opacity: 0; background: #EEF0F4; }
    #h3-e1 { top: 320px; } #h3-e2 { top: 640px; }
    #h3-l { position: absolute; left: 540px; top: 340px; width: 480px; height: 170px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    #h3-l .t { font-size: 54px; font-weight: 900; white-space: nowrap; }
    #h3-l .s { font-size: 44px; font-weight: 800; white-space: nowrap; }
    #h3-n1 { left: 60px; top: 900px; width: 900px; font-size: 40px; }
    #h3-n2 { left: 60px; top: 1010px; width: 800px; font-size: 40px; }
  </style>
  <div id="root" data-composition-id="h3" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,4.2,9.5]"},{"id":"dur","type":"number","label":"장면 길이","default":15.1},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"wk","type":"number","label":"연결이 약한 시각","default":0},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h3-all">
      <svg id="h3-svg" viewBox="0 0 1080 1920"></svg>
      <div id="h3-e1" class="en x-card x-hide"><div class="en-n">학과</div>
        <div class="en-pk"><div class="en-r">학과코드</div></div><div class="en-dv"></div><div class="en-at"></div></div>
      <div id="h3-e2" class="en x-card x-hide" style="--a:64px"><div class="en-n">학생</div>
        <div class="en-pk"><div class="en-r">학번</div></div><div class="en-dv"></div>
        <div class="en-at"><div class="bd" id="h3-ba"></div><div class="en-r x-hide" id="h3-r1">학과코드</div></div></div>
      <div id="h3-l" class="x-card x-hide"><div class="t">비식별자 관계</div><div class="s">점선</div></div>
      <div id="h3-n1" class="q-chip q-ng">식별자 관계만 이으면 → 키가 계속 길어짐</div>
      <div id="h3-n2" class="q-chip q-ok">연결이 약한 곳 → 비식별자 관계</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 15.1;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, t);

    const NS = "http://www.w3.org/2000/svg";
    const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
    const ST = { stroke: "#18181B", "stroke-width": 6, fill: "none", "stroke-linecap": "round" };
    function sym(g, x, y, ux, uy, kind) {
      const nx = -uy, ny = ux;
      const pt = (a, b) => [x + ux * a + nx * b, y + uy * a + ny * b];
      const ln = (a1, b1, a2, b2) => { const [p, q] = pt(a1, b1), [r, s] = pt(a2, b2); mk("line", { x1: p, y1: q, x2: r, y2: s, ...ST }, g); };
      const bar = (o) => ln(o, -22, o, 22);
      const crow = () => { [-24, 0, 24].forEach((b) => ln(40, 0, 0, b)); };
      if (kind === "11") { bar(20); bar(38); }
      else if (kind === "mo") { crow(); const [cx, cy] = pt(66, 0); mk("circle", { cx, cy, r: 13, ...ST, fill: "#FFFFFF" }, g); }
    }
    const svg = document.getElementById("h3-svg");
    const g = mk("g", { id: "h3-g", style: "opacity:0" }, svg);   // 학과 — 학생 점선
    mk("line", { x1: 250, y1: 485, x2: 250, y2: 640, "stroke-dasharray": "16 12", ...ST }, g);
    sym(g, 250, 485, 0, 1, "11"); sym(g, 250, 640, 0, -1, "mo");

    // 5 학과의 학과코드는 학생의 일반 속성으로 들어간다
    ft("#h3-e1", { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, at(0, 0.1));
    ft("#h3-e2", { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, at(0, 0.3));
    fade("#h3-g", at(0, 0.8), 0, 1);
    const a = at(0, 1.2);
    mk("circle", { id: "h3-da", cx: 250, cy: 485, r: 17, fill: "#6B3FE6", style: "opacity:0" }, svg);
    ft("#h3-da", { opacity: 0, attr: { cx: 250, cy: 485 } }, { opacity: 1, attr: { cx: 250, cy: 485 }, duration: 0.2 }, a);
    tl.fromTo("#h3-da", { attr: { cx: 250, cy: 485 } }, { attr: { cx: 250, cy: 622 }, duration: 1.0, ease: "power2.inOut", immediateRender: false }, a + 0.25);
    fade("#h3-ba", a + 1.2, 0, 1);
    fade("#h3-r1", a + 1.3, 0, 1);
    fade("#h3-da", a + 1.4, 1, 0);
    // 6 학생을 학번으로 따로 구분하도록 하면 비식별자 관계, 점선
    stamp("#h3-l", at(1, 2.8));
    // 7 식별자 관계만 이으면 키가 계속 길어지니, 연결이 약한 곳은 비식별자 관계로
    stamp("#h3-n1", at(2, 0.2));
    stamp("#h3-n2", X("wk", at(2, 3.0)) - 0.2);
    if (String(V.exit) !== "false") ft("#h3-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h3"] = tl;
  </script>
</template>
