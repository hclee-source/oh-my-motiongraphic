<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #h2-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
    .en { position: absolute; box-sizing: border-box; display: flex; flex-direction: column; padding-bottom: 8px; }
    .en-n { height: 64px; padding-top: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 900; }
    .en-pk { position: relative; min-height: calc(var(--k, 1) * 64px); }
    .en-at { position: relative; min-height: 20px; }
    .en-dv { height: 5px; background: #18181B; border-radius: 3px; }
    .en-r { position: relative; height: 64px; display: flex; align-items: center; padding-left: 36px; font-size: 40px; font-weight: 800; white-space: nowrap; }
    .en-pk .en-r { color: var(--color-accent, #6B3FE6); }
    .bd { position: absolute; left: 12px; right: 12px; top: 3px; bottom: 3px; border-radius: 12px; opacity: 0;
      background: color-mix(in srgb, var(--color-accent, #6B3FE6) 13%, #FFFFFF); }
    #h2-e1 { left: 60px; top: 320px; width: 380px; }
    #h2-e2 { left: 60px; top: 640px; width: 380px; }
    #h2-e3 { left: 640px; top: 640px; width: 320px; }
    #h2-l { position: absolute; left: 540px; top: 340px; width: 480px; height: 170px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    #h2-l .t { font-size: 54px; font-weight: 900; color: var(--color-accent, #6B3FE6); white-space: nowrap; }
    #h2-l .s { font-size: 44px; font-weight: 800; white-space: nowrap; }
    #h2-n { left: 500px; top: 550px; width: 520px; }
  </style>
  <div id="root" data-composition-id="h2" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,4.6,11]"},{"id":"dur","type":"number","label":"장면 길이","default":16.3},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"ha","type":"number","label":"학번 시각","default":0},{"id":"hb","type":"number","label":"과목코드 시각","default":0},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h2-all">
      <svg id="h2-svg" viewBox="0 0 1080 1920"></svg>
      <div id="h2-e1" class="en x-card x-hide"><div class="en-n">학생</div>
        <div class="en-pk"><div class="en-r">학번</div></div><div class="en-dv"></div><div class="en-at"></div></div>
      <div id="h2-e2" class="en x-card x-hide"><div class="en-n">수강</div>
        <div class="en-pk" style="--k:2"><div class="bd" id="h2-bp"></div><div class="en-r x-hide" id="h2-r1">학번</div><div class="en-r x-hide" id="h2-r2">과목코드</div></div><div class="en-dv"></div><div class="en-at"></div></div>
      <div id="h2-e3" class="en x-card x-hide"><div class="en-n">과목</div>
        <div class="en-pk"><div class="en-r">과목코드</div></div><div class="en-dv"></div><div class="en-at"></div></div>
      <div id="h2-l" class="x-card x-hide"><div class="t">식별자 관계</div><div class="s">실선</div></div>
      <div id="h2-n" class="q-chip q-ok" style="font-size:38px">학생 없이는 수강도 없다</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 16.3;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, t);

    const NS = "http://www.w3.org/2000/svg";
    const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
    const ST = { stroke: "#18181B", "stroke-width": 6, fill: "none", "stroke-linecap": "round" };
    function sym(g, x, y, ux, uy, kind) {
      const nx = -uy, ny = ux;
      const pt = (a, b) => [x + ux * a + nx * b, y + uy * a + ny * b];
      const ln = (a1, b1, a2, b2) => { const [p, q] = pt(a1, b1), [r, s] = pt(a2, b2); mk("line", { x1: p, y1: q, x2: r, y2: s, ...ST }, g); };
      const bar = (o) => ln(o, -22, o, 22);
      const crow = () => { [-24, 0, 24].forEach((b) => ln(40, 0, 0, b)); };
      if (kind === "11") { bar(20); bar(38); }
      else if (kind === "m1") { crow(); bar(58); }
    }
    const svg = document.getElementById("h2-svg");
    const g = mk("g", { id: "h2-g", style: "opacity:0" }, svg);   // 학생 — 수강, 수강 — 과목 실선
    mk("line", { x1: 250, y1: 485, x2: 250, y2: 640, ...ST }, g);
    sym(g, 250, 485, 0, 1, "11"); sym(g, 250, 640, 0, -1, "m1");
    mk("line", { x1: 440, y1: 738, x2: 640, y2: 738, ...ST }, g);
    sym(g, 440, 738, 1, 0, "m1"); sym(g, 640, 738, -1, 0, "11");

    // 주식별자가 선을 따라 내려가는 점(글자 없는 도형)
    const dot = (id, x, y) => mk("circle", { id, cx: x, cy: y, r: 17, fill: "#6B3FE6", style: "opacity:0" }, svg);
    dot("h2-da", 250, 485);
    dot("h2-db", 640, 738);
    const run = (id, x0, y0, x1, y1, t, d) => {
      ft("#" + id, { opacity: 0, attr: { cx: x0, cy: y0 } }, { opacity: 1, attr: { cx: x0, cy: y0 }, duration: 0.2 }, t);
      tl.fromTo("#" + id, { attr: { cx: x0, cy: y0 } }, { attr: { cx: x1, cy: y1 }, duration: d, ease: "power2.inOut", immediateRender: false }, t + 0.25);
    };

    // 2 수강의 주식별자는 학생의 학번과 과목의 과목코드를 합친 것
    ["#h2-e1", "#h2-e2", "#h2-e3"].forEach((id, j) => ft(id, { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, at(0, 0.1 + j * 0.2)));
    fade("#h2-g", at(0, 0.8), 0, 1);
    const a = X("ha", at(0, 1.4)) - 0.3;
    run("h2-da", 250, 485, 250, 622, a, 1.0);
    fade("#h2-bp", a + 1.2, 0, 1);
    fade("#h2-r1", a + 1.3, 0, 1);
    fade("#h2-da", a + 1.4, 1, 0);
    const b = X("hb", at(0, 3.0)) - 0.3;
    run("h2-db", 640, 738, 458, 738, b, 1.0);
    fade("#h2-r2", b + 1.3, 0, 1);
    fade("#h2-db", b + 1.4, 1, 0);
    // 3 부모의 주식별자가 자식의 주식별자 안으로 들어가면 식별자 관계, 실선
    stamp("#h2-l", at(1, 3.2));
    // 4 학번이 수강의 주식별자에 들어 있으니 학생 없이는 수강도 없다
    stamp("#h2-n", at(2, 1.6));
    if (String(V.exit) !== "false") ft("#h2-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h2"] = tl;
  </script>
</template>
