  </style>
  <div id="root" data-composition-id="s05" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,3.5,8.6,15,20.3]"},{"id":"dur","type":"number","label":"장면 길이","default":26.5},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>

  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 26.5;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, t);
    const ACC = "#6B3FE6", INK2 = "#71717A";

    // 17 네 가지 특징
    ft("#s05-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s05-e", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.4));
    fade("#s05-p1", at(0, 1.4), 0, 1);
    const focus = (k, t) => {
      stamp(`#s05-c${k}`, t);
      fade(`#s05-r${k}`, t, 0, 1);
      ft(`#s05-t${k}`, { color: INK2 }, { color: ACC }, t);
      if (k > 1) {
        fade(`#s05-r${k - 1}`, t, 1, 0);
        ft(`#s05-t${k - 1}`, { color: ACC }, { color: INK2 }, t);
      }
    };
    focus(1, at(1, 0.2));
    focus(2, at(2, 0.2));
    fade("#s05-p2", at(2, 2.4), 0, 1);
    focus(3, at(3, 0.2));
    fade("#s05-p2", at(3, 0.1), 1, 0);
    focus(4, at(4, 0.2));
    if (String(V.exit) !== "false") ft("#s05-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s05"] = tl;
  </script>
