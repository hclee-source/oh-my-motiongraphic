  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 31.9;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);

    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, t);

    // IE 기호 그리기(상자 가장자리 x,y에서 선이 뻗는 방향 u 기준)
    const NS = "http://www.w3.org/2000/svg";
    const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };

    function sym(g, x, y, ux, uy, kind) {
      const nx = -uy, ny = ux;
      const pt = (a, b) => [x + ux * a + nx * b, y + uy * a + ny * b];
      const ln = (a1, b1, a2, b2) => { const [p, q] = pt(a1, b1), [r, s] = pt(a2, b2); mk("line", { x1: p, y1: q, x2: r, y2: s, ...ST }, g); };
      const bar = (o) => ln(o, -20, o, 20);
      const crow = () => { [-22, 0, 22].forEach((b) => ln(38, 0, 0, b)); };
      if (kind === "11") { bar(18); bar(34); }
      else if (kind === "1") { bar(24); }
      else if (kind === "mo") { crow(); const [cx, cy] = pt(62, 0); mk("circle", { cx, cy, r: 12, ...ST, fill: "#FFFFFF" }, g); }
      else if (kind === "m") { crow(); }
    }
    const svg = document.getElementById("s03-svg");
    const gl = mk("g", { id: "s03-gline", style: "opacity:0" }, svg);
    mk("line", { x1: 860, y1: 317, x2: 1060, y2: 317, ...ST }, gl);
    const gR = mk("g", { id: "s03-gR", style: "opacity:0" }, svg); sym(gR, 1060, 317, -1, 0, "mo");
    const gL = mk("g", { id: "s03-gL", style: "opacity:0" }, svg); sym(gL, 860, 317, 1, 0, "11");
    // 범례 아이콘(카드 안 좌표): 오른쪽 끝에 기호, 선은 왼쪽으로
    const lgs = document.getElementById("s03-lgs");
    [["m", 62], ["mo", 154], ["1", 246], ["11", 338]].forEach(([k, y], i) => {
      const g = mk("g", { id: "s03-ic" + (i + 1), style: "opacity:0" }, lgs);
      mk("line", { x1: 50, y1: y, x2: 230, y2: y, ...ST }, g);
      sym(g, 230, y, -1, 0, k);
    });

    // 8 엔터티를 잇는 선이 관계, 표기 세 가지
    ft("#s03-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));

    fade("#s03-lb", at(1, 0.3), 0, 1);
    stamp("#s03-rb1", X("b1", at(1, 2.0)) - 0.2);
    stamp("#s03-rb2", X("b2", at(1, 3.2)) - 0.2);
    stamp("#s03-rb3", X("b3", at(1, 4.2)) - 0.2);
    // 10 관계선택사양 필수 / 선택
    fade("#s03-lb", at(2, 0.1), 1, 0.4);
