<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #s04-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
    .en { position: absolute; box-sizing: border-box; display: flex; flex-direction: column; width: 400px; padding-bottom: 8px; top: 270px; }
    .en-n { height: 60px; padding-top: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 900; }
    .en-pk { position: relative; min-height: calc(var(--k, 1) * 56px); }
    .en-at { position: relative; min-height: 112px; }
    .en-dv { height: 4px; background: #18181B; border-radius: 2px; }
    .en-r { position: relative; height: 56px; display: flex; align-items: center; padding-left: 36px; font-size: 34px; font-weight: 800; white-space: nowrap; }
    .en-pk .en-r { color: var(--color-accent, #6B3FE6); }
    .en-at .en-r { color: #3F3F46; }
    #s04-e1 { left: 260px; } #s04-e2 { left: 1260px; }
    .s04-ring { position: absolute; top: 352px; height: 80px; box-sizing: border-box; border: 4px solid var(--color-accent, #6B3FE6); border-radius: 18px; opacity: 0; }
    #s04-rg1 { left: 1170px; width: 86px; }
    #s04-rg2 { left: 664px; width: 50px; }
    .s04-rd { position: absolute; left: 192px; width: 1536px; height: 110px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
      font-size: 46px; font-weight: 800; white-space: nowrap; }
    #s04-d1 { top: 580px; } #s04-d2 { top: 710px; }
    #s04-ch { left: 700px; top: 444px; width: 520px; }
  </style>
  <div id="root" data-composition-id="s04" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,6.3,13.2,17.1]"},{"id":"dur","type":"number","label":"장면 길이","default":23.9},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s04-all">
      <div id="s04-head" class="x-head">관계 읽기</div>
      <svg id="s04-svg" viewBox="0 0 1920 1080"></svg>
      <div id="s04-e1" class="en x-card x-hide" style="--k:1">
        <div class="en-n">고객</div>
        <div class="en-pk"><div class="en-r">고객번호</div></div>
        <div class="en-dv"></div>
        <div class="en-at"><div class="en-r">이메일</div><div class="en-r">이름</div></div>
      </div>
      <div id="s04-e2" class="en x-card x-hide" style="--k:1">
        <div class="en-n">주문</div>
        <div class="en-pk"><div class="en-r">주문번호</div></div>
        <div class="en-dv"></div>
        <div class="en-at"><div class="en-r">주문일자</div><div class="en-r">고객번호</div></div>
      </div>
      <div class="s04-ring" id="s04-rg1"></div>
      <div class="s04-ring" id="s04-rg2"></div>
      <div class="q-chip q-ok" id="s04-ch">주문 없는 고객도 있음 → 선택</div>
      <div class="s04-rd x-card x-hide" id="s04-d1">각 고객은 <span class="x-acc">&nbsp;여러 주문을 때때로&nbsp;</span> 한다</div>
      <div class="s04-rd x-card x-hide" id="s04-d2">각 주문은 <span class="x-acc">&nbsp;한 고객에게 항상&nbsp;</span> 속한다</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 23.9;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, t);

    const NS = "http://www.w3.org/2000/svg";
    const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
    const ST = { stroke: "#18181B", "stroke-width": 5, fill: "none", "stroke-linecap": "round" };
    function sym(g, x, y, ux, uy, kind) {
      const nx = -uy, ny = ux;
      const pt = (a, b) => [x + ux * a + nx * b, y + uy * a + ny * b];
      const ln = (a1, b1, a2, b2) => { const [p, q] = pt(a1, b1), [r, s] = pt(a2, b2); mk("line", { x1: p, y1: q, x2: r, y2: s, ...ST }, g); };
      const bar = (o) => ln(o, -20, o, 20);
      const crow = () => { [-22, 0, 22].forEach((b) => ln(38, 0, 0, b)); };
      if (kind === "11") { bar(18); bar(34); }
      else if (kind === "1") { bar(24); }
      else if (kind === "mo") { crow(); const [cx, cy] = pt(62, 0); mk("circle", { cx, cy, r: 12, ...ST, fill: "#FFFFFF" }, g); }
      else if (kind === "m1") { crow(); bar(54); }
    }
    const svg = document.getElementById("s04-svg");
    const g = mk("g", { id: "s04-gr", style: "opacity:0" }, svg);
    mk("line", { x1: 660, y1: 392, x2: 1260, y2: 392, "stroke-dasharray": "16 12", ...ST }, g);
    sym(g, 660, 392, 1, 0, "11");
    sym(g, 1260, 392, -1, 0, "mo");

    // 13 기준 엔터티에서 출발해 상대편 끝의 기호를 본다
    ft("#s04-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s04-e1", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.4));
    ft("#s04-e2", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.7));
    fade("#s04-gr", at(0, 1.6), 0, 1);
    // 14 고객에서 읽으면 주문 쪽 끝 ○ + 까마귀발
    fade("#s04-rg1", at(1, 0.4), 0, 1);
    ft("#s04-d1", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(1, 2.4));
    // 15 가입만 하고 아직 주문하지 않은 고객도 있으니 선택
    stamp("#s04-ch", at(2, 0.4));
    // 16 주문에서 읽으면 고객 쪽 끝 세로줄 두 개
    fade("#s04-ch", at(3, 0.1), 1, 0);
    fade("#s04-rg1", at(3, 0.2), 1, 0);
    fade("#s04-rg2", at(3, 0.5), 0, 1);
    ft("#s04-d1", { opacity: 1 }, { opacity: 0.45, ease: "power2.out" }, at(3, 0.5));
    ft("#s04-d2", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(3, 2.4));
    if (String(V.exit) !== "false") ft("#s04-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s04"] = tl;
  </script>
</template>
