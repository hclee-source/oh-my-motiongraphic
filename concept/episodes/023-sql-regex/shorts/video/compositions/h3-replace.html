<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #h3-code { left: 80px; top: 330px; width: 920px; }
    #h3-code .q-ln { font-size: 40px; height: 76px; padding: 0 44px; }
    #h3-str { position: absolute; left: 80px; top: 514px; width: 920px; height: 260px; }
    #h3-sw { position: absolute; left: 32px; right: 32px; top: 32px; bottom: 32px; }
    .h3-line { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center;
      font-size: 120px; font-weight: 900; white-space: nowrap; }
    .h3-sp { position: relative; display: inline-block; width: 80px; height: 150px; }
    .h3-sp > i { position: absolute; left: 12px; right: 12px; bottom: 6px; height: 10px; border-radius: 5px; background: var(--color-accent, #6B3FE6); opacity: 0; }
    #h3-lb { color: var(--color-accent, #6B3FE6); opacity: 0; }
    #h3-ok { left: 80px; top: 830px; height: 84px; font-size: 42px; padding: 0 36px; }
  </style>
  <div id="root" data-composition-id="h3" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45]"},{"id":"dur","type":"number","label":"장면 길이","default":7.6},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"g","type":"number","label":"공백을 시각","default":2.6},{"id":"s3","type":"number","label":"공백 두 개가 시각","default":4.3},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h3-all">
      <div id="h3-code" class="x-dark q-code x-hide">
        <div class="q-ln"><span><span class="q-k">REGEXP_REPLACE</span>('홍 길 동', ' ')</span></div>
      </div>
      <div id="h3-str" class="x-card x-hide">
        <div id="h3-sw" data-layout-allow-overlap>
          <div class="h3-line" id="h3-la"><span>홍</span><span class="h3-sp"><i id="h3-b1"></i></span><span>길</span><span class="h3-sp"><i id="h3-b2"></i></span><span>동</span></div>
          <div class="h3-line" id="h3-lb">홍길동</div>
        </div>
      </div>
      <div id="h3-ok" class="q-chip q-ok">공백 두 개 → 모두 지움</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 7.6;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k] ?? d);
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, t);

    // 5 ‘홍 길 동’에서 공백을 지우면 → 공백 두 개가 모두 지워져 홍길동
    ft("#h3-str", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0));
    ft("#h3-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 1.0));
    ft(["#h3-b1", "#h3-b2"], { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1 }, X("g", 2.6));
    stamp("#h3-ok", X("s3", 4.3));
    fade("#h3-la", X("s3", 4.3) + 1.0, 1, 0);
    fade("#h3-lb", X("s3", 4.3) + 1.25, 0, 1);
    if (String(V.exit) !== "false") ft("#h3-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h3"] = tl;
  </script>
</template>
