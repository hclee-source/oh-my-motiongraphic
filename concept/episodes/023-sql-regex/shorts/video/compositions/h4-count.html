<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #h4-code { left: 80px; top: 330px; width: 920px; }
    #h4-code .q-ln { font-size: 40px; height: 76px; padding: 0 44px; }
    .h4-cw { position: relative; display: block; width: 820px; height: 76px; }
    .h4-cw > span { position: absolute; left: 0; top: 0; line-height: 76px; white-space: nowrap; opacity: 0; }
    .h4-c { position: absolute; top: 500px; width: 240px; height: 200px; display: flex; align-items: center; justify-content: center; }
    .h4-hl { position: absolute; inset: -2px; border-radius: 28px; border: 3px solid var(--color-accent, #6B3FE6);
      background: color-mix(in srgb, var(--color-accent, #6B3FE6) 14%, #FFFFFF); opacity: 0; }
    .h4-ch { position: relative; font-size: 104px; font-weight: 900; line-height: 1; }
    .h4-p { position: absolute; top: 720px; width: 240px; text-align: center; font-size: 40px; font-weight: 800; color: var(--color-ink2, #71717A); opacity: 0; }
    #h4-res { position: absolute; left: 80px; top: 800px; width: 400px; height: 140px; }
    .h4-rv { position: absolute; left: 32px; right: 32px; top: 16px; bottom: 16px; display: flex; align-items: center; justify-content: center;
      font-size: 80px; font-weight: 900; opacity: 0; }
    #h4-note { position: absolute; left: 80px; top: 990px; width: 860px; height: 196px; padding: 30px 40px; box-sizing: border-box; }
    .h4-nl { height: 68px; display: flex; align-items: center; font-size: 40px; font-weight: 800; white-space: nowrap; }
    .h4-nl .x-ink2 { margin-right: 18px; }
  </style>
  <div id="root" data-composition-id="h4" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,5.3,10.25]"},{"id":"dur","type":"number","label":"장면 길이","default":16.85},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"n0","type":"number","label":"토를 시각","default":2.5},{"id":"n1","type":"number","label":"2개입니다 시각","default":3.8},{"id":"n2","type":"number","label":"1을 시각","default":8.9},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h4-all">
      <div id="h4-code" class="x-dark q-code x-hide">
        <div class="q-ln"><span class="h4-cw" data-layout-allow-overlap>
          <span id="h4-v1"><span class="q-k">REGEXP_COUNT</span>('토마토', '토')</span>
          <span id="h4-v2"><span class="q-k">REGEXP_INSTR</span>('토마토', '토')</span>
        </span></div>
      </div>
      <div class="h4-c x-card x-hide" id="h4-c1" style="left:80px"><div class="h4-hl" id="h4-h1"></div><div class="h4-ch">토</div></div>
      <div class="h4-c x-card x-hide" id="h4-c2" style="left:380px"><div class="h4-hl" id="h4-h2"></div><div class="h4-ch">마</div></div>
      <div class="h4-c x-card x-hide" id="h4-c3" style="left:680px"><div class="h4-hl" id="h4-h3"></div><div class="h4-ch">토</div></div>
      <div class="h4-p" id="h4-p1" style="left:80px">1</div>
      <div class="h4-p" id="h4-p2" style="left:380px">2</div>
      <div class="h4-p" id="h4-p3" style="left:680px">3</div>
      <div id="h4-res" class="x-card x-hide" data-layout-allow-overlap>
        <div class="h4-rv x-acc" id="h4-r1">2</div>
        <div class="h4-rv x-acc" id="h4-r2">1</div>
      </div>
      <div id="h4-note" class="x-card x-hide">
        <div class="h4-nl"><span class="x-ink2">없으면</span>REGEXP_SUBSTR = <span class="q-null">&nbsp;NULL</span></div>
        <div class="h4-nl">REGEXP_INSTR · REGEXP_COUNT = 0</div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 16.85;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k] ?? d);
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, t);

    // 6 ‘토마토’에서 REGEXP_COUNT로 토를 세면 → 2개
    [1, 2, 3].forEach((k) => ft(`#h4-c${k}`, { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(0, (k - 1) * 0.1)));
    ft("#h4-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.8));
    fade("#h4-v1", at(0, 0.8), 0, 1);
    fade(["#h4-h1", "#h4-h3"], X("n0", 2.5), 0, 1);
    ft("#h4-res", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, X("n1", 3.8) - 0.2);
    stamp("#h4-r1", X("n1", 3.8));
    // 7 REGEXP_INSTR으로 토를 찾으면 → 처음 맞는 곳의 시작 위치 1
    fade("#h4-v1", at(1, 0), 1, 0);
    fade("#h4-v2", at(1, 0.15), 0, 1);
    fade("#h4-h3", at(1, 0.2), 1, 0);
    fade("#h4-r1", at(1, 0.2), 1, 0);
    [1, 2, 3].forEach((k) => fade(`#h4-p${k}`, at(1, 1.6 + k * 0.08), 0, 1));
    ft("#h4-p1", { color: "#71717A" }, { color: "#6B3FE6" }, X("n2", 8.9) - 0.2);
    stamp("#h4-r2", X("n2", 8.9) + 0.9);
    // 8 맞는 곳이 없으면 SUBSTR은 NULL, INSTR · COUNT는 0
    fade(["#h4-c1", "#h4-c2", "#h4-c3", "#h4-p1", "#h4-p2", "#h4-p3", "#h4-res"], at(2, 0.1), 1, 0.4);
    ft("#h4-note", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(2, 0.2));
    if (String(V.exit) !== "false") ft("#h4-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h4"] = tl;
  </script>
</template>
