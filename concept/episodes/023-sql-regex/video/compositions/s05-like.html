    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 58.1;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k] ?? d);
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, t);
    const ACC = "#6B3FE6", INK = "#18181B", DIM = 0.25;
    let pat = 1, cnt = 1, note = null;
    const pattern = (k, t) => { fade(`#s05-v${pat}`, t, 1, 0); fade(`#s05-v${k}`, t + 0.15, 0, 1); pat = k; };
    const count = (k, t) => { fade(`#s05-c${cnt}`, t, 1, 0); fade(`#s05-c${k}`, t + 0.1, 0, 1); cnt = k; };
    const say = (id, t) => { if (note) fade(note, t, 1, 0); fade(id, t + 0.15, 0, 1); note = id; };
    const hit = (m, k, t) => { ft(m, { color: INK }, { color: ACC }, t); stamp(k, t + 0.1); };

    // 19 처음 문제로 — 같은 표, 같은 SQL

    ft("#s05-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.2));
    fade("#s05-v1", at(0, 0.2), 0, 1);
    ft("#s05-tb", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.4));
    fade("#s05-c1", at(0, 0.6), 0, 1);
    fade("#s05-h3", at(0, 1.2), 0, 1);
    // 20 어느 한 부분에서라도 맞으면 참
    ft("#s05-note", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(1, 0.1));
    say("#s05-na", at(1, 0.1));
    // 21 A101은 뒤쪽 101, 4096은 앞쪽 409
    hit("#s05-m0", "#s05-k0", X("x1", 9.2));
    hit("#s05-m3", "#s05-k3", X("x2", 11.2));
    // 22 숫자 두 개뿐인 B30, 77C만 빠지고 4행
    hit("#s05-m1", "#s05-k1", at(3, 0.2));
    hit("#s05-m5", "#s05-k5", at(3, 0.2));
    fade(["#s05-r2", "#s05-r4"], at(3, 1.4), 1, DIM);

    pattern(2, X("c3", 21.5));
    say("#s05-nb", X("c3", 21.5));
    fade("#s05-r0", X("c3b", 24.5) - 0.3, 1, DIM);
    count(3, X("c3b", 24.5) + 0.4);
    // 24 뒤에 $ → 네 자리인 4096도 빠져 두 행
    pattern(3, X("c4", 28.4));
    say("#s05-nc", X("c4", 28.4));
    fade("#s05-r3", X("c4b", 30.5), 1, DIM);
    count(4, X("c4c", 32.8));
    // 25 LIKE는 전체 일치, 정규 표현식은 ^ · $로 묶는다
    say("#s05-nd", at(6, 0.2));

    say("#s05-ne", at(7, 0.1));
    // 27 '^b' → 0행: 표를 처음 상태로 돌리고 모두 흐리게
    pattern(4, at(8, 0.1));
    ft(["#s05-m0", "#s05-m1", "#s05-m3", "#s05-m5"], { color: ACC }, { color: INK }, at(8, 0.1));
    fade(["#s05-k0", "#s05-k1", "#s05-k3", "#s05-k5"], at(8, 0.1), 1, 0);
    fade(["#s05-r1", "#s05-r5"], at(8, 0.3), 1, DIM);
