<template>
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; }
    .cap { position: absolute; left: 0; right: 0; bottom: 108px; text-align: center; overflow: visible;
      font-size: 46px; font-weight: 600; line-height: 1.35; letter-spacing: 0; color: var(--color-ink, #18181B); }
    .cap span { display: inline-block; max-width: 1536px; }
  </style>
  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <div id="cap-01a" class="cap clip" data-start="3.600" data-duration="1.490"><span>상품 코드 여섯 개 가운데,</span></div>
    <div id="cap-01b" class="cap clip" data-start="5.090" data-duration="3.407"><span>숫자 세 자리로 된 코드만 찾으려고 합니다.</span></div>
    <div id="cap-02a" class="cap clip" data-start="8.598" data-duration="2.310"><span>그래서 ‘숫자 세 개’라는 정규 표현식을</span></div>
    <div id="cap-02b" class="cap clip" data-start="10.908" data-duration="2.525"><span>REGEXP_LIKE 조건으로 걸었습니다.</span></div>
    <div id="cap-03a" class="cap clip" data-start="13.532" data-duration="2.750"><span>숫자 세 자리 코드는 205와 310이니,</span></div>
    <div id="cap-03b" class="cap clip" data-start="16.282" data-duration="2.300"><span>두 행이 나올 것 같습니다.</span></div>
    <div id="cap-04a" class="cap clip" data-start="18.682" data-duration="2.632"><span>그런데 실제로는 4행이 나옵니다.</span></div>
    <div id="cap-05a" class="cap clip" data-start="21.414" data-duration="3.050"><span>오늘은 정규 표현식 함수 다섯 개를 결과 맞히기로</span></div>
    <div id="cap-05b" class="cap clip" data-start="24.464" data-duration="3.830"><span>정리하면서, 이 4행의 이유도 찾아보겠습니다.</span></div>
    <div id="cap-06a" class="cap clip" data-start="28.944" data-duration="2.030"><span>정규 표현식은 ‘숫자 네 개’,</span></div>
    <div id="cap-06b" class="cap clip" data-start="30.974" data-duration="4.402"><span>‘대문자로 시작’처럼 문자열의 모양을 기호로 적는 방법입니다.</span></div>
    <div id="cap-07a" class="cap clip" data-start="35.475" data-duration="2.770"><span>LIKE의 퍼센트와 밑줄보다 훨씬 자세하게,</span></div>
    <div id="cap-07b" class="cap clip" data-start="38.245" data-duration="3.924"><span>글자의 종류와 반복 횟수까지 적을 수 있습니다.</span></div>
    <div id="cap-08a" class="cap clip" data-start="42.269" data-duration="4.667"><span>오라클의 정규 표현식 함수는 다섯 개로, 조건을 거는 REGEXP_LIKE,</span></div>
    <div id="cap-08b" class="cap clip" data-start="46.936" data-duration="5.740"><span>뽑는 REGEXP_SUBSTR, 바꾸는 REGEXP_REPLACE가 기본입니다.</span></div>
    <div id="cap-09a" class="cap clip" data-start="52.776" data-duration="2.790"><span>여기에 위치를 알려 주는 REGEXP_INSTR,</span></div>
    <div id="cap-09b" class="cap clip" data-start="55.566" data-duration="3.134"><span>개수를 세는 REGEXP_COUNT가 더해집니다.</span></div>
    <div id="cap-10a" class="cap clip" data-start="59.350" data-duration="2.695"><span>먼저 글자 하나를 뜻하는 기호입니다.</span></div>
    <div id="cap-11a" class="cap clip" data-start="62.145" data-duration="2.790"><span>점은 아무 글자나 하나, 대괄호는 그</span></div>
    <div id="cap-11b" class="cap clip" data-start="64.935" data-duration="2.838"><span>안에 적은 글자 가운데 하나를 뜻합니다.</span></div>
    <div id="cap-12a" class="cap clip" data-start="67.873" data-duration="2.770"><span>대괄호 안에 0부터 9까지 범위를 적으면 숫자</span></div>
    <div id="cap-12b" class="cap clip" data-start="70.643" data-duration="3.511"><span>하나를 뜻하고, 역슬래시 d도 같은 뜻입니다.</span></div>
    <div id="cap-13a" class="cap clip" data-start="74.254" data-duration="3.850"><span>대괄호 안 맨 앞에 캐럿을 붙이면 반대로 적은 글자가 아닌</span></div>
    <div id="cap-13b" class="cap clip" data-start="78.104" data-duration="4.757"><span>글자 하나가 되는데, 대괄호 밖의 캐럿과는 뜻이 다릅니다.</span></div>
    <div id="cap-14a" class="cap clip" data-start="83.511" data-duration="1.750"><span>다음은 바로 앞 덩어리가 몇</span></div>
    <div id="cap-14b" class="cap clip" data-start="85.261" data-duration="2.383"><span>번 나오는지를 정하는 기호입니다.</span></div>
    <div id="cap-15a" class="cap clip" data-start="87.744" data-duration="4.110"><span>별표는 0번 이상, 더하기 기호는 한 번 이상,</span></div>
    <div id="cap-15b" class="cap clip" data-start="91.854" data-duration="2.235"><span>물음표는 없거나 한 번입니다.</span></div>
    <div id="cap-16a" class="cap clip" data-start="94.190" data-duration="3.270"><span>중괄호에 숫자 하나를 적으면 정확히 그 횟수만큼,</span></div>
    <div id="cap-16b" class="cap clip" data-start="97.460" data-duration="4.120"><span>숫자 두 개를 쉼표로 적으면 그 범위만큼 반복합니다.</span></div>
    <div id="cap-17a" class="cap clip" data-start="101.679" data-duration="3.450"><span>그래서 휴대폰 번호는 숫자 세 개, 하이픈,</span></div>
    <div id="cap-17b" class="cap clip" data-start="105.129" data-duration="5.076"><span>숫자 네 개, 하이픈, 숫자 네 개로 적을 수 있습니다.</span></div>
    <div id="cap-18a" class="cap clip" data-start="110.305" data-duration="4.010"><span>반복 기호는 바로 앞 한 덩어리, 곧 글자 하나나 대괄호</span></div>
    <div id="cap-18b" class="cap clip" data-start="114.315" data-duration="4.511"><span>하나에만 붙으니, 여러 글자를 반복하려면 괄호로 묶습니다.</span></div>
    <div id="cap-19a" class="cap clip" data-start="119.475" data-duration="2.635"><span>이제 처음 문제로 돌아가 보겠습니다.</span></div>
    <div id="cap-20a" class="cap clip" data-start="122.211" data-duration="2.190"><span>REGEXP_LIKE는 패턴이 문자열의</span></div>
    <div id="cap-20b" class="cap clip" data-start="124.401" data-duration="2.575"><span>어느 한 부분에서라도 맞으면 참입니다.</span></div>
    <div id="cap-21a" class="cap clip" data-start="127.075" data-duration="2.110"><span>A101은 뒤쪽 101이,</span></div>
    <div id="cap-21b" class="cap clip" data-start="129.185" data-duration="4.067"><span>4096은 앞쪽 409가 숫자 세 개라서 참이 됩니다.</span></div>
    <div id="cap-22a" class="cap clip" data-start="133.353" data-duration="1.870"><span>숫자가 두 개뿐인 B30과</span></div>
    <div id="cap-22b" class="cap clip" data-start="135.223" data-duration="3.257"><span>77C만 빠지고, 4행이 나옵니다.</span></div>
    <div id="cap-23a" class="cap clip" data-start="138.580" data-duration="2.450"><span>패턴 맨 앞에 시작을 뜻하는 캐럿을 붙이면,</span></div>
    <div id="cap-23b" class="cap clip" data-start="141.030" data-duration="4.015"><span>숫자로 시작하지 않는 A101이 빠져 3행입니다.</span></div>
    <div id="cap-24a" class="cap clip" data-start="145.145" data-duration="2.510"><span>맨 뒤에 끝을 뜻하는 달러 기호까지 붙이면,</span></div>
    <div id="cap-24b" class="cap clip" data-start="147.655" data-duration="5.975"><span>네 자리인 4096도 빠지고 205와 310, 두 행이 남습니다.</span></div>
    <div id="cap-25a" class="cap clip" data-start="153.730" data-duration="2.530"><span>문자열 전체를 맞춰야 하는 LIKE와 달리,</span></div>
    <div id="cap-25b" class="cap clip" data-start="156.260" data-duration="5.425"><span>정규 표현식은 캐럿과 달러 기호로 시작과 끝을 직접 묶어야 합니다.</span></div>
    <div id="cap-26a" class="cap clip" data-start="161.785" data-duration="1.630"><span>또 정규 표현식은 기본</span></div>
    <div id="cap-26b" class="cap clip" data-start="163.415" data-duration="2.533"><span>설정에서 대소문자를 구분합니다.</span></div>
    <div id="cap-27a" class="cap clip" data-start="166.048" data-duration="3.514"><span>소문자 b로 시작하는 코드를 찾으면 0행입니다.</span></div>
    <div id="cap-28a" class="cap clip" data-start="169.663" data-duration="2.610"><span>옵션 ‘i’를 주면 대소문자를 가리지 않아서,</span></div>
    <div id="cap-28b" class="cap clip" data-start="172.273" data-duration="4.234"><span>대문자 B로 시작하는 B30이 나와 1행이 됩니다.</span></div>
    <div id="cap-29a" class="cap clip" data-start="177.157" data-duration="2.482"><span>여기서부터는 결과 맞히기입니다.</span></div>
    <div id="cap-30a" class="cap clip" data-start="179.739" data-duration="3.450"><span>‘2026년 11월 5일’에서 숫자가 한 번 이상 이어진</span></div>
    <div id="cap-30b" class="cap clip" data-start="183.189" data-duration="3.755"><span>부분을 REGEXP_SUBSTR으로 뽑으면 무엇이 나올까요?</span></div>
    <div id="cap-31a" class="cap clip" data-start="187.044" data-duration="1.957"><span>답은 2026입니다.</span></div>
    <div id="cap-32a" class="cap clip" data-start="189.101" data-duration="1.810"><span>이어진 숫자를 한 덩어리로 잡고,</span></div>
    <div id="cap-32b" class="cap clip" data-start="190.911" data-duration="3.751"><span>여러 덩어리 가운데 첫 번째 하나만 돌려줍니다.</span></div>
    <div id="cap-33a" class="cap clip" data-start="194.762" data-duration="2.510"><span>세 번째 인자는 찾기 시작할 위치,</span></div>
    <div id="cap-33b" class="cap clip" data-start="197.272" data-duration="3.695"><span>네 번째 인자는 몇 번째 덩어리인지를 정합니다.</span></div>
    <div id="cap-34a" class="cap clip" data-start="201.067" data-duration="2.950"><span>그래서 시작 위치에 1을, 몇 번째에 2를</span></div>
    <div id="cap-34b" class="cap clip" data-start="204.017" data-duration="3.060"><span>주면 두 번째 덩어리인 11이 나옵니다.</span></div>
    <div id="cap-35a" class="cap clip" data-start="207.177" data-duration="1.830"><span>숫자 다섯 개처럼 맞는 부분이</span></div>
    <div id="cap-35b" class="cap clip" data-start="209.007" data-duration="2.236"><span>없으면 결과는 NULL입니다.</span></div>
    <div id="cap-36a" class="cap clip" data-start="211.893" data-duration="2.530"><span>REGEXP_REPLACE로 전화번호 끝의 숫자 네</span></div>
    <div id="cap-36b" class="cap clip" data-start="214.423" data-duration="4.185"><span>개를 별 네 개로 바꾸면, 마지막 네 자리가 가려집니다.</span></div>
    <div id="cap-37a" class="cap clip" data-start="218.708" data-duration="1.590"><span>그렇다면 끝을 뜻하는 달러</span></div>
    <div id="cap-37b" class="cap clip" data-start="220.298" data-duration="2.216"><span>기호를 빼면 어떻게 될까요?</span></div>
    <div id="cap-38a" class="cap clip" data-start="222.614" data-duration="2.813"><span>그러면 가운데 네 자리도 가려집니다.</span></div>
    <div id="cap-39a" class="cap clip" data-start="225.527" data-duration="2.330"><span>REGEXP_REPLACE는 따로 정하지 않으면,</span></div>
    <div id="cap-39b" class="cap clip" data-start="227.857" data-duration="4.312"><span>맞는 부분을 하나만이 아니라 모두 바꾸기 때문입니다.</span></div>
    <div id="cap-40a" class="cap clip" data-start="232.269" data-duration="3.130"><span>바꿀 문자를 아예 적지 않으면 맞는 부분이 지워져서,</span></div>
    <div id="cap-40b" class="cap clip" data-start="235.399" data-duration="4.535"><span>숫자가 아닌 글자를 지우면 숫자 열한 개만 남습니다.</span></div>
    <div id="cap-41a" class="cap clip" data-start="240.584" data-duration="1.730"><span>REGEXP_COUNT로 ‘banana’에서</span></div>
    <div id="cap-41b" class="cap clip" data-start="242.314" data-duration="2.458"><span>알파벳 a를 세면 3입니다.</span></div>
    <div id="cap-42a" class="cap clip" data-start="244.871" data-duration="3.483"><span>그럼 세 글자 ana를 세면 몇 개일까요?</span></div>
    <div id="cap-43a" class="cap clip" data-start="248.455" data-duration="3.332"><span>겹치게 세면 두 번이지만, 답은 1입니다.</span></div>
    <div id="cap-44a" class="cap clip" data-start="251.887" data-duration="1.790"><span>한 번 맞춘 글자는 건너뛰고,</span></div>
    <div id="cap-44b" class="cap clip" data-start="253.677" data-duration="3.409"><span>그 뒤에서부터 이어서 찾기 때문입니다.</span></div>
    <div id="cap-45a" class="cap clip" data-start="257.186" data-duration="2.810"><span>REGEXP_INSTR은 처음 맞는 곳의 시작 위치를</span></div>
    <div id="cap-45b" class="cap clip" data-start="259.996" data-duration="4.223"><span>돌려주는데, 알파벳 n은 세 번째 글자라서 3입니다.</span></div>
    <div id="cap-46a" class="cap clip" data-start="264.319" data-duration="4.230"><span>맞는 곳이 없으면 REGEXP_INSTR과 REGEXP_COUNT는 0을,</span></div>
    <div id="cap-46b" class="cap clip" data-start="268.549" data-duration="2.887"><span>REGEXP_SUBSTR은 NULL을 돌려줍니다.</span></div>
    <div id="cap-47a" class="cap clip" data-start="272.086" data-duration="3.050"><span>마지막으로, 태그를 뽑으려고 여는 꺾쇠괄호 뒤에</span></div>
    <div id="cap-47b" class="cap clip" data-start="275.136" data-duration="3.618"><span>점과 별표를 적고 닫는 꺾쇠괄호로 끝냈습니다.</span></div>
    <div id="cap-48a" class="cap clip" data-start="278.854" data-duration="2.139"><span>결과는 앞의 태그 하나일까요?</span></div>
    <div id="cap-49a" class="cap clip" data-start="281.093" data-duration="2.017"><span>답은 문자열 전체입니다.</span></div>
    <div id="cap-50a" class="cap clip" data-start="283.209" data-duration="2.970"><span>반복 기호는 맞출 수 있는 가장 긴 부분을 잡아서,</span></div>
    <div id="cap-50b" class="cap clip" data-start="286.179" data-duration="3.831"><span>맨 마지막 닫는 꺾쇠괄호까지 가져갑니다.</span></div>
    <div id="cap-51a" class="cap clip" data-start="290.110" data-duration="2.270"><span>반복 기호 뒤에 물음표를 붙이면 가장</span></div>
    <div id="cap-51b" class="cap clip" data-start="292.380" data-duration="3.305"><span>짧게 잡아서, 앞의 태그 하나만 나옵니다.</span></div>
    <div id="cap-52a" class="cap clip" data-start="295.785" data-duration="2.250"><span>이 패턴으로 REGEXP_REPLACE를 하면</span></div>
    <div id="cap-52b" class="cap clip" data-start="298.035" data-duration="3.744"><span>태그만 모두 지워져 ‘굵게’라는 글자만 남습니다.</span></div>
    <div id="cap-53a" class="cap clip" data-start="302.429" data-duration="2.582"><span>시험장에서 챙길 것 세 가지입니다.</span></div>
    <div id="cap-54a" class="cap clip" data-start="305.111" data-duration="2.550"><span>첫째, 캐럿과 달러 기호가 없으면</span></div>
    <div id="cap-54b" class="cap clip" data-start="307.661" data-duration="3.343"><span>패턴이 문자열 일부에만 맞아도 참입니다.</span></div>
    <div id="cap-55a" class="cap clip" data-start="311.104" data-duration="4.330"><span>둘째, REGEXP_SUBSTR은 첫 번째로 맞는 부분 하나를 뽑고,</span></div>
    <div id="cap-55b" class="cap clip" data-start="315.434" data-duration="3.674"><span>REGEXP_REPLACE는 맞는 부분을 모두 바꿉니다.</span></div>
    <div id="cap-56a" class="cap clip" data-start="319.208" data-duration="3.210"><span>셋째, 반복 기호는 가장 길게 맞추고,</span></div>
    <div id="cap-56b" class="cap clip" data-start="322.418" data-duration="3.447"><span>뒤에 물음표를 붙여야 가장 짧게 맞춥니다.</span></div>
    <div id="cap-57a" class="cap clip" data-start="325.966" data-duration="3.050"><span>덧붙여, 대괄호 안 맨 앞의 캐럿은 시작이</span></div>
    <div id="cap-57b" class="cap clip" data-start="329.016" data-duration="3.306"><span>아니라 ‘이 글자가 아닌 것’이라는 뜻입니다.</span></div>
    <div id="cap-58a" class="cap clip" data-start="332.972" data-duration="2.894"><span>오늘 내용을 한 줄로 정리하면 이렇습니다.</span></div>
    <div id="cap-59a" class="cap clip" data-start="335.965" data-duration="2.230"><span>정규 표현식은 일부만 맞아도 참이고,</span></div>
    <div id="cap-59b" class="cap clip" data-start="338.195" data-duration="2.331"><span>가장 길게 잡습니다.</span></div>
    <div id="cap-60a" class="cap clip" data-start="340.626" data-duration="2.510"><span>전체를 맞추려면 캐럿과 달러 기호를,</span></div>
    <div id="cap-60b" class="cap clip" data-start="343.136" data-duration="2.987"><span>짧게 잡으려면 물음표를 붙입니다.</span></div>
  </div>
  <script>
    window.__timelines["captions"] = gsap.timeline({ paused: true });
  </script>
</template>
