<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .s10-c { position: absolute; left: 192px; width: 928px; height: 176px; padding: 0 44px; box-sizing: border-box;
      display: grid; grid-template-columns: 84px 1fr; align-items: center; }
    #s10-c1 { top: 262px; }
    #s10-c2 { top: 466px; }
    #s10-c3 { top: 670px; }
    .s10-ring { position: absolute; inset: -2px; border-radius: 28px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
    .s10-n { font-size: 72px; font-weight: 900; color: var(--color-ink2, #71717A); }
    .s10-t { font-size: 44px; font-weight: 800; white-space: nowrap; }
    .s10-d { margin-top: 8px; font-size: 32px; font-weight: 600; color: var(--color-ink2, #71717A); opacity: 0; white-space: nowrap; }
    #s10-side { top: 262px; height: 584px; padding: 44px 48px; }
    #s10-plus { font-size: 32px; font-weight: 700; color: var(--color-ink2, #71717A); }
    #s10-sname { margin-top: 10px; font-size: 52px; font-weight: 900; line-height: 1.25; }
    #s10-sdef { margin-top: 26px; font-size: 40px; font-weight: 800; color: var(--color-accent, #6B3FE6); line-height: 1.4; }
    #s10-sex { margin-top: 30px; font-size: 34px; font-weight: 700; color: var(--color-ink2, #71717A); }
  </style>
  <div id="root" data-composition-id="s10" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,3.1,9.1,17.2,24]"},{"id":"dur","type":"number","label":"장면 길이","default":30.4},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s10-all">
      <div id="s10-head" class="x-head">시험장 체크</div>
      <div class="s10-c x-card x-hide" id="s10-c1"><div class="s10-ring" id="s10-r1"></div><div class="s10-n" id="s10-n1">1</div>
        <div><div class="s10-t">^ · $ 없으면 일부만 맞아도 참</div><div class="s10-d" id="s10-d1">LIKE와 달리 전체 일치가 아니다</div></div></div>
      <div class="s10-c x-card x-hide" id="s10-c2"><div class="s10-ring" id="s10-r2"></div><div class="s10-n" id="s10-n2">2</div>
        <div><div class="s10-t">SUBSTR은 하나 · REPLACE는 모두</div><div class="s10-d" id="s10-d2">첫 번째로 맞는 부분 / 맞는 부분 전부</div></div></div>
      <div class="s10-c x-card x-hide" id="s10-c3"><div class="s10-ring" id="s10-r3"></div><div class="s10-n" id="s10-n3">3</div>
        <div><div class="s10-t">반복은 가장 길게, ?를 붙이면 짧게</div><div class="s10-d" id="s10-d3">&lt;.*&gt; 전체 · &lt;.*?&gt; 앞의 태그 하나</div></div></div>
      <div id="s10-side" class="x-side x-card x-hide">
        <div id="s10-plus">덧붙여</div>
        <div id="s10-sname">대괄호 안<br />맨 앞의 ^</div>
        <div id="s10-sdef">시작이 아니라<br />‘이 글자가 아닌 것’</div>
        <div id="s10-sex">[^0-9] = 숫자가 아닌 글자</div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 30.4;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, t);
    const ACC = "#6B3FE6", INK2 = "#71717A";

    // 53 세 가지
    ft("#s10-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    // 지금 말하는 카드만 테두리와 번호가 강조색
    const focus = (k, t) => {
      stamp(`#s10-c${k}`, t);
      fade(`#s10-r${k}`, t, 0, 1);
      ft(`#s10-n${k}`, { color: INK2 }, { color: ACC }, t);
      if (k > 1) {
        fade(`#s10-r${k - 1}`, t, 1, 0);
        ft(`#s10-n${k - 1}`, { color: ACC }, { color: INK2 }, t);
      }
    };
    // 54 ^ · $가 없으면 일부만 맞아도 참
    focus(1, at(1, 0.2));
    fade("#s10-d1", at(1, 2.6), 0, 1);
    // 55 SUBSTR은 첫 번째 하나, REPLACE는 모두
    focus(2, at(2, 0.2));
    fade("#s10-d2", at(2, 3.0), 0, 1);
    // 56 반복은 가장 길게, ?를 붙여야 가장 짧게
    focus(3, at(3, 0.2));
    fade("#s10-d3", at(3, 2.6), 0, 1);
    // 57 덧붙여 대괄호 안 맨 앞의 ^ = 아닌 것
    fade("#s10-r3", at(4, 0.2), 1, 0);
    ft("#s10-n3", { color: ACC }, { color: INK2 }, at(4, 0.2));
    ft("#s10-side", { opacity: 0, x: 24 }, { opacity: 1, x: 0 }, at(4, 0.3));
    if (String(V.exit) !== "false") ft("#s10-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s10"] = tl;
  </script>
</template>
