<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #h1-card { position: absolute; left: 80px; top: 420px; width: 920px; height: 340px; padding: 0 64px;
      display: flex; align-items: center; justify-content: center; gap: 40px; }
    .h1-it { font-size: 120px; font-weight: 900; }
    #h1-ar { font-size: 100px; font-weight: 900; color: var(--color-ink2, #71717A); }
    #h1-q { color: var(--color-accent, #6B3FE6); opacity: 0; }
    #h1-t { position: absolute; left: 80px; top: 860px; font-size: 72px; font-weight: 900; opacity: 0; white-space: nowrap; }
    .h1-w { position: absolute; top: 990px; font-size: 60px; font-weight: 900; opacity: 0; }
  </style>
  <div id="root" data-composition-id="h1" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.3,5.5]"},{"id":"dur","type":"number","label":"장면 길이","default":8},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h1-all">
      <div id="h1-card" class="x-card x-hide"><div class="h1-it">빵</div><div id="h1-ar">→</div><div class="h1-it">우유<span id="h1-q">?</span></div></div>
      <div id="h1-t">세 숫자로 평가</div>
      <div class="h1-w" style="left: 80px">지지도</div>
      <div class="h1-w" style="left: 380px">신뢰도</div>
      <div class="h1-w x-acc" style="left: 680px">향상도</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 8;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);

    // 1 빵을 산 손님 중 우유도 산 사람이 많다면, 쓸모 있을까?
    ft("#h1-card", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, at(0, 0.1));
    ft("#h1-q", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, at(0, 3.6));
    // 2 세 숫자로 평가
    ft("#h1-t", { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, at(1, 0.2));
    gsap.utils.toArray(".h1-w").forEach((w, k) => ft(w, { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, at(1, 0.8 + k * 0.3)));
    if (String(V.exit) !== "false") ft("#h1-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.35);
    window.__timelines["h1"] = tl;
  </script>
</template>
