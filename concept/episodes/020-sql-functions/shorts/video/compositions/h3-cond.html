<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #h3-codes { position: absolute; left: 80px; top: 320px; width: 920px; height: 300px; }
    .h3-code { left: 0; top: 0; width: 920px; }
    .h3-code .q-ln { font-size: 46px; height: 76px; padding: 0 44px; }
    .h3-day { position: absolute; top: 640px; width: 420px; height: 150px; box-sizing: border-box; display: flex; align-items: center;
      justify-content: center; font-size: 72px; font-weight: 900; }
    #h3-cap { position: absolute; left: 80px; width: 920px; top: 520px; text-align: center; font-size: 48px; font-weight: 800;
      color: var(--color-ink2, #71717A); opacity: 0; }
    #h3-ring { position: absolute; inset: -2px; border-radius: 28px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
    .h3-ans { height: 110px; border-radius: 55px; font-size: 64px; font-weight: 900; }
  </style>
  <div id="root" data-composition-id="h3" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0,7]"},{"id":"dur","type":"number","label":"장면 길이","default":15.7},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"d1","type":"number","label":"하루가 시각","default":3.6},{"id":"h12","type":"number","label":"12시간 시각","default":5.2},{"id":"nw","type":"number","label":"맞는 시각","default":10.5},{"id":"nl","type":"number","label":"NULL 시각","default":12.8},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h3-all">
      <div id="h3-codes" data-layout-allow-overlap>
        <div id="h3-c1" class="h3-code x-dark q-code x-hide">
          <div class="q-ln"><span><span class="q-k">SYSDATE</span> + 0.5</span></div>
        </div>
        <div id="h3-c2" class="h3-code x-dark q-code x-hide">
          <div class="q-ln"><span><span class="q-k">CASE WHEN</span> 점수 &gt;= 60</span></div>
          <div class="q-ln"><span><span class="q-k">THEN</span> '합격' <span class="q-k">END</span></span></div>
        </div>
      </div>
      <div id="h3-p1" data-layout-allow-overlap>
        <div id="h3-cap">하루 = 1</div>
        <div class="h3-day x-card x-hide" id="h3-dA" style="left:80px"><div id="h3-ring"></div>0.5</div>
        <div class="h3-day x-card x-hide" id="h3-dB" style="left:580px">0.5</div>
      </div>
      <div id="h3-p2" data-layout-allow-overlap>
        <div id="h3-sc" class="q-chip q-ok" style="left:290px;top:690px;width:500px;height:100px;font-size:52px;font-weight:900">점수 = 50</div>
      </div>
      <div id="h3-ans" data-layout-allow-overlap>
        <div id="h3-q1" class="q-chip h3-ans" style="left:290px;top:960px;width:500px;background:#FFFFFF;border:2px solid var(--color-line, #E3E5EA);color:var(--color-ink2, #71717A)">?</div>
        <div id="h3-o1" class="q-chip q-ok h3-ans" style="left:290px;top:960px;width:500px">12시간 뒤</div>
        <div id="h3-o2" class="q-chip h3-ans" style="left:290px;top:960px;width:500px;background:#FFFFFF;border:2px solid var(--color-line, #E3E5EA)"><span class="q-null">NULL</span></div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 10;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d = 0) => Number(V[k]) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);

    // 6 SYSDATE + 0.5 → 하루가 1이니까 12시간 뒤
    ft("#h3-c1", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.1));
    fade("#h3-q1", at(0, 1.4), 0, 1);
    fade("#h3-cap", X("d1", -0.2), 0, 1);
    stamp("#h3-dA", X("d1", 0));
    stamp("#h3-dB", X("d1", 0.3));
    fade("#h3-ring", X("h12", -0.2), 0, 1);
    fade("#h3-dB", X("h12", -0.2), 1, 0.3);
    fade("#h3-q1", X("h12", -0.1), 1, 0);
    fade("#h3-o1", X("h12", 0), 0, 1);
    // 7 점수 50, ELSE 없는 CASE → 맞는 WHEN이 없어 NULL
    const t7 = at(1, -0.3);
    fade(["#h3-c1", "#h3-p1", "#h3-o1"], t7, 1, 0);
    ft("#h3-c2", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, t7 + 0.4);
    stamp("#h3-sc", t7 + 1.2);
    fade("#h3-q1", t7 + 1.6, 0, 1);
    fade("#h3-q1", X("nl", -0.3), 1, 0);
    fade("#h3-o2", X("nl", -0.2), 0, 1);
    if (String(V.exit) !== "false") ft("#h3-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h3"] = tl;
  </script>
</template>
