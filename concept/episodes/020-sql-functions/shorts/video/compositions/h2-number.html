<template>

  <style>

  <div id="root" data-composition-id="h2" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0,7.2]"},{"id":"dur","type":"number","label":"장면 길이","default":15.5},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"bk","type":"number","label":"백의 시각","default":3.2},{"id":"r1","type":"number","label":"900 시각","default":5.5},{"id":"m3","type":"number","label":"-3 시각","default":9.5},{"id":"up","type":"number","label":"올라간 시각","default":12.5},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h2-all">

  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 10;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d = 0) => Number(V[k]) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);

    // 4 TRUNC(987, -2) → 백의 자리까지만 남기고 900
    ft("#h2-c1", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.1));
    [1, 2, 3].forEach((k, j) => stamp("#h2-d" + k, at(0, 0.4 + j * 0.15)));
    fade("#h2-q1", at(0, 1.4), 0, 1);
    [1, 2, 3].forEach((k, j) => fade("#h2-l" + k, X("bk", -0.4 + j * 0.3), 0, 1));
    fade(["#h2-d2", "#h2-d3"], X("r1", -1.0), 1, 0.25);
    fade("#h2-q1", X("r1", -0.2), 1, 0);
    fade("#h2-o1", X("r1", -0.1), 0, 1);
    // 5 CEIL(-2.7) → -3이 아니라 0 쪽으로 올라간 -2
    const t5 = at(1, -0.3);
    fade(["#h2-c1", "#h2-p1", "#h2-o1"], t5, 1, 0);
    ft("#h2-c2", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, t5 + 0.4);
    fade(["#h2-line", "#h2-k1", "#h2-k2", "#h2-t1", "#h2-t2"], t5 + 0.8, 0, 1);
    stamp("#h2-dot", t5 + 1.2);
    fade("#h2-z", t5 + 1.2, 0, 1);
    fade("#h2-ng", X("m3", -0.1), 0, 1);
    ft("#h2-arrow", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.6, ease: "power2.out" }, X("up", -0.1));
    fade("#h2-head", X("up", 0.4), 0, 1);
    fade("#h2-o2", X("up", 0.8), 0, 1);
    fade("#h2-ng", X("up", 0.8), 1, 0.35);
    if (String(V.exit) !== "false") ft("#h2-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h2"] = tl;
  </script>
