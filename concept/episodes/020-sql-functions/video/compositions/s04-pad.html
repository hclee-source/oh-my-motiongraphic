    <div id="s04-all">

  <script>

    const X = (k, d) => Number(V[k]) || d;

    const a2 = X("a2", at(4, 0.6));
    fade("#s04-xx", a2 - 0.3, 1, 0.2);
    fade("#s04-q2", a2 - 0.1, 1, 0);
    stamp("#s04-a2", a2);

    fade("#s04-q3", a3 - 0.1, 1, 0);
    stamp("#s04-a3", a3);
    if (String(V.exit) !== "false") ft("#s04-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s04"] = tl;
