<template>

  <style>

  </style>
  <div id="root" data-composition-id="s09" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,3.9,8.2,10.9]"},{"id":"dur","type":"number","label":"장면 길이","default":18.3},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"a1","type":"number","label":"보통 시각","default":9.8},{"id":"w","type":"number","label":"95는 시각","default":14.6},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s09-all">
      <div id="s09-head" class="x-head">검색 CASE</div>
      <div id="s09-code" class="x-dark q-code x-hide">
        <div class="q-ln"><div class="q-hi" id="s09-h1"></div><span style="position:relative"><span class="q-k">SELECT CASE WHEN</span> 점수 &gt;= 80 <span class="q-k">THEN</span> '보통'</span></div>
        <div class="q-ln"><span style="margin-left:264px"><span class="q-k">WHEN</span> 점수 &gt;= 90 <span class="q-k">THEN</span> '우수'</span></div>
        <div class="q-ln"><span style="margin-left:264px"><span class="q-k">ELSE</span> '노력' <span class="q-k">END</span></span></div>
        <div class="q-ln"><span><span class="q-k">FROM</span> 성적;</span></div>
      </div>
      <div id="s09-sc" class="q-chip">점수 = 95</div>

  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 18.3;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);

    // 52 WHEN마다 조건을 적는 검색 CASE
    ft("#s09-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s09-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    // 53 점수가 95일 때
    stamp("#s09-sc", at(1, 0.3));
    stamp("#s09-q", at(1, 2.0));
    // 54 우수가 아니라 보통
    stamp("#s09-ng", at(2, 0.6));
    const a1 = X("a1", at(2, 1.4));
    fade("#s09-h1", a1 - 0.2, 0, 1);
    fade("#s09-q", a1 - 0.1, 1, 0);
    stamp("#s09-a", a1);
    // 55 처음 참이 되는 WHEN에서 멈춘다, 95는 첫 줄에서 이미 참
    stamp("#s09-n1", at(3, 0.3));
    stamp("#s09-n2", X("w", at(3, 3.8)));
    if (String(V.exit) !== "false") ft("#s09-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s09"] = tl;
  </script>
