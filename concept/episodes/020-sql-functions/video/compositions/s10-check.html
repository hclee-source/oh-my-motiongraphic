<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .s10-c { position: absolute; left: 192px; width: 928px; height: 176px; padding: 0 44px; box-sizing: border-box;
      display: grid; grid-template-columns: 84px 1fr; align-items: center; }
    #s10-c1 { top: 262px; }
    #s10-c2 { top: 466px; }
    #s10-c3 { top: 670px; }
    .s10-ring { position: absolute; inset: -2px; border-radius: 28px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
    .s10-n { font-size: 72px; font-weight: 900; color: var(--color-ink2, #71717A); }
    .s10-t { font-size: 44px; font-weight: 800; white-space: nowrap; }
    .s10-d { margin-top: 8px; font-size: 32px; font-weight: 600; color: var(--color-ink2, #71717A); opacity: 0; white-space: nowrap; }
    #s10-side { top: 262px; height: 584px; padding: 36px 44px; }

    .s10-r { margin-top: 20px; font-size: 34px; font-weight: 800; white-space: nowrap; opacity: 0; }

    #s10-r1 { margin-top: 28px; }
  </style>
  <div id="root" data-composition-id="s10" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,3.1,11,17.1,24.1,34.6]"},{"id":"dur","type":"number","label":"장면 길이","default":39.7},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"g1","type":"number","label":"SUBSTRING 시각","default":27},{"id":"g2","type":"number","label":"CHARINDEX 시각","default":28.5},{"id":"g3","type":"number","label":"CEILING 시각","default":29.7},{"id":"g4","type":"number","label":"GETDATE 시각","default":30.8},{"id":"g5","type":"number","label":"LEN 시각","default":33.3},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s10-all">
      <div id="s10-head" class="x-head">시험장 체크</div>
      <div class="s10-c x-card x-hide" id="s10-c1"><div class="s10-ring" id="s10-o1"></div><div class="s10-n" id="s10-m1">1</div>
        <div><div class="s10-t">SUBSTR 위치는 1부터</div><div class="s10-d" id="s10-d1">세 번째 인수는 길이 · 음수 위치는 뒤에서부터</div></div></div>
      <div class="s10-c x-card x-hide" id="s10-c2"><div class="s10-ring" id="s10-o2"></div><div class="s10-n" id="s10-m2">2</div>
        <div><div class="s10-t">자릿수 -1은 십의 자리까지</div><div class="s10-d" id="s10-d2">TRUNC는 버리기만</div></div></div>
      <div class="s10-c x-card x-hide" id="s10-c3"><div class="s10-ring" id="s10-o3"></div><div class="s10-n" id="s10-m3">3</div>
        <div><div class="s10-t">맞는 값이 없으면 NULL</div><div class="s10-d" id="s10-d3">DECODE 기본값 · CASE의 ELSE가 없을 때</div></div></div>
      <div id="s10-side" class="x-side x-card x-hide">
        <div id="s10-plus">덧붙여</div>
        <div id="s10-sname">SQL Server</div>
        <div class="s10-r" id="s10-r1"><span>SUBSTR →</span> SUBSTRING</div>
        <div class="s10-r" id="s10-r2"><span>INSTR →</span> CHARINDEX</div>
        <div class="s10-r" id="s10-r3"><span>CEIL →</span> CEILING</div>
        <div class="s10-r" id="s10-r4"><span>SYSDATE →</span> GETDATE</div>
        <div class="s10-r" id="s10-r5"><span>LENGTH →</span> LEN</div>
        <div class="s10-r x-acc" id="s10-r6"><span>DECODE →</span> CASE</div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 39.7;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, t);
    const ACC = "#6B3FE6", INK2 = "#71717A";

    // 56 세 가지
    ft("#s10-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    // 지금 말하는 카드만 테두리와 번호가 강조색
    const focus = (k, t) => {
      stamp(`#s10-c${k}`, t);
      fade(`#s10-o${k}`, t, 0, 1);
      ft(`#s10-m${k}`, { color: INK2 }, { color: ACC }, t);
      if (k > 1) {
        fade(`#s10-o${k - 1}`, t, 1, 0);
        ft(`#s10-m${k - 1}`, { color: ACC }, { color: INK2 }, t);
      }
    };
    // 57 SUBSTR
    focus(1, at(1, 0.2));
    fade("#s10-d1", at(1, 3.0), 0, 1);
    // 58 자릿수 · TRUNC
    focus(2, at(2, 0.2));
    fade("#s10-d2", at(2, 3.2), 0, 1);
    // 59 기본값 · ELSE
    focus(3, at(3, 0.2));
    fade("#s10-d3", at(3, 0.6), 0, 1);
    // 60 SQL Server 이름 — 말하는 순간 한 줄씩
    fade("#s10-o3", at(4, 0.2), 1, 0);
    ft("#s10-m3", { color: ACC }, { color: INK2 }, at(4, 0.2));
    ft("#s10-side", { opacity: 0, x: 24 }, { opacity: 1, x: 0 }, at(4, 0.3));
    [["g1", 3.0], ["g2", 4.6], ["g3", 5.8], ["g4", 7.0], ["g5", 9.2]].forEach(([k, s], j) => fade(`#s10-r${j + 1}`, X(k, at(4, s)) - 0.1, 0, 1));
    // 61 DECODE는 오라클에만, SQL Server는 CASE
    fade("#s10-r6", at(5, 0.2), 0, 1);
    if (String(V.exit) !== "false") ft("#s10-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s10"] = tl;
  </script>
