<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #s01-code { left: 192px; top: 262px; width: 1080px; }
    #s01-code .q-ln { font-size: 52px; height: 80px; padding: 0 44px; }
    #s01-ans { position: absolute; left: 1316px; top: 278px; width: 412px; height: 100px; }
    .s01-big { left: 0; top: 0; height: 100px; padding: 0 44px; border-radius: 50px; font-size: 60px; font-weight: 900; }
    .s01-qm { background: #FFFFFF; border: 2px solid var(--color-line, #E3E5EA); color: var(--color-ink2, #71717A); }
    #s01-ng { left: 1316px; top: 422px; }
    #s01-w1 { left: 192px; top: 430px; }
    #s01-w2 { left: 676px; top: 430px; }
    .s01-k { position: absolute; top: 560px; width: 740px; height: 180px; padding: 0 44px; box-sizing: border-box;
      display: flex; flex-direction: column; justify-content: center; gap: 14px; }
    #s01-c1 { left: 192px; }
    #s01-c2 { left: 988px; }
    .s01-ring { position: absolute; inset: -2px; border-radius: 28px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
    .s01-t { font-size: 44px; font-weight: 900; white-space: nowrap; }
    .s01-d { font-size: 34px; font-weight: 800; white-space: nowrap; }
    #s01-row { position: absolute; left: 192px; top: 776px; width: 1536px; height: 72px; }
    .s01-g { top: 0; padding: 0 34px; background: #FFFFFF; border: 2px solid var(--color-line, #E3E5EA); color: var(--color-ink, #18181B); }
    #s01-dual { left: 0; top: 0; }
  </style>
  <div id="root" data-composition-id="s01" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.2,5.8,10.1,12.1,18.8,26.7,34.3]"},{"id":"dur","type":"number","label":"장면 길이","default":39.5},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"a1","type":"number","label":"130 시각","default":10.9},{"id":"w1","type":"number","label":"문자 시각","default":27.6},{"id":"w4","type":"number","label":"조건 시각","default":29.4},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s01-all">
      <div id="s01-head" class="x-head">결과를 맞혀 보세요</div>
      <div id="s01-code" class="x-dark q-code x-hide">
        <div class="q-ln"><div class="q-hi" id="s01-hl"></div><span><span class="q-k">SELECT</span> ROUND(125, -1) <span class="q-k">FROM</span> DUAL;</span></div>
      </div>
      <div id="s01-ans" data-layout-allow-overlap>
        <div id="s01-q" class="q-chip s01-big s01-qm">?</div>
        <div id="s01-q2" class="q-chip s01-big s01-qm">125?</div>
        <div id="s01-a" class="q-chip q-ok s01-big">130</div>
      </div>
      <div id="s01-ng" class="q-chip q-ng">✕ 125 그대로</div>
      <div id="s01-w1" class="q-chip q-ok">자릿수 -1 = 십의 자리까지</div>
      <div id="s01-w2" class="q-chip q-ok">일의 자리 5에서 반올림</div>
      <div id="s01-c2" class="s01-k x-card x-hide">
        <div class="s01-t">집계 함수</div>
        <div class="s01-d x-ink2">여러 행 → 결과 하나</div>
      </div>
      <div id="s01-c1" class="s01-k x-card x-hide"><div class="s01-ring" id="s01-r1"></div>
        <div class="s01-t">단일 행 함수</div>
        <div class="s01-d x-acc">행마다 결과 하나</div>
      </div>
      <div id="s01-row" data-layout-allow-overlap>
        <div class="q-chip s01-g" id="s01-g1" style="left:0">문자</div>
        <div class="q-chip s01-g" id="s01-g2" style="left:150px">숫자</div>
        <div class="q-chip s01-g" id="s01-g3" style="left:300px">날짜</div>
        <div class="q-chip s01-g" id="s01-g4" style="left:450px">조건</div>
        <div class="q-chip q-ok" id="s01-dual">DUAL = 식을 계산해 보는 한 행짜리 표</div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 39.5;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);

    // 1 125를 ROUND로, 두 번째 인수에 -1
    ft("#s01-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s01-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    stamp("#s01-q", at(0, 2.2));
    // 2 소수점 아래가 없으니 그대로 125?
    fade("#s01-q", at(1, 0.6), 1, 0);
    fade("#s01-q2", at(1, 0.7), 0, 1);
    // 3 정답은 130
    const a1 = X("a1", at(2, 0.8));
    fade("#s01-q2", a1 - 0.1, 1, 0);
    stamp("#s01-a", a1);
    stamp("#s01-ng", a1 + 0.3);
    // 4 자릿수 -1은 십의 자리까지, 일의 자리 5에서 반올림
    stamp("#s01-w1", at(3, 0.3));
    stamp("#s01-w2", at(3, 3.4));
    // 5 집계 함수와 달리 행마다 결과 하나 = 단일 행 함수
    fade(["#s01-code", "#s01-ans", "#s01-ng", "#s01-w1", "#s01-w2"], at(4, 0.1), 1, 0.4);
    ft("#s01-c2", { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, at(4, 0.3));
    ft("#s01-c1", { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, at(4, 3.2));
    fade("#s01-r1", at(4, 3.6), 0, 1);
    fade("#s01-c2", at(4, 4.6), 1, 0.45);
    // 6 문자, 숫자, 날짜, 조건 순서로
    const w1 = X("w1", at(5, 0.9)), w4 = X("w4", at(5, 2.7));
    [1, 2, 3, 4].forEach((k, j) => stamp(`#s01-g${k}`, w1 + (w4 - w1) * j / 3 - 0.05));
    // 7 DUAL = 식을 계산해 보는 한 행짜리 표 — 카드의 FROM DUAL 줄을 밝게
    fade(["#s01-g1", "#s01-g2", "#s01-g3", "#s01-g4"], at(6, 0.1), 1, 0);
    stamp("#s01-dual", at(6, 0.4));
    fade("#s01-code", at(6, 0.4), 0.4, 1);
    fade("#s01-hl", at(6, 0.6), 0, 1);
    if (String(V.exit) !== "false") ft("#s01-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s01"] = tl;
  </script>
</template>
