<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .s11-b { position: absolute; top: 300px; width: 360px; height: 330px; padding: 0 24px; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .s11-k { font-size: 34px; font-weight: 800; color: var(--color-ink2, #71717A); }
    .s11-t { margin-top: 26px; font-size: 46px; font-weight: 900; line-height: 1.25; color: var(--color-accent, #6B3FE6); }
    .s11-ring { position: absolute; inset: -2px; border-radius: 28px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
  </style>
  <div id="root" data-composition-id="s11" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,3.4]"},{"id":"dur","type":"number","label":"장면 길이","default":13},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":false},{"id":"y1","type":"number","label":"위치는 시각","default":3.4},{"id":"y2","type":"number","label":"자릿수 시각","default":4.8},{"id":"y3","type":"number","label":"날짜는 시각","default":7},{"id":"y4","type":"number","label":"맞는 시각","default":8.9},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s11-all">
      <div id="s11-head" class="x-head">한 줄 정리</div>
      <div class="s11-b x-card x-hide" id="s11-b1" style="left:192px"><div class="s11-ring" id="s11-o1"></div><div class="s11-k">문자</div><div class="s11-t">위치는<br />1부터</div></div>
      <div class="s11-b x-card x-hide" id="s11-b2" style="left:584px"><div class="s11-ring" id="s11-o2"></div><div class="s11-k">숫자</div><div class="s11-t">-1은<br />십의 자리</div></div>
      <div class="s11-b x-card x-hide" id="s11-b3" style="left:976px"><div class="s11-ring" id="s11-o3"></div><div class="s11-k">날짜</div><div class="s11-t">하루 = 1</div></div>
      <div class="s11-b x-card x-hide" id="s11-b4" style="left:1368px"><div class="s11-ring" id="s11-o4"></div><div class="s11-k">조건</div><div class="s11-t">없으면<br />NULL</div></div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);

    // 62 한 줄로 정리하면
    ft("#s11-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    // 63 위치는 1부터, 자릿수 -1은 십의 자리, 날짜는 하루가 1, 맞는 조건이 없으면 NULL
    [["y1", 0], ["y2", 1.4], ["y3", 3.6], ["y4", 5.5]].forEach(([k, s], j) => {
      const n = j + 1, t = X(k, at(1, s)) - 0.1;
      ft(`#s11-b${n}`, { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, t);
      fade(`#s11-o${n}`, t, 0, 1);
      if (n > 1) fade(`#s11-o${n - 1}`, t, 1, 0);
    });
    window.__timelines["s11"] = tl;
  </script>
</template>
