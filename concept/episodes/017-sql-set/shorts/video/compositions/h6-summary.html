    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45]"},{"id":"dur","type":"number","label":"장면 길이","default":5.85},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":false},{"id":"rs","type":"number","label":"나머지 시각","default":2.4},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h6-all">

      <div class="h6-c x-card x-hide" id="h6-c2"><div class="h6-lab">중복 지움</div>

  <script>
    const V = window.__hyperframes?.getVariables?.() || {};

    const tl = gsap.timeline({ paused: true });

    stamp("#h6-c2", X("rs", at(0, 2.4)) - 0.1);
    window.__timelines["h6"] = tl;
