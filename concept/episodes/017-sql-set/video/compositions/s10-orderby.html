  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 22.9;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);

    // 44 ORDER BY는 맨 마지막 SELECT 뒤에 한 번만
    ft("#s10-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s10-a", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    const lt = X("lt", at(0, 3.4));
    fade("#s10-a4h", lt, 0, 1);
    stamp("#s10-ok1", lt + 0.6);
    // 45 첫 번째 SELECT 뒤에 적으면 오류
    fade("#s10-a4h", at(1, 0), 1, 0);
    ft("#s10-b", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(1, 0.1));
    fade("#s10-b2h", at(1, 1.0), 0, 1);
    stamp("#s10-x", at(1, 2.2));
    // 46 기준은 첫 SELECT의 열 이름 — 별칭을 붙였다면 별칭, 또는 열 순서 번호
    fade(["#s10-b", "#s10-x"], at(2, 0.1), 1, 0);
    const al = X("al", at(2, 3.2));
    fade(["#s10-a1h", "#s10-a4h"], al, 0, 1);
    fade("#s10-ok1", al, 1, 0);
    fade("#s10-ok2", al + 0.2, 0, 1);
    const pn = X("pn", at(2, 6.0));
    fade("#s10-a1h", pn, 1, 0);
    fade("#s10-o1", pn, 1, 0);
    fade("#s10-o2", pn + 0.15, 0, 1);
    // 47 맨 끝의 ORDER BY는 합쳐진 전체 결과를 정렬
    ft("#s10-res", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(3, 0.2));
    ["#s10-r0", "#s10-r1", "#s10-r2", "#s10-r3"].forEach((r, j) => ft(r, { opacity: 0, y: 8 }, { opacity: 1, y: 0 }, at(3, 0.7 + j * 0.2)));
    if (String(V.exit) !== "false") ft("#s10-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
