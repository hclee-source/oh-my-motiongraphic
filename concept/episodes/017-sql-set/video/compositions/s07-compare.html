  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 15.3;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });

    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);
    const rise = (sel, t) => ft(sel, { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, t);

    rise("#s07-c3", X("k3", at(0, 3.9)) - 0.1);
    rise("#s07-c4", X("k4", at(0, 5.6)) - 0.1);
    fade("#s07-rev", X("k5", at(0, 7.0)), 0, 1);
    // 35 중복을 남기는 것은 UNION ALL 하나뿐, 나머지 셋은 중복을 지운다

    stamp("#s07-t1", at(1, 0.6));
    const rest = X("rest", at(1, 3.4));
    fade("#s07-o1", rest, 1, 0);
    ["#s07-t2", "#s07-t3", "#s07-t4"].forEach((s, j) => stamp(s, rest + 0.1 + j * 0.25));
    if (String(V.exit) !== "false") ft("#s07-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s07"] = tl;
  </script>
