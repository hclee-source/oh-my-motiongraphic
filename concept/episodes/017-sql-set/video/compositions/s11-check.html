<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .s11-c { position: absolute; left: 192px; width: 980px; height: 176px; padding: 0 44px; box-sizing: border-box;
      display: grid; grid-template-columns: 84px 1fr; align-items: center; }
    #s11-c1 { top: 262px; }
    #s11-c2 { top: 466px; }
    #s11-c3 { top: 670px; }
    .s11-ring { position: absolute; inset: -2px; border-radius: 28px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
    .s11-n { font-size: 72px; font-weight: 900; color: var(--color-ink2, #71717A); }
    .s11-t { font-size: 42px; font-weight: 800; white-space: nowrap; }
    .s11-d { margin-top: 8px; font-size: 32px; font-weight: 600; color: var(--color-ink2, #71717A); opacity: 0; white-space: nowrap; }
    #s11-side { position: absolute; left: 1228px; top: 262px; width: 500px; height: 584px; padding: 44px 48px; box-sizing: border-box; }
    #s11-plus { font-size: 32px; font-weight: 700; color: var(--color-ink2, #71717A); }
    #s11-sname { margin-top: 10px; font-size: 52px; font-weight: 900; line-height: 1.25; }
    #s11-sdef { margin-top: 28px; font-size: 40px; font-weight: 800; color: var(--color-accent, #6B3FE6); line-height: 1.4; }
  </style>
  <div id="root" data-composition-id="s11" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,3.13,10.07,15.0,21.57]"},{"id":"dur","type":"number","label":"장면 길이","default":27.3},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s11-all">
      <div id="s11-head" class="x-head">시험장 체크</div>
      <div class="s11-c x-card x-hide" id="s11-c1"><div class="s11-ring" id="s11-r1"></div><div class="s11-n" id="s11-n1">1</div>
        <div><div class="s11-t">UNION ALL만 중복을 남긴다</div><div class="s11-d" id="s11-d1">나머지 셋은 한 표 안의 중복까지 지운다</div></div></div>
      <div class="s11-c x-card x-hide" id="s11-c2"><div class="s11-ring" id="s11-r2"></div><div class="s11-n" id="s11-n2">2</div>
        <div><div class="s11-t">MINUS는 순서가 중요</div><div class="s11-d" id="s11-d2">위아래를 바꾸면 결과가 달라진다</div></div></div>
      <div class="s11-c x-card x-hide" id="s11-c3"><div class="s11-ring" id="s11-r3"></div><div class="s11-n" id="s11-n3">3</div>
        <div><div class="s11-t">열 이름은 첫 번째 SELECT</div><div class="s11-d" id="s11-d3">ORDER BY는 맨 끝에 한 번만</div></div></div>
      <div id="s11-side" class="x-card x-hide">
        <div id="s11-plus">덧붙여</div>
        <div id="s11-sname">NULL끼리도<br />같은 값</div>
        <div id="s11-sdef">등호 비교와<br />다르다</div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 27.3;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, t);
    const ACC = "#6B3FE6", INK2 = "#71717A";

    // 48 세 가지
    ft("#s11-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    // 지금 말하는 카드만 테두리와 번호가 강조색
    const focus = (k, t) => {
      stamp(`#s11-c${k}`, t);
      fade(`#s11-r${k}`, t, 0, 1);
      ft(`#s11-n${k}`, { color: INK2 }, { color: ACC }, t);
      if (k > 1) {
        fade(`#s11-r${k - 1}`, t, 1, 0);
        ft(`#s11-n${k - 1}`, { color: ACC }, { color: INK2 }, t);
      }
    };
    // 49 UNION ALL뿐, 나머지 셋은 한 표 안의 중복까지
    focus(1, at(1, 0.2));
    fade("#s11-d1", at(1, 3.0), 0, 1);
    // 50 MINUS는 위아래를 바꾸면 결과가 달라진다
    focus(2, at(2, 0.2));
    fade("#s11-d2", at(2, 1.8), 0, 1);
    // 51 열 이름은 첫 번째 SELECT, ORDER BY는 맨 끝에 한 번
    focus(3, at(3, 0.2));
    fade("#s11-d3", at(3, 3.0), 0, 1);
    // 52 덧붙여, 등호 비교와 달리 NULL끼리도 같은 값
    fade("#s11-r3", at(4, 0.2), 1, 0);
    ft("#s11-n3", { color: ACC }, { color: INK2 }, at(4, 0.2));
    ft("#s11-side", { opacity: 0, x: 24 }, { opacity: 1, x: 0 }, at(4, 0.3));
    if (String(V.exit) !== "false") ft("#s11-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s11"] = tl;
  </script>
</template>
