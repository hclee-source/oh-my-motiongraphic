  <style>

  <div id="root" data-composition-id="s01" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.2,5.6,9.1,13.1,14.9]"},{"id":"dur","type":"number","label":"장면 길이","default":20.4},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"lv","type":"number","label":"봄 4행 시각","default":2.0},{"id":"rr","type":"number","label":"여름 시각","default":2.7},{"id":"rv","type":"number","label":"여름 3행 시각","default":4.3},{"id":"ng","type":"number","label":"틀립니다 시각","default":11.8},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s01-all">

      </div>
      <div id="s01-q" class="x-dark q-code x-hide">

        <div class="q-ln"><div class="q-hi" id="s01-h2"></div><span class="q-k">UNION</span></div>

      <div id="s01-r" class="s01-k x-card x-hide">

  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 20.4;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);
    const rise = (sel, t) => ft(sel, { opacity: 0, y: 10 }, { opacity: 1, y: 0 }, t);

    // 1 봄 응모 4행, 여름 응모 3행
    ft("#s01-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s01-l", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    rise("#s01-lv", X("lv", at(0, 2.0)) - 0.1);
    ft("#s01-r", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, X("rr", at(0, 2.7)) - 0.1);
    rise("#s01-rv", X("rv", at(0, 4.3)) - 0.1);
    // 2 UNION으로 합치면 몇 행?
    ft("#s01-q", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(1, 0));
    fade("#s01-h2", at(1, 0.9), 0, 1);
    ft("#s01-f", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(1, 1.4));
    fade("#s01-qm", at(1, 2.0), 0, 1);
    // 3 4 더하기 3, 7행이라고 하면 틀린다
    fade("#s01-qm", at(2, 0), 1, 0);
    fade("#s01-w", at(2, 0.2), 0, 1);
    const ng = X("ng", at(2, 2.7));
    ft("#s01-wt", { color: "#18181B" }, { color: "#8A8A93" }, ng);
    stamp("#s01-x", ng + 0.1);
    // 4 정답은 4행
    fade("#s01-c", at(3, 0.2), 0, 1);
    // 5 이 두 표로 네 연산자의 행 수를 센다 — 카드는 흐리게
    fade("#s01-h2", at(4, 0.2), 1, 0);
    fade(["#s01-l", "#s01-r", "#s01-q", "#s01-f"], at(4, 0.4), 1, 0.4);
    if (String(V.exit) !== "false") ft("#s01-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s01"] = tl;
