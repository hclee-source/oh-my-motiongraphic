<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>

      display: grid; grid-template-columns: 90px 1fr; align-items: center; }
    #s08-c1 { top: 262px; }
    #s08-c2 { top: 466px; }
    #s08-c3 { top: 670px; }

  </style>
  <div id="root" data-composition-id="s08" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,3.13,10.49,16.09]"},{"id":"dur","type":"number","label":"장면 길이","default":21.9},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s08-all">

  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 21.9;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);

    // 50 세 가지

    // 지금 말하는 카드만 테두리와 번호가 강조색

      stamp(`#s08-c${k}`, t);
      fade(`#s08-r${k}`, t, 0, 1);
      ft(`#s08-n${k}`, { color: INK2 }, { color: ACC }, t);
      if (k > 1) {
        fade(`#s08-r${k - 1}`, t, 1, 0);

    focus(2, at(2, 0.2));
    fade("#s08-d2", at(2, 2.6), 0, 1);
    // 53 UNPIVOT은 NULL 칸을 뺀다, 남기려면 INCLUDE NULLS
    focus(3, at(3, 0.2));
    fade("#s08-d3", at(3, 2.4), 0, 1);
    if (String(V.exit) !== "false") ft("#s08-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s08"] = tl;
