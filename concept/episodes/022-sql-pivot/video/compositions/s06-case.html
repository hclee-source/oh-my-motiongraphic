  <div id="root" data-composition-id="s06" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,4.81,10.09,16.19,22.33]"},{"id":"dur","type":"number","label":"장면 길이","default":28.7},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"gb","type":"number","label":"GROUP BY 시각","default":12.6},{"id":"same","type":"number","label":"똑같은 시각","default":14.4},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s06-all">

        <div class="q-ln" style="padding-left:80px"><div class="q-hi" id="s06-h2"></div><span>SUM(<span class="q-k">CASE WHEN</span> 분기 = 1 <span class="q-k">THEN</span> 매출 <span class="q-k">END</span>) <span class="q-k">AS</span> Q1,</span></div>
        <div class="q-ln" style="padding-left:80px"><div class="q-hi" id="s06-h3"></div><span>SUM(<span class="q-k">CASE WHEN</span> 분기 = 2 <span class="q-k">THEN</span> 매출 <span class="q-k">END</span>) <span class="q-k">AS</span> Q2,</span></div>

  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 28.7;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);
    let cur = [];
    const hi = (ks, t) => { cur.forEach((k) => fade(`#s06-h${k}`, t, 1, 0)); ks.forEach((k) => fade(`#s06-h${k}`, t, 0, 1)); cur = ks; };

    // 34 PIVOT 없이 CASE와 GROUP BY로도
    ft("#s06-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s06-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    // 35 분기가 1인 행에서만 매출 → SUM으로 감싸면 Q1
    hi([2], at(1, 0.3));
    // 36 분기마다 이렇게 적고 GROUP BY 부서 → 똑같은 2행
    hi([3, 4], at(2, 0.2));
    hi([6], Number(V.gb) || at(2, 2.4));
    const same = Number(V.same) || at(2, 4);
    ft("#s06-tb", { opacity: 0, x: 24 }, { opacity: 1, x: 0 }, same - 0.6);
    stamp("#s06-ok", same + 0.4);
    // 37 묶는 기준을 직접 → 담당자 열이 있어도 갈라지지 않는다
    ft("#s06-note", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(3, 0.4));
    // 38 SQL Server: 별칭 없이 대괄호
    hi([], at(4, 0.2));
    fade(["#s06-code", "#s06-tb", "#s06-ok", "#s06-note"], at(4, 0.3), 1, 0.4);
    ft("#s06-ss", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(4, 0.5));
    if (String(V.exit) !== "false") ft("#s06-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s06"] = tl;
