<template>

  <style>

  <div id="root" data-composition-id="s01" data-width="1920" data-height="1080"

    <div id="s01-all">

      <div id="s01-code" class="x-dark q-code x-hide">

        <div class="q-ln"><div class="q-hi" id="s01-h2"></div><span><span class="q-k">PIVOT</span> (SUM(매출) <span class="q-k">FOR</span> 분기</span></div>

  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 25.1;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);

    // 1 부서별 분기 매출을 한 줄씩 보려고 PIVOT
    ft("#s01-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s01-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    fade("#s01-h2", at(0, 1.8), 0, 1);
    // 2 부서는 둘 → 2행일 것 같다
    stamp("#s01-exp", at(1, 1.2));
    // 3 실제 결과는 3행, 영업이 두 줄로
    fade("#s01-h2", at(2, 0), 1, 0);
    ft("#s01-tb", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(2, 0.1));
    ["#s01-r0", "#s01-r1", "#s01-r2"].forEach((r, j) => ft(r, { opacity: 0, y: 8 }, { opacity: 1, y: 0 }, at(2, 0.5 + j * 0.15)));
    const r3 = Number(V.r3) || at(2, 1.4);
    fade("#s01-exp", r3, 1, 0.4);
    stamp("#s01-real", r3 + 0.1);
    const sp = Number(V.sp) || at(2, 2.6);
    fade("#s01-bd", sp, 0, 1);
    ft(".s01-dp", { color: "#18181B" }, { color: "#6B3FE6" }, sp);
    // 4 오류도 없는데 왜?
    fade("#s01-q1", at(3, 0.3), 0, 1);
    // 5 답은 PIVOT이 행을 묶는 방식
    fade("#s01-q1", at(4, 0.1), 1, 0);
    fade("#s01-q2", at(4, 0.3), 0, 1);
    // 6 실적 표 하나로 따라가 보기 — 카드는 흐리게
    fade(["#s01-code", "#s01-tb", "#s01-real"], at(5, 0.3), 1, 0.4);
    if (String(V.exit) !== "false") ft("#s01-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s01"] = tl;
