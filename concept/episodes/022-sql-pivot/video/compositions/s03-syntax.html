  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }

      display: flex; flex-direction: column; justify-content: center; }

  <div id="root" data-composition-id="s03" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,6.64,8.96,11.75,16.04,19.61,25.2,31.9]"},{"id":"dur","type":"number","label":"장면 길이","default":40.06},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"q1","type":"number","label":"Q1 시각","default":35.5},{"id":"q2","type":"number","label":"Q2 시각","default":36.6},{"id":"q3","type":"number","label":"Q3 시각","default":37.7},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s03-all">
      <div id="s03-head" class="x-head">PIVOT 문법</div>
      <div id="s03-code" class="x-dark q-code x-hide">
        <div class="q-ln"><span><span class="q-k">SELECT</span> *</span></div>
        <div class="q-ln"><div class="q-hi" id="s03-h2"></div><span><span class="q-k">FROM</span> (<span class="q-k">SELECT</span> 부서, 분기, 매출</span></div>
        <div class="q-ln" style="padding-left:146px"><div class="q-hi" id="s03-h3"></div><span><span class="q-k">FROM</span> 실적)</span></div>
        <div class="q-ln"><div class="q-hi" id="s03-h4"></div><span><span class="q-k">PIVOT</span> (SUM(매출)</span></div>
        <div class="q-ln" style="padding-left:180px"><div class="q-hi" id="s03-h5"></div><span><span class="q-k">FOR</span> 분기</span></div>
        <div class="q-ln" style="padding-left:180px"><div class="q-hi" id="s03-h6"></div><span><span class="q-k">IN</span> (1 <span class="q-k">AS</span> Q1, 2 <span class="q-k">AS</span> Q2, 3 <span class="q-k">AS</span> Q3));</span></div>
      </div>
      <div class="s03-p x-card x-hide" id="s03-p1"><div class="s03-ring" id="s03-o1"></div>

      <div class="s03-p x-card x-hide" id="s03-p2"><div class="s03-ring" id="s03-o2"></div>

      <div class="q-chip q-ok s03-ch" id="s03-q3">3분기 → Q3</div>
    </div>

  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 40.06;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);
    let cur = [];
    const hi = (ks, t) => { cur.forEach((k) => fade(`#s03-h${k}`, t, 1, 0)); ks.forEach((k) => fade(`#s03-h${k}`, t, 0, 1)); cur = ks; };
    let ring = 0;
    const focus = (k, t) => { if (ring) fade(`#s03-o${ring}`, t, 1, 0); if (k) fade(`#s03-o${k}`, t, 0, 1); ring = k; };

    // 10 FROM 절 괄호 안에서 세 열만
    ft("#s03-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s03-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    hi([2, 3], at(0, 1.2));
    // 11 이유는 조금 뒤에 — 그대로
    // 12 PIVOT 괄호 안은 세 부분
    hi([4, 5, 6], at(2, 0.2));
    [1, 2, 3].forEach((k, j) => ft(`#s03-p${k}`, { opacity: 0, x: 24 }, { opacity: 1, x: 0 }, at(2, 0.4 + j * 0.25)));
    // 13 첫째 SUM(매출) = 새 칸에 들어갈 값
    hi([4], at(3, 0.2));
    focus(1, at(3, 0.2));
    fade("#s03-d1", at(3, 1.4), 0, 1);
    // 14 집계 함수가 반드시
    stamp("#s03-must", at(4, 0.6));
    // 15 둘째 FOR 분기 = 분기 값을 펼쳐 열로
    hi([5], at(5, 0.2));
    focus(2, at(5, 0.2));
    fade("#s03-d2", at(5, 1.6), 0, 1);
    // 16 셋째 IN 목록 = 적은 값만 열, 별칭이 열 이름
    hi([6], at(6, 0.2));
    focus(3, at(6, 0.2));
    fade("#s03-d3", at(6, 1.6), 0, 1);
    // 17 1분기 → Q1 …
    stamp("#s03-q1", Number(V.q1) || at(7, 3.5));
    stamp("#s03-q2", Number(V.q2) || at(7, 4.4));
    stamp("#s03-q3", Number(V.q3) || at(7, 5.3));
    if (String(V.exit) !== "false") ft("#s03-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s03"] = tl;
  </script>
