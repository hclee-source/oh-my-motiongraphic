<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #h2-t { position: absolute; left: 80px; top: 316px; width: 880px; text-align: center; font-size: 60px; font-weight: 900; opacity: 0; }
    .h2-c { position: absolute; top: 440px; width: 205px; height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; }
    .h2-ring { position: absolute; inset: -2px; border-radius: 28px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
    .h2-cn { font-size: 48px; font-weight: 800; }
    .h2-ct { margin-top: 8px; font-size: 32px; font-weight: 800; white-space: nowrap; opacity: 0; }
    .h2-key { color: var(--color-accent, #6B3FE6); font-weight: 900; }
    .h2-use { color: var(--color-ink2, #71717A); }
    #h2-ng { left: 80px; top: 640px; height: 84px; font-size: 38px; padding: 0 32px; border-radius: 42px; }
    #h2-code { left: 80px; top: 780px; width: 880px; }
    #h2-code .q-ln { font-size: 42px; height: 66px; }
    #h2-ok { left: 80px; top: 1010px; height: 84px; font-size: 38px; padding: 0 32px; border-radius: 42px; }
  </style>
  <div id="root" data-composition-id="h2" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,2.88,7.5,12.63]"},{"id":"dur","type":"number","label":"장면 길이","default":15.54},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"nm","type":"number","label":"나머지 열 시각","default":5.2},{"id":"hk","type":"number","label":"학기처럼 시각","default":8.0},{"id":"mo","type":"number","label":"행이 늘어납니다 시각","default":11.0},{"id":"iv","type":"number","label":"인라인 뷰로 시각","default":13.0},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h2-all">
      <div id="h2-t">함정은 <span class="x-acc">묶는 기준</span></div>
      <div class="h2-c x-card" id="h2-k1" style="left:80px"><div class="h2-ring" id="h2-o1"></div><div class="h2-cn">이름</div><div class="h2-ct h2-key" id="h2-t1">묶는 기준</div></div>
      <div class="h2-c x-card" id="h2-k4" style="left:305px"><div class="h2-ring" id="h2-o4"></div><div class="h2-cn">학기</div><div class="h2-ct h2-key" id="h2-t4">묶는 기준</div></div>
      <div class="h2-c x-card" id="h2-k2" style="left:530px"><div class="h2-cn">과목</div><div class="h2-ct h2-use" id="h2-t2">FOR</div></div>
      <div class="h2-c x-card" id="h2-k3" style="left:755px"><div class="h2-cn">점수</div><div class="h2-ct h2-use" id="h2-t3">집계</div></div>
      <div id="h2-ng" class="q-chip q-ng">이름 · 학기로 묶여 행이 늘어남</div>
      <div id="h2-code" class="x-dark q-code x-hide">
        <div class="q-ln"><span><span class="q-k">FROM</span> (<span class="q-k">SELECT</span> 이름, 과목, 점수</span></div>
        <div class="q-ln" style="padding-left:150px"><span><span class="q-k">FROM</span> 성적)</span></div>
      </div>
      <div id="h2-ok" class="q-chip q-ok">✓ 인라인 뷰로 필요한 열만</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 15.54;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);

    // 4 알아 둘 함정은 묶는 기준
    ft("#h2-t", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(0, 0));
    ["#h2-k1", "#h2-k2", "#h2-k3"].forEach((k, j) => ft(k, { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(0, 0.6 + j * 0.12)));
    // 5 집계 함수 · FOR에 나오지 않은 나머지 열 전부로 묶는다
    fade(["#h2-t3", "#h2-t2"], at(1, 0.5), 0, 1);
    fade(["#h2-k2", "#h2-k3"], at(1, 1.6), 1, 0.45);
    const nm = Number(V.nm) || at(1, 2.4);
    fade(["#h2-t1", "#h2-o1"], nm, 0, 1);
    // 6 학기처럼 값이 갈리는 열이 더 있으면 → 그 열로도 묶여 행이 늘어난다
    const hk = Number(V.hk) || at(2, 0.4);
    ft("#h2-k4", { opacity: 0, y: -16 }, { opacity: 1, y: 0 }, hk);
    fade(["#h2-t4", "#h2-o4"], hk + 1.4, 0, 1);
    stamp("#h2-ng", Number(V.mo) || at(2, 3.6));
    // 7 그래서 인라인 뷰로 필요한 열만
    fade(["#h2-k4", "#h2-ng"], at(3, 0.1), 1, 0.35);
    ft("#h2-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(3, 0.2));
    stamp("#h2-ok", Number(V.iv) || at(3, 1.0));
    if (String(V.exit) !== "false") ft("#h2-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h2"] = tl;
  </script>
</template>
