<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #h1-a { left: 80px; top: 320px; width: 880px; height: 324px; }
    #h1-b { left: 80px; top: 770px; width: 880px; height: 280px; }
    .h1-t .q-th, .h1-t .q-tr { grid-template-columns: 274px 274px 274px; }
    .h1-t .q-th { top: 24px; height: 64px; }
    .h1-t .q-th > div { font-size: 36px; }
    #h1-a .q-tr { height: 64px; }
    #h1-a .q-tr > div { font-size: 46px; }
    #h1-b .q-tr { height: 72px; }
    #h1-b .q-tr > div { font-size: 54px; font-weight: 900; }
    #h1-b .q-tr > div.q-null { font-size: 40px; font-weight: 700; color: #6E6E78; }
    .h1-r, .h1-v { opacity: 0; }
    .h1-sb { color: var(--color-accent, #6B3FE6); }
    #h1-ar { position: absolute; left: 80px; top: 672px; width: 880px; text-align: center; font-size: 48px; font-weight: 900;
      color: var(--color-accent, #6B3FE6); opacity: 0; }
    .h1-nb { position: absolute; left: 598px; top: 180px; width: 224px; height: 72px; border-radius: 16px;
      background: color-mix(in srgb, var(--color-accent, #6B3FE6) 12%, #FFFFFF); opacity: 0; }
  </style>
  <div id="root" data-composition-id="h1" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0,2.73,7.99]"},{"id":"dur","type":"number","label":"장면 길이","default":10.98},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"sc","type":"number","label":"점수가 시각","default":6.2},{"id":"nl","type":"number","label":"NULL 시각","default":10.1},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h1-all">
      <div id="h1-a" class="x-card q-tb h1-t x-hide">
        <div class="q-th"><div>이름</div><div>과목</div><div>점수</div></div>
        <div class="q-tr h1-r" style="top:100px"><div>서연</div><div class="h1-s">국어</div><div>85</div></div>
        <div class="q-tr h1-r" style="top:168px"><div>서연</div><div class="h1-s">영어</div><div>95</div></div>
        <div class="q-tr h1-r" style="top:236px"><div>도윤</div><div class="h1-s">국어</div><div>75</div></div>
      </div>
      <div id="h1-ar">▼ PIVOT</div>
      <div id="h1-b" class="x-card q-tb h1-t x-hide">
        <div class="q-th"><div>이름</div><div class="h1-hh">국어</div><div class="h1-hh">영어</div></div>
        <div class="h1-nb" id="h1-nb"></div>
        <div class="q-tr" style="top:100px"><div>서연</div><div class="h1-v">85</div><div class="h1-v">95</div></div>
        <div class="q-tr" style="top:180px"><div>도윤</div><div class="h1-v">75</div><div class="q-null" id="h1-nu" style="opacity:0">NULL</div></div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 10.98;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const pop = (sel, t) => ft(sel, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, t);
    const ACC = "#6B3FE6", INK = "#18181B", INK2 = "#71717A";

    // 1 PIVOT은 행에 있던 값을 열로
    ft("#h1-a", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.05));
    ft(".h1-r", { opacity: 0, y: 8 }, { opacity: 1, y: 0, stagger: 0.1 }, at(0, 0.3));
    fade("#h1-ar", at(0, 1.2), 0, 1);
    ft("#h1-b", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 1.6));
    // 2 과목 값 국어 · 영어가 새 열, 칸에는 점수
    ft(".h1-s", { color: INK }, { color: ACC }, at(1, 0.3));
    ft(".h1-hh", { color: INK2 }, { color: ACC }, at(1, 1.0));
    ft(".h1-v", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, ease: "back.out(2)", stagger: 0.2 }, Number(V.sc) || at(1, 3.4));
    // 3 도윤 영어처럼 데이터가 없는 칸은 NULL
    fade("#h1-nb", at(2, 0.3), 0, 1);
    pop("#h1-nu", Number(V.nl) || at(2, 2.0));
    if (String(V.exit) !== "false") ft("#h1-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h1"] = tl;
  </script>
</template>
