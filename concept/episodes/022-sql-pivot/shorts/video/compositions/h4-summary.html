<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .h4-c { position: absolute; left: 80px; width: 880px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #h4-c1 { top: 360px; }
    #h4-c2 { top: 720px; }
    .h4-ring { position: absolute; inset: -2px; border-radius: 28px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
    .h4-dir { font-size: 44px; font-weight: 800; color: var(--color-ink2, #71717A); }
    .h4-kw { margin-top: 4px; font-size: 92px; font-weight: 900; line-height: 1.1; color: var(--color-accent, #6B3FE6); }
    .h4-m { margin-top: 8px; font-size: 50px; font-weight: 800; white-space: nowrap; opacity: 0; }
  </style>
  <div id="root" data-composition-id="h4" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,3.61]"},{"id":"dur","type":"number","label":"장면 길이","default":8.38},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":false},{"id":"u1","type":"number","label":"열을 행으로 시각","default":1.9},{"id":"u2","type":"number","label":"UNPIVOT은 시각","default":5.6},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h4-all">
      <div class="h4-c x-card x-hide" id="h4-c1"><div class="h4-ring" id="h4-o1"></div>
        <div class="h4-dir">행 → 열</div><div class="h4-kw">PIVOT</div><div class="h4-m" id="h4-m1">남은 열로 묶인다</div></div>
      <div class="h4-c x-card x-hide" id="h4-c2"><div class="h4-ring" id="h4-o2"></div>
        <div class="h4-dir">열 → 행</div><div class="h4-kw">UNPIVOT</div><div class="h4-m" id="h4-m2">NULL은 뺀다</div></div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);

    // 11 행을 열로 PIVOT, 열을 행으로 UNPIVOT
    ft("#h4-c1", { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, at(0, 0));
    fade("#h4-o1", at(0, 0), 0, 1);
    const u1 = Number(V.u1) || at(0, 1.5);
    ft("#h4-c2", { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, u1);
    fade("#h4-o1", u1, 1, 0);
    fade("#h4-o2", u1, 0, 1);
    // 12 PIVOT은 남은 열로 묶이고, UNPIVOT은 NULL을 뺀다
    fade("#h4-o2", at(1, 0), 1, 0);
    fade("#h4-o1", at(1, 0), 0, 1);
    fade("#h4-m1", at(1, 0.2), 0, 1);
    const u2 = Number(V.u2) || at(1, 2.0);
    fade("#h4-o1", u2, 1, 0);
    fade("#h4-o2", u2, 0, 1);
    fade("#h4-m2", u2 + 0.2, 0, 1);
    window.__timelines["h4"] = tl;
  </script>
</template>
