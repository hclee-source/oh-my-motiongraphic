<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    /* 위: 조건 A = B(+) / 가운데: 양쪽 설명 칩 / 아래: A가 통째로 칠해진 원 그림 */
    #h4-q { position: absolute; left: 80px; top: 330px; width: 920px; height: 200px; }
    .h4-s { position: absolute; top: 0; height: 200px; display: flex; align-items: center; justify-content: center;
      font-size: 104px; font-weight: 900; white-space: nowrap; }
    #h4-a { left: 80px; width: 300px; }
    #h4-eq { left: 380px; width: 160px; color: #A1A1AA; }
    #h4-b { left: 540px; width: 300px; }
    .h4-w { position: absolute; top: 576px; width: 460px; height: 84px; display: flex; justify-content: center; }
    .h4-w .q-chip { position: relative; height: 84px; padding: 0 30px; border-radius: 42px; font-size: 38px; }
    #h4-svg { position: absolute; left: 80px; top: 700px; width: 920px; height: 480px; overflow: visible; }
    .h4-t { position: absolute; top: 900px; width: 120px; text-align: center; font-size: 64px; font-weight: 900; opacity: 0; }
  </style>
  <div id="root" data-composition-id="h4" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45]"},{"id":"dur","type":"number","label":"장면 길이","default":6.9},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":false},{"id":"nl","type":"number","label":"NULL로 시각","default":1.8},{"id":"op","type":"number","label":"반대편이 시각","default":3.9},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h4-all">
      <div id="h4-q" class="x-dark x-hide">
        <div class="h4-s" id="h4-a">A</div>
        <div class="h4-s" id="h4-eq">=</div>
        <div class="h4-s" id="h4-b"><div>B<span id="h4-p">(+)</span></div></div>
      </div>
      <div class="h4-w" style="left:80px"><div class="q-chip q-ok" id="h4-ca">모두 살아남는 쪽</div></div>
      <div class="h4-w" style="left:540px"><div class="q-chip q-ng" id="h4-cb">NULL로 채워질 쪽</div></div>
      <!-- 원 중심 A (430, 940), B (650, 940), 반지름 180 -->
      <svg id="h4-svg" viewBox="0 0 920 480">
        <circle id="h4-fa" cx="350" cy="240" r="180" fill="#6B3FE6" fill-opacity="0.9" opacity="0" />
        <circle id="h4-oa" cx="350" cy="240" r="180" fill="none" stroke="#18181B" stroke-width="6" opacity="0" />
        <circle id="h4-ob" cx="570" cy="240" r="180" fill="none" stroke="#18181B" stroke-width="6" opacity="0" />
      </svg>
      <div class="h4-t" id="h4-ta" style="left:290px">A</div>
      <div class="h4-t" id="h4-tb" style="left:662px">B</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);

    // 7 오라클의 (+)는 NULL로 채워질 쪽에 붙고, 반대편이 모두 살아남는다
    ft("#h4-q", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, -0.3));
    fade(["#h4-oa", "#h4-ob"], at(0, 0.3), 0, 1);
    fade(["#h4-ta", "#h4-tb"], at(0, 0.5), 0, 1);
    const nl = X("nl", at(0, 1.4));
    ft("#h4-p", { color: "#FFFFFF" }, { color: "#A68CFF" }, nl);
    stamp("#h4-cb", nl + 0.1);
    const op = X("op", at(0, 3.5));
    stamp("#h4-ca", op);
    fade("#h4-fa", op + 0.1, 0, 1);
    ft("#h4-ta", { color: "#18181B" }, { color: "#FFFFFF" }, op + 0.1);
    window.__timelines["h4"] = tl;
  </script>
</template>
