  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 8.2;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    let cur = 0;
    const pick = (k, t) => { if (cur) fade(`#h2-o${cur}`, t, 1, 0); fade(`#h2-o${k}`, t, 0, 1); fade(`#h2-f${k}`, t, 0, 1); cur = k; };

    // 3 LEFT는 왼쪽을, RIGHT는 오른쪽을, FULL은 양쪽을 모두 살린다
    [1, 2, 3].forEach((k, j) => ft(`#h2-k${k}`, { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, -0.3 + j * 0.1)));
    pick(1, at(0, 0.3));
    pick(2, X("rt", at(0, 1.4)));
    const fl = X("fl", at(0, 3.2));
    pick(3, fl);
    ft("#h2-t", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, fl + 0.4);
    // 4 짝이 없는 칸은 NULL로 채워진다
    fade(["#h2-n1", "#h2-n2"], at(1, 0.3), 0, 1);
    if (String(V.exit) !== "false") ft("#h2-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h2"] = tl;
