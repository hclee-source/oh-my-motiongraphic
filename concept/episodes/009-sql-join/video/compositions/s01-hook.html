<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .s01-k { position: absolute; top: 262px; width: 740px; height: 220px; box-sizing: border-box; }
    #s01-l { left: 192px; }
    #s01-r { left: 988px; }
    #s01-f { position: absolute; left: 192px; top: 522px; width: 1536px; height: 304px; box-sizing: border-box; }
    .s01-lab { position: absolute; left: 0; right: 0; top: 40px; text-align: center; font-size: 34px; font-weight: 800;
      color: var(--color-ink2, #71717A); white-space: nowrap; }
    .s01-v { position: absolute; left: 0; right: 0; top: 94px; text-align: center; font-size: 80px; font-weight: 900; line-height: 1.2; opacity: 0; }
    #s01-ans { position: absolute; left: 0; right: 0; top: 112px; height: 150px; }
    #s01-q { position: absolute; left: 0; right: 0; top: 0; height: 150px; line-height: 150px; text-align: center;
      font-size: 100px; font-weight: 900; color: var(--color-ink2, #71717A); opacity: 0; }
    #s01-w { position: absolute; left: 0; top: 0; width: 768px; height: 150px; display: flex; align-items: center; justify-content: center; opacity: 0; }
    #s01-wt { font-size: 72px; font-weight: 900; white-space: nowrap; }
    #s01-x { position: relative; margin-left: 32px; }
    #s01-c { position: absolute; left: 768px; top: 0; width: 768px; height: 150px; display: flex; align-items: center; justify-content: center;
      gap: 26px; opacity: 0; }
    #s01-c1 { font-size: 40px; font-weight: 800; color: var(--color-ink2, #71717A); }
    #s01-c2 { font-size: 100px; font-weight: 900; color: var(--color-accent, #6B3FE6); }
  </style>
  <div id="root" data-composition-id="s01" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.2,7,10,14,16]"},{"id":"dur","type":"number","label":"장면 길이","default":21},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"lv","type":"number","label":"LEFT 5행 시각","default":3.2},{"id":"rr","type":"number","label":"RIGHT 시각","default":3.6},{"id":"rv","type":"number","label":"RIGHT 5행 시각","default":5.7},{"id":"ng","type":"number","label":"틀립니다 시각","default":12.7},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s01-all">
      <div id="s01-head" class="x-head">5 더하기 5는</div>
      <div id="s01-l" class="s01-k x-card x-hide">
        <div class="s01-lab">LEFT OUTER JOIN</div>
        <div class="s01-v" id="s01-lv">5행</div>
      </div>
      <div id="s01-r" class="s01-k x-card x-hide">
        <div class="s01-lab">RIGHT OUTER JOIN</div>
        <div class="s01-v" id="s01-rv">5행</div>
      </div>
      <div id="s01-f" class="x-card x-hide">
        <div class="s01-lab">FULL OUTER JOIN</div>
        <div id="s01-ans" data-layout-allow-overlap>
          <div id="s01-q">?</div>
          <div id="s01-w"><div id="s01-wt">5 + 5 = 10행</div><div id="s01-x" class="q-chip q-ng">✕ 틀림</div></div>
          <div id="s01-c"><div id="s01-c1">정답</div><div id="s01-c2">6행</div></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 21;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);
    const rise = (sel, t) => ft(sel, { opacity: 0, y: 10 }, { opacity: 1, y: 0 }, t);

    // 1 LEFT OUTER JOIN 5행, RIGHT OUTER JOIN 5행
    ft("#s01-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s01-l", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.4));
    rise("#s01-lv", X("lv", at(0, 3.0)));
    ft("#s01-r", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, X("rr", at(0, 3.4)));
    rise("#s01-rv", X("rv", at(0, 5.5)));
    // 2 그렇다면 FULL OUTER JOIN은?
    ft("#s01-f", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(1, 0.1));
    fade("#s01-q", at(1, 0.9), 0, 1);
    // 3 5 더하기 5, 10행이라고 하면 틀린다
    fade("#s01-q", at(2, 0), 1, 0);
    fade("#s01-w", at(2, 0.2), 0, 1);
    const ng = X("ng", at(2, 2.6));
    ft("#s01-wt", { color: "#18181B" }, { color: "#A1A1AA" }, ng);
    stamp("#s01-x", ng + 0.1);
    // 4 정답은 6행
    fade("#s01-c", at(3, 0.2), 0, 1);
    // 5 같은 두 표로 다섯 가지 조인을 세어 본다 — 카드는 흐리게
    fade(["#s01-l", "#s01-r", "#s01-f"], at(4, 0.4), 1, 0.4);
    if (String(V.exit) !== "false") ft("#s01-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s01"] = tl;
  </script>
</template>
