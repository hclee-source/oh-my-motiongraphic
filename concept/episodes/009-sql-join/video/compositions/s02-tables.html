        <div class="s02-gb" id="s02-gb2" style="top:402px;height:44px"></div>

        <div class="s02-g" style="top:236px" data-layout-allow-overlap><span id="s02-g1">짝 있음</span><span id="s02-g1b" class="x-acc">두 번 셈</span></div>

        <div class="s02-n" id="s02-n-b"><div><span class="x-acc">왼쪽</span> 표의 행을 모두 살린다</div></div>

  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 88;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const ACC = "#6B3FE6", INK = "#18181B", INK2 = "#71717A", GRAY = "#B4B4BE";
    const head = (id, prev, t) => { if (prev) fade(prev, t, 1, 0); ft(id, { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, t + (prev ? 0.2 : 0)); };
    let note = null;
    const say = (id, t) => { if (note) fade(note, t, 1, 0); fade(id, t + 0.15, 0, 1); note = id; };
    let cnt = 0;
    const count = (k, t) => { if (cnt) fade(`#s02-c${cnt}`, t, 1, 0); fade(`#s02-c${k}`, t + 0.1, 0, 1); cnt = k; };
    const rowIn = (id, t) => ft(id, { opacity: 0, x: -16 }, { opacity: 1, x: 0 }, t);
    // 잇는 선: 그어지고 양 끝 점이 찍힌다 / 선 색 바꾸기(초점이면 강조색, 아니면 회색)
    const draw = (k, t) => {
      ft(`#s02-l${k}`, { strokeDashoffset: 270 }, { strokeDashoffset: 0, duration: 0.5 * S, ease: "power2.inOut" }, t);
      fade(`#s02-a${k}`, t, 0, 1);
      fade(`#s02-b${k}`, t + 0.45 * S, 0, 1);
    };
    const lineColor = (ks, a, b, t) => ks.forEach((k) => {
      ft(`#s02-l${k}`, { stroke: a }, { stroke: b }, t);
      ft([`#s02-a${k}`, `#s02-b${k}`], { fill: a }, { fill: b }, t);
    });

    // 6 왼쪽 사원 다섯 명, 오른쪽 부서 네 개
    head("#s02-ha", null, at(0, 0));
    ft("#s02-emp", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.6));
    ft("#s02-dep", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, X("d2", at(0, 2.0)));
    // 7 두 표는 부서번호로 이어진다
    ft(["#s02-k1", "#s02-k2"], { color: INK2 }, { color: ACC }, at(1, 0.3));
    // 8 민수·지영 → 10 영업, 현우 → 20 개발, 수진 → 30 인사
    draw(0, at(2, 0.3));
    draw(1, at(2, 1.1));
    draw(2, X("m2", at(2, 2.2)));
    draw(3, X("m3", at(2, 3.8)));
    // 9 동훈은 부서번호가 NULL — 이을 곳이 없다
    ft(["#s02-k1", "#s02-k2"], { color: ACC }, { color: INK2 }, at(3, 0.2));
    lineColor([0, 1, 2, 3], ACC, GRAY, at(3, 0.2));
    fade("#s02-be", at(3, 0.3), 0, 1);
    // 10 40번 기획 부서에는 사원이 없다
    fade("#s02-be", at(4, 0.2), 1, 0);
    fade("#s02-bd", at(4, 0.3), 0, 1);

    // 11 INNER JOIN — 원본 표는 왼쪽으로, 결과 표가 오른쪽에
    head("#s02-hb", "#s02-ha", at(5, 0));
    fade("#s02-bd", at(5, 0.1), 1, 0);
    ft("#s02-src", { x: 338 }, { x: 0, duration: 0.7 * S, ease: "power2.inOut" }, at(5, 0.2));
    lineColor([0, 1, 2, 3], GRAY, ACC, at(5, 0.6));
    ft("#s02-res", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(5, 1.3));
    ft("#s02-note", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(5, 1.5));
    say("#s02-n-a", at(5, 1.5));
    // 12 민수, 지영, 현우, 수진 — 네 행
    rowIn("#s02-r0", at(6, 0.1));
    rowIn("#s02-r1", X("j1", at(6, 0.9)));
    rowIn("#s02-r2", X("j2", at(6, 1.7)));
    rowIn("#s02-r3", X("j3", at(6, 2.5)));
    count(4, X("j4", at(6, 4.2)));
    // 13 동훈은 NULL이라 어느 부서와도 같지 않다 → 빠진다
    fade("#s02-e4", at(7, 1.6), 1, 0.3);
    // 14 사원이 없는 기획도 빠진다
    fade("#s02-d3", at(8, 1.2), 1, 0.3);
    // 15 영업은 사원이 둘이라 결과에 두 번
    lineColor([2, 3], ACC, GRAY, at(9, 0.6));
    ft(["#s02-y0", "#s02-y1", "#s02-dy"], { color: INK }, { color: ACC }, at(9, 0.8));

    // 16 LEFT OUTER JOIN — 왼쪽 표를 모두 살린다
    head("#s02-hc", "#s02-hb", at(10, 0));
    lineColor([0, 1], ACC, GRAY, at(10, 0.1));
    ft(["#s02-y0", "#s02-y1", "#s02-dy"], { color: ACC }, { color: INK }, at(10, 0.1));
    fade("#s02-oe", at(10, 0.3), 0, 1);
    fade("#s02-e4", at(10, 0.5), 0.3, 1);
    say("#s02-n-b", at(10, 0.3));
    // 17 네 행에 동훈이 더해져 5행
    rowIn("#s02-rd", X("l1", at(11, 2.4)));
    count(5, X("l2", at(11, 3.4)));
    // 18 동훈의 부서명 칸은 NULL
    fade("#s02-hd1", at(12, 0.5), 0, 1);
    // 19 RIGHT OUTER JOIN — 오른쪽 표를 모두 살린다(동훈 행은 빠지고 다시 4행)
    head("#s02-hd", "#s02-hc", at(13, 0));
    fade("#s02-oe", at(13, 0.2), 1, 0);
    fade("#s02-od", at(13, 0.3), 0, 1);
    fade("#s02-e4", at(13, 0.3), 1, 0.3);
    fade("#s02-d3", at(13, 0.5), 0.3, 1);
    fade(["#s02-rd", "#s02-hd1"], at(13, 0.3), 1, 0);
    count(4, at(13, 0.6));
    say("#s02-n-c", at(13, 0.3));
    // 20 기획이 더해져 5행, 이번에는 사원 칸이 NULL
    rowIn("#s02-rg", X("g1", at(14, 1.2)));
    count(5, X("g2", at(14, 2.7)));
    fade("#s02-hg1", X("g3", at(14, 4.1)), 0, 1);

    // 21 FULL OUTER JOIN — 양쪽 표를 모두 살린다
    head("#s02-he", "#s02-hd", at(15, 0));
    fade("#s02-oe", at(15, 0.3), 0, 1);
    fade("#s02-e4", at(15, 0.3), 0.3, 1);
    fade("#s02-hg1", at(15, 0.2), 1, 0);
    ft("#s02-rg", { y: 0 }, { y: 64, duration: 0.5 * S, ease: "power2.inOut" }, at(15, 0.4));
    rowIn("#s02-rd", at(15, 1.2));
    count(6, at(15, 1.6));
    say("#s02-n-d", at(15, 0.3));
    // 22 짝 있는 네 행, 왼쪽에만 동훈, 오른쪽에만 기획 — 6행
    const bar = (k, t) => { ft(`#s02-gb${k}`, { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1 }, t); fade(`#s02-g${k}`, t + 0.15, 0, 1); };
    bar(1, at(16, 0.4));
    bar(2, X("f1", at(16, 1.5)));
    bar(3, X("f2", at(16, 3.3)));
    // 모두 6행 — 초점이 원본 표에서 결과 표로
    const a6 = X("a6", at(16, 5.6));
    fade(["#s02-oe", "#s02-od"], a6, 1, 0);
    fade("#s02-or", a6 + 0.1, 0, 1);
    // 23 LEFT + RIGHT는 짝 있는 네 행을 두 번 센다
    say("#s02-n-e", at(17, 0.2));
    fade("#s02-f1", at(17, 0.35), 0, 1);
    fade("#s02-g1", at(17, 1.6), 1, 0);
    fade("#s02-g1b", at(17, 1.75), 0, 1);
    // 24 5 + 5에서 겹친 4를 빼면 6
    fade("#s02-f2", X("x1", at(18, 1.5)), 0, 1);
    fade("#s02-f3", X("x2", at(18, 2.5)), 0, 1);
    if (String(V.exit) !== "false") ft("#s02-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s02"] = tl;
  </script>
