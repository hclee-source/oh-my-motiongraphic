<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .s10-r { position: absolute; left: 192px; width: 1536px; height: 150px; padding: 0 64px; box-sizing: border-box;
      display: grid; grid-template-columns: 420px 1fr; align-items: center; }
    .s10-ring { position: absolute; inset: -2px; border-radius: 28px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
    .s10-k { position: relative; font-size: 44px; font-weight: 800; color: var(--color-ink2, #71717A); white-space: nowrap; }
    .s10-v { position: relative; font-size: 68px; font-weight: 900; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s10" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,3.9]"},{"id":"dur","type":"number","label":"장면 길이","default":11.6},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":false},{"id":"y2","type":"number","label":"여러 행이면 시각","default":5.2},{"id":"y3","type":"number","label":"있는지만 시각","default":8},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s10-all">
      <div id="s10-head" class="x-head">한 줄 정리</div>
      <div class="s10-r x-card x-hide" id="s10-r1" style="top:290px"><div class="s10-ring" id="s10-o1"></div><div class="s10-k">결과 한 행</div><div class="s10-v">등호 · 부등호</div></div>
      <div class="s10-r x-card x-hide" id="s10-r2" style="top:476px"><div class="s10-ring" id="s10-o2"></div><div class="s10-k">결과 여러 행</div><div class="s10-v"><span class="x-acc">IN</span> · <span class="x-acc">ANY</span> · <span class="x-acc">ALL</span></div></div>
      <div class="s10-r x-card x-hide" id="s10-r3" style="top:662px"><div class="s10-ring" id="s10-o3"></div><div class="s10-k">있는지만 볼 때</div><div class="s10-v x-acc">EXISTS</div></div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const w = (k, d) => (Number(V[k]) || d);

    // 55 한 줄로 정리하면
    ft("#s10-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    // 56 한 행이면 등호, 여러 행이면 IN · ANY · ALL, 있는지만 볼 때는 EXISTS
    [[1, at(1, 0)], [2, w("y2", at(1, 1.3))], [3, w("y3", at(1, 4.1))]].forEach(([k, t]) => {
      ft(`#s10-r${k}`, { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, t - 0.1);
      fade(`#s10-o${k}`, t - 0.1, 0, 1);
      if (k > 1) fade(`#s10-o${k - 1}`, t - 0.1, 1, 0);
    });
    window.__timelines["s10"] = tl;
  </script>
</template>
