<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .h5-r { position: absolute; left: 90px; width: 860px; height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .h5-ring { position: absolute; inset: -2px; border-radius: 32px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
    .h5-k { position: relative; font-size: 72px; font-weight: 900; color: var(--color-accent, #6B3FE6); white-space: nowrap; }
    .h5-v { position: relative; margin-top: 10px; font-size: 58px; font-weight: 800; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="h5" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45]"},{"id":"dur","type":"number","label":"장면 길이","default":8.5},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":false},{"id":"y2","type":"number","label":"최댓값보다 시각","default":2.4},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h5-all">
      <div class="h5-r x-card x-hide" id="h5-r1" style="top:420px"><div class="h5-ring" id="h5-o1"></div><div class="h5-k">&gt; ANY</div><div class="h5-v">최솟값보다 크다</div></div>
      <div class="h5-r x-card x-hide" id="h5-r2" style="top:730px"><div class="h5-ring" id="h5-o2"></div><div class="h5-k">&gt; ALL</div><div class="h5-v">최댓값보다 크다</div></div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const w = (k, d) => (Number(V[k]) || d);

    // 10 > ANY는 최솟값보다, > ALL은 최댓값보다 크다
    ft("#h5-r1", { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, at(0, 0));
    fade("#h5-o1", at(0, 0.2), 0, 1);
    const t2 = w("y2", at(0, 1.9)) - 0.4;
    ft("#h5-r2", { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, t2);
    fade("#h5-o1", t2, 1, 0);
    fade("#h5-o2", t2, 0, 1);
    window.__timelines["h5"] = tl;
  </script>
</template>
