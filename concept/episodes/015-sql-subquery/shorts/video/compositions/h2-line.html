<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>

  <div id="root" data-composition-id="h2" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,7.9,13.8,18.6,23.2]"},{"id":"dur","type":"number","label":"장면 길이","default":30.7},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"a20","type":"number","label":"20 시각","default":2.4},{"id":"a50","type":"number","label":"50 시각","default":3},{"id":"a80","type":"number","label":"80 시각","default":3.6},{"id":"a60","type":"number","label":"60 시각","default":5.6},{"id":"kmin","type":"number","label":"가장 작은 시각","default":11},{"id":"kmax","type":"number","label":"가장 큰 시각","default":16},{"id":"fl","type":"number","label":"거짓 시각","default":21.6},{"id":"lany","type":"number","label":"작은 애니 시각","default":25.6},{"id":"lall","type":"number","label":"작은 올 시각","default":27.6},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h2-all">

  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 30.7;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);
    const w = (k, d) => (Number(V[k]) || d);
    // 숫자 줄: 0~100을 x 120~900에
    const X = (v) => 120 + v * 7.8;

    // 4 서브쿼리 결과 20, 50, 80 / 비교할 값 60
    fade("#h2-axis", at(0, 0), 0, 1);
    stamp("#h2-c20", w("a20", at(0, 1.9)) - 0.1);
    stamp("#h2-c50", w("a50", at(0, 2.5)) - 0.1);
    stamp("#h2-c80", w("a80", at(0, 3.1)) - 0.1);
    stamp("#h2-dot", w("a60", at(0, 5.1)) - 0.1);
    stamp("#h2-sixty", w("a60", at(0, 5.1)));
    // 5 > ANY: 하나보다만 크면 → 가장 작은 20
    ft("#h2-code", { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, at(1, 0));
    fade("#h2-va", at(1, 0.1), 0, 1);
    const k1 = w("kmin", at(1, 3.3)) - 0.1;
    fade("#h2-o20", k1, 0, 1);
    ft("#h2-bar", { x: X(20) - 4, opacity: 0 }, { x: X(20) - 4, opacity: 1 }, k1 + 0.2);
    ft("#h2-band", { x: X(20), scaleX: (900 - X(20)) / 100, opacity: 0 }, { x: X(20), scaleX: (900 - X(20)) / 100, opacity: 1 }, k1 + 0.3);
    // 6 > ALL: 모두보다 → 가장 큰 80
    fade("#h2-va", at(2, 0), 1, 0);
    fade("#h2-vb", at(2, 0.15), 0, 1);
    const k2 = w("kmax", at(2, 2.6)) - 0.1;
    fade("#h2-o20", k2, 1, 0);
    fade("#h2-o80", k2, 0, 1);
    ft("#h2-bar", { x: X(20) - 4 }, { x: X(80) - 4, duration: 0.6 * S, ease: "power2.inOut" }, k2 + 0.2);
    ft("#h2-band", { x: X(20), scaleX: (900 - X(20)) / 100 }, { x: X(80), scaleX: (900 - X(80)) / 100, duration: 0.6 * S, ease: "power2.inOut" }, k2 + 0.2);
    // 7 그래서 60은 > ANY 참, > ALL 거짓
    stamp("#h2-ry", at(3, 0.8));
    stamp("#h2-rn", w("fl", at(3, 3)) - 0.1);
    // 8 부등호를 뒤집으면 < ANY = 최댓값, < ALL = 최솟값
    fade(["#h2-bar", "#h2-band", "#h2-o80"], at(4, 0), 1, 0);
    fade(["#h2-ry", "#h2-rn", "#h2-code", "#h2-vb"], at(4, 0), 1, 0.35);
    ft("#h2-rows", { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, at(4, 0.4));
    fade("#h2-l1", w("lany", at(4, 2.4)) - 0.2, 0, 1);
    fade("#h2-l2", w("lall", at(4, 4.4)) - 0.2, 0, 1);
    if (String(V.exit) !== "false") ft("#h2-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h2"] = tl;
  </script>
