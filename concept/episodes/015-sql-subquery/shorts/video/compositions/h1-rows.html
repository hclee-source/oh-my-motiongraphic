<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #h1-code { left: 90px; top: 330px; width: 900px; height: 150px; display: flex; align-items: center; justify-content: center;
      font-size: 58px; font-weight: 800; white-space: nowrap; }
    .h1-ch { top: 530px; width: 180px; height: 96px; border-radius: 48px; font-size: 50px; }
    #h1-err { left: 380px; top: 676px; width: 320px; height: 96px; border-radius: 48px; font-size: 48px; }
    .h1-op { top: 830px; width: 240px; height: 100px; border-radius: 50px; font-size: 54px; font-weight: 900; }
    #h1-eq { position: absolute; left: 90px; top: 990px; width: 860px; height: 150px; display: flex; align-items: center; justify-content: center;
      font-size: 62px; font-weight: 900; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="h1" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.2,5,8.5]"},{"id":"dur","type":"number","label":"장면 길이","default":12.1},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"oe","type":"number","label":"오류 시각","default":3.4},{"id":"ka","type":"number","label":"ANY 시각","default":6.4},{"id":"kl","type":"number","label":"ALL 시각","default":7.6},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h1-all">
      <div id="h1-code" class="x-dark q-code x-hide"><span>급여 = ( <span class="q-k">서브쿼리</span> )</span></div>
      <div class="q-chip q-ok h1-ch" id="h1-v1" style="left:180px">20</div>
      <div class="q-chip q-ok h1-ch" id="h1-v2" style="left:450px">50</div>
      <div class="q-chip q-ok h1-ch" id="h1-v3" style="left:720px">80</div>
      <div id="h1-err" class="q-chip q-ng">✕ 오류</div>
      <div class="q-chip q-ok h1-op" id="h1-k1" style="left:110px">IN</div>
      <div class="q-chip q-ok h1-op" id="h1-k2" style="left:420px">ANY</div>
      <div class="q-chip q-ok h1-op" id="h1-k3" style="left:730px">ALL</div>
      <div id="h1-eq" class="x-card x-hide"><span><span class="x-acc">IN</span> = (= ANY)</span></div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 12.1;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);
    const w = (k, d) => (Number(V[k]) || d);

    // 1 서브쿼리가 여러 행 → 등호로 비교하면 오류
    ft("#h1-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0));
    [1, 2, 3].forEach((k, j) => stamp(`#h1-v${k}`, at(0, 0.8 + j * 0.2)));
    stamp("#h1-err", w("oe", at(0, 3.2)) - 0.1);
    // 2 이때 쓰는 것이 IN과 ANY, 그리고 ALL
    fade(["#h1-code", "#h1-v1", "#h1-v2", "#h1-v3", "#h1-err"], at(1, 0), 1, 0.4);
    stamp("#h1-k1", at(1, 0.6));
    stamp("#h1-k2", w("ka", at(1, 1.3)) - 0.1);
    stamp("#h1-k3", w("kl", at(1, 2.4)) - 0.1);
    // 3 IN = (= ANY)
    ft("#h1-eq", { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, at(2, 0.3));
    if (String(V.exit) !== "false") ft("#h1-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h1"] = tl;
  </script>
</template>
