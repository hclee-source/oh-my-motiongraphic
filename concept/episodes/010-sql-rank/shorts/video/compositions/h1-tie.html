<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .h1-c { position: absolute; top: 700px; width: 215px; height: 240px; text-align: center; line-height: 1; white-space: nowrap;
      padding-top: 72px; }
    .h1-n { font-size: 96px; font-weight: 900; }
    .h1-u { margin-left: 6px; font-size: 36px; font-weight: 800; color: var(--color-ink2, #71717A); }
    .h1-ring { position: absolute; inset: -2px; border-radius: 32px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
    #h1-tie { position: absolute; left: 80px; top: 572px; width: 450px; text-align: center; font-size: 52px; font-weight: 900;
      color: var(--color-accent, #6B3FE6); white-space: nowrap; opacity: 0; }
    #h1-br { position: absolute; left: 92px; top: 654px; width: 426px; height: 6px; border-radius: 3px; background: var(--color-accent, #6B3FE6);
      transform-origin: 50% 50%; opacity: 0; }
    #h1-q { position: absolute; left: 550px; top: 540px; width: 215px; text-align: center; font-size: 120px; font-weight: 900; line-height: 1;
      color: var(--color-accent, #6B3FE6); opacity: 0; }
  </style>
  <div id="root" data-composition-id="h1" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0,8.73]"},{"id":"dur","type":"number","label":"장면 길이","default":10.85},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"j1","type":"number","label":"공동 시각","default":6.09},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h1-all">
      <div class="h1-c x-card x-hide" id="h1-c1" style="left:80px"><div class="h1-ring" id="h1-o1"></div><span class="h1-n" id="h1-v1">90</span><span class="h1-u">점</span></div>
      <div class="h1-c x-card x-hide" id="h1-c2" style="left:315px"><div class="h1-ring" id="h1-o2"></div><span class="h1-n" id="h1-v2">90</span><span class="h1-u">점</span></div>
      <div class="h1-c x-card x-hide" id="h1-c3" style="left:550px"><div class="h1-ring" id="h1-o3"></div><span class="h1-n">85</span><span class="h1-u">점</span></div>
      <div class="h1-c x-card x-hide" id="h1-c4" style="left:785px"><span class="h1-n">80</span><span class="h1-u">점</span></div>
      <div id="h1-tie">공동 1등</div>
      <div id="h1-br"></div>
      <div id="h1-q">?</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 10.85;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);

    // 1 90, 90, 85, 80점 — 숫자를 부를 때 한 장씩 / 90점 두 명이 공동 1등
    [[1, 0.1], [2, 0.9], [3, 1.9], [4, 2.8]].forEach(([k, d]) => stamp(`#h1-c${k}`, at(0, d)));
    const j1 = Number(V.j1) || at(0, 6.0);
    fade(["#h1-o1", "#h1-o2"], j1, 0, 1);
    ft(["#h1-v1", "#h1-v2"], { color: "#18181B" }, { color: "#6B3FE6" }, j1);
    ft("#h1-br", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1 }, j1 + 0.1);
    fade("#h1-tie", j1 + 0.2, 0, 1);
    // 2 그다음 85점은 몇 등?
    fade("#h1-o3", at(1, 0.4), 0, 1);
    ft("#h1-q", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, at(1, 0.9));
    if (String(V.exit) !== "false") ft("#h1-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h1"] = tl;
  </script>
</template>
