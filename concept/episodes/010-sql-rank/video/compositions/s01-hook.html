    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 24;

    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);

    stamp("#s01-c4", at(2, 0.3));
    stamp("#s01-c6", Number(V.f6) || at(2, 2.0));
    // 4 순위 함수 세 개 — 동점 처리 방식이 다르다
    fade("#s01-top", at(3, 0.2), 1, 0.35);
    [1, 2, 3].forEach((k, j) => ft(`#s01-f${k}`, { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(3, 1.2 + j * 0.25)));

      ft(`#s01-f${k}`, { backgroundColor: INK, color: "#FFFFFF" }, { backgroundColor: "#EAE4FC", color: ACC }, at(4, d)));
