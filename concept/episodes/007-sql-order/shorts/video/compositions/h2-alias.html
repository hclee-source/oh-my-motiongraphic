<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .h2-r { position: absolute; left: 80px; width: 600px; height: 118px; padding: 0 40px; box-sizing: border-box;
      display: grid; grid-template-columns: 70px 1fr; align-items: center; }
    .h2-no { font-size: 40px; font-weight: 900; color: var(--color-ink2, #71717A); }
    .h2-kw { font-size: 48px; font-weight: 900; white-space: nowrap; }
    .h2-ring { position: absolute; inset: -2px; border-radius: 28px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
    .h2-c { left: 710px; width: 250px; padding: 0 16px; }
  </style>
  <div id="root" data-composition-id="h2" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.2,4]"},{"id":"dur","type":"number","label":"장면 길이","default":9},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"o6","type":"number","label":"ORDER BY 시각","default":6},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h2-all">
      <div class="h2-r x-card x-hide" id="h2-r1" style="top:320px"><div class="h2-ring" id="h2-o1"></div><div class="h2-no">1</div><div class="h2-kw">FROM</div></div>
      <div class="h2-r x-card x-hide" id="h2-r2" style="top:454px"><div class="h2-ring" id="h2-o2"></div><div class="h2-no">2</div><div class="h2-kw">WHERE</div></div>
      <div class="h2-r x-card x-hide" id="h2-r3" style="top:588px"><div class="h2-ring" id="h2-o3"></div><div class="h2-no">3</div><div class="h2-kw">GROUP BY</div></div>
      <div class="h2-r x-card x-hide" id="h2-r4" style="top:722px"><div class="h2-ring" id="h2-o4"></div><div class="h2-no">4</div><div class="h2-kw">HAVING</div></div>
      <div class="h2-r x-card x-hide" id="h2-r5" style="top:856px"><div class="h2-ring" id="h2-o5"></div><div class="h2-no">5</div><div class="h2-kw">SELECT</div></div>
      <div class="h2-r x-card x-hide" id="h2-r6" style="top:990px"><div class="h2-ring" id="h2-o6"></div><div class="h2-no">6</div><div class="h2-kw">ORDER BY</div></div>
      <div class="q-chip q-ok h2-c" id="h2-c5" style="top:879px">별칭 생김</div>
      <div class="q-chip q-ng h2-c" id="h2-c2" style="top:477px">✕ 오류</div>
      <div class="q-chip q-ok h2-c" id="h2-c6" style="top:1013px">✓ 가능</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 9;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);

    // 3 SELECT에서 붙인 별칭은 다섯 번째에야 생긴다
    [1, 2, 3, 4, 5, 6].forEach((k, j) => ft(`#h2-r${k}`, { opacity: 0, x: -20 }, { opacity: 1, x: 0 }, at(0, j * 0.1)));
    fade("#h2-o5", at(0, 1.2), 0, 1);
    stamp("#h2-c5", at(0, 1.6));
    // 4 WHERE에서는 오류, ORDER BY에서는 된다
    fade("#h2-o2", at(1, 0.2), 0, 1);
    stamp("#h2-c2", at(1, 0.6));
    const o6 = Number(V.o6) || at(1, 2.2);
    fade("#h2-o6", o6, 0, 1);
    stamp("#h2-c6", o6 + 0.3);
    if (String(V.exit) !== "false") ft("#h2-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h2"] = tl;
  </script>
</template>
