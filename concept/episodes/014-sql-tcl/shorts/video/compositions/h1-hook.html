<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #h1-q { position: absolute; left: 80px; top: 330px; width: 920px; height: 300px; }
    #h1-q1 { position: absolute; left: 0; right: 0; top: 56px; text-align: center; font-size: 56px; font-weight: 800; }
    #h1-sw { position: absolute; left: 0; right: 0; top: 150px; height: 96px; }
    #h1-sw > div { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 76px; font-weight: 900; opacity: 0; }
    .h1-r { position: absolute; left: 80px; width: 880px; height: 96px; padding: 0 40px; box-sizing: border-box;
      display: grid; grid-template-columns: 80px 1fr; align-items: center; }
    .h1-n { font-size: 52px; font-weight: 900; color: var(--color-accent, #6B3FE6); }
    .h1-t { font-size: 48px; font-weight: 800; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="h1" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,3.4]"},{"id":"dur","type":"number","label":"장면 길이","default":7.5},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h1-all">
      <div id="h1-q" class="x-card x-hide">
        <div id="h1-q1">ROLLBACK을 하면</div>
        <div id="h1-sw" data-layout-allow-overlap>
          <div id="h1-a" class="x-acc">무조건 처음으로?</div>
          <div id="h1-b">그렇지 않습니다</div>
        </div>
      </div>
      <div class="h1-r x-card x-hide" id="h1-r1" style="top:690px"><div class="h1-n">1</div><div class="h1-t">ROLLBACK TO</div></div>
      <div class="h1-r x-card x-hide" id="h1-r2" style="top:806px"><div class="h1-n">2</div><div class="h1-t">이름 없는 ROLLBACK</div></div>
      <div class="h1-r x-card x-hide" id="h1-r3" style="top:922px"><div class="h1-n">3</div><div class="h1-t">DDL</div></div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 7.5;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);

    // 1 ROLLBACK을 하면 무조건 처음으로?
    ft("#h1-q", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, -0.3));
    fade("#h1-a", at(0, 0.9), 0, 1);
    // 2 그렇지 않습니다. 규칙은 세 가지
    fade("#h1-a", at(1, 0.1), 1, 0);
    fade("#h1-b", at(1, 0.25), 0, 1);
    [1, 2, 3].forEach((k, j) => ft(`#h1-r${k}`, { opacity: 0, x: -20 }, { opacity: 1, x: 0 }, at(1, 1.6 + j * 0.3)));
    if (String(V.exit) !== "false") ft("#h1-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h1"] = tl;
  </script>
</template>
