<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #h3-box { position: absolute; left: 80px; top: 330px; width: 880px; height: 680px; }
    .h3-b { position: absolute; left: 40px; width: 800px; height: 100px; border-radius: 22px; box-sizing: border-box; padding: 0 36px;
      display: flex; align-items: center; justify-content: space-between; }
    .h3-bt { font-size: 44px; font-weight: 800; white-space: nowrap; }
    #h3-c0 { top: 40px; background: #E7E8EC; }
    #h3-lock { font-size: 38px; font-weight: 900; color: var(--color-accent, #6B3FE6); white-space: nowrap; opacity: 0; }
    #h3-cm { position: absolute; left: 40px; top: 166px; width: 800px; height: 60px; }
    #h3-cml { position: absolute; left: 0; top: 4px; font-size: 40px; font-weight: 900; color: var(--color-accent, #6B3FE6); white-space: nowrap; }
    #h3-cmb { position: absolute; left: 340px; right: 0; top: 27px; height: 6px; border-radius: 3px; background: var(--color-accent, #6B3FE6); }
    .h3-p { background: color-mix(in srgb, var(--color-accent, #6B3FE6) 12%, #FFFFFF); opacity: 0; }
    #h3-d1 { top: 250px; }
    #h3-d2 { top: 470px; }
    #h3-fr { position: absolute; left: 40px; top: 372px; width: 800px; height: 76px; opacity: 0; }
    .h3-fp { position: absolute; left: 10px; top: 2px; width: 6px; height: 72px; border-radius: 3px; background: #A1A1AA; }
    .h3-ff { position: absolute; left: 20px; top: 2px; width: 80px; height: 54px; border-radius: 6px 16px 16px 6px;
      background: var(--color-accent, #6B3FE6); }
    .h3-fl { position: absolute; left: 136px; top: 6px; font-size: 42px; font-weight: 800; white-space: nowrap; }
    #h3-rb { left: 40px; top: 590px; height: 72px; font-size: 40px; }
    #h3-gone { position: absolute; left: 40px; right: 40px; top: 330px; height: 140px; display: flex; align-items: center;
      justify-content: center; text-align: center; font-size: 44px; font-weight: 900; line-height: 1.35; opacity: 0; }
  </style>
  <div id="root" data-composition-id="h3" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,4.4,7.7]"},{"id":"dur","type":"number","label":"장면 길이","default":10.9},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"lc","type":"number","label":"마지막 COMMIT 시각","default":2.2},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h3-all">
      <div id="h3-box" class="x-card x-hide">
        <div class="h3-b" id="h3-c0"><span class="h3-bt">COMMIT한 작업</span><span id="h3-lock">되돌릴 수 없음</span></div>
        <div id="h3-cm"><div id="h3-cml">마지막 COMMIT</div><div id="h3-cmb"></div></div>
        <div class="h3-b h3-p" id="h3-d1"><span class="h3-bt">UPDATE</span></div>
        <div id="h3-fr"><div class="h3-fp"></div><div class="h3-ff"></div><div class="h3-fl">저장 지점</div></div>
        <div class="h3-b h3-p" id="h3-d2"><span class="h3-bt">DELETE</span></div>
        <div class="q-chip q-ng" id="h3-rb">ROLLBACK</div>
        <div id="h3-gone"><div>변경도, 저장 지점도<br /><span class="x-acc">모두 사라짐</span></div></div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 10.9;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, i, d) => Number(V[k]) || at(i, d);
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);

    // 판: 마지막 COMMIT 선 아래에 변경 두 개와 저장 지점이 쌓여 있다
    ft("#h3-box", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, -0.3));
    ft("#h3-d1", { opacity: 0, y: 10 }, { opacity: 1, y: 0 }, at(0, 0));
    stamp("#h3-fr", at(0, 0.2));
    ft("#h3-d2", { opacity: 0, y: 10 }, { opacity: 1, y: 0 }, at(0, 0.4));
    // 6 이름 없이 ROLLBACK만 → 마지막 COMMIT 시점으로
    stamp("#h3-rb", at(0, 0.9));
    const lc = X("lc", 0, 2.0);
    fade(["#h3-d2", "#h3-d1"], lc, 1, 0);
    ft("#h3-cm", { scale: 1 }, { scale: 1.05, duration: 0.25 * S, yoyo: true, repeat: 1, ease: "power2.out" }, lc + 0.3);
    // 7 그동안 만든 저장 지점도 모두 사라진다
    fade("#h3-fr", at(1, 0.4), 1, 0);
    fade("#h3-gone", at(1, 1.0), 0, 1);
    // 8 이미 COMMIT한 내용은 되돌릴 수 없다
    fade("#h3-rb", at(2, 0.1), 1, 0.35);
    fade("#h3-lock", at(2, 0.4), 0, 1);
    if (String(V.exit) !== "false") ft("#h3-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h3"] = tl;
  </script>
</template>
