<template>
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; }
    .cap { position: absolute; left: 0; right: 0; bottom: 108px; text-align: center; overflow: visible;
      font-size: 46px; font-weight: 600; line-height: 1.35; letter-spacing: 0; color: var(--color-ink, #18181B); }
    .cap span { display: inline-block; max-width: 1536px; }
  </style>
  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <div id="cap-01a" class="cap clip" data-start="3.600" data-duration="2.010"><span>과일 세 행이 커밋되어 있는 표에서,</span></div>
    <div id="cap-01b" class="cap clip" data-start="5.610" data-duration="3.004"><span>명령 열 줄을 차례로 실행합니다.</span></div>
    <div id="cap-02a" class="cap clip" data-start="8.714" data-duration="1.710"><span>그 열 줄 사이에 ROLLBACK이</span></div>
    <div id="cap-02b" class="cap clip" data-start="10.424" data-duration="1.763"><span>세 번이나 들어 있습니다.</span></div>
    <div id="cap-03a" class="cap clip" data-start="12.287" data-duration="2.722"><span>마지막에 이 표에는 몇 행이 남을까요?</span></div>
    <div id="cap-04a" class="cap clip" data-start="15.109" data-duration="1.970"><span>세 번이나 되돌렸으니 처음의 세</span></div>
    <div id="cap-04b" class="cap clip" data-start="17.079" data-duration="3.068"><span>행일 것 같지만, 정답은 네 행입니다.</span></div>
    <div id="cap-05a" class="cap clip" data-start="20.247" data-duration="1.550"><span>ROLLBACK이 언제나 처음으로</span></div>
    <div id="cap-05b" class="cap clip" data-start="21.797" data-duration="2.592"><span>돌아가는 명령은 아니기 때문입니다.</span></div>
    <div id="cap-06a" class="cap clip" data-start="24.489" data-duration="3.110"><span>오늘은 이 열 줄을 한 줄씩 따라가며 COMMIT,</span></div>
    <div id="cap-06b" class="cap clip" data-start="27.599" data-duration="3.731"><span>ROLLBACK, SAVEPOINT를 정리해 보겠습니다.</span></div>
    <div id="cap-07a" class="cap clip" data-start="31.980" data-duration="3.950"><span>오라클에서 INSERT, UPDATE, DELETE로 바꾼</span></div>
    <div id="cap-07b" class="cap clip" data-start="35.930" data-duration="4.525"><span>내용은 바로 확정되지 않고, 하나의 트랜잭션으로 묶입니다.</span></div>
    <div id="cap-08a" class="cap clip" data-start="40.555" data-duration="2.430"><span>트랜잭션은 전부 반영되거나 전부</span></div>
    <div id="cap-08b" class="cap clip" data-start="42.985" data-duration="2.286"><span>취소되어야 하는 작업 단위입니다.</span></div>
    <div id="cap-09a" class="cap clip" data-start="45.371" data-duration="4.110"><span>이 성질이 원자성이고, 일관성, 격리성,</span></div>
    <div id="cap-09b" class="cap clip" data-start="49.481" data-duration="3.785"><span>지속성과 함께 트랜잭션의 네 가지 특성입니다.</span></div>
    <div id="cap-10a" class="cap clip" data-start="53.366" data-duration="2.250"><span>COMMIT은 지금까지의 변경을 확정하고,</span></div>
    <div id="cap-10b" class="cap clip" data-start="55.616" data-duration="3.870"><span>ROLLBACK은 마지막 COMMIT 이후의 변경을 취소합니다.</span></div>
    <div id="cap-11a" class="cap clip" data-start="59.586" data-duration="3.470"><span>COMMIT 전에는 다른 사용자에게 바뀐 내용이 보이지 않고,</span></div>
    <div id="cap-11b" class="cap clip" data-start="63.056" data-duration="3.850"><span>바뀐 행은 다른 사용자가 고칠 수 없게 잠깁니다.</span></div>
    <div id="cap-12a" class="cap clip" data-start="67.006" data-duration="2.310"><span>SAVEPOINT는 저장점이라고 부르며,</span></div>
    <div id="cap-12b" class="cap clip" data-start="69.316" data-duration="4.059"><span>트랜잭션 중간에 이름을 붙여 꽂아 두는 깃발입니다.</span></div>
    <div id="cap-13a" class="cap clip" data-start="73.475" data-duration="1.790"><span>ROLLBACK TO 뒤에 그 이름을 적으면,</span></div>
    <div id="cap-13b" class="cap clip" data-start="75.265" data-duration="2.772"><span>그 깃발까지만 되돌립니다.</span></div>
    <div id="cap-14a" class="cap clip" data-start="78.688" data-duration="3.270"><span>처음 표에는 사과 10, 배 20,</span></div>
    <div id="cap-14b" class="cap clip" data-start="81.958" data-duration="2.786"><span>귤 30의 세 행이 커밋되어 있습니다.</span></div>
    <div id="cap-15a" class="cap clip" data-start="84.844" data-duration="1.350"><span>첫째 줄 INSERT로 감</span></div>
    <div id="cap-15b" class="cap clip" data-start="86.194" data-duration="2.242"><span>40을 넣으면 네 행이 됩니다.</span></div>
    <div id="cap-16a" class="cap clip" data-start="88.536" data-duration="1.330"><span>아직 COMMIT하지 않았으니</span></div>
    <div id="cap-16b" class="cap clip" data-start="89.866" data-duration="2.351"><span>감은 확정되지 않은 행입니다.</span></div>
    <div id="cap-17a" class="cap clip" data-start="92.317" data-duration="1.790"><span>그래도 지금 작업하는 사용자가</span></div>
    <div id="cap-17b" class="cap clip" data-start="94.107" data-duration="2.819"><span>조회하면 감까지 네 행이 보입니다.</span></div>
    <div id="cap-18a" class="cap clip" data-start="97.025" data-duration="2.330"><span>둘째 줄에서 SAVEPOINT A를 만들어,</span></div>
    <div id="cap-18b" class="cap clip" data-start="99.355" data-duration="3.935"><span>감이 들어간 지금 상태에 깃발 A를 꽂습니다.</span></div>
    <div id="cap-19a" class="cap clip" data-start="103.941" data-duration="1.110"><span>셋째 줄 UPDATE로</span></div>
    <div id="cap-19b" class="cap clip" data-start="105.051" data-duration="2.266"><span>사과 수량을 15로 바꿉니다.</span></div>
    <div id="cap-20a" class="cap clip" data-start="107.416" data-duration="2.150"><span>넷째 줄에서 SAVEPOINT B를 만들어,</span></div>
    <div id="cap-20b" class="cap clip" data-start="109.566" data-duration="3.842"><span>사과가 15인 지금 상태에 깃발 B를 꽂습니다.</span></div>
    <div id="cap-21a" class="cap clip" data-start="113.508" data-duration="1.450"><span>다섯째 줄 DELETE로</span></div>
    <div id="cap-21b" class="cap clip" data-start="114.958" data-duration="1.928"><span>배를 지우면 세 행이 남습니다.</span></div>
    <div id="cap-22a" class="cap clip" data-start="116.986" data-duration="4.939"><span>지금 표는 사과 15, 귤 30, 감 40입니다.</span></div>
    <div id="cap-23a" class="cap clip" data-start="122.575" data-duration="1.450"><span>여섯째 줄 ROLLBACK TO B는</span></div>
    <div id="cap-23b" class="cap clip" data-start="124.025" data-duration="2.700"><span>깃발 B 뒤에 한 일만 되돌립니다.</span></div>
    <div id="cap-24a" class="cap clip" data-start="126.825" data-duration="2.250"><span>B 뒤에 한 일은 배를 지운 것 하나라서,</span></div>
    <div id="cap-24b" class="cap clip" data-start="129.075" data-duration="2.624"><span>배가 돌아와 네 행이 됩니다.</span></div>
    <div id="cap-25a" class="cap clip" data-start="131.798" data-duration="3.418"><span>B보다 앞에서 바꾼 사과 15는 그대로입니다.</span></div>
    <div id="cap-26a" class="cap clip" data-start="135.316" data-duration="1.850"><span>트랜잭션은 끝나지 않았고,</span></div>
    <div id="cap-26b" class="cap clip" data-start="137.166" data-duration="3.092"><span>깃발 A와 B도 그대로 남아 있습니다.</span></div>
    <div id="cap-27a" class="cap clip" data-start="140.908" data-duration="1.550"><span>일곱째 줄 ROLLBACK TO A는</span></div>
    <div id="cap-27b" class="cap clip" data-start="142.458" data-duration="3.123"><span>깃발 A 뒤에 한 일을 모두 되돌립니다.</span></div>
    <div id="cap-28a" class="cap clip" data-start="145.681" data-duration="2.450"><span>A 뒤에 남아 있던 일은 셋째 줄 UPDATE</span></div>
    <div id="cap-28b" class="cap clip" data-start="148.131" data-duration="3.502"><span>하나라서, 사과가 15에서 다시 10이 됩니다.</span></div>
    <div id="cap-29a" class="cap clip" data-start="151.733" data-duration="2.430"><span>A보다 앞에서 넣은 감은 되돌려지지 않아,</span></div>
    <div id="cap-29b" class="cap clip" data-start="154.163" data-duration="2.211"><span>여전히 네 행입니다.</span></div>
    <div id="cap-30a" class="cap clip" data-start="156.474" data-duration="2.130"><span>이때 A보다 뒤에 꽂은 깃발 B는</span></div>
    <div id="cap-30b" class="cap clip" data-start="158.604" data-duration="2.973"><span>지워지고, 깃발 A만 남습니다.</span></div>
    <div id="cap-31a" class="cap clip" data-start="161.677" data-duration="1.827"><span>그래서 이 다음에 ROLLBACK</span></div>
    <div id="cap-31b" class="cap clip" data-start="163.504" data-duration="1.834"><span>TO B를 하면 오류가 납니다.</span></div>
    <div id="cap-32a" class="cap clip" data-start="165.988" data-duration="1.090"><span>여덟째 줄 COMMIT으로</span></div>
    <div id="cap-32b" class="cap clip" data-start="167.078" data-duration="2.380"><span>지금의 네 행이 확정됩니다.</span></div>
    <div id="cap-33a" class="cap clip" data-start="169.558" data-duration="1.950"><span>COMMIT을 하면 트랜잭션이 끝나고,</span></div>
    <div id="cap-33b" class="cap clip" data-start="171.508" data-duration="3.019"><span>남아 있던 깃발 A도 사라집니다.</span></div>
    <div id="cap-34a" class="cap clip" data-start="174.627" data-duration="1.070"><span>아홉째 줄 DELETE로</span></div>
    <div id="cap-34b" class="cap clip" data-start="175.697" data-duration="2.060"><span>귤을 지우면 세 행이 됩니다.</span></div>
    <div id="cap-35a" class="cap clip" data-start="177.857" data-duration="2.110"><span>마지막 줄의 ROLLBACK은 이름이 없으니,</span></div>
    <div id="cap-35b" class="cap clip" data-start="179.967" data-duration="2.893"><span>마지막 COMMIT 시점으로 돌아갑니다.</span></div>
    <div id="cap-36a" class="cap clip" data-start="182.959" data-duration="3.690"><span>귤이 돌아와서 답은 사과 10, 배 20,</span></div>
    <div id="cap-36b" class="cap clip" data-start="186.649" data-duration="3.583"><span>귤 30, 감 40의 네 행입니다.</span></div>
    <div id="cap-37a" class="cap clip" data-start="190.332" data-duration="1.090"><span>이미 COMMIT한 감은</span></div>
    <div id="cap-37b" class="cap clip" data-start="191.422" data-duration="2.218"><span>ROLLBACK으로도 지울 수 없습니다.</span></div>
    <div id="cap-38a" class="cap clip" data-start="194.290" data-duration="2.946"><span>저장 지점 이름이 겹치면 어떻게 될까요?</span></div>
    <div id="cap-39a" class="cap clip" data-start="197.336" data-duration="2.470"><span>같은 이름으로 SAVEPOINT를 다시 만들면,</span></div>
    <div id="cap-39b" class="cap clip" data-start="199.806" data-duration="4.209"><span>앞의 지점은 지워지고 새 지점이 그 이름을 갖습니다.</span></div>
    <div id="cap-40a" class="cap clip" data-start="204.115" data-duration="2.110"><span>SAVEPOINT A 다음에 포도를 넣고,</span></div>
    <div id="cap-40b" class="cap clip" data-start="206.225" data-duration="4.231"><span>다시 A를 만든 뒤 키위를 넣었다고 해 보겠습니다.</span></div>
    <div id="cap-41a" class="cap clip" data-start="210.556" data-duration="2.530"><span>이제 ROLLBACK TO A를 하면 나중에 만든</span></div>
    <div id="cap-41b" class="cap clip" data-start="213.086" data-duration="4.074"><span>A로 돌아가서, 키위만 취소되고 포도는 남습니다.</span></div>
    <div id="cap-42a" class="cap clip" data-start="217.810" data-duration="3.104"><span>오라클에서 하나 더 조심할 것이 DDL입니다.</span></div>
    <div id="cap-43a" class="cap clip" data-start="221.015" data-duration="4.310"><span>CREATE, ALTER, DROP, TRUNCATE,</span></div>
    <div id="cap-43b" class="cap clip" data-start="225.325" data-duration="4.265"><span>RENAME 같은 DDL을 실행하면 자동으로 COMMIT이 일어납니다.</span></div>
    <div id="cap-44a" class="cap clip" data-start="229.690" data-duration="2.890"><span>예를 들어 UPDATE로 귤 수량을 0으로 바꾸고,</span></div>
    <div id="cap-44b" class="cap clip" data-start="232.580" data-duration="3.524"><span>CREATE TABLE을 실행한 다음 ROLLBACK을 해 보겠습니다.</span></div>
    <div id="cap-45a" class="cap clip" data-start="236.203" data-duration="3.678"><span>귤 수량은 30으로 돌아오지 않고 0 그대로입니다.</span></div>
    <div id="cap-46a" class="cap clip" data-start="239.982" data-duration="1.730"><span>CREATE TABLE이 실행되는 순간,</span></div>
    <div id="cap-46b" class="cap clip" data-start="241.712" data-duration="4.042"><span>앞의 UPDATE까지 함께 COMMIT되었기 때문입니다.</span></div>
    <div id="cap-47a" class="cap clip" data-start="245.853" data-duration="1.890"><span>TRUNCATE로 지운 행을 ROLLBACK으로</span></div>
    <div id="cap-47b" class="cap clip" data-start="247.743" data-duration="2.708"><span>되살릴 수 없는 것도 같은 이유입니다.</span></div>
    <div id="cap-48a" class="cap clip" data-start="250.552" data-duration="2.510"><span>SQL Server는 기본이 자동 커밋 모드라,</span></div>
    <div id="cap-48b" class="cap clip" data-start="253.062" data-duration="3.545"><span>문장 하나하나가 실행되자마자 확정됩니다.</span></div>
    <div id="cap-49a" class="cap clip" data-start="256.707" data-duration="3.830"><span>다만 BEGIN TRANSACTION으로 시작한 트랜잭션 안에서는 대부분의</span></div>
    <div id="cap-49b" class="cap clip" data-start="260.537" data-duration="4.962"><span>DDL도 되돌릴 수 있고, 저장 지점은 SAVE TRANSACTION으로 만듭니다.</span></div>
    <div id="cap-50a" class="cap clip" data-start="266.149" data-duration="2.582"><span>시험장에서 챙길 것 세 가지입니다.</span></div>
    <div id="cap-51a" class="cap clip" data-start="268.830" data-duration="3.250"><span>첫째, ROLLBACK TO는 그 저장 지점 뒤의 작업만</span></div>
    <div id="cap-51b" class="cap clip" data-start="272.080" data-duration="4.112"><span>되돌리고, 그 뒤에 만든 저장 지점도 함께 지웁니다.</span></div>
    <div id="cap-52a" class="cap clip" data-start="276.292" data-duration="2.770"><span>둘째, 이름 없는 ROLLBACK은 마지막 COMMIT</span></div>
    <div id="cap-52b" class="cap clip" data-start="279.062" data-duration="3.946"><span>시점으로 돌아가고, 저장 지점도 모두 사라집니다.</span></div>
    <div id="cap-53a" class="cap clip" data-start="283.108" data-duration="3.490"><span>셋째, 오라클의 DDL은 자동으로 COMMIT되므로,</span></div>
    <div id="cap-53b" class="cap clip" data-start="286.598" data-duration="3.314"><span>그 앞의 변경까지 되돌릴 수 없습니다.</span></div>
    <div id="cap-54a" class="cap clip" data-start="290.562" data-duration="2.894"><span>오늘 내용을 한 줄로 정리하면 이렇습니다.</span></div>
    <div id="cap-55a" class="cap clip" data-start="293.555" data-duration="2.830"><span>ROLLBACK TO는 깃발까지, 그냥 ROLLBACK은</span></div>
    <div id="cap-55b" class="cap clip" data-start="296.385" data-duration="4.214"><span>마지막 COMMIT까지, DDL은 그 자리에서 COMMIT입니다.</span></div>
  </div>
  <script>
    window.__timelines["captions"] = gsap.timeline({ paused: true });
  </script>
</template>
