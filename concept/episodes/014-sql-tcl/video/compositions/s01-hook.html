  <div id="root" data-composition-id="s01" data-width="1920" data-height="1080"

    <div id="s01-all">
      <div id="s01-head" class="x-head">ROLLBACK을 세 번 하면</div>
      <div id="s01-code" class="x-dark q-code x-hide">
        <div class="q-ln" id="s01-l1"><span><span class="s01-no">1</span><span class="q-k">INSERT INTO</span> 과일 <span class="q-k">VALUES</span> ('감', 40);</span></div>
        <div class="q-ln" id="s01-l2"><span><span class="s01-no">2</span><span class="q-k">SAVEPOINT</span> A;</span></div>
        <div class="q-ln" id="s01-l3"><span><span class="s01-no">3</span><span class="q-k">UPDATE</span> 과일 <span class="q-k">SET</span> 수량 = 15 <span class="q-k">WHERE</span> 이름 = '사과';</span></div>
        <div class="q-ln" id="s01-l4"><span><span class="s01-no">4</span><span class="q-k">SAVEPOINT</span> B;</span></div>

        <div class="q-ln" id="s01-l6"><div class="q-hi" id="s01-h6"></div><span><span class="s01-no">6</span><span class="q-k">ROLLBACK TO</span> B;</span></div>
        <div class="q-ln" id="s01-l7"><div class="q-hi" id="s01-h7"></div><span><span class="s01-no">7</span><span class="q-k">ROLLBACK TO</span> A;</span></div>
        <div class="q-ln" id="s01-l8"><span><span class="s01-no">8</span><span class="q-k">COMMIT</span>;</span></div>

  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 28.4;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    let note = null;
    const say = (id, t) => { if (note) fade(note, t, 1, 0); fade(id, t + 0.15, 0, 1); note = id; };
    const lines = (ids) => ids.map((i) => `#s01-l${i} > span`);

    // 1 커밋된 과일 3행에서 명령 열 줄을 차례로
    ft("#s01-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s01-tb", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    fade("#s01-st", at(0, 1.2), 0, 1);
    ft("#s01-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 2.2));
    // 2 그 사이에 ROLLBACK이 세 번 — 나머지 줄은 흐리게, 세 줄만 밝게
    fade(lines([1, 2, 3, 4, 5, 8, 9]), at(1, 0.6), 1, 0.35);
    [6, 7, 10].forEach((k, j) => fade(`#s01-h${k}`, at(1, 1.0 + j * 0.45), 0, 1));
    // 3 마지막에 몇 행?
    ft("#s01-note", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(2, 0.1));
    say("#s01-n1", at(2, 0.1));
    // 4 처음 세 행일 것 같지만 → 정답은 네 행
    say("#s01-n2", at(3, 0.6));
    const jd = Number(V.jd) || at(3, 2.6);
    say("#s01-n3", jd);
    // 5 ROLLBACK이 늘 처음으로 돌아가는 것은 아니다
    say("#s01-n4", at(4, 0.3));
    // 6 한 줄씩 따라가기 — 강조를 풀고 전체를 흐리게
    fade(["#s01-h6", "#s01-h7", "#s01-h10"], at(5, 0.3), 1, 0);
    fade(lines([1, 2, 3, 4, 5, 8, 9]), at(5, 0.3), 0.35, 1);
    fade(["#s01-tb", "#s01-note"], at(5, 0.6), 1, 0.4);
    if (String(V.exit) !== "false") ft("#s01-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s01"] = tl;
