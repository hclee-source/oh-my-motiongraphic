    const hi = (k, t) => { if (cur) fade(`#s03-h${cur}`, t, 1, 0); if (k) fade(`#s03-h${k}`, t, 0, 1); cur = k; };
    let note = null;
    const say = (id, t) => { if (note) fade(note, t, 1, 0); if (id) fade(id, t + 0.15, 0, 1); note = id; };
