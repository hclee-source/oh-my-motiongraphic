<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>

      display: grid; grid-template-columns: 96px 1fr; align-items: center; }

    #s09-c2 { top: 410px; }
    #s09-c3 { top: 558px; }
    #s09-c4 { top: 706px; }
    .s09-ring { position: absolute; inset: -2px; border-radius: 28px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
    .s09-n { font-size: 68px; font-weight: 900; color: var(--color-ink2, #71717A); }
    .s09-t { font-size: 42px; font-weight: 800; white-space: nowrap; }
    .s09-d { margin-top: 6px; font-size: 32px; font-weight: 600; color: var(--color-ink2, #71717A); opacity: 0; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s09" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,3,9,15,21]"},{"id":"dur","type":"number","label":"장면 길이","default":28},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s09-all">
      <div id="s09-head" class="x-head">시험장 체크</div>
      <div class="s09-c x-card x-hide" id="s09-c1"><div class="s09-ring" id="s09-r1"></div><div class="s09-n" id="s09-n1">1</div>
        <div><div class="s09-t">ORDER BY만 적으면 기본 범위는 RANGE</div><div class="s09-d" id="s09-d1">같은 값의 행은 같은 누적값</div></div></div>
      <div class="s09-c x-card x-hide" id="s09-c2"><div class="s09-ring" id="s09-r2"></div><div class="s09-n" id="s09-n2">2</div>
        <div><div class="s09-t">ROWS는 행 개수로, RANGE는 정렬한 값으로</div><div class="s09-d" id="s09-d2">범위를 정하는 기준이 다르다</div></div></div>
      <div class="s09-c x-card x-hide" id="s09-c3"><div class="s09-ring" id="s09-r3"></div><div class="s09-n" id="s09-n3">3</div>
        <div><div class="s09-t">LAG는 앞 행, LEAD는 뒤 행의 값</div><div class="s09-d" id="s09-d3">없으면 NULL 또는 세 번째 인수로 적은 값</div></div></div>
      <div class="s09-c x-card x-hide" id="s09-c4"><div class="s09-ring" id="s09-r4"></div><div class="s09-n" id="s09-n4">4</div>
        <div><div class="s09-t">LAST_VALUE는 범위를 끝까지 넓혀야</div><div class="s09-d" id="s09-d4">UNBOUNDED FOLLOWING까지</div></div></div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 28;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, t);
    const ACC = "#6B3FE6", INK2 = "#71717A";

    // 48 시험장에서 챙길 네 가지
    ft("#s09-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    // 지금 말하는 카드만 테두리와 번호가 강조색
    const focus = (k, t) => {
      stamp(`#s09-c${k}`, t);
      fade(`#s09-r${k}`, t, 0, 1);
      ft(`#s09-n${k}`, { color: INK2 }, { color: ACC }, t);
      if (k > 1) {
        fade(`#s09-r${k - 1}`, t, 1, 0);
        ft(`#s09-n${k - 1}`, { color: ACC }, { color: INK2 }, t);
      }
    };
    focus(1, at(1, 0.2));
    fade("#s09-d1", at(1, 3.0), 0, 1);
    focus(2, at(2, 0.2));
    fade("#s09-d2", at(2, 3.0), 0, 1);
    focus(3, at(3, 0.2));
    fade("#s09-d3", at(3, 3.0), 0, 1);
    focus(4, at(4, 0.2));
    fade("#s09-d4", at(4, 3.0), 0, 1);
    if (String(V.exit) !== "false") ft("#s09-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s09"] = tl;
  </script>
