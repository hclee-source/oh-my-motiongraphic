  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 40;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d = 0) => Number(V[k]) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);

    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);
    const paint = (sel, t, a, b) => ft(sel, { color: a }, { color: b }, t);
    const ACC = "#6B3FE6", INK = "#18181B";
    const IDX = [0, 1, 2, 3, 4];
    let note = null;
    const say = (id, t) => { if (note) fade(note, t, 1, 0); fade(id, t + 0.15, 0, 1); note = id; };

    // 7 직원 다섯 명, 급여가 같은 지영과 현우

    ft("#s02-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.5));
    paint(["#s02-p1", "#s02-p2"], at(0, 3.6), INK, ACC);
    // 8 괄호를 비우면 전체 합계 2000이 모든 행에
    paint(["#s02-p1", "#s02-p2"], at(1, 0), ACC, INK);
    fade("#s02-o1", at(1, 0.2), 0, 1);
    fade("#s02-h4a", at(1, 0.2), 0, 1);
    say("#s02-na", at(1, 0.4));
    ft("#s02-note", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(1, 0.3));
    IDX.forEach((i, j) => stamp(`#s02-a${i}`, X("t2000", -0.1 + j * 0.12)));
    // 9 행을 줄이지 않고 행마다 값 하나씩
    say("#s02-nb", at(2, 0.3));
    // 10 PARTITION BY 부서 → 영업 1200, 개발 800
    say("#s02-nc", at(3, 0.2));
    fade("#s02-o1", at(3, 0.2), 1, 0);
    fade("#s02-o2", at(3, 0.5), 0, 1);
    fade(IDX.map(i => `#s02-a${i}`), at(3, 0.5), 1, 0);
    [0, 1, 4].forEach((i, j) => stamp(`#s02-b${i}`, X("p12", -0.1 + j * 0.1)));
    [2, 3].forEach((i, j) => stamp(`#s02-b${i}`, X("p8", -0.1 + j * 0.1)));
    // 11 괄호 안에 ORDER BY 급여
    fade(IDX.map(i => `#s02-b${i}`), at(4, 0.2), 1, 0);
    fade("#s02-o2", at(4, 0.2), 1, 0);
    fade("#s02-o3", at(4, 0.5), 0, 1);
    fade("#s02-h4a", at(4, 0.2), 1, 0);
    fade("#s02-h4b", at(4, 0.5), 0, 1);
    // 12 급여 순으로 차곡차곡
    say("#s02-nd", at(5, 0.2));

    stamp("#s02-c0", X("c1", 0.3));

    stamp("#s02-c2", X("c2", -0.1));
    fade("#s02-ring", X("c2", 0), 0, 1);
    paint(["#s02-c1", "#s02-c2"], X("c2", 0), INK, ACC);

    stamp("#s02-c3", X("c4", -0.1));

    say("#s02-ne", X("c5", 0));
    paint("#s02-c4", X("c5", 0.1), INK, ACC);
    if (String(V.exit) !== "false") ft("#s02-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
