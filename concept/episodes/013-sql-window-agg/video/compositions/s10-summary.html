<template>

  <style>

      align-items: center; justify-content: center; gap: 18px; text-align: center; }

  </style>
  <div id="root" data-composition-id="s10" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,3.4]"},{"id":"dur","type":"number","label":"장면 길이","default":12},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":false},{"id":"rw","type":"number","label":"한 행씩 시각","default":8},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s10-all">
      <div id="s10-head" class="x-head">한 줄 정리</div>
      <div class="s10-c x-card x-hide" id="s10-c1"><div class="s10-t">ORDER BY만 적으면 <span class="x-acc">RANGE</span></div><div class="s10-d">같은 값은 함께 더해진다</div></div>
      <div class="s10-c x-card x-hide" id="s10-c2"><div class="s10-t">한 행씩 더하려면 <span class="x-acc">ROWS</span></div><div class="s10-d">행 개수로 센다</div></div>

  <script>
    const V = window.__hyperframes?.getVariables?.() || {};

    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);

    ft("#s10-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));

    ft("#s10-c1", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(1, 0.2));
    ft("#s10-c2", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, X("rw", -0.2));
    window.__timelines["s10"] = tl;
  </script>
