<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #s05-code { left: 192px; top: 262px; width: 780px; }
    #s05-code .q-ln { font-size: 32px; padding: 0 36px; }
    #s05-note { position: absolute; left: 192px; top: 530px; width: 780px; height: 316px; }
    .s05-n { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; text-align: center; font-size: 44px; font-weight: 900; line-height: 1.3; opacity: 0; }
    .s05-n small { display: block; font-size: 34px; font-weight: 700; color: var(--color-ink2, #71717A); }
    #s05-tb { left: 1012px; top: 262px; width: 716px; height: 584px; }
    #s05-tb .q-th, #s05-tb .q-tr { grid-template-columns: 170px 170px 320px; }
    #s05-tb .q-th { top: 24px; }
    #s05-tb .q-th > div { font-size: 30px; }
    #s05-tb .q-tr > div { font-size: 42px; }
    .s05-cell { position: relative; height: 48px; }
    .s05-cell > span { position: absolute; left: 0; right: 0; top: 0; line-height: 48px; text-align: center; font-size: 42px; font-weight: 900; white-space: nowrap; opacity: 0; }
    #s05-ring { position: absolute; left: 12px; width: 692px; top: 92px; height: 264px; box-sizing: border-box; border-radius: 26px;
      border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
  </style>
  <div id="root" data-composition-id="s05" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,8,16]"},{"id":"dur","type":"number","label":"장면 길이","default":24},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"e5","type":"number","label":"500과 시각","default":21},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s05-all">
      <div id="s05-head" class="x-head">앞뒤 몇 행만</div>
      <div id="s05-code" class="x-dark q-code x-hide">
        <div class="q-ln"><span><span class="q-k">SUM</span>(급여) <span class="q-k">OVER</span> (<span class="q-k">ORDER BY</span> 급여</span></div>
        <div class="q-ln"><div class="q-hi" id="s05-h2"></div><span>&nbsp;&nbsp;<span class="q-k">ROWS BETWEEN</span> 1 <span class="q-k">PRECEDING</span></span></div>
        <div class="q-ln"><div class="q-hi" id="s05-h3"></div><span>&nbsp;&nbsp;<span class="q-k">AND</span> 1 <span class="q-k">FOLLOWING</span>)</span></div>
      </div>
      <div id="s05-note" class="x-card x-hide" data-layout-allow-overlap>
        <div class="s05-n" id="s05-na"><span>바로 앞 행 + 현재 행<br />+ 바로 뒤 행</span><small>세 행만 더한다</small></div>
        <div class="s05-n" id="s05-nb"><span>첫 행과 마지막 행은<br /><span class="x-acc">이웃이 하나뿐</span></span><small>두 행만 더한다</small></div>
      </div>
      <div id="s05-tb" class="x-card q-tb x-hide">
        <div class="q-th"><div>이름</div><div>급여</div><div>세 행 합계</div></div>
        <div class="q-tr" style="top:100px"><div>민수</div><div>200</div><div class="s05-cell"><span id="s05-v0">500</span></div></div>
        <div class="q-tr" style="top:196px"><div>지영</div><div>300</div><div class="s05-cell"><span id="s05-v1">800</span></div></div>
        <div class="q-tr" style="top:292px"><div>현우</div><div>300</div><div class="s05-cell"><span id="s05-v2">1100</span></div></div>
        <div class="q-tr" style="top:388px"><div>수진</div><div>500</div><div class="s05-cell"><span id="s05-v3">1500</span></div></div>
        <div class="q-tr" style="top:484px"><div>동훈</div><div>700</div><div class="s05-cell"><span id="s05-v4">1200</span></div></div>
        <div id="s05-ring"></div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 24;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d = 0) => Number(V[k]) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);
    // 세 행짜리 테두리 자리(위쪽 행 a ~ 아래쪽 행 b)
    const win = (a, b) => ({ top: 100 + 96 * a - 8, height: (b - a) * 96 + 56 + 16 });
    const move = (from, to, t) => ft("#s05-ring", { ...win(...from) }, { ...win(...to), ease: "power2.inOut", duration: 0.3 }, t);
    // 29 500, 800, 1100, 1500, 1200 — 실제 말 시각(문장 시작 기준 초)
    const T = [0.52, 1.36, 2.84, 4.16, 5.62];
    const W = [[0, 1], [0, 2], [1, 3], [2, 4], [3, 4]];

    // 28 앞 1행, 현재, 뒤 1행 세 행만
    ft("#s05-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s05-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    ft("#s05-tb", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.5));
    ft("#s05-note", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(0, 0.7));
    fade("#s05-na", at(0, 1.0), 0, 1);
    fade("#s05-h2", at(0, 1.2), 0, 1);
    fade("#s05-h3", at(0, 3.2), 0, 1);
    fade("#s05-ring", at(0, 3.6), 0, 1);
    // 29 결과는 500, 800, 1100, 1500, 1200
    fade(["#s05-h2", "#s05-h3"], at(1, 0), 1, 0);
    stamp("#s05-v0", at(1, T[0] - 0.1));
    W.forEach((w, j) => {
      if (j === 0) move([0, 2], [0, 1], at(1, 0.4));
      else move(W[j - 1], w, at(1, T[j] - 0.5));
      if (j > 0) stamp(`#s05-v${j}`, at(1, T[j] - 0.1));
    });
    // 30 첫 행과 마지막 행은 이웃이 하나뿐
    fade("#s05-na", at(2, 0), 1, 0);
    fade("#s05-nb", at(2, 0.2), 0, 1);
    move([3, 4], [0, 1], at(2, 1.2));
    move([0, 1], [3, 4], X("e5", -0.5));
    if (String(V.exit) !== "false") ft("#s05-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s05"] = tl;
  </script>
</template>
