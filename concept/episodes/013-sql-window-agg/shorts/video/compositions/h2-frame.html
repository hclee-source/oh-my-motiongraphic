<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #h2-code { left: 80px; top: 320px; width: 920px; }
    #h2-code .q-ln { font-size: 44px; height: 72px; padding: 0 44px; }
    .h2-sw { position: relative; display: inline-block; width: 180px; height: 56px; vertical-align: middle; }
    .h2-sw > span { position: absolute; left: 0; top: 0; line-height: 56px; }
    #h2-rw { opacity: 0; }
    .h2-l { opacity: 0; }
    .h2-b { position: absolute; width: 190px; height: 120px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
      font-size: 68px; font-weight: 900; opacity: 0; }
    .h2-s { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
    #h2-w0,#h2-w1,#h2-w2,#h2-w3 { opacity: 0; }
    #h2-ring { position: absolute; left: 270px; top: 690px; width: 440px; height: 300px; box-sizing: border-box; border-radius: 34px;
      border: 5px solid var(--color-accent, #6B3FE6); opacity: 0; }
    #h2-chips { position: absolute; left: 80px; top: 1080px; width: 880px; height: 96px; }
    #h2-chips .q-chip { top: 0; left: 0; height: 96px; font-size: 46px; border-radius: 48px; }
  </style>
  <div id="root" data-composition-id="h2" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,5,10,15]"},{"id":"dur","type":"number","label":"장면 길이","default":20},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h2-all">
      <div id="h2-code" class="x-dark q-code x-hide">
        <div class="q-ln"><span><span class="q-k">SUM</span>(값) <span class="q-k">OVER</span> (<span class="q-k">ORDER BY</span> 값</span></div>
        <div class="q-ln h2-l" id="h2-l2"><div class="q-hi" id="h2-h2"></div><span data-layout-allow-overlap>&nbsp;&nbsp;<span class="q-k h2-sw"><span id="h2-rg">RANGE</span><span id="h2-rw">ROWS</span></span> <span class="q-k">BETWEEN</span></span></div>
        <div class="q-ln h2-l" id="h2-l3"><span>&nbsp;&nbsp;<span class="q-k">UNBOUNDED PRECEDING</span></span></div>
        <div class="q-ln h2-l" id="h2-l4"><span>&nbsp;&nbsp;<span class="q-k">AND CURRENT ROW</span>)</span></div>
      </div>
      <div class="h2-b x-card" id="h2-a0" style="left:80px;top:700px">40</div>
      <div class="h2-b x-card" id="h2-a1" style="left:290px;top:700px">50</div>
      <div class="h2-b x-card" id="h2-a2" style="left:500px;top:700px">50</div>
      <div class="h2-b x-card" id="h2-a3" style="left:710px;top:700px">60</div>
      <div class="h2-b x-dark" id="h2-g0" data-layout-allow-overlap style="left:80px;top:870px"><span class="h2-s" id="h2-gg0">40</span><span class="h2-s" id="h2-w0">40</span></div>
      <div class="h2-b x-dark" id="h2-g1" data-layout-allow-overlap style="left:290px;top:870px"><span class="h2-s" id="h2-gg1">140</span><span class="h2-s" id="h2-w1">90</span></div>
      <div class="h2-b x-dark" id="h2-g2" data-layout-allow-overlap style="left:500px;top:870px"><span class="h2-s" id="h2-gg2">140</span><span class="h2-s" id="h2-w2">140</span></div>
      <div class="h2-b x-dark" id="h2-g3" data-layout-allow-overlap style="left:710px;top:870px"><span class="h2-s" id="h2-gg3">200</span><span class="h2-s" id="h2-w3">200</span></div>
      <div id="h2-ring"></div>
      <div id="h2-chips" data-layout-allow-overlap>
        <div class="q-chip q-ok" id="h2-ca" style="width:640px">처음부터 현재 행까지</div>
        <div class="q-chip q-ng" id="h2-cb" style="width:640px">같은 값 = 함께</div>
        <div class="q-chip q-ok" id="h2-cc" style="width:640px">행을 하나씩 센다</div>
        <div class="q-chip q-ng" id="h2-cd" style="width:640px">먼저 90 · 다음 140</div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 20;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);
    const paint = (sel, t, a, b) => ft(sel, { color: a }, { color: b }, t);
    const ACC = "#6B3FE6", INK = "#18181B";
    const ACCD = "#A68CFF", WHITE = "#FFFFFF";
    // ROWS 값을 말하는 실제 시각(문장 시작 기준 초, listen/words.json에서 잰 값)
    const TW = [2.64, 3.42, 4.92, 6.2];   // 5 40, 90, 140, 200

    // 3 ORDER BY만 적으면 기본 범위는 RANGE, 처음부터 현재 행까지
    ft("#h2-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0));
    [0, 1, 2, 3].forEach((j) => stamp(`#h2-a${j}`, at(0, 0.3 + j * 0.1)));
    fade("#h2-l2", at(0, 0.7), 0, 1);
    fade("#h2-l3", at(0, 1.2), 0, 1);
    fade("#h2-l4", at(0, 1.7), 0, 1);
    [0, 1, 2, 3].forEach((j) => stamp(`#h2-g${j}`, at(0, 1.0 + j * 0.1)));
    fade("#h2-h2", at(0, 2.0), 0, 1);
    stamp("#h2-ca", at(0, 2.4));
    // 4 RANGE는 값으로 범위, 같은 값의 행을 함께
    fade("#h2-h2", at(1, 0), 1, 0);
    fade("#h2-ca", at(1, 0.1), 1, 0);
    fade("#h2-ring", at(1, 0.8), 0, 1);
    paint(["#h2-gg1", "#h2-gg2"], at(1, 0.8), WHITE, ACCD);
    stamp("#h2-cb", at(1, 2.0));
    // 5 ROWS로 적으면 행을 하나씩 → 40, 90, 140, 200
    fade("#h2-cb", at(2, 0), 1, 0);
    fade("#h2-ring", at(2, 0), 1, 0);
    fade("#h2-rg", at(2, 0.3), 1, 0);
    fade("#h2-rw", at(2, 0.5), 0, 1);
    fade(["#h2-gg0", "#h2-gg1", "#h2-gg2", "#h2-gg3"], at(2, 1.0), 1, 0);
    stamp("#h2-cc", at(2, 1.4));
    TW.forEach((d, j) => stamp(`#h2-w${j}`, at(2, d - 0.1)));
    // 6 같은 50이어도 먼저 90, 다음 140
    fade("#h2-cc", at(3, 0), 1, 0);
    fade("#h2-ring", at(3, 0.2), 0, 1);
    paint(["#h2-w1", "#h2-w2"], at(3, 0.2), WHITE, ACCD);
    stamp("#h2-cd", at(3, 0.8));
    if (String(V.exit) !== "false") ft("#h2-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h2"] = tl;
  </script>
</template>
