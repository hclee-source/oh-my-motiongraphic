<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .h4-c { position: absolute; left: 80px; width: 880px; height: 240px; padding: 0 56px; display: flex; flex-direction: column; justify-content: center; }
    .h4-p { font-size: 40px; font-weight: 800; color: var(--color-ink2, #71717A); white-space: nowrap; }
    .h4-k { margin-top: 10px; font-size: 76px; font-weight: 900; line-height: 1.1; color: var(--color-accent, #6B3FE6); white-space: nowrap; opacity: 0; }
    .h4-ring { position: absolute; inset: -2px; border-radius: 32px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
  </style>
  <div id="root" data-composition-id="h4" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45]"},{"id":"dur","type":"number","label":"장면 길이","default":7.8},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":false},{"id":"k1","type":"number","label":"ROLLUP 시각","default":1.5},{"id":"m2","type":"number","label":"모든 시각","default":2.4},{"id":"k2","type":"number","label":"CUBE 시각","default":3.3},{"id":"m3","type":"number","label":"지정한 시각","default":4},{"id":"k3","type":"number","label":"GROUPING SETS 시각","default":5.2},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h4-all">
      <div class="h4-c x-card x-hide" id="h4-c1" style="top:330px"><div class="h4-ring" id="h4-o1"></div>
        <div class="h4-p">오른쪽부터 지우면</div><div class="h4-k" id="h4-k1">ROLLUP</div></div>
      <div class="h4-c x-card x-hide" id="h4-c2" style="top:610px"><div class="h4-ring" id="h4-o2"></div>
        <div class="h4-p">모든 조합은</div><div class="h4-k" id="h4-k2">CUBE</div></div>
      <div class="h4-c x-card x-hide" id="h4-c3" style="top:890px"><div class="h4-ring" id="h4-o3"></div>
        <div class="h4-p">지정한 묶음만</div><div class="h4-k" id="h4-k3">GROUPING SETS</div></div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => (Number(V[k]) || d);
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.35 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);

    // 7 오른쪽부터 지우면 ROLLUP, 모든 조합은 CUBE, 지정한 묶음만 GROUPING SETS
    const rows = [[at(0, 0), X("k1", at(0, 1.1))], [X("m2", at(0, 2.0)), X("k2", at(0, 2.9))], [X("m3", at(0, 3.6)), X("k3", at(0, 4.8))]];
    rows.forEach(([r, k], j) => {
      const n = j + 1;
      ft(`#h4-c${n}`, { opacity: 0, x: -20 }, { opacity: 1, x: 0 }, r);
      fade(`#h4-o${n}`, r, 0, 1);
      if (n > 1) fade(`#h4-o${n - 1}`, r, 1, 0);
      stamp(`#h4-k${n}`, k);
    });
    window.__timelines["h4"] = tl;
  </script>
</template>
