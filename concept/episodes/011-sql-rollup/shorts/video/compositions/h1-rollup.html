<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #h1-code { position: absolute; left: 80px; top: 330px; width: 920px; height: 150px; }
    .h1-q { position: absolute; left: 0; right: 0; top: 0; height: 150px; display: flex; align-items: center; justify-content: center;
      font-size: 72px; font-weight: 900; white-space: nowrap; color: #FFFFFF; }
    #h1-qb { opacity: 0; }
    .h1-s { position: absolute; width: 640px; height: 170px; }
    .h1-v { position: absolute; inset: 0; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; }
    .h1-g { font-size: 64px; font-weight: 900; white-space: nowrap; }
    .h1-g i { font-style: normal; color: #949497; text-decoration: line-through; text-decoration-thickness: 5px; }
    .h1-l { font-size: 40px; font-weight: 800; color: var(--color-ink2, #71717A); white-space: nowrap; }
    .h1-b { opacity: 0; }
    .h1-ring { position: absolute; inset: -2px; border-radius: 32px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
  </style>
  <div id="root" data-composition-id="h1" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0,4.9,9.5]"},{"id":"dur","type":"number","label":"장면 길이","default":12.8},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"st","type":"number","label":"하나씩 시각","default":1.8},{"id":"a1","type":"number","label":"A로만 시각","default":6.5},{"id":"a2","type":"number","label":"마지막에 시각","default":7.9},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h1-all">
      <div id="h1-code" class="x-dark x-hide" data-layout-allow-overlap>
        <div class="h1-q" id="h1-qa"><span><span class="q-k">ROLLUP</span>(A, B)</span></div>
        <div class="h1-q" id="h1-qb"><span><span class="q-k">ROLLUP</span>(B, A)</span></div>
      </div>
      <div class="h1-s x-card x-hide" id="h1-s1" style="left:80px;top:530px" data-layout-allow-overlap><div class="h1-ring" id="h1-o1"></div>
        <div class="h1-v" id="h1-a1"><span class="h1-g">(A, B)</span><span class="h1-l">A·B별</span></div>
        <div class="h1-v h1-b" id="h1-b1"><span class="h1-g">(B, A)</span><span class="h1-l">B·A별</span></div></div>
      <div class="h1-s x-card x-hide" id="h1-s2" style="left:200px;top:730px" data-layout-allow-overlap><div class="h1-ring" id="h1-o2"></div>
        <div class="h1-v" id="h1-a2"><span class="h1-g">(A<i>, B</i>)</span><span class="h1-l">A별 소계</span></div>
        <div class="h1-v h1-b" id="h1-b2"><span class="h1-g">(B<i>, A</i>)</span><span class="h1-l">B별 소계</span></div></div>
      <div class="h1-s x-card x-hide" id="h1-s3" style="left:320px;top:930px" data-layout-allow-overlap><div class="h1-ring" id="h1-o3"></div>
        <div class="h1-v" id="h1-a3"><span class="h1-g">(<i>A, B</i>)</span><span class="h1-l">총계</span></div>
        <div class="h1-v h1-b" id="h1-b3"><span class="h1-g">(<i>B, A</i>)</span><span class="h1-l">총계</span></div></div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 12.8;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => (Number(V[k]) || d);
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    let ring = 0;
    const focus = (k, t) => { if (ring) fade(`#h1-o${ring}`, t, 1, 0); if (k) fade(`#h1-o${k}`, t, 0, 1); ring = k; };

    // 1 ROLLUP(A, B)는 오른쪽부터 하나씩 지우며 소계를 붙인다 — 세 계단
    ft("#h1-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0));
    const st = X("st", at(0, 1.6));
    [1, 2, 3].forEach((k, j) => ft(`#h1-s${k}`, { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, st + j * 0.35));
    // 2 A와 B로, A로만, 마지막에 총계
    focus(1, at(1, 0));
    focus(2, X("a1", at(1, 1.5)));
    focus(3, X("a2", at(1, 2.9)));
    // 3 괄호 안 순서를 바꾸면 결과도 바뀐다
    focus(0, at(2, 0.1));
    fade("#h1-qa", at(2, 0.3), 1, 0);
    fade("#h1-qb", at(2, 0.45), 0, 1);
    [1, 2, 3].forEach((k, j) => { fade(`#h1-a${k}`, at(2, 0.7 + j * 0.15), 1, 0); fade(`#h1-b${k}`, at(2, 0.85 + j * 0.15), 0, 1); });
    focus(2, at(2, 1.6));
    if (String(V.exit) !== "false") ft("#h1-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h1"] = tl;
  </script>
</template>
