<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .s08-c { position: absolute; left: 192px; width: 1536px; height: 176px; padding: 0 56px 0 44px; box-sizing: border-box;
      display: grid; grid-template-columns: 84px 1fr auto; align-items: center; }
    #s08-c1 { top: 262px; }
    #s08-c2 { top: 466px; }
    #s08-c3 { top: 670px; }

    .s08-n { font-size: 72px; font-weight: 900; color: var(--color-ink2, #71717A); }
    .s08-t { font-size: 44px; font-weight: 800; white-space: nowrap; }
    .s08-d { margin-top: 8px; font-size: 30px; font-weight: 600; color: var(--color-ink2, #71717A); opacity: 0; white-space: nowrap; }
    .s08-e { font-size: 40px; font-weight: 900; white-space: nowrap; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s08" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,3.1,9.1,14.4]"},{"id":"dur","type":"number","label":"장면 길이","default":21.4},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s08-all">
      <div id="s08-head" class="x-head">시험장 체크</div>
      <div class="s08-c x-card x-hide" id="s08-c1"><div class="s08-ring" id="s08-r1"></div><div class="s08-n" id="s08-n1">1</div>
        <div><div class="s08-t">ROLLUP은 오른쪽부터 지운다</div><div class="s08-d" id="s08-d1">괄호 안 순서가 바뀌면 결과도 바뀐다</div></div>
        <div class="s08-e" id="s08-e1">9행 <span class="x-acc">≠</span> 10행</div></div>
      <div class="s08-c x-card x-hide" id="s08-c2"><div class="s08-ring" id="s08-r2"></div><div class="s08-n" id="s08-n2">2</div>
        <div><div class="s08-t">CUBE는 모든 조합</div><div class="s08-d" id="s08-d2">순서와 상관없이 같은 결과</div></div>
        <div class="s08-e" id="s08-e2">12행 <span class="x-acc">=</span> 12행</div></div>
      <div class="s08-c x-card x-hide" id="s08-c3"><div class="s08-ring" id="s08-r3"></div><div class="s08-n" id="s08-n3">3</div>
        <div><div class="s08-t">GROUPING SETS는 지정한 묶음만</div><div class="s08-d" id="s08-d3">총계는 빈 괄호를 적어야 나온다</div></div>
        <div class="s08-e" id="s08-e3">(부서, 직급, <span class="x-acc">()</span>)</div></div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 21.4;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, t);
    const ACC = "#6B3FE6", INK2 = "#71717A";

    // 34 세 가지
    ft("#s08-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    // 지금 말하는 카드만 테두리와 번호가 강조색
    const focus = (k, t) => {
      stamp(`#s08-c${k}`, t);
      fade(`#s08-r${k}`, t, 0, 1);
      ft(`#s08-n${k}`, { color: INK2 }, { color: ACC }, t);
      if (k > 1) {
        fade(`#s08-r${k - 1}`, t, 1, 0);
        ft(`#s08-n${k - 1}`, { color: ACC }, { color: INK2 }, t);
      }
    };
    // 35 ROLLUP은 오른쪽부터 — 순서가 바뀌면 결과도
    focus(1, at(1, 0.2));
    fade("#s08-d1", at(1, 2.4), 0, 1);
    fade("#s08-e1", at(1, 3.4), 0, 1);
    // 36 CUBE는 모든 조합 — 순서와 상관없이 같다
    focus(2, at(2, 0.2));
    fade("#s08-d2", at(2, 2.0), 0, 1);
    fade("#s08-e2", at(2, 3.0), 0, 1);
    // 37 GROUPING SETS는 적은 묶음만, 총계는 빈 괄호
    focus(3, at(3, 0.2));
    fade("#s08-d3", at(3, 3.2), 0, 1);
    fade("#s08-e3", at(3, 4.2), 0, 1);
    if (String(V.exit) !== "false") ft("#s08-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s08"] = tl;
  </script>
