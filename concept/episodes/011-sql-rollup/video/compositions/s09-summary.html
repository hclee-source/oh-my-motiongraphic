<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .s09-r { position: absolute; left: 192px; width: 1536px; height: 160px; padding: 0 64px; box-sizing: border-box;
      display: flex; align-items: center; justify-content: space-between; }
    .s09-p { font-size: 48px; font-weight: 800; white-space: nowrap; }
    .s09-k { font-size: 64px; font-weight: 900; color: var(--color-accent, #6B3FE6); white-space: nowrap; opacity: 0; }
    .s09-ring { position: absolute; inset: -2px; border-radius: 28px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
  </style>
  <div id="root" data-composition-id="s09" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,3.4]"},{"id":"dur","type":"number","label":"장면 길이","default":11.8},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":false},{"id":"k1","type":"number","label":"ROLLUP 시각","default":4.6},{"id":"m2","type":"number","label":"모든 시각","default":5.2},{"id":"k2","type":"number","label":"CUBE 시각","default":6.4},{"id":"m3","type":"number","label":"지정한 시각","default":7},{"id":"k3","type":"number","label":"GROUPING SETS 시각","default":8.4},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s09-all">
      <div id="s09-head" class="x-head">한 줄 정리</div>
      <div class="s09-r x-card x-hide" id="s09-r1" style="top:270px"><div class="s09-ring" id="s09-o1"></div>
        <div class="s09-p">오른쪽부터 지우면</div><div class="s09-k" id="s09-k1">ROLLUP</div></div>
      <div class="s09-r x-card x-hide" id="s09-r2" style="top:462px"><div class="s09-ring" id="s09-o2"></div>
        <div class="s09-p">모든 조합은</div><div class="s09-k" id="s09-k2">CUBE</div></div>
      <div class="s09-r x-card x-hide" id="s09-r3" style="top:654px"><div class="s09-ring" id="s09-o3"></div>
        <div class="s09-p">지정한 묶음만</div><div class="s09-k" id="s09-k3">GROUPING SETS</div></div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => (Number(V[k]) || d);
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, t);

    // 38 한 줄로 정리하면
    ft("#s09-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    // 39 오른쪽부터 지우면 ROLLUP, 모든 조합은 CUBE, 지정한 묶음만 GROUPING SETS
    const rows = [[at(1, 0.05), X("k1", at(1, 1.2))], [X("m2", at(1, 2.0)), X("k2", at(1, 3.0))], [X("m3", at(1, 3.6)), X("k3", at(1, 4.8))]];
    rows.forEach(([r, k], j) => {
      const n = j + 1;
      ft(`#s09-r${n}`, { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, r);
      fade(`#s09-o${n}`, r, 0, 1);
      if (n > 1) fade(`#s09-o${n - 1}`, r, 1, 0);
      stamp(`#s09-k${n}`, k);
    });
    window.__timelines["s09"] = tl;
  </script>
</template>
