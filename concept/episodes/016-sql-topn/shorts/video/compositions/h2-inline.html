<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #h2-in { position: absolute; left: 80px; top: 330px; width: 920px; height: 340px; box-sizing: border-box; }
    #h2-lab { position: absolute; left: 36px; top: 28px; font-size: 38px; font-weight: 800; color: var(--color-ink2, #71717A); white-space: nowrap; }
    .h2-b { position: absolute; top: 110px; width: 156px; height: 196px; box-sizing: border-box; border-radius: 22px;
      border: 3px solid var(--color-line, #E3E5EA); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .h2-no { font-size: 40px; font-weight: 900; color: var(--color-accent, #6B3FE6); line-height: 1; opacity: 0; }
    .h2-v { font-size: 72px; font-weight: 900; line-height: 1; }
    .h2-hl { position: absolute; inset: -3px; border-radius: 22px; border: 4px solid var(--color-accent, #6B3FE6);
      background: color-mix(in srgb, var(--color-accent, #6B3FE6) 10%, transparent); opacity: 0; }
    #h2-out { left: 80px; top: 720px; width: 920px; }
    #h2-out .q-ln { font-size: 44px; height: 80px; padding: 0 44px; }
    #h2-res { position: absolute; left: 80px; top: 920px; width: 880px; text-align: center; font-size: 60px; font-weight: 900; opacity: 0; }
  </style>
  <div id="root" data-composition-id="h2" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,6.22]"},{"id":"dur","type":"number","label":"장면 길이","default":9.76},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"ot","type":"number","label":"바깥에서 시각","default":3.8},{"id":"rs","type":"number","label":"95점 시각","default":7.4},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h2-all">
      <div id="h2-in" class="x-card x-hide">
        <div id="h2-lab">괄호 안 · <span class="x-acc">ORDER BY 점수 DESC</span></div>
        <div class="h2-b" id="h2-b1" style="left:32px"><div class="h2-hl" id="h2-l1"></div><div class="h2-no" id="h2-n1">1</div><div class="h2-v">95</div></div>
        <div class="h2-b" id="h2-b2" style="left:206px"><div class="h2-hl" id="h2-l2"></div><div class="h2-no" id="h2-n2">2</div><div class="h2-v">90</div></div>
        <div class="h2-b" id="h2-b3" style="left:380px"><div class="h2-no"> </div><div class="h2-v">90</div></div>
        <div class="h2-b" id="h2-b4" style="left:554px"><div class="h2-no"> </div><div class="h2-v">70</div></div>
        <div class="h2-b" id="h2-b5" style="left:728px"><div class="h2-no"> </div><div class="h2-v">60</div></div>
      </div>
      <div id="h2-out" class="x-dark q-code x-hide">
        <div class="q-ln"><div class="q-hi" id="h2-h1"></div><span>바깥 · <span class="q-k">WHERE ROWNUM</span> &lt;= 2</span></div>
      </div>
      <div id="h2-res">결과는 <span class="x-acc">95 · 90</span></div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 9.76;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d = 0) => Number(V[k]) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, t);

    // 4 괄호 안에서 먼저 정렬하고, 바깥에서 ROWNUM으로 자른다
    ft("#h2-in", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0));
    [1, 2, 3, 4, 5].forEach((k, j) => ft(`#h2-b${k}`, { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(0, 0.4 + j * 0.15)));
    ft("#h2-out", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, X("ot", -0.2));
    fade("#h2-h1", X("ot", 0.2), 0, 1);
    stamp("#h2-n1", X("ot", 0.5));
    stamp("#h2-n2", X("ot", 0.8));
    fade(["#h2-b3", "#h2-b4", "#h2-b5"], X("ot", 1.2), 1, 0.3);
    // 5 그러면 결과는 95점, 90점
    fade(["#h2-l1", "#h2-l2"], X("rs", -0.1), 0, 1);
    fade("#h2-res", X("rs", 0), 0, 1);
    if (String(V.exit) !== "false") ft("#h2-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h2"] = tl;
  </script>
</template>
