<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #h3-code { left: 80px; top: 330px; width: 920px; }
    #h3-code .q-ln { font-size: 48px; height: 84px; padding: 0 44px; }
    .h3-col { position: absolute; top: 540px; width: 160px; height: 300px; }
    .h3-c { position: absolute; left: 0; top: 0; width: 160px; height: 200px; box-sizing: border-box; display: flex; align-items: center;
      justify-content: center; font-size: 80px; font-weight: 900; }
    .h3-tag { position: absolute; left: 0; right: 0; top: 224px; text-align: center; font-size: 52px; font-weight: 900;
      color: #8A8A93; opacity: 0; }
    #h3-res { left: 80px; top: 880px; height: 96px; padding: 0 44px; border-radius: 48px; font-size: 52px; }
    #h3-why { position: absolute; left: 80px; top: 1020px; width: 880px; text-align: center; font-size: 44px; font-weight: 800;
      color: var(--color-ink2, #71717A); opacity: 0; }
  </style>
  <div id="root" data-composition-id="h3" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,3.49]"},{"id":"dur","type":"number","label":"장면 길이","default":9.37},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"nr","type":"number","label":"한 행도 시각","default":1.8},{"id":"a1","type":"number","label":"1번을 받는데 시각","default":4.4},{"id":"a2","type":"number","label":"버려지고 시각","default":6.2},{"id":"b1","type":"number","label":"다시 1번을 시각","default":7.6},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h3-all">
      <div id="h3-code" class="x-dark q-code x-hide">
        <div class="q-ln"><span><span class="q-k">WHERE ROWNUM</span> = 2</span></div>
      </div>
      <div class="h3-col" style="left:90px"><div class="h3-c x-card x-hide" id="h3-c1">60</div><div class="h3-tag" id="h3-t1">1</div></div>
      <div class="h3-col" style="left:270px"><div class="h3-c x-card x-hide" id="h3-c2">70</div><div class="h3-tag" id="h3-t2">1</div></div>
      <div class="h3-col" style="left:450px"><div class="h3-c x-card x-hide" id="h3-c3">95</div><div class="h3-tag" id="h3-t3">1</div></div>
      <div class="h3-col" style="left:630px"><div class="h3-c x-card x-hide" id="h3-c4">90</div><div class="h3-tag" id="h3-t4">1</div></div>
      <div class="h3-col" style="left:810px"><div class="h3-c x-card x-hide" id="h3-c5">90</div><div class="h3-tag" id="h3-t5">1</div></div>
      <div id="h3-res" class="q-chip q-ng">결과 0행</div>
      <div id="h3-why">1번을 받고 버려지면, 다음 행도 다시 1번</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 9.37;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d = 0) => Number(V[k]) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, t);
    // 한 장이 1번을 받았다가 버려진다
    const drop = (k, tNum, tDrop) => { stamp(`#h3-t${k}`, tNum); fade(`#h3-c${k}`, tDrop, 1, 0.25); };

    // 6 ROWNUM = 2는 한 행도 나오지 않는다
    ft("#h3-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0));
    [1, 2, 3, 4, 5].forEach((k, j) => stamp(`#h3-c${k}`, at(0, 0.3 + j * 0.12)));
    stamp("#h3-res", X("nr", 0));
    // 7 첫 행은 1번을 받는데 2가 아니라 버려지고, 다음 행이 다시 1번
    drop(1, X("a1", -0.1), X("a2", 0));
    drop(2, X("b1", -0.1), X("b1", 0.5));
    [3, 4, 5].forEach((k, j) => drop(k, X("b1", 0.6 + j * 0.3), X("b1", 1.0 + j * 0.3)));
    fade("#h3-why", X("a2", 0.3), 0, 1);
    if (String(V.exit) !== "false") ft("#h3-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h3"] = tl;
  </script>
</template>
