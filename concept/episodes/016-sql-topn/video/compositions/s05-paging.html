<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #s05-code { left: 192px; top: 262px; width: 900px; }
    #s05-code .q-ln { font-size: 30px; height: 54px; padding: 0 36px; }
    #s05-code .s05-in { padding-left: 84px; }
    #s05-code .s05-in2 { padding-left: 196px; }
    #s05-ng { left: 192px; top: 690px; }
    #s05-tb { left: 1148px; top: 262px; width: 580px; height: 300px; }
    #s05-tb .q-th, #s05-tb .q-tr { grid-template-columns: 150px 220px 154px; }
    #s05-cnt { font-size: 32px; font-weight: 900; color: var(--color-accent, #6B3FE6); opacity: 0; }
    #s05-tb .q-tr > div:first-child { color: var(--color-accent, #6B3FE6); font-weight: 900; }
  </style>
  <div id="root" data-composition-id="s05" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,8.08,13.2]"},{"id":"dur","type":"number","label":"장면 길이","default":21.9},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"rn","type":"number","label":"ROWNUM이 시각","default":3},{"id":"z0","type":"number","label":"0행 시각","default":6.5},{"id":"al","type":"number","label":"순번이라는 시각","default":10.5},{"id":"ot","type":"number","label":"바깥에서 시각","default":14.5},{"id":"v4","type":"number","label":"400 시각","default":18.4},{"id":"v5","type":"number","label":"350 시각","default":19.4},{"id":"v6","type":"number","label":"300 시각","default":20.4},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s05-all">
      <div id="s05-head" class="x-head">중간 구간 자르기</div>
      <div id="s05-ng" class="q-chip q-ng"><span>ROWNUM &gt;= 4</span><span id="s05-z" style="opacity:0;margin-left:14px">→ 0행 ✕</span></div>
      <div id="s05-code" class="x-dark q-code x-hide">
        <div class="q-ln"><span><span class="q-k">SELECT</span> * <span class="q-k">FROM</span> (</span></div>
        <div class="q-ln s05-in"><div class="q-hi" id="s05-h2"></div><span><span class="q-k">SELECT</span> <span class="q-k">ROWNUM</span> <span class="q-k">AS</span> 순번, 이름, 급여</span></div>
        <div class="q-ln s05-in"><div class="q-hi" id="s05-h3"></div><span><span class="q-k">FROM</span> (<span class="q-k">SELECT</span> 이름, 급여 <span class="q-k">FROM</span> 직원</span></div>
        <div class="q-ln s05-in2"><div class="q-hi" id="s05-h4"></div><span><span class="q-k">ORDER BY</span> 급여 <span class="q-k">DESC</span>)</span></div>
        <div class="q-ln"><span>)</span></div>
        <div class="q-ln"><div class="q-hi" id="s05-h6"></div><span><span class="q-k">WHERE</span> 순번 <span class="q-k">BETWEEN</span> 4 <span class="q-k">AND</span> 6;</span></div>
      </div>
      <div id="s05-tb" class="x-card q-tb x-hide">
        <div class="q-th" style="top:20px"><div>순번</div><div>급여(만 원)</div><div id="s05-cnt">3행</div></div>
        <div class="q-tr x-hide" id="s05-r4" style="top:96px"><div>4</div><div>400</div><div></div></div>
        <div class="q-tr x-hide" id="s05-r5" style="top:160px"><div>5</div><div>350</div><div></div></div>
        <div class="q-tr x-hide" id="s05-r6" style="top:224px"><div>6</div><div>300</div><div></div></div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 21.9;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d = 0) => Number(V[k]) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    let cur = 0;
    const hi = (k, t) => { if (cur) fade(`#s05-h${cur}`, t, 1, 0); if (k) fade(`#s05-h${k}`, t, 0, 1); cur = k; };

    // 33 네 번째부터 여섯 번째: ROWNUM이 4 이상이라고 바로 적으면 0행 — 칩이 위에 먼저 뜨고, 다음 문장에서 아래로 내려가 흐려진다
    ft("#s05-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s05-ng", { opacity: 0, y: -428, scale: 0.9 }, { opacity: 1, y: -428, scale: 1, ease: "back.out(1.8)" }, X("rn", -0.1));
    fade("#s05-z", X("z0", -0.1), 0, 1);
    // 34 정렬한 인라인 뷰 바깥에서 ROWNUM에 순번이라는 별칭
    ft("#s05-ng", { opacity: 1, y: -428 }, { opacity: 0.5, y: 0, duration: 0.6 * S, ease: "power2.inOut" }, at(1, 0));
    ft("#s05-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(1, 0.9));
    hi(3, at(1, 1.2));
    hi(2, X("al", -0.2));
    // 35 한 겹 더 바깥에서 순번으로 거르면 순번 4~6: 400, 350, 300
    hi(6, X("ot", -0.1));
    ft("#s05-tb", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, X("ot", 0.4));
    [["#s05-r4", "v4"], ["#s05-r5", "v5"], ["#s05-r6", "v6"]].forEach(([r, k]) => ft(r, { opacity: 0, y: 8 }, { opacity: 1, y: 0 }, X(k, -0.1)));
    fade("#s05-cnt", X("v6", 0.6), 0, 1);
    if (String(V.exit) !== "false") ft("#s05-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s05"] = tl;
  </script>
</template>
