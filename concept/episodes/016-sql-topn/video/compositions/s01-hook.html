<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #s01-code { left: 192px; top: 262px; width: 760px; }
    #s01-tb { left: 1008px; top: 262px; width: 720px; height: 300px; }
    #s01-tb .q-th, #s01-tb .q-tr { grid-template-columns: 220px 220px 224px; }
    #s01-cnt { color: var(--color-accent, #6B3FE6); font-weight: 900; font-size: 32px; opacity: 0; }
    #s01-who { left: 1008px; top: 602px; }
    #s01-ng { left: 192px; top: 602px; }
    #s01-q { position: absolute; left: 192px; top: 730px; width: 1536px; height: 80px; }
    #s01-q > div { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 48px; font-weight: 800; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s01" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.2,5.2,11.4,16.5,20.2,24.1]"},{"id":"dur","type":"number","label":"장면 길이","default":29},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"ob","type":"number","label":"ORDER BY 시각","default":8},{"id":"v1","type":"number","label":"400 시각","default":12},{"id":"v2","type":"number","label":"300 시각","default":12.6},{"id":"v3","type":"number","label":"250 시각","default":13.2},{"id":"w5","type":"number","label":"500인 시각","default":18},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s01-all">
      <div id="s01-head" class="x-head">상위 3명을 뽑았는데</div>
      <div id="s01-code" class="x-dark q-code x-hide">
        <div class="q-ln"><span><span class="q-k">SELECT</span> 이름, 급여</span></div>
        <div class="q-ln"><span><span class="q-k">FROM</span> 직원</span></div>
        <div class="q-ln"><div class="q-hi" id="s01-h3"></div><span><span class="q-k">WHERE</span> <span class="q-k">ROWNUM</span> &lt;= 3</span></div>
        <div class="q-ln"><div class="q-hi" id="s01-h4"></div><span><span class="q-k">ORDER BY</span> 급여 <span class="q-k">DESC</span>;</span></div>
      </div>
      <div id="s01-tb" class="x-card q-tb x-hide">
        <div class="q-th" style="top:20px"><div>이름</div><div>급여(만 원)</div><div id="s01-cnt">3행</div></div>
        <div class="q-tr x-hide" id="s01-r1" style="top:96px"><div>민수</div><div>400</div><div></div></div>
        <div class="q-tr x-hide" id="s01-r2" style="top:160px"><div>지영</div><div>300</div><div></div></div>
        <div class="q-tr x-hide" id="s01-r3" style="top:224px"><div>수진</div><div>250</div><div></div></div>
      </div>
      <div id="s01-who" class="q-chip q-ng">급여 500인 직원은?</div>
      <div id="s01-ng" class="q-chip q-ng">✕ 상위 3명이 아니다</div>
      <div id="s01-q" data-layout-allow-overlap>
        <div id="s01-q1">상위 3명을 뽑았는데, 왜 1등이 빠졌을까?</div>
        <div id="s01-q2" class="x-acc">ROWNUM이 붙는 순간을 따라가 보면</div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 29;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d = 0) => Number(V[k]) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);

    // 1 급여 상위 세 명을 뽑으려고 이런 SQL
    ft("#s01-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s01-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    // 2 WHERE에서 ROWNUM 3 이하 → ORDER BY로 높은 순
    fade("#s01-h3", at(1, 0.2), 0, 1);
    fade("#s01-h3", X("ob", -0.1), 1, 0);
    fade("#s01-h4", X("ob"), 0, 1);
    // 3 결과는 400, 300, 250 세 명
    fade("#s01-h4", at(2, 0), 1, 0);
    ft("#s01-tb", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(2, 0));
    [["#s01-r1", "v1"], ["#s01-r2", "v2"], ["#s01-r3", "v3"]].forEach(([r, k]) => ft(r, { opacity: 0, y: 8 }, { opacity: 1, y: 0 }, X(k, -0.1)));
    fade("#s01-cnt", X("v3", 0.6), 0, 1);
    // 4 그런데 급여 500인 직원이 있다
    stamp("#s01-who", X("w5", -0.1));
    // 5 상위 3명인데 1등이 빠졌다
    stamp("#s01-ng", at(4, 0.2));
    fade("#s01-tb", at(4, 0.4), 1, 0.45);
    fade("#s01-q1", at(4, 0.6), 0, 1);
    // 6 ROWNUM이 붙는 순간을 따라가 본다
    fade("#s01-q1", at(5, 0.1), 1, 0);
    fade("#s01-q2", at(5, 0.3), 0, 1);
    fade(["#s01-code", "#s01-who", "#s01-ng"], at(5, 0.3), 1, 0.4);
    if (String(V.exit) !== "false") ft("#s01-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s01"] = tl;
  </script>
</template>
