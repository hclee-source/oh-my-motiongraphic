  <div id="root" data-composition-id="s02" data-width="1920" data-height="1080"

      <div id="s02-code" class="x-dark q-code x-hide">
        <div class="q-ln"><div class="q-hi" id="s02-h1"></div><span><span class="q-k">SELECT</span> 이름, 급여</span><div class="q-no" id="s02-o1">3</div></div>
        <div class="q-ln"><div class="q-hi" id="s02-h2"></div><span><span class="q-k">FROM</span> 직원</span><div class="q-no" id="s02-o2">1</div></div>
        <div class="q-ln"><div class="q-hi" id="s02-h3"></div><span><span class="q-k">WHERE</span> <span class="q-k">ROWNUM</span> &lt;= 3</span><div class="q-no" id="s02-o3">2</div></div>
        <div class="q-ln"><div class="q-hi" id="s02-h4"></div><span><span class="q-k">ORDER BY</span> 급여 <span class="q-k">DESC</span>;</span><div class="q-no" id="s02-o4">4</div></div>

        <div class="s02-n" id="s02-nb"><span>번호를 붙여 보고<br />WHERE를 <span class="x-acc">통과하면</span> 다음 번호로</span></div>
        <div class="s02-n" id="s02-nc"><span>처음 읽은 <span class="x-acc">세 행만</span> 남는다</span></div>
        <div class="s02-n" id="s02-nd"><span>상위 3명이 아니라<br />먼저 읽힌 세 명을 정렬</span></div>

        <div class="q-th" id="s02-th"><div>이름</div><div>급여(만 원)</div><div id="s02-rnh">ROWNUM</div>
          <div class="s02-cell s02-cnt" data-layout-allow-overlap><span id="s02-c1">7행</span><span id="s02-c2">3행</span></div></div>
        <div class="q-tr" id="s02-r0" style="top:84px"><div>지영</div><div>300</div>
          <div class="s02-cell"><span class="s02-rn" id="s02-u0">1</span></div>
          <div class="s02-cell" data-layout-allow-overlap><span class="s02-ok" id="s02-m0">통과</span></div></div>
        <div class="q-tr" id="s02-r1" style="top:148px"><div>민수</div><div>400</div>
          <div class="s02-cell"><span class="s02-rn" id="s02-u1">2</span></div>
          <div class="s02-cell" data-layout-allow-overlap><span class="s02-rk" id="s02-k3a">공동 3등</span><span class="s02-ok" id="s02-m1">통과</span></div></div>

          <div class="s02-cell"><span class="s02-rn s02-g" id="s02-u3">4</span></div>
          <div class="s02-cell" data-layout-allow-overlap><span class="s02-rk" id="s02-k1">1등</span><span class="s02-ng" id="s02-m3">버림</span></div></div>
        <div class="q-tr" id="s02-r4" style="top:340px"><div>예린</div><div>400</div>
          <div class="s02-cell"><span class="s02-rn s02-g" id="s02-u4">4</span></div>
          <div class="s02-cell" data-layout-allow-overlap><span class="s02-rk" id="s02-k3b">공동 3등</span><span class="s02-ng" id="s02-m4">버림</span></div></div>
        <div class="q-tr" id="s02-r5" style="top:404px"><div>동훈</div><div>450</div>
          <div class="s02-cell"><span class="s02-rn s02-g" id="s02-u5">4</span></div>
          <div class="s02-cell" data-layout-allow-overlap><span class="s02-rk" id="s02-k2">2등</span><span class="s02-ng" id="s02-m5">버림</span></div></div>
        <div class="q-tr" id="s02-r6" style="top:468px"><div>태호</div><div>350</div>
          <div class="s02-cell"><span class="s02-rn s02-g" id="s02-u6">4</span></div>

      </div>

  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 76.5;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d = 0) => Number(V[k]) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, t);
    const head = (id, prev, t) => { if (prev) fade(prev, t, 1, 0); ft(id, { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, t + (prev ? 0.2 : 0)); };
    let cur = 0;
    const hi = (k, t) => { if (cur) fade(`#s02-h${cur}`, t, 1, 0); if (k) fade(`#s02-h${k}`, t, 0, 1); cur = k; };
    let note = null;
    const say = (id, t) => { if (note) fade(note, t, 1, 0); fade(id, t + 0.15, 0, 1); note = id; };
    let cnt = 0;
    const count = (k, t) => { if (cnt) fade(`#s02-c${cnt}`, t, 1, 0); fade(`#s02-c${k}`, t + 0.1, 0, 1); cnt = k; };
    const R = (i) => `#s02-r${i}`;

    // ── 2장 직원 표와 읽는 순서 ──
    // 7 저장된 순서: 지영 300, 민수 400, 수진 250이 앞의 세 명, 현우 500은 네 번째
    head("#s02-ha", null, at(0, 0));
    ft("#s02-code", { opacity: 0, y: 16 }, { opacity: 0.4, y: 0 }, at(0, 0.2));
    ft("#s02-tb", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    [0, 1, 2, 3, 4, 5, 6].forEach((i) => ft(R(i), { opacity: 0, y: 8 }, { opacity: 1, y: 0 }, at(0, 0.7 + i * 0.12)));
    count(1, at(0, 1.8));
    fade("#s02-bd1", X("b1", -0.1), 0, 1);
    fade("#s02-bd1", X("b2", -0.2), 1, 0);
    fade("#s02-bd2", X("b2", -0.1), 0, 1);
    // 8 ORDER BY가 없으면 순서는 정해져 있지 않지만, 저장된 순서대로 읽는다고 가정
    ft("#s02-note", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(1, 0.2));
    say("#s02-na", at(1, 0.2));
    fade("#s02-na2", at(1, 3.8), 0, 1);
    // 9 급여 순: 현우 500, 동훈 450, 민수 · 예린 공동 3등
    fade("#s02-bd2", at(2, 0), 1, 0);
    stamp("#s02-k1", X("k1", 0));
    stamp("#s02-k2", X("k2", 0));
    stamp(["#s02-k3a", "#s02-k3b"], X("k3", 0));

    // ── 3장 ROWNUM이 붙는 순간 ──
    // 10 ROWNUM은 조회하면서 1부터 차례로 붙이는 번호
    head("#s02-hb", "#s02-ha", at(3, 0));
    fade(["#s02-k1", "#s02-k2", "#s02-k3a", "#s02-k3b"], at(3, 0.1), 1, 0);
    fade("#s02-code", at(3, 0.2), 0.4, 1);
    fade("#s02-na", at(3, 0.2), 1, 0);
    note = null;
    fade("#s02-rnh", at(3, 1.2), 0, 1);
    // 11 번호를 붙여 보고, WHERE를 통과해야 다음 번호로
    hi(3, at(4, 0.2));
    say("#s02-nb", at(4, 0.3));
    // 12 WHERE 단계 — 맨 마지막 ORDER BY보다 한참 먼저(처리 순번)
    [["#s02-o2", 0], ["#s02-o3", 0.35], ["#s02-o1", 0.7]].forEach(([o, d]) => stamp(o, at(5, 0.2 + d)));
    hi(4, X("ob", -0.1));
    stamp("#s02-o4", X("ob", 0));
    hi(3, at(6, 0));
    // 13 지영 1번, 민수 2번, 수진 3번 → 모두 통과
    [["#s02-u0", "n1"], ["#s02-u1", "n2"], ["#s02-u2", "n3"]].forEach(([u, k]) => stamp(u, X(k, -0.05)));
    ["#s02-m0", "#s02-m1", "#s02-m2"].forEach((m, j) => fade(m, X("ps", j * 0.15), 0, 1));
    // 14 현우는 4번 → 3 이하가 아니라 버림
    stamp("#s02-u3", X("f4", -0.05));
    fade("#s02-m3", X("dr", 0), 0, 1);
    fade(R(3), X("dr", 0.5), 1, 0.3);
    // 15 뒤의 행들도 계속 4번 → 버림, 처음 읽은 세 행만
    [4, 5, 6].forEach((i, j) => {
      const t = at(8, 0.3 + j * 0.55);
      stamp(`#s02-u${i}`, t);
      fade(`#s02-m${i}`, t + 0.3, 0, 1);
      fade(R(i), t + 0.7, 1, 0.3);
    });
    count(2, X("r3", 0));
    say("#s02-nc", X("r3", 0.1));

    // ── 4장 정렬은 그다음 ──
    // 16 ORDER BY는 세 행만 남은 뒤 정렬 → 세 행 안에서 순서만 바뀜
    head("#s02-hc", "#s02-hb", at(9, 0));
    hi(4, at(9, 0.2));
    fade(["#s02-m0", "#s02-m1", "#s02-m2"], at(9, 0.4), 1, 0);
    // 지영(1번)과 민수(2번) 자리 바꿈: 움직이는 동안 흐리게(겹쳐 보이지 않게)
    const t0 = X("so", 0);
    fade([R(0), R(1)], t0, 1, 0.15);
    ft(R(0), { y: 0 }, { y: 64, duration: 0.5 * S, ease: "power2.inOut" }, t0 + 0.25);
    ft(R(1), { y: 0 }, { y: -64, duration: 0.5 * S, ease: "power2.inOut" }, t0 + 0.25);
    fade([R(0), R(1)], t0 + 0.25 + 0.5 * S, 0.15, 1);
    // 17 결과는 민수 400, 지영 300, 수진 250
    fade("#s02-bd1", at(10, 0.2), 0, 1);
    // 18 상위 3명이 아니라 먼저 읽힌 세 명을 정렬
    say("#s02-nd", at(11, 0.2));
    // 19 첫 번째 함정
    say("#s02-ne", at(12, 0));
    hi(0, at(12, 0));
    if (String(V.exit) !== "false") ft("#s02-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s02"] = tl;
  </script>
