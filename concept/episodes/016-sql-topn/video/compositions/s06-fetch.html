    const R = (i) => `#s06-r${i}`;

    fade([R(3), R(4), R(5), R(6)], X("f3", 0.2), 1, 0.3);
    count(1, X("f3", 0.3));
    // 38 ORDER BY 다음에 처리 → 정렬이 먼저

    ft("#s06-note", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, X("ob", 0.2));
