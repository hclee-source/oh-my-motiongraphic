  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 39;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d = 0) => Number(V[k]) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, t);
    let note = null;
    const say = (id, t) => { if (note) fade(note, t, 1, 0); fade(id, t + 0.15, 0, 1); note = id; };
    const R = (i) => `#s04-r${i}`;
    const ALL = [0, 1, 2, 3, 4, 5, 6].map(R);
    // 저장된 순서 → 급여 순 자리(지영 6번째, 민수 3번째, 수진 7번째, 현우 1번째, 예린 4번째, 동훈 2번째, 태호 5번째)
    const POS = [5, 2, 6, 0, 3, 1, 4];

    // 27 정렬을 먼저 끝내고 번호를 붙이면 된다
    ft("#s04-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s04-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.2));
    ft("#s04-tb", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.4));
    ft("#s04-note", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(0, 1.0));
    say("#s04-na", at(0, 1.0));
    // 28 정렬하는 SELECT는 괄호 안에, 바깥 WHERE에서 ROWNUM으로 자른다
    fade("#s04-bk", X("in", -0.1), 0, 1);
    fade("#s04-bk", X("out", -0.1), 1, 0);
    fade("#s04-h6", X("out", 0), 0, 1);
    // 29 괄호 안의 SELECT = 인라인 뷰, 안쪽에서 정렬 → 바깥에서 거르기
    fade("#s04-h6", X("iv", -0.3), 1, 0);
    fade("#s04-bk", X("iv", -0.2), 0, 1);
    fade("#s04-iv", X("iv", 0), 0, 1);
    say("#s04-nb", X("iv", 0.6));
    // 30 안쪽에서 급여 순으로 정렬 → 바깥에서 1번, 2번, 3번(움직이는 동안 흐리게)
    const t0 = at(3, 0.2);
    fade(ALL, t0, 1, 0.15);
    ALL.forEach((r, i) => ft(r, { y: 0 }, { y: (POS[i] - i) * 64, duration: 0.6 * S, ease: "power2.inOut" }, t0 + 0.25));
    fade(ALL, t0 + 0.25 + 0.6 * S, 0.15, 1);
    fade("#s04-bk", t0 + 1.6, 1, 0);
    fade("#s04-h6", t0 + 1.6, 0, 1);
    [["#s04-n1", "u1"], ["#s04-n2", "u2"], ["#s04-n3", "u3"]].forEach(([n, k]) => stamp(n, X(k, -0.05)));
    // 31 결과는 현우 500, 동훈 450, 400 한 명 → 3행
    fade([R(4), R(6), R(0), R(2)], at(4, 0.2), 1, 0.3);
    fade("#s04-bd", at(4, 0.4), 0, 1);
    fade("#s04-cnt", at(4, 0.6), 0, 1);
    // 32 민수와 예린은 둘 다 400 → 누가 3번일지 정해지지 않음
    fade(R(4), at(5, 0.2), 0.3, 0.75);
    ft("#s04-tie", { opacity: 0, x: 12 }, { opacity: 1, x: 0 }, at(5, 0.4));
    if (String(V.exit) !== "false") ft("#s04-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s04"] = tl;
  </script>
