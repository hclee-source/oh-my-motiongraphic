<!doctype html>
<html
  lang="ko"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"배경","default":"#F1F2F5"},
    {"id":"color-card","type":"color","label":"카드","default":"#FFFFFF"},
    {"id":"color-line","type":"color","label":"카드 테두리","default":"#E3E5EA"},
    {"id":"color-hair","type":"color","label":"가는 선","default":"#D3D6DD"},
    {"id":"color-dot","type":"color","label":"점(보통)","default":"#CDD0D8"},
    {"id":"color-shadow","type":"color","label":"카드 그림자","default":"rgba(20,24,40,0.06)"},
    {"id":"color-ink","type":"color","label":"글자","default":"#18181B"},
    {"id":"color-ink2","type":"color","label":"보조 글자","default":"#71717A"},
    {"id":"color-accent","type":"color","label":"강조색","default":"#6B3FE6"},
    {"id":"color-accent-dark","type":"color","label":"어두운 카드 위 강조색","default":"#A68CFF"},
    {"id":"color-anchor","type":"color","label":"수식 카드","default":"#18181B"},
    {"id":"font-main","type":"string","label":"글꼴","default":"Pretendard"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-4Regular.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-6SemiBold.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-7Bold.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-8ExtraBold.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-9Black.woff2") format("woff2"); font-weight: 900; }
      @font-face { font-family: "GmarketSans"; src: url("assets/fonts/GmarketSansLight.woff") format("woff"); font-weight: 300; }
      @font-face { font-family: "GmarketSans"; src: url("assets/fonts/GmarketSansMedium.woff") format("woff"); font-weight: 500; }
      @font-face { font-family: "GmarketSans"; src: url("assets/fonts/GmarketSansBold.woff") format("woff"); font-weight: 700; }
      @font-face { font-family: "NanumSquareRound"; src: url("assets/fonts/NanumSquareRoundR.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "NanumSquareRound"; src: url("assets/fonts/NanumSquareRoundB.ttf") format("truetype"); font-weight: 700; }
      @font-face { font-family: "NanumSquareRound"; src: url("assets/fonts/NanumSquareRoundEB.ttf") format("truetype"); font-weight: 800; }
      :root {
        --color-ground: #F1F2F5;
        --color-card: #FFFFFF;
        --color-line: #E3E5EA;
        --color-hair: #D3D6DD;
        --color-dot: #CDD0D8;
        --color-shadow: rgba(20,24,40,0.06);
        --color-ink: #18181B;
        --color-ink2: #71717A;
        --color-accent: #6B3FE6;
        --color-accent-dark: #A68CFF;
        --color-anchor: #18181B;
        --font-main: "Pretendard";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground); }
      #root { position: relative; width: 100%; height: 100%; }
      #bg { position: absolute; inset: 0; background: var(--color-ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1920" data-height="1080">
      <div id="bg"></div>
      <div id="s02" data-composition-id="s02" data-composition-src="compositions/s02-matrix.html"
        data-start="0" data-duration="6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="s03" data-composition-id="s03" data-composition-src="compositions/s03-dots.html"
        data-start="6" data-duration="6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="s06" data-composition-id="s06" data-composition-src="compositions/s06-calc.html"
        data-start="12" data-duration="6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="18" data-track-index="2" data-track-kind="captions"
        data-width="1920" data-height="1080" style="z-index: 2"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
