<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #s04-card { top: 262px; height: 584px; padding: 48px 52px; }
    .s04-frac { margin-top: 34px; display: grid; grid-template-columns: auto auto; column-gap: 28px; align-items: center; justify-content: start; }
    .s04-num, .s04-den { font-size: 64px; font-weight: 800; text-align: center; white-space: nowrap; }
    .s04-line { height: 5px; border-radius: 3px; background: #FFFFFF; margin: 10px 0; transform: scaleX(0); transform-origin: left center; }
    .s04-tag { font-size: 28px; font-weight: 700; color: #A1A1AA; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s04" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.5,3,6,9,13]"},{"id":"dur","type":"number","label":"장면 길이","default":20},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":false},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s04-all">
      <div id="s04-head" class="x-head">정밀도</div>
      <div class="x-mx x-hide" id="s04-mx">
        <div></div>
        <div class="x-lab x-pred">예측</div>
        <div class="x-lab x-act">실제</div>
        <div class="x-h x-ch"><span class="x-wrap">양성<span class="x-ov" id="s04-colacc">양성</span></span></div>
        <div class="x-h x-ch">음성</div>
        <div class="x-h x-rh">양성</div>
        <div class="x-cell x-card" id="s04-tp"><div class="x-hl" id="s04-tp-hl"></div><div class="x-code">TP</div><div class="x-kn">참 양성</div></div>
        <div class="x-cell x-card" id="s04-fn"><div class="x-hl"></div><div class="x-code">FN</div><div class="x-kn">거짓 음성</div></div>
        <div class="x-h x-rh">음성</div>
        <div class="x-cell x-card" id="s04-fp"><div class="x-hl" id="s04-fp-hl"></div><div class="x-code">FP</div><div class="x-kn">거짓 양성</div></div>
        <div class="x-cell x-card" id="s04-tn"><div class="x-hl"></div><div class="x-code">TN</div><div class="x-kn">참 음성</div></div>
      </div>
      <div id="s04-card" class="x-side x-dark x-hide">
        <div class="x-fname">정밀도</div>
        <div class="s04-frac">
          <div>
            <div class="s04-num x-hide" id="s04-num">TP</div>
            <div class="s04-line" id="s04-line"></div>
            <div class="s04-den x-hide" id="s04-den">TP + FP</div>
          </div>
          <div>
            <div class="s04-tag x-hide" id="s04-tnum">분자</div>
            <div style="height: 34px"></div>
            <div class="s04-tag x-hide" id="s04-tden">분모</div>
          </div>
        </div>
        <div class="x-fmean x-hide" id="s04-mean">‘양성’ 판정을 얼마나 믿을까</div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 20;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);

    // 앞 장(점 격자)이 사라진 자리에 2장의 표가 그대로 돌아온다
    fade("#s04-mx", 0.05, 0, 1);
    // 24 첫 번째는 정밀도
    ft("#s04-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    // 25 양성이라고 말한 것 가운데 — 예측 양성 열
    ft("#s04-card", { opacity: 0, x: 24 }, { opacity: 1, x: 0 }, at(1, 0.3));
    fade("#s04-tp-hl, #s04-fp-hl, #s04-colacc", at(1, 1.0), 0, 1);
    // 26 그 열만 본다
    fade("#s04-fn, #s04-tn", at(2, 0.3), 1, 0.38);
    // 27 분모 TP+FP, 분자 TP
    tl.fromTo("#s04-line", { scaleX: 0 }, { scaleX: 1, duration: 0.4 * S, ease: "power3.inOut", immediateRender: false }, at(3, 0.2));
    fade("#s04-den, #s04-tden", at(3, 0.6), 0, 1);
    fade("#s04-num, #s04-tnum", at(3, 2.4), 0, 1);
    // 28 얼마나 믿을 만한가
    ft("#s04-mean", { opacity: 0, y: 10 }, { opacity: 1, y: 0 }, at(4, 0.4));
    if (String(V.exit) !== "false") ft("#s04-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s04"] = tl;
  </script>
</template>
