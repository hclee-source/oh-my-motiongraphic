<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    /* 5장 끝 모습(재현율 카드 + 작은 정밀도 카드) */
    #s06-rcard { top: 262px; height: 420px; padding: 40px 52px; }
    #s06-small { top: 702px; height: 144px; padding: 24px 40px; }
    .s06-frac { margin-top: 22px; display: inline-block; }
    .s06-fn { font-size: 56px; font-weight: 800; text-align: center; white-space: nowrap; }
    .s06-fl { height: 5px; border-radius: 3px; background: #FFFFFF; margin: 8px 0; width: 300px; }
    .s06-sname { font-size: 32px; font-weight: 800; }
    .s06-sdef { margin-top: 10px; font-size: 34px; font-weight: 700; color: var(--color-ink2, #71717A); }
    .s06-base { font-size: 28px; font-weight: 700; margin-left: 14px; }
    .s06-ex { margin-top: 14px; font-size: 28px; font-weight: 600; color: #A1A1AA; }
    /* 계산 카드 */
    #s06-calc { top: 262px; height: 584px; padding: 40px 48px; }
    .s06-row { position: relative; height: 160px; border-bottom: 2px solid #2A2A2E; display: grid;
      grid-template-columns: 1fr auto; align-items: center; }
    .s06-row:last-child { border-bottom: 0; }
    .s06-rl { font-size: 40px; font-weight: 800; }
    .s06-rf { margin-top: 8px; font-size: 30px; font-weight: 600; color: #A1A1AA; }
    .s06-rv { font-size: 84px; font-weight: 900; letter-spacing: -0.02em; color: #FFFFFF; }
    .s06-sw { position: relative; display: inline-block; }
    .s06-sw > span:last-child { position: absolute; left: 0; top: 0; white-space: nowrap; opacity: 0; }
    #s06-subB { color: var(--color-ink2, #71717A); }
    /* 큰 숫자를 아래로 내려 왼쪽 위 이름표(TP 등)와 떼어 놓는다 */
    #s06-all .x-num { padding-top: 44px; }
  </style>
  <div id="root" data-composition-id="s06" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.5,3,6,10,13,17,20,23,27]"},{"id":"dur","type":"number","label":"장면 길이","default":43},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s06-all">
      <div id="s06-head1" class="x-head" style="opacity: 1">재현율</div>
      <div id="s06-head2" class="x-head">숫자로 계산해 보기</div>
      <div class="x-sub" id="s06-sub"><span id="s06-subA">메일 100통 · 실제 스팸 20통 · 정상 80통</span><span id="s06-subB" class="x-hide"> · 걸러 낸 25통</span></div>

      <div class="x-mx">
        <div></div>
        <div class="x-lab x-pred">예측</div>
        <div class="x-lab x-act">실제</div>
        <div class="x-h x-ch"><span class="x-wrap"><span class="s06-sw" data-layout-allow-overlap><span class="s06-a">양성</span><span class="s06-b">스팸</span></span><span class="x-ov" id="s06-colacc">스팸</span></span></div>
        <div class="x-h x-ch"><span class="s06-sw" data-layout-allow-overlap><span class="s06-a">음성</span><span class="s06-b">정상</span></span></div>
        <div class="x-h x-rh"><span class="x-wrap"><span class="s06-sw" data-layout-allow-overlap><span class="s06-a">양성</span><span class="s06-b">스팸</span></span><span class="x-ov" id="s06-rowacc" style="opacity: 1">양성</span></span></div>
        <div class="x-cell x-card" id="s06-tp"><div class="x-hl" id="s06-tp-hl" style="opacity: 1"></div>
          <div class="x-code s06-big">TP</div><div class="x-kn s06-big">참 양성</div><div class="x-corner">TP</div><div class="x-num" id="s06-tp-n">15</div></div>
        <div class="x-cell x-card" id="s06-fn"><div class="x-hl" id="s06-fn-hl" style="opacity: 1"></div>
          <div class="x-code s06-big">FN</div><div class="x-kn s06-big">거짓 음성</div><div class="x-corner">FN</div><div class="x-num" id="s06-fn-n">5</div></div>
        <div class="x-h x-rh"><span class="s06-sw" data-layout-allow-overlap><span class="s06-a">음성</span><span class="s06-b">정상</span></span></div>
        <div class="x-cell x-card" id="s06-fp" style="opacity: 0.38"><div class="x-hl" id="s06-fp-hl"></div>
          <div class="x-code s06-big">FP</div><div class="x-kn s06-big">거짓 양성</div><div class="x-corner">FP</div><div class="x-num" id="s06-fp-n">10</div></div>
        <div class="x-cell x-card" id="s06-tn" style="opacity: 0.38"><div class="x-hl" id="s06-tn-hl"></div>
          <div class="x-code s06-big">TN</div><div class="x-kn s06-big">참 음성</div><div class="x-corner">TN</div><div class="x-num" id="s06-tn-n">70</div></div>
      </div>

      <div id="s06-rcard" class="x-side x-dark">
        <div class="x-fname">재현율<span class="s06-base x-accd">실제 기준 · 행</span></div>
        <div class="s06-frac"><div class="s06-fn">TP</div><div class="s06-fl"></div><div class="s06-fn">TP + FN</div></div>
        <div class="x-fmean" style="margin-top: 14px">진짜 양성을 빠짐없이 찾았나</div>
        <div class="s06-ex">모두 ‘정상’ 모델 → 0 ÷ 10 = 0</div>
      </div>
      <div id="s06-small" class="x-side x-card">
        <div class="s06-sname">정밀도<span class="s06-base x-acc">예측 기준 · 열</span></div>
        <div class="s06-sdef">TP ÷ (TP + FP)</div>
      </div>

      <div id="s06-calc" class="x-side x-dark x-hide">
        <div class="s06-row x-hide" id="s06-r1"><div><div class="s06-rl">정밀도</div><div class="s06-rf">15 ÷ (15 + 10)</div></div><div class="s06-rv" id="s06-v1">0.0</div></div>
        <div class="s06-row x-hide" id="s06-r2"><div><div class="s06-rl">재현율</div><div class="s06-rf">15 ÷ (15 + 5)</div></div><div class="s06-rv" id="s06-v2">0.00</div></div>
        <div class="s06-row x-hide" id="s06-r3"><div><div class="s06-rl">정확도</div><div class="s06-rf">(15 + 70) ÷ 100</div></div><div class="s06-rv" id="s06-v3">0.00</div></div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 43;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const count = (el, t, a, b, d, fmt) => { const o = { v: a }; tl.fromTo(o, { v: a }, { v: b, duration: d * S, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t); };
    const ACCD = "#A68CFF";

    // 36 숫자로 계산 — 5장의 강조와 카드가 걷히고 제목이 바뀐다
    fade("#s06-head1", at(0, 0), 1, 0);
    ft("#s06-head2", { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, at(0, 0.15));
    fade("#s06-tp-hl, #s06-fn-hl, #s06-rowacc", at(0, 0.2), 1, 0);
    fade("#s06-fp, #s06-tn", at(0, 0.2), 0.38, 1);
    ft("#s06-rcard, #s06-small", { opacity: 1, x: 0 }, { opacity: 0, x: 60, ease: "power2.in" }, at(0, 0.2));
    // 37 메일 100통 — 머리글이 양성/음성에서 스팸/정상으로
    ft("#s06-sub", { opacity: 0, y: 8 }, { opacity: 1, y: 0 }, at(1, 0.3));
    fade(".s06-a", at(1, 1.6), 1, 0);
    fade(".s06-b", at(1, 1.6), 0, 1);
    // 38 걸러 낸 25통, 그중 진짜 15통
    fade("#s06-subB", at(2, 0.4), 0, 1);
    // 39 TP 15, FP 10 — 이름은 모서리로, 숫자가 들어온다
    fade(".s06-big", at(3, 0.2), 1, 0);
    fade(".x-corner", at(3, 0.3), 0, 1);
    ft("#s06-tp-n", { opacity: 0, y: -20 }, { opacity: 1, y: 0, ease: "back.out(1.6)" }, at(3, 0.9));
    ft("#s06-fp-n", { opacity: 0, y: -20 }, { opacity: 1, y: 0, ease: "back.out(1.6)" }, at(3, 1.9));
    // 40 FN 5, TN 70
    ft("#s06-fn-n", { opacity: 0, y: -20 }, { opacity: 1, y: 0, ease: "back.out(1.6)" }, at(4, 2.6));
    ft("#s06-tn-n", { opacity: 0, y: -20 }, { opacity: 1, y: 0, ease: "back.out(1.6)" }, at(4, 3.6));
    // 41 정밀도 = 예측 스팸 열
    fade("#s06-tp-hl, #s06-fp-hl, #s06-colacc", at(5, 0.1), 0, 1);
    fade("#s06-fn, #s06-tn", at(5, 0.1), 1, 0.38);
    ft("#s06-calc", { opacity: 0, x: 24 }, { opacity: 1, x: 0 }, at(5, 0.1));
    fade("#s06-r1", at(5, 0.5), 0, 1);
    count(document.getElementById("s06-v1"), at(5, 1.8), 0, 0.6, 0.7, v => v.toFixed(1));
    ft("#s06-v1", { color: "#FFFFFF" }, { color: ACCD }, at(5, 1.8));
    // 42 재현율 = 실제 스팸 행
    fade("#s06-fp-hl, #s06-colacc", at(6, 0.1), 1, 0);
    fade("#s06-fp", at(6, 0.1), 1, 0.38);
    fade("#s06-fn", at(6, 0.1), 0.38, 1);
    fade("#s06-fn-hl", at(6, 0.1), 0, 1);
    ft("#s06-v1", { color: ACCD }, { color: "#FFFFFF" }, at(6, 0.1));
    fade("#s06-r2", at(6, 0.4), 0, 1);
    count(document.getElementById("s06-v2"), at(6, 1.8), 0, 0.75, 0.7, v => v.toFixed(2));
    ft("#s06-v2", { color: "#FFFFFF" }, { color: ACCD }, at(6, 1.8));
    // 43 정확도 = 맞힌 두 칸
    fade("#s06-fn-hl", at(7, 0.1), 1, 0);
    fade("#s06-fn", at(7, 0.1), 1, 0.38);
    fade("#s06-tn", at(7, 0.1), 0.38, 1);
    fade("#s06-tn-hl", at(7, 0.1), 0, 1);
    ft("#s06-v2", { color: ACCD }, { color: "#FFFFFF" }, at(7, 0.1));
    fade("#s06-r3", at(7, 0.4), 0, 1);
    count(document.getElementById("s06-v3"), at(7, 2.4), 0, 0.85, 0.7, v => v.toFixed(2));
    ft("#s06-v3", { color: "#FFFFFF" }, { color: ACCD }, at(7, 2.4));
    // 44 같은 모델, 다른 평가 — 세 숫자를 한꺼번에
    fade("#s06-tp-hl, #s06-tn-hl", at(8, 0.2), 1, 0);
    fade("#s06-fn, #s06-fp", at(8, 0.2), 0.38, 1);
    ft("#s06-v1, #s06-v2", { color: "#FFFFFF" }, { color: ACCD }, at(8, 0.6));
    if (String(V.exit) !== "false") ft("#s06-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s06"] = tl;
  </script>
</template>
