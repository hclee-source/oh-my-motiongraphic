<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .s01-box { position: absolute; top: 250px; width: 700px; height: 440px; padding: 44px 52px; box-sizing: border-box; }
    #s01-a { left: 192px; }
    #s01-b { left: 1028px; }
    .s01-cap { font-size: 32px; font-weight: 700; color: var(--color-ink2, #71717A); }
    .s01-lab { margin-top: 8px; font-size: 44px; font-weight: 800; }
    .s01-big { margin-top: 18px; font-size: 200px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
    #s01-ring { position: absolute; inset: -2px; border-radius: 28px; border: 4px solid var(--color-accent, #6B3FE6); opacity: 0; }
    .s01-word { position: absolute; top: 736px; font-size: 96px; font-weight: 900; letter-spacing: -0.015em; }
    #s01-w1 { left: 192px; }
    #s01-w2 { left: 1028px; }
    .s01-ul { position: absolute; top: 852px; height: 10px; border-radius: 5px; background: var(--color-accent, #6B3FE6);
      transform-origin: left center; transform: scaleX(0); }
    #s01-u1 { left: 192px; width: 300px; }
    #s01-u2 { left: 1028px; width: 300px; }
  </style>
  <div id="root" data-composition-id="s01" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0,3,6,8,12]"},{"id":"dur","type":"number","label":"장면 길이","default":21},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s01-all">
      <div id="s01-a" class="s01-box x-card x-hide">
        <div class="s01-cap">질병 진단 모델</div>
        <div class="s01-lab">정확도</div>
        <div class="s01-big" id="s01-acc">0%</div>
      </div>
      <div id="s01-b" class="s01-box x-card x-hide">
        <div id="s01-ring"></div>
        <div class="s01-cap">같은 모델이</div>
        <div class="s01-lab">찾아낸 환자</div>
        <div class="s01-big x-acc x-hide" id="s01-zero">0명</div>
      </div>
      <div class="s01-word x-hide" id="s01-w1">정밀도</div>
      <div class="s01-word x-hide" id="s01-w2">재현율</div>
      <div class="s01-ul" id="s01-u1"></div>
      <div class="s01-ul" id="s01-u2"></div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 21;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, t);
    const count = (el, t, a, b, d, fmt) => { const o = { v: a }; tl.fromTo(o, { v: a }, { v: b, duration: d * S, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t); };

    // 1 정확도 99% 모델
    stamp("#s01-a", at(0, 0.1));
    count(document.getElementById("s01-acc"), at(0, 0.5), 0, 99, 0.8, v => Math.round(v) + "%");
    // 2 환자를 한 명도 못 찾는다
    stamp("#s01-b", at(1, 0.1));
    ft("#s01-zero", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, at(1, 1.3));
    // 3 어떻게? — 모순에 시선
    ft("#s01-ring", { opacity: 0 }, { opacity: 1 }, at(2, 0.1));
    // 4 두 숫자 — 카드는 물러나고 두 낱말이 들어온다
    ft("#s01-a, #s01-b", { y: 0, opacity: 1 }, { y: -40, opacity: 0.35, duration: 0.5 * S, ease: "power2.inOut" }, at(3, 0.2));
    ft("#s01-ring", { opacity: 1 }, { opacity: 0 }, at(3, 0.2));
    ft("#s01-w1", { opacity: 0, y: 24 }, { opacity: 1, y: 0 }, at(3, 1.6));
    tl.fromTo("#s01-u1", { scaleX: 0 }, { scaleX: 1, duration: 0.45 * S, ease: "power3.inOut", immediateRender: false }, at(3, 1.8));
    ft("#s01-w2", { opacity: 0, y: 24 }, { opacity: 1, y: 0 }, at(3, 2.3));
    tl.fromTo("#s01-u2", { scaleX: 0 }, { scaleX: 1, duration: 0.45 * S, ease: "power3.inOut", immediateRender: false }, at(3, 2.5));
    if (String(V.exit) !== "false") ft("#s01-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s01"] = tl;
  </script>
</template>
