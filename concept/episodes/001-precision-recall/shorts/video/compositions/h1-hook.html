<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .h1-box { position: absolute; left: 80px; width: 920px; height: 380px; padding: 44px 52px; }
    #h1-a { top: 330px; }
    #h1-b { top: 750px; }
    .h1-cap { font-size: 38px; font-weight: 700; color: var(--color-ink2, #71717A); }
    .h1-lab { margin-top: 8px; font-size: 54px; font-weight: 800; }
    .h1-big { position: absolute; right: 56px; bottom: 34px; font-size: 190px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
    #h1-ring { position: absolute; inset: -2px; border-radius: 32px; border: 5px solid var(--color-accent, #6B3FE6); opacity: 0; }
    /* 점 1000개 */
    #h1-g { position: absolute; left: 80px; top: 330px; width: 920px; height: 790px; padding: 44px 40px; }
    #h1-gt { font-size: 46px; font-weight: 800; }
    #h1-dots { margin-top: 34px; display: grid; grid-template-columns: repeat(40, 16px); gap: 5px; justify-content: center; }
    #h1-dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--color-dot, #CDD0D8); }
    #h1-dots i.p { background: var(--color-accent, #6B3FE6); }
    #h1-chip { margin-top: 40px; text-align: center; font-size: 46px; font-weight: 800; }
    #h1-chip b { font-weight: 900; color: var(--color-accent, #6B3FE6); }
    /* 두 숫자 */
    #h1-two { position: absolute; left: 0; right: 0; top: 560px; text-align: center; }
    #h1-two > div { width: fit-content; margin-left: auto; margin-right: auto; }
    #h1-two1 { font-size: 64px; font-weight: 800; color: var(--color-ink2, #71717A); }
    #h1-two2 { margin-top: 18px; font-size: 120px; font-weight: 900; letter-spacing: -0.02em; }
  </style>
  <div id="root" data-composition-id="h1" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0,5.06,11.51]"},{"id":"dur","type":"number","label":"장면 길이","default":16.35},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h1-all">
      <!-- 첫 화면부터 보이는 카드(쇼츠 첫 장면) -->
      <div id="h1-a" class="h1-box x-card">
        <div class="h1-cap">질병 진단 모델</div>
        <div class="h1-lab">정확도</div>
        <div class="h1-big">99%</div>
      </div>
      <div id="h1-b" class="h1-box x-card x-hide">
        <div id="h1-ring"></div>
        <div class="h1-cap">같은 모델이</div>
        <div class="h1-lab">찾아낸 환자</div>
        <div class="h1-big x-acc x-hide" id="h1-zero">0명</div>
      </div>

      <div id="h1-g" class="x-card x-hide">
        <div id="h1-gt">1000명 중 <span class="x-acc">환자 10명</span></div>
        <div id="h1-dots"></div>
        <div id="h1-chip" class="x-hide">모두 ‘정상’이라고 답하면 <span id="h1-chip2" class="x-hide">→ 정확도 <b>99%</b></span></div>
      </div>

      <div id="h1-two">
        <div id="h1-two1" class="x-hide">양성만 따로 보는</div>
        <div id="h1-two2" class="x-hide">두 숫자</div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 16.35;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, t);

    // 점 1000개(40×25), 환자 10명 자리는 고정
    const PAT = [37, 118, 203, 286, 391, 455, 560, 634, 772, 905];
    const dots = document.getElementById("h1-dots");
    for (let i = 0; i < 1000; i++) {
      const d = document.createElement("i");
      if (PAT.includes(i)) d.className = "p";
      dots.appendChild(d);
    }

    // 1 정확도 99%인데 환자는 한 명도 못 찾는다
    stamp("#h1-b", at(0, 1.6));
    ft("#h1-zero", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, at(0, 2.5));
    ft("#h1-ring", { opacity: 0 }, { opacity: 1 }, at(0, 3.6));
    // 2 1000명 중 환자 10명, 모두 정상이라고 답하면 99%
    ft("#h1-a, #h1-b", { opacity: 1, y: 0 }, { opacity: 0, y: -40, duration: 0.35 * S, ease: "power2.in" }, at(1, 0));
    ft("#h1-g", { opacity: 0, y: 30 }, { opacity: 1, y: 0 }, at(1, 0.3));
    ft("#h1-dots i.p", { scale: 1 }, { scale: 1.6, duration: 0.25 * S, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.04 }, at(1, 1.3));
    ft("#h1-chip", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(1, 2.5));
    ft("#h1-chip2", { opacity: 0 }, { opacity: 1 }, at(1, 4.3));
    // 3 양성만 따로 보는 두 숫자 — 위 제목이 강조된다(header.html)
    ft("#h1-g", { opacity: 1, y: 0 }, { opacity: 0, y: -30, duration: 0.35 * S, ease: "power2.in" }, at(2, 0));
    ft("#h1-two1", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(2, 0.3));
    ft("#h1-two2", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, at(2, 1.2));
    if (String(V.exit) !== "false") ft("#h1-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["h1"] = tl;
  </script>
</template>
