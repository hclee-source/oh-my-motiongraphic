<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .h4-row { position: absolute; left: 80px; width: 920px; height: 320px; padding: 0 56px;
      display: grid; grid-template-columns: 300px 1fr; align-items: center; }
    #h4-p { top: 450px; }
    #h4-r { top: 810px; }
    .h4-name { font-size: 84px; font-weight: 900; letter-spacing: -0.01em; color: var(--color-accent, #6B3FE6); }
    .h4-base { font-size: 56px; font-weight: 800; }
    .h4-f { margin-top: 14px; font-size: 44px; font-weight: 700; color: var(--color-ink2, #71717A); white-space: nowrap; }
    .h4-den { padding-bottom: 4px; }
    .h4-u { position: absolute; left: 0; right: 0; bottom: -4px; height: 5px; border-radius: 3px; background: var(--color-accent, #6B3FE6);
      transform: scaleX(0); transform-origin: left center; }
  </style>
  <div id="root" data-composition-id="h4" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,5.9]"},{"id":"dur","type":"number","label":"장면 길이","default":9.29},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":false},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h4-all">
      <div id="h4-p" class="h4-row x-card x-hide">
        <div class="h4-name">정밀도</div>
        <div>
          <div class="h4-base">예측 기준</div>
          <div class="h4-f">TP ÷ <span class="x-wrap h4-den">(TP + FP)<span class="x-ov h4-ov">(TP + FP)</span><span class="h4-u"></span></span></div>
        </div>
      </div>
      <div id="h4-r" class="h4-row x-card x-hide">
        <div class="h4-name">재현율</div>
        <div>
          <div class="h4-base">실제 기준</div>
          <div class="h4-f">TP ÷ <span class="x-wrap h4-den">(TP + FN)<span class="x-ov h4-ov">(TP + FN)</span><span class="h4-u"></span></span></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 9.29;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);

    // 12 정밀도는 예측 기준, 재현율은 실제 기준
    ft("#h4-p", { opacity: 0, y: 24 }, { opacity: 1, y: 0 }, at(0, 1.2));
    ft("#h4-r", { opacity: 0, y: 24 }, { opacity: 1, y: 0 }, at(0, 3.2));
    // 13 분모만 찾으면 — 두 분모가 강조색으로
    ft(".h4-ov", { opacity: 0 }, { opacity: 1 }, at(1, 0.2));
    tl.fromTo(".h4-u", { scaleX: 0 }, { scaleX: 1, duration: 0.4 * S, ease: "power3.inOut", immediateRender: false, stagger: 0.15 }, at(1, 0.2));
    if (String(V.exit) !== "false") ft("#h4-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["h4"] = tl;
  </script>
</template>
