<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .h2-in { opacity: 0; }
    /* 아래 수식 카드 두 장: 정밀도는 가운데서 시작해 재현율이 나올 때 왼쪽으로 비킨다 */
    .h2-fc { position: absolute; top: 912px; width: 450px; height: 350px; padding: 34px 30px; text-align: center; }
    #h2-pc { left: 315px; }
    #h2-rc { left: 550px; }
    .h2-name { font-size: 46px; font-weight: 800; }
    .h2-frac { margin: 16px auto 0; display: inline-block; }
    .h2-num, .h2-den { font-size: 60px; font-weight: 800; white-space: nowrap; }
    .h2-line { height: 5px; border-radius: 3px; background: #FFFFFF; margin: 10px 0; transform: scaleX(0); transform-origin: left center; }
    .h2-tag { margin-top: 14px; font-size: 36px; font-weight: 800; color: var(--color-accent-dark, #A68CFF); white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="h2" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,5.23,13.16,17.72,22.26,25.92]"},{"id":"dur","type":"number","label":"장면 길이","default":30.06},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h2-all">
      <div class="x-mx">
        <div></div>
        <div class="x-lab x-pred h2-in" id="h2-pred">예측</div>
        <div class="x-lab x-act h2-in" id="h2-act">실제</div>
        <div class="x-h x-ch h2-in h2-chd"><span class="x-wrap">양성<span class="x-ov" id="h2-colacc">양성</span></span></div>
        <div class="x-h x-ch h2-in h2-chd">음성</div>
        <div class="x-h x-rh h2-in h2-rhd"><span class="x-wrap">양성<span class="x-ov" id="h2-rowacc">양성</span></span></div>
        <div class="x-cell x-card h2-in" id="h2-tp"><div class="x-hl"></div><div class="x-code h2-in">TP</div><div class="x-kn h2-in">양성 맞힘</div></div>
        <div class="x-cell x-card h2-in" id="h2-fn"><div class="x-hl"></div><div class="x-code h2-in">FN</div><div class="x-kn h2-in">놓침</div></div>
        <div class="x-h x-rh h2-in h2-rhd">음성</div>
        <div class="x-cell x-card h2-in" id="h2-fp"><div class="x-hl"></div><div class="x-code h2-in">FP</div><div class="x-kn h2-in">잘못 잡음</div></div>
        <div class="x-cell x-card h2-in" id="h2-tn"><div class="x-hl"></div><div class="x-code h2-in">TN</div><div class="x-kn h2-in">음성 맞힘</div></div>
      </div>

      <div id="h2-pc" class="h2-fc x-dark x-hide">
        <div class="h2-name">정밀도</div>
        <div class="h2-frac">
          <div class="h2-num x-hide" id="h2-pn">TP</div>
          <div class="h2-line" id="h2-pl"></div>
          <div class="h2-den x-hide" id="h2-pd">TP + FP</div>
        </div>
        <div class="h2-tag x-hide" id="h2-pt">↑ 예측 양성의 합</div>
      </div>
      <div id="h2-rc" class="h2-fc x-dark x-hide">
        <div class="h2-name">재현율</div>
        <div class="h2-frac">
          <div class="h2-num x-hide" id="h2-rn">TP</div>
          <div class="h2-line" id="h2-rl"></div>
          <div class="h2-den x-hide" id="h2-rd">TP + FN</div>
        </div>
        <div class="h2-tag x-hide" id="h2-rt">↑ 실제 양성의 합</div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 30.06;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t, stagger = 0) => ft(sel, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, ease: "back.out(1.6)", stagger }, t);
    const cell = (id) => `#h2-${id} .x-code, #h2-${id} .x-kn`;
    const hl = (id) => `#h2-${id} .x-hl`;

    // 4 실제와 예측을 양성·음성으로 나누면 네 칸
    fade("#h2-act, .h2-rhd", at(0, 0), 0, 1);
    fade("#h2-pred, .h2-chd", at(0, 0.6), 0, 1);
    stamp("#h2-tp, #h2-fn, #h2-fp, #h2-tn", at(0, 2.6), 0.1);
    // 5 맞히면 TP, 잘못 잡으면 FP, 놓치면 FN
    stamp(cell("tp"), at(1, 1.4));
    fade(hl("tp"), at(1, 1.4), 0, 1);
    stamp(cell("fp"), at(1, 4.0));
    fade(hl("tp"), at(1, 4.0), 1, 0);
    fade(hl("fp"), at(1, 4.0), 0, 1);
    stamp(cell("fn"), at(1, 6.0));
    fade(hl("fp"), at(1, 6.0), 1, 0);
    fade(hl("fn"), at(1, 6.0), 0, 1);
    fade(cell("tn"), at(1, 6.6), 0, 1);
    // 6 정밀도 — 예측 양성 열(TP, FP)
    fade(hl("fn"), at(2, 0.2), 1, 0);
    fade("#h2-fn, #h2-tn", at(2, 0.2), 1, 0.35);
    fade(`${hl("tp")}, ${hl("fp")}, #h2-colacc`, at(2, 0.5), 0, 1);
    ft("#h2-pc", { opacity: 0, y: 24 }, { opacity: 1, y: 0 }, at(2, 0.3));
    tl.fromTo("#h2-pl", { scaleX: 0 }, { scaleX: 1, duration: 0.4 * S, ease: "power3.inOut", immediateRender: false }, at(2, 1.1));
    fade("#h2-pd", at(2, 1.3), 0, 1);
    fade("#h2-pn", at(2, 2.8), 0, 1);
    // 7 분모는 예측 양성의 합
    ft("#h2-pt", { opacity: 0, y: 10 }, { opacity: 1, y: 0 }, at(3, 0.7));
    // 8 재현율 — 강조가 실제 양성 행(TP, FN)으로
    ft("#h2-pc", { x: 0 }, { x: -235, duration: 0.5 * S, ease: "power2.inOut" }, at(4, 0));
    fade(`${hl("fp")}, #h2-colacc`, at(4, 0.6), 1, 0);
    fade("#h2-fp", at(4, 0.6), 1, 0.35);
    fade("#h2-fn", at(4, 0.6), 0.35, 1);
    fade(`${hl("fn")}, #h2-rowacc`, at(4, 0.6), 0, 1);
    ft("#h2-rc", { opacity: 0, y: 24 }, { opacity: 1, y: 0 }, at(4, 0.4));
    tl.fromTo("#h2-rl", { scaleX: 0 }, { scaleX: 1, duration: 0.4 * S, ease: "power3.inOut", immediateRender: false }, at(4, 0.7));
    fade("#h2-rd", at(4, 0.9), 0, 1);
    fade("#h2-rn", at(4, 2.1), 0, 1);
    // 9 분모는 실제 양성의 합
    ft("#h2-rt", { opacity: 0, y: 10 }, { opacity: 1, y: 0 }, at(5, 0.7));
    if (String(V.exit) !== "false") ft("#h2-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["h2"] = tl;
  </script>
</template>
