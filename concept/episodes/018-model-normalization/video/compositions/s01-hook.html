  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 55.94;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);
    const ACC = "#6B3FE6", INK = "#18181B";
    let note = null;
    const say = (id, t) => { if (note) fade(note, t, 1, 0); fade(id, t + 0.15, 0, 1); note = id; };

    // 1 주문 · 상품 · 고객 정보를 테이블 하나에
    ft("#s01-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s01-tb", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    [0, 1, 2, 3, 4].forEach((j) => ft(`#s01-r${j}`, { opacity: 0, y: 8 }, { opacity: 1, y: 0 }, at(0, 0.9 + j * 0.15)));
    // 2 공책을 노트로 — 세 행을 모두
    ft(["#s01-a1", "#s01-a2", "#s01-a3"], { color: INK }, { color: ACC }, at(1, 0.8));
    [1, 2, 3].forEach((k, j) => fade(`#s01-bd${k}`, at(1, 2.2 + j * 0.15), 0, 1));
    // 3 한 행이라도 빠뜨리면 이름이 둘 → 갱신 이상
    fade("#s01-a1", at(2, 0.6), 1, 0);
    fade("#s01-b1", at(2, 0.7), 0, 1);
    fade("#s01-a2", at(2, 1.1), 1, 0);
    fade("#s01-b2", at(2, 1.2), 0, 1);
    fade(["#s01-bd1", "#s01-bd2"], at(2, 2.0), 1, 0);
    stamp("#s01-k1", X("k1", at(2, 3.8)));
    // 4 주문이 없는 새 상품 가위
    fade("#s01-bd3", at(3, 0.1), 1, 0);
    const gw = X("gw", at(3, 1.6));
    fade("#s01-ghost", gw - 0.2, 0, 1);
    ft("#s01-gr", { opacity: 0, x: -16 }, { opacity: 1, x: 0 }, gw);
    stamp("#s01-xw", at(3, 2.6));
    // 5 주문번호를 비울 수 없다 → 삽입 이상
    ft("#s01-em", { scale: 1 }, { scale: 1.12, duration: 0.25 * S, yoyo: true, repeat: 1, ease: "power2.out" }, at(4, 2.0));
    stamp("#s01-k2", X("k2", at(4, 4.6)));
    // 6 3번 주문을 지우면 지우개까지 → 삭제 이상
    fade(["#s01-ghost", "#s01-gr", "#s01-xw"], at(5, 0.1), 1, 0);
    ft(["#s01-o3", "#s01-o4"], { color: INK }, { color: ACC }, at(5, 0.3));
    ft("#s01-er", { color: INK }, { color: ACC }, at(5, 1.6));
    fade(["#s01-r3", "#s01-r4"], X("dl", at(5, 1.0)) + 1.4, 1, 0.12);
    stamp("#s01-k3", X("k3", at(5, 4.2)));
    // 7 왜 이런 일이? — 표는 원래대로, 칩은 흐리게
    fade(["#s01-r3", "#s01-r4"], at(6, 0.1), 0.12, 1);
    ft(["#s01-o3", "#s01-o4", "#s01-er", "#s01-a3"], { color: ACC }, { color: INK }, at(6, 0.1));
    fade(["#s01-b1", "#s01-b2"], at(6, 0.1), 1, 0);
    fade(["#s01-a1", "#s01-a2"], at(6, 0.2), 0, 1);
    ft(["#s01-a1", "#s01-a2"], { color: ACC }, { color: INK }, at(6, 0.1));
    fade(["#s01-k1", "#s01-k2", "#s01-k3"], at(6, 0.4), 1, 0.45);
    say("#s01-n7", at(6, 1.4));
    // 8 주문 · 상품 · 고객, 서로 다른 대상이 한 테이블에
    [["1", "g1", 0.1], ["2", "g2", 0.8], ["3", "g3", 1.5]].forEach(([k, v, d]) => {
      const t = X(v, at(7, d));
      fade(`#s01-gl${k}`, t, 0, 1);
      ft(`#s01-gb${k}`, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1 }, t);
    });
    say("#s01-n8", X("mx", at(7, 4.4)));
    // 9 이상 현상을 없애고 중복을 줄이려고 나누는 일 = 정규화
    say("#s01-n9", at(8, 1.0));
    // 10 제1, 제2, 제3정규형까지 한 단계씩
    say("#s01-n10", at(9, 1.0));
    if (String(V.exit) !== "false") ft("#s01-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s01"] = tl;
  </script>
