        <div class="q-chip q-ng" id="s03-ch" style="left:0">이행 함수 종속</div>
        <div class="s03-n" id="s03-nF"><span>제3정규형 = <span class="x-acc">일반 속성끼리는</span> 종속되지 않음</span></div>
        <div class="s03-n" id="s03-nG"><span>테이블 <span class="x-acc">네 개</span></span></div>
        <div class="s03-n" id="s03-nH"><span>민수 이름 저장: 네 번 → <span class="x-acc">한 번</span></span></div>
        <div class="q-chip q-ok" id="s03-cj" style="left:0">네 테이블을 조인하면 처음 5행 그대로</div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 139;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const X = (k, d) => Number(V[k]) || d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);
    const paint = (sel, t, a, b) => ft(sel, { color: a }, { color: b }, t);
    const ACC = "#6B3FE6", INK = "#18181B", GR = "#71717A";
    let note = null;
    const say = (id, t) => { if (note) fade(note, t, 1, 0); fade(id, t + 0.15, 0, 1); note = id; };
    const burst = (sel, dx, t) => { ft(sel, { x: dx, scale: 0.94 }, { x: 0, scale: 1, duration: 0.8, ease: "power3.out" }, t); ft(sel, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, t); };
    const quick = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, duration: 0.3, ease: "power2.out" }, t);

    // ── 3장: 함수 종속과 결정자 ──
    // 17 테이블을 어디서 나눌지는 함수 종속이 알려 줌
    ft("#s03-h1", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s03-big", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    // 18 한 속성의 값이 정해지면 다른 속성의 값이 하나로
    stamp("#s03-def", at(1, 0.2));
    fade("#s03-dA", at(1, 0.5), 0, 1);
    // 19 결정자 → 종속자
    fade("#s03-dA", at(2, 0.1), 1, 0);
    fade("#s03-dB", at(2, 0.4), 0, 1);
    // 20 상품코드 → 상품명, 단가
    fade("#s03-def", at(3, 0.0), 1, 0);
    fade("#s03-dB", at(3, 0.0), 1, 0);
    stamp("#s03-l1", at(3, 0.5));
    fade("#s03-a1", at(3, 0.5), 0, 1);
    // 21 주문번호 → 고객번호, 고객번호 → 고객이름
    fade("#s03-a1", at(4, 0.0), 1, 0.2);
    stamp("#s03-l2", at(4, 0.2));
    fade("#s03-a2", at(4, 0.2), 0, 1);
    fade("#s03-a2", at(4, 2.2), 1, 0.2);
    stamp("#s03-l3", at(4, 2.4));
    fade("#s03-a3", at(4, 2.4), 0, 1);
    // 22 수량은 주문번호와 상품코드 둘 다
    fade("#s03-a3", at(5, 0.0), 1, 0.2);
    stamp("#s03-l4", at(5, 0.2));
    fade("#s03-a4", at(5, 0.2), 0, 1);
    // 23 핵심 함수 종속은 네 개
    fade("#s03-a4", at(6, 0.2), 1, 0.35);
    fade(["#s03-a1", "#s03-a2", "#s03-a3"], at(6, 0.2), 0.2, 0.35);
    say("#s03-nA", at(6, 0.9));

    // ── 4장: 제2정규형과 부분 함수 종속 ──
    // 24 주식별자가 여러 속성으로 된 테이블에서 따진다
    fade("#s03-h1", at(7, 0), 1, 0);
    ft("#s03-h2", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(7, 0.1));
    fade(["#s03-a1", "#s03-a2", "#s03-a3", "#s03-a4"], at(7, 0.1), 0.35, 0);
    fade(["#s03-gl", "#s03-gb"], at(7, 1.2), 0, 1);
    paint(["#s03-bh0", "#s03-bh1"], at(7, 1.2), GR, ACC);
    // 25 일부에만 종속되면 부분 함수 종속
    say("#s03-cp", X("pf", at(8, 2.8)));
    // 26 상품명·단가는 상품코드에만, 고객번호는 주문번호에만
    fade("#s03-a1", at(9, 0.2), 0, 1);
    fade("#s03-a2", at(9, 0.2), 0.0, 1);
    fade("#s03-g1", at(9, 0.2), 0, 1);
    stamp("#s03-tg1", X("t1", at(9, 1.4)));
    fade("#s03-g2", X("t2", at(9, 3.4)) - 0.2, 0, 1);
    stamp("#s03-tg2", X("t2", at(9, 3.4)));
    // 27 고객이름도 고객번호를 거쳐 주문번호에만
    fade("#s03-a1", at(10, 0.0), 1, 0);
    fade("#s03-g1", at(10, 0.0), 1, 0.3);
    fade("#s03-g2", at(10, 0.0), 1, 0.3);
    fade("#s03-l3a", at(10, 0.3), 1, 0);
    fade("#s03-l3b", at(10, 0.4), 0, 1);
    fade("#s03-a3", at(10, 0.5), 0.2, 1);
    fade("#s03-g3", at(10, 0.6), 0, 1);
    stamp("#s03-tg3", at(10, 1.8));
    // 28 부분 함수 종속을 없애 주식별자 전체에 종속 = 제2정규형
    fade(["#s03-a2", "#s03-a3"], at(11, 0.0), 1, 0);
    fade(["#s03-g1", "#s03-g2", "#s03-g3"], at(11, 0.0), 0.3, 0);
    fade(["#s03-g1", "#s03-g2", "#s03-g3"], at(11, 0.0), 0.3, 0);
    fade("#s03-g4", at(11, 0.8), 0, 1);
    stamp("#s03-tg4", at(11, 1.0));
    say("#s03-nB", at(11, 1.2));
    // 29 상품코드에 딸린 속성은 상품 테이블로, 주문번호에 딸린 속성은 주문 테이블로
    fade(["#s03-l1", "#s03-l2", "#s03-l3", "#s03-l4", "#s03-tg1", "#s03-tg2", "#s03-tg3", "#s03-tg4", "#s03-g4"], at(12, 0.1), 1, 0);
    fade("#s03-bd1", at(12, 0.5), 0, 1);
    fade("#s03-lb1", at(12, 0.6), 0, 1);
    fade("#s03-bd2", at(12, 3.0), 0, 1);
    fade("#s03-lb2", at(12, 3.1), 0, 1);
    // 30 수량은 주문상품 테이블에 남음 — 표가 셋으로 갈라짐
    const sp = at(13, 0.3);
    quick(["#s03-big"], sp, 1, 0);
    burst("#s03-osp", -139, sp + 0.25);
    burst("#s03-prd", -139, sp + 0.35);
    burst("#s03-ord", -139, sp + 0.45);
    paint(".s03-oq", at(13, 1.6), INK, ACC);
    // 31 테이블 세 개, 주문상품 5행, 상품 3행, 주문 3행
    paint(".s03-oq", at(14, 0.1), ACC, INK);
    say("#s03-nC", at(14, 0.4));
    stamp("#s03-ct1", X("cnt1", at(14, 2.6)));
    stamp("#s03-ct2", X("cnt2", at(14, 3.8)));
    stamp("#s03-ct3", X("cnt3", at(14, 5.0)));
    // 32 공책이라는 이름은 한 번만 저장되니 한 행만 고치면 됨
    say("#s03-nC2", at(15, 0.6));
    paint("#s03-pa", at(15, 2.2), INK, ACC);
    fade("#s03-pa", at(15, 2.9), 1, 0);
    fade("#s03-pb", at(15, 3.0), 0, 1);
    ft("#s03-pb", { color: ACC }, { color: ACC }, at(15, 3.0));
    // 33 가위도 상품 테이블에 넣을 수 있고, 3번 주문을 지워도 지우개는 남음
    fade("#s03-pb", at(16, 0.1), 1, 0);
    fade("#s03-pa", at(16, 0.2), 0, 1);
    paint("#s03-pa", at(16, 0.2), ACC, INK);
    fade("#s03-gh", X("gw", at(16, 0.6)) - 0.2, 0, 1);
    ft("#s03-gr", { opacity: 0, x: -12 }, { opacity: 1, x: 0 }, X("gw", at(16, 0.6)));
    stamp("#s03-ck", X("gw", at(16, 0.6)) + 0.9);
    say("#s03-nC3", at(16, 0.8));
    paint([".s03-p3"], X("dl", at(16, 3.4)), INK, ACC);

    // ── 5장: 제3정규형과 이행 함수 종속 ──
    // 34 주문 테이블에는 민수가 아직 두 번
    fade("#s03-h2", at(17, 0), 1, 0);
    ft("#s03-h3", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(17, 0.1));
    fade(["#s03-gh", "#s03-gr", "#s03-ck"], at(17, 0.0), 1, 0);
    paint([".s03-p3"], at(17, 0.0), ACC, INK);
    fade(["#s03-osp", "#s03-prd"], at(17, 0.2), 1, 0.3);
    paint(".s03-ms", X("m2", at(17, 2.0)), INK, ACC);
    say("#s03-nD", at(17, 2.2));
    // 35 지영의 하나뿐인 주문을 지우면 이름도 함께 사라짐
    paint(".s03-ms", at(18, 0.1), ACC, INK);
    fade("#s03-or2", X("jy", at(18, 1.4)), 1, 0.15);
    stamp("#s03-xj", X("jy", at(18, 1.4)) + 1.4);
    say("#s03-nE", at(18, 0.8));
    // 36 주문번호가 고객번호를, 고객번호가 고객이름을 정함
    fade("#s03-or2", at(19, 0.1), 0.15, 1);
    fade("#s03-nE", at(19, 0.1), 1, 0);
    note = null;
    fade("#s03-xj", at(19, 0.1), 1, 0);
    fade("#s03-a5", at(19, 0.8), 0, 1);
    // 37 일반 속성을 거쳐 이어지는 종속 = 이행 함수 종속
    say("#s03-ch", at(20, 2.6));
    // 38 일반 속성끼리는 종속되지 않게 = 제3정규형
    fade("#s03-a5", at(21, 0.2), 1, 0.3);
    say("#s03-nF", at(21, 1.0));
    // 39 고객번호와 고객이름은 고객 테이블로, 주문 테이블에는 고객번호만
    fade("#s03-ob", at(22, 0.3), 0, 1);
    fade("#s03-a5", at(22, 2.2), 0.3, 0);
    const s2 = at(22, 2.8);
    quick("#s03-ord", s2, 1, 0);
    burst("#s03-ord2", 125, s2 + 0.25);
    burst("#s03-cus", 102, s2 + 0.35);
    ft("#s03-osp", { x: 0 }, { x: -109, duration: 0.9, ease: "power2.inOut" }, s2 + 0.25);
    ft("#s03-prd", { x: 0 }, { x: -117, duration: 0.9, ease: "power2.inOut" }, s2 + 0.25);
    // 40 테이블 네 개, 주문 3행 옆에 고객 2행
    say("#s03-nG", at(23, 0.4));
    stamp("#s03-ct4", at(23, 2.6));
    stamp("#s03-ct5", at(23, 4.0));
    // 41 처음에 네 번 저장됐던 민수가 한 번만
    paint("#s03-cm", at(24, 1.8), INK, ACC);
    say("#s03-nH", at(24, 1.0));
    // 42 네 테이블을 다시 조인하면 처음 5행 그대로
    paint("#s03-cm", at(25, 0.1), ACC, INK);
    fade(["#s03-osp", "#s03-prd"], at(25, 0.1), 0.3, 1);
    fade("#s03-jn", at(25, 0.8), 0, 1);
    say("#s03-cj", at(25, 1.4));
    if (String(V.exit) !== "false") ft("#s03-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s03"] = tl;
  </script>
</template>
