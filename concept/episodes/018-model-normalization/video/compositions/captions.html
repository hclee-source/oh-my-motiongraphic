<template>
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; }
    .cap { position: absolute; left: 0; right: 0; bottom: 108px; text-align: center; overflow: visible;
      font-size: 46px; font-weight: 600; line-height: 1.35; letter-spacing: 0; color: var(--color-ink, #18181B); }
    .cap span { display: inline-block; max-width: 1536px; }
  </style>
  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <div id="cap-01a" class="cap clip" data-start="3.600" data-duration="2.550"><span>주문, 상품, 고객 정보를</span></div>
    <div id="cap-01b" class="cap clip" data-start="6.150" data-duration="2.249"><span>테이블 하나에 모두 담았습니다.</span></div>
    <div id="cap-02a" class="cap clip" data-start="8.499" data-duration="1.330"><span>상품명 ‘공책’을 ‘노트’로</span></div>
    <div id="cap-02b" class="cap clip" data-start="9.829" data-duration="2.894"><span>바꾸려면 세 행을 모두 고쳐야 합니다.</span></div>
    <div id="cap-03a" class="cap clip" data-start="12.823" data-duration="2.610"><span>한 행이라도 빠뜨리면 같은 상품에 이름이</span></div>
    <div id="cap-03b" class="cap clip" data-start="15.433" data-duration="3.288"><span>둘이 되는데, 이것이 갱신 이상입니다.</span></div>
    <div id="cap-04a" class="cap clip" data-start="18.820" data-duration="1.470"><span>아직 주문이 없는 새 상품</span></div>
    <div id="cap-04b" class="cap clip" data-start="20.290" data-duration="2.177"><span>‘가위’는 넣을 수조차 없습니다.</span></div>
    <div id="cap-05a" class="cap clip" data-start="22.568" data-duration="2.990"><span>행을 구별하는 식별자의 일부인 주문번호를 비울</span></div>
    <div id="cap-05b" class="cap clip" data-start="25.558" data-duration="3.464"><span>수 없기 때문인데, 이것이 삽입 이상입니다.</span></div>
    <div id="cap-06a" class="cap clip" data-start="29.122" data-duration="2.350"><span>3번 주문을 지우면 지우개 정보까지</span></div>
    <div id="cap-06b" class="cap clip" data-start="31.472" data-duration="3.590"><span>함께 사라지는데, 이것이 삭제 이상입니다.</span></div>
    <div id="cap-07a" class="cap clip" data-start="35.163" data-duration="1.570"><span>테이블 하나에 모았을 뿐인데,</span></div>
    <div id="cap-07b" class="cap clip" data-start="36.733" data-duration="2.522"><span>왜 이런 일이 생길까요?</span></div>
    <div id="cap-08a" class="cap clip" data-start="39.355" data-duration="3.570"><span>주문, 상품, 고객이라는 서로 다른 대상의</span></div>
    <div id="cap-08b" class="cap clip" data-start="42.925" data-duration="2.969"><span>정보가 한 테이블에 섞여 있기 때문입니다.</span></div>
    <div id="cap-09a" class="cap clip" data-start="45.994" data-duration="2.650"><span>이런 이상 현상을 없애고 데이터 중복을</span></div>
    <div id="cap-09b" class="cap clip" data-start="48.644" data-duration="3.240"><span>줄이려고 테이블을 나누는 일이 정규화입니다.</span></div>
    <div id="cap-10a" class="cap clip" data-start="51.983" data-duration="3.210"><span>오늘은 이 테이블을 제1, 제2,</span></div>
    <div id="cap-10b" class="cap clip" data-start="55.193" data-duration="3.950"><span>제3정규형까지 한 단계씩 나눠 보겠습니다.</span></div>
    <div id="cap-11a" class="cap clip" data-start="59.793" data-duration="2.590"><span>이 테이블도 처음엔 주문 한 건이 한 행이라,</span></div>
    <div id="cap-11b" class="cap clip" data-start="62.383" data-duration="4.756"><span>상품 칸에 ‘연필, 공책’처럼 값이 여럿이었습니다.</span></div>
    <div id="cap-12a" class="cap clip" data-start="67.239" data-duration="2.946"><span>제1정규형은 모든 속성이 더 나눌 수 없는</span></div>
    <div id="cap-12b" class="cap clip" data-start="70.185" data-duration="3.196"><span>값 하나, 곧 원자값만 갖는 상태입니다.</span></div>
    <div id="cap-13a" class="cap clip" data-start="73.481" data-duration="2.350"><span>그래서 값이 여럿인 칸을 행으로 펼치면,</span></div>
    <div id="cap-13b" class="cap clip" data-start="75.831" data-duration="2.432"><span>3행이 5행이 됩니다.</span></div>
    <div id="cap-14a" class="cap clip" data-start="78.362" data-duration="2.830"><span>상품 열을 ‘첫째 상품’, ‘둘째 상품’처럼</span></div>
    <div id="cap-14b" class="cap clip" data-start="81.192" data-duration="4.070"><span>옆으로 늘어놓는 반복 그룹도 제1정규형 위반입니다.</span></div>
    <div id="cap-15a" class="cap clip" data-start="85.362" data-duration="1.670"><span>이제 1번 주문이 두 행이라,</span></div>
    <div id="cap-15b" class="cap clip" data-start="87.032" data-duration="3.750"><span>주문번호만으로는 한 행이 정해지지 않습니다.</span></div>
    <div id="cap-16a" class="cap clip" data-start="90.882" data-duration="2.410"><span>주문번호와 상품코드를 함께 알아야 한</span></div>
    <div id="cap-16b" class="cap clip" data-start="93.292" data-duration="3.196"><span>행이 정해지니, 이 둘이 주식별자입니다.</span></div>
    <div id="cap-17a" class="cap clip" data-start="97.138" data-duration="3.484"><span>테이블을 어디서 나눌지는 함수 종속이 알려 줍니다.</span></div>
    <div id="cap-18a" class="cap clip" data-start="100.722" data-duration="2.470"><span>한 속성의 값이 정해지면 다른 속성의</span></div>
    <div id="cap-18b" class="cap clip" data-start="103.192" data-duration="2.322"><span>값이 하나로 정해지는 관계입니다.</span></div>
    <div id="cap-19a" class="cap clip" data-start="105.614" data-duration="1.970"><span>값을 정하는 쪽을 결정자,</span></div>
    <div id="cap-19b" class="cap clip" data-start="107.584" data-duration="4.340"><span>정해지는 쪽을 종속자라고 하고, 화살표로 잇습니다.</span></div>
    <div id="cap-20a" class="cap clip" data-start="112.024" data-duration="3.817"><span>상품코드가 정해지면 상품명과 단가가 정해집니다.</span></div>
    <div id="cap-21a" class="cap clip" data-start="115.941" data-duration="1.790"><span>주문번호는 고객번호를,</span></div>
    <div id="cap-21b" class="cap clip" data-start="117.731" data-duration="2.797"><span>고객번호는 고객이름을 정합니다.</span></div>
    <div id="cap-22a" class="cap clip" data-start="120.628" data-duration="1.930"><span>수량은 주문번호와 상품코드를</span></div>
    <div id="cap-22b" class="cap clip" data-start="122.558" data-duration="2.055"><span>둘 다 알아야 정해집니다.</span></div>
    <div id="cap-23a" class="cap clip" data-start="124.713" data-duration="1.450"><span>이 테이블에서 핵심이 되는</span></div>
    <div id="cap-23b" class="cap clip" data-start="126.163" data-duration="2.700"><span>함수 종속은 이렇게 네 개입니다.</span></div>
    <div id="cap-24a" class="cap clip" data-start="129.513" data-duration="2.150"><span>제2정규형은 주식별자가 여러</span></div>
    <div id="cap-24b" class="cap clip" data-start="131.663" data-duration="2.469"><span>속성으로 된 테이블에서 따집니다.</span></div>
    <div id="cap-25a" class="cap clip" data-start="134.232" data-duration="2.170"><span>일반 속성이 주식별자 전체가 아니라</span></div>
    <div id="cap-25b" class="cap clip" data-start="136.402" data-duration="3.872"><span>일부에만 종속되면, 부분 함수 종속입니다.</span></div>
    <div id="cap-26a" class="cap clip" data-start="140.374" data-duration="2.350"><span>상품명과 단가는 상품코드에만,</span></div>
    <div id="cap-26b" class="cap clip" data-start="142.724" data-duration="3.234"><span>고객번호는 주문번호에만 종속됩니다.</span></div>
    <div id="cap-27a" class="cap clip" data-start="146.059" data-duration="1.790"><span>고객이름도 고객번호를 거쳐,</span></div>
    <div id="cap-27b" class="cap clip" data-start="147.849" data-duration="3.127"><span>결국 주문번호에만 종속됩니다.</span></div>
    <div id="cap-28a" class="cap clip" data-start="151.076" data-duration="3.310"><span>이 부분 함수 종속을 없애, 모든 일반 속성이</span></div>
    <div id="cap-28b" class="cap clip" data-start="154.386" data-duration="4.007"><span>주식별자 전체에 종속되게 한 것이 제2정규형입니다.</span></div>
    <div id="cap-29a" class="cap clip" data-start="158.493" data-duration="2.670"><span>상품코드에 딸린 속성은 상품 테이블로,</span></div>
    <div id="cap-29b" class="cap clip" data-start="161.163" data-duration="3.820"><span>주문번호에 딸린 속성은 주문 테이블로 떼어 냅니다.</span></div>
    <div id="cap-30a" class="cap clip" data-start="165.083" data-duration="2.686"><span>수량은 주문상품 테이블에 남습니다.</span></div>
    <div id="cap-31a" class="cap clip" data-start="167.869" data-duration="3.690"><span>이제 테이블은 세 개, 주문상품 5행,</span></div>
    <div id="cap-31b" class="cap clip" data-start="171.559" data-duration="3.231"><span>상품 3행, 주문 3행입니다.</span></div>
    <div id="cap-32a" class="cap clip" data-start="174.890" data-duration="2.350"><span>공책이라는 이름은 한 번만 저장되니,</span></div>
    <div id="cap-32b" class="cap clip" data-start="177.240" data-duration="2.292"><span>한 행만 고치면 됩니다.</span></div>
    <div id="cap-33a" class="cap clip" data-start="179.631" data-duration="1.950"><span>가위도 상품 테이블에 넣을 수 있고,</span></div>
    <div id="cap-33b" class="cap clip" data-start="181.581" data-duration="3.733"><span>3번 주문을 지워도 지우개 정보는 남습니다.</span></div>
    <div id="cap-34a" class="cap clip" data-start="185.965" data-duration="2.050"><span>그런데 주문 테이블에는 민수라는</span></div>
    <div id="cap-34b" class="cap clip" data-start="188.015" data-duration="2.329"><span>이름이 아직 두 번 들어 있습니다.</span></div>
    <div id="cap-35a" class="cap clip" data-start="190.444" data-duration="2.150"><span>지영 고객의 하나뿐인 주문을 지우면,</span></div>
    <div id="cap-35b" class="cap clip" data-start="192.594" data-duration="3.022"><span>지영이라는 이름도 함께 사라집니다.</span></div>
    <div id="cap-36a" class="cap clip" data-start="195.716" data-duration="2.170"><span>주문번호가 고객번호를 정하고,</span></div>
    <div id="cap-36b" class="cap clip" data-start="197.886" data-duration="3.666"><span>고객번호가 다시 고객이름을 정하기 때문입니다.</span></div>
    <div id="cap-37a" class="cap clip" data-start="201.653" data-duration="2.010"><span>이렇게 일반 속성을 거쳐 이어지는</span></div>
    <div id="cap-37b" class="cap clip" data-start="203.663" data-duration="2.740"><span>종속을 이행 함수 종속이라고 합니다.</span></div>
    <div id="cap-38a" class="cap clip" data-start="206.503" data-duration="2.090"><span>이를 없애 일반 속성끼리는 서로</span></div>
    <div id="cap-38b" class="cap clip" data-start="208.593" data-duration="3.162"><span>종속되지 않게 한 것이 제3정규형입니다.</span></div>
    <div id="cap-39a" class="cap clip" data-start="211.856" data-duration="2.690"><span>고객번호와 고객이름은 고객 테이블로 떼고,</span></div>
    <div id="cap-39b" class="cap clip" data-start="214.546" data-duration="3.365"><span>주문 테이블에는 고객번호만 남깁니다.</span></div>
    <div id="cap-40a" class="cap clip" data-start="218.011" data-duration="2.590"><span>이제 테이블은 네 개, 주문 테이블</span></div>
    <div id="cap-40b" class="cap clip" data-start="220.601" data-duration="3.052"><span>3행 옆에 고객 테이블 2행이 생겼습니다.</span></div>
    <div id="cap-41a" class="cap clip" data-start="223.753" data-duration="2.610"><span>처음에 네 번 저장됐던 민수라는 이름이,</span></div>
    <div id="cap-41b" class="cap clip" data-start="226.363" data-duration="2.497"><span>이제 한 번만 저장됩니다.</span></div>
    <div id="cap-42a" class="cap clip" data-start="228.960" data-duration="3.550"><span>네 테이블을 다시 조인하면 처음 5행이 그대로 나오니,</span></div>
    <div id="cap-42b" class="cap clip" data-start="232.510" data-duration="2.986"><span>나누면서 잃은 정보는 없습니다.</span></div>
    <div id="cap-43a" class="cap clip" data-start="236.146" data-duration="3.470"><span>제3정규형 다음은 BCNF로, 제3정규형을</span></div>
    <div id="cap-43b" class="cap clip" data-start="239.616" data-duration="3.862"><span>만족하면서 모든 결정자가 후보키인 상태입니다.</span></div>
    <div id="cap-44a" class="cap clip" data-start="243.578" data-duration="1.890"><span>후보키는 주식별자가 될 수 있는</span></div>
    <div id="cap-44b" class="cap clip" data-start="245.468" data-duration="2.579"><span>속성이나 속성의 묶음을 말합니다.</span></div>
    <div id="cap-45a" class="cap clip" data-start="248.147" data-duration="4.690"><span>그 위로 다치 종속, 곧 여러 값 종속을 없애는 제4정규형과,</span></div>
    <div id="cap-45b" class="cap clip" data-start="252.837" data-duration="3.698"><span>조인 종속을 없애는 제5정규형이 있습니다.</span></div>
    <div id="cap-46a" class="cap clip" data-start="257.186" data-duration="2.610"><span>테이블을 나누면 조인이 늘어 조회가 느려질</span></div>
    <div id="cap-46b" class="cap clip" data-start="259.796" data-duration="3.393"><span>수는 있지만, 무조건 그런 것은 아닙니다.</span></div>
    <div id="cap-47a" class="cap clip" data-start="263.288" data-duration="2.990"><span>상품 목록만 볼 때는 작은 상품 테이블 하나만</span></div>
    <div id="cap-47b" class="cap clip" data-start="266.278" data-duration="3.319"><span>읽으면 되니, 오히려 가벼울 수도 있습니다.</span></div>
    <div id="cap-48a" class="cap clip" data-start="269.697" data-duration="2.890"><span>정규화하면 대체로 좋아지는 쪽은 입력,</span></div>
    <div id="cap-48b" class="cap clip" data-start="272.587" data-duration="2.659"><span>수정, 삭제입니다.</span></div>
    <div id="cap-49a" class="cap clip" data-start="275.346" data-duration="3.330"><span>반대로 조회 성능을 위해, 정규화한 구조에 일부러</span></div>
    <div id="cap-49b" class="cap clip" data-start="278.676" data-duration="3.848"><span>중복이나 통합 같은 변형을 주는 것을 반정규화라고 합니다.</span></div>
    <div id="cap-50a" class="cap clip" data-start="282.624" data-duration="2.090"><span>주문 테이블에 고객이름을 다시 넣으면,</span></div>
    <div id="cap-50b" class="cap clip" data-start="284.714" data-duration="2.985"><span>조인 없이 바로 읽을 수 있습니다.</span></div>
    <div id="cap-51a" class="cap clip" data-start="287.799" data-duration="3.270"><span>대신 같은 이름이 여러 곳에 생겨, 입력,</span></div>
    <div id="cap-51b" class="cap clip" data-start="291.069" data-duration="4.428"><span>수정, 삭제 부담과 무결성 위험이 늘 수 있습니다.</span></div>
    <div id="cap-52a" class="cap clip" data-start="296.147" data-duration="2.582"><span>시험장에서 챙길 것 세 가지입니다.</span></div>
    <div id="cap-53a" class="cap clip" data-start="298.828" data-duration="3.130"><span>첫째, 이상 현상은 갱신 이상,</span></div>
    <div id="cap-53b" class="cap clip" data-start="301.958" data-duration="4.474"><span>삽입 이상, 삭제 이상, 세 가지입니다.</span></div>
    <div id="cap-54a" class="cap clip" data-start="306.533" data-duration="4.950"><span>둘째, 제1정규형은 원자값, 제2정규형은 부분 함수</span></div>
    <div id="cap-54b" class="cap clip" data-start="311.483" data-duration="4.455"><span>종속 제거, 제3정규형은 이행 함수 종속 제거입니다.</span></div>
    <div id="cap-55a" class="cap clip" data-start="316.038" data-duration="5.430"><span>셋째, 정규화는 입력, 수정, 삭제에 대체로 유리하고,</span></div>
    <div id="cap-55b" class="cap clip" data-start="321.468" data-duration="3.932"><span>조회는 느려질 수도, 빨라질 수도 있습니다.</span></div>
    <div id="cap-56a" class="cap clip" data-start="326.050" data-duration="2.894"><span>오늘 내용을 한 줄로 정리하면 이렇습니다.</span></div>
    <div id="cap-57a" class="cap clip" data-start="329.044" data-duration="3.570"><span>칸마다 값은 하나, 주식별자 전체에,</span></div>
    <div id="cap-57b" class="cap clip" data-start="332.614" data-duration="8.207"><span>그리고 주식별자에만 종속. 이것이 제1, 제2, 제3정규형입니다.</span></div>
  </div>
  <script>
    window.__timelines["captions"] = gsap.timeline({ paused: true });
  </script>
</template>
