          <div class="s03-sw" data-layout-allow-overlap><span class="q-null" id="s03-x0">NULL</span><span class="x-acc" id="s03-x1" style="opacity:0">0</span></div></div>

        <div class="q-tr x-hide" id="s03-f0" style="top:112px"><div class="s03-bar" id="s03-b0"></div><div class="s03-fn">COUNT(*)</div>
          <div class="s03-calc x-hide" id="s03-k0">행 5개</div><div class="s03-val x-hide" id="s03-v0">5</div></div>
        <div class="q-tr x-hide" id="s03-f1" style="top:192px"><div class="s03-bar" id="s03-b1"></div><div class="s03-fn">COUNT(점수)</div>
          <div class="s03-calc x-hide" id="s03-k1">NULL 빼고</div><div class="s03-val x-hide" id="s03-v1">4</div></div>
        <div class="q-tr x-hide" id="s03-f2" style="top:272px"><div class="s03-bar" id="s03-b2"></div><div class="s03-fn">SUM(점수)</div>
          <div class="s03-calc x-hide" id="s03-k2">NULL 빼고</div><div class="s03-val x-hide" id="s03-v2">320</div></div>

        <div class="q-tr x-hide" id="s03-f4" style="top:192px"><div class="s03-bar" id="s03-b4"></div><div class="s03-fn">AVG(NVL(점수, 0))</div>
          <div class="s03-calc"><span class="x-hide" id="s03-k4a">320</span> <span class="x-hide" id="s03-k4b">÷ 5</span></div><div class="s03-val x-acc x-hide" id="s03-v4">64</div></div>
        <div class="q-tr x-hide" id="s03-f5" style="top:272px"><div class="s03-bar" id="s03-b5"></div><div class="s03-fn">SUM(점수) ÷ COUNT(*)</div>
          <div class="s03-calc x-hide" id="s03-k5">320 ÷ 5</div><div class="s03-val x-acc x-hide" id="s03-v5">64</div></div>
        <div id="s03-note" data-layout-allow-overlap>

  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 53.912;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, t);
    const head = (id, prev, t) => { if (prev) fade(prev, t, 1, 0); ft(id, { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, t + (prev ? 0.2 : 0)); };
    const num = (k, fallback) => Number(V[k]) || fallback;
    // 지금 계산하는 결과 행만 연보라 바탕
    let cur = -1;
    const bar = (k, t) => { if (cur >= 0) fade(`#s03-b${cur}`, t, 1, 0); if (k >= 0) fade(`#s03-b${k}`, t, 0, 1); cur = k; };
    let note = null;
    const say = (id, t) => { if (note) fade(note, t, 1, 0); if (id) fade(id, t + 0.15, 0, 1); note = id; };

    // 11 집계 함수는 NULL을 만나도 결과가 NULL이 되지 않는다
    head("#s03-ha", null, at(0, 0));
    ft("#s03-tb", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.2));
    [0, 1, 2, 3, 4].forEach((r, j) => ft(`#s03-r${r}`, { opacity: 0, y: 8 }, { opacity: 1, y: 0 }, at(0, 0.6 + j * 0.12)));
    ft("#s03-rs", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 1.4));
    [0, 1, 2, 3].forEach((r, j) => ft(`#s03-f${r}`, { opacity: 0, y: 8 }, { opacity: 1, y: 0 }, at(0, 2.0 + j * 0.2)));
    // 12 COUNT(*)는 행의 개수 → 5
    bar(0, at(1, 0.2));
    fade("#s03-k0", at(1, 1.0), 0, 1);
    stamp("#s03-v0", num("v5", at(1, 2.1)));
    // 13 COUNT(점수)는 NULL이 아닌 행만 → 4 (동훈 행이 흐려진다)
    bar(1, at(2, 0.2));
    fade("#s03-r4", at(2, 1.2), 1, 0.25);
    fade("#s03-k1", at(2, 1.4), 0, 1);
    stamp("#s03-v1", num("v4", at(2, 2.8)));
    // 14 SUM(점수)는 NULL을 빼고 더해 320
    bar(2, at(3, 0.2));
    fade("#s03-k2", at(3, 0.9), 0, 1);
    stamp("#s03-v2", num("v320", at(3, 2.1)));
    // 15 AVG(점수)도 NULL을 빼고, 320을 4로 나눈 80
    bar(3, at(4, 0.2));
    fade("#s03-k3", at(4, 2.4), 0, 1);
    stamp("#s03-v3", num("v80", at(4, 3.8)));
    // 16 COUNT(*)만 빼면 모두 NULL을 건너뛴다
    bar(-1, at(5, 0.2));
    say("#s03-na", at(5, 0.3));

    // 17 0점으로 치려면 NULL을 0으로 — 앞 결과는 접고 AVG(점수) 80만 위로
    head("#s03-hb", "#s03-ha", at(6, 0));
    say(null, at(6, 0.2));
    fade(["#s03-f0", "#s03-f1", "#s03-f2"], at(6, 0.2), 1, 0);
    ft("#s03-f3", { y: 0 }, { y: -240, duration: 0.6 * S, ease: "power2.inOut" }, at(6, 1.0));
    fade("#s03-r4", at(6, 0.4), 0.25, 1);
    fade("#s03-rh", at(6, 2.0), 0, 1);
    // 18 NVL(점수, 0) — NULL이면 0
    fade("#s03-t1", at(7, 0.3), 1, 0);
    fade("#s03-t2", at(7, 0.5), 0, 1);
    fade("#s03-x0", at(7, 2.4), 1, 0);
    fade("#s03-x1", at(7, 2.6), 0, 1);
    // 19 합은 그대로 320, 나누는 수는 5 → 64
    fade("#s03-rh", at(8, 0.2), 1, 0);
    ft("#s03-f4", { opacity: 0, y: 8 }, { opacity: 1, y: 0 }, at(8, 0.2));
    bar(4, at(8, 0.4));
    fade("#s03-k4a", num("n320", at(8, 1.5)), 0, 1);
    fade("#s03-k4b", num("n5", at(8, 3.1)), 0, 1);
    stamp("#s03-v4", num("n64", at(8, 4.4)));
    // 20 SUM(점수) ÷ COUNT(*)도 같은 64
    ft("#s03-f5", { opacity: 0, y: 8 }, { opacity: 1, y: 0 }, at(9, 0.2));
    bar(5, at(9, 0.3));
    fade("#s03-k5", at(9, 1.8), 0, 1);
    stamp("#s03-v5", at(9, 2.6));
    // 21 AVG(점수)는 언제나 80, 0점 조건이 있을 때만 NVL로 64
    bar(3, num("a80", at(10, 1.3)));
    bar(4, num("a64", at(10, 4.9)));
    say("#s03-nb", num("a64", at(10, 4.9)) + 0.2);
    if (String(V.exit) !== "false") ft("#s03-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s03"] = tl;
  </script>
