<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #s05-code { left: 192px; top: 262px; width: 700px; }
    .s05-slot { position: relative; height: 60px; }
    .s05-ws { position: absolute; inset: 0; }
    .s05-ws > .q-ln { position: absolute; left: 0; right: 0; top: 0; opacity: 0; }
    #s05-note { position: absolute; left: 192px; top: 534px; width: 700px; height: 312px; }
    .s05-n { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; opacity: 0; }
    .s05-n > div { font-size: 40px; font-weight: 800; line-height: 1.45; white-space: nowrap; }
    .s05-n > div.s05-sm { margin-top: 14px; font-size: 30px; font-weight: 700; color: var(--color-ink2, #71717A); }
    #s05-tb { left: 952px; top: 262px; width: 776px; height: 584px; }
    #s05-tb .q-th, #s05-tb .q-tr { grid-template-columns: 190px 190px 190px 150px; }
    #s05-tb .q-th > div { font-size: 30px; }
    #s05-tb .q-tr > div { font-size: 40px; }
    #s05-tb .q-null { color: #8A8A93; }
    .s05-m, .s05-cnt { position: relative; height: 56px; }
    .s05-m > span, .s05-cnt > span { position: absolute; left: 0; right: 0; top: 0; line-height: 56px; text-align: center; opacity: 0; }
    .s05-m > span { font-size: 40px; font-weight: 900; }
    .s05-m > span.n { color: var(--color-ink2, #71717A); }
    .s05-m > span.y, .s05-m > span.u { color: var(--color-accent, #6B3FE6); }
    .s05-cnt > span { font-size: 34px; font-weight: 900; color: var(--color-accent, #6B3FE6); }
  </style>
  <div id="root" data-composition-id="s05" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,2.383,8.012,14.323,19.224,21.632,28.092,33.011,36.991,43.612,48.573,53.309,58.912]"},{"id":"dur","type":"number","label":"장면 길이","default":65.501},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"e1","type":"number","label":"WHERE는 시각","default":11.456},{"id":"e2","type":"number","label":"아닌 것을 시각","default":16.239},{"id":"e3","type":"number","label":"90점과 시각","default":25.406},{"id":"e4","type":"number","label":"동훈은 시각","default":41.837},{"id":"e5","type":"number","label":"그리고 시각","default":50.379},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s05-all">
      <div id="s05-ha" class="x-head">비교하면 알 수 없음</div>
      <div id="s05-hb" class="x-head">NOT IN의 함정</div>
      <div id="s05-code" class="x-dark q-code x-hide">
        <div class="q-ln"><span><span class="q-k">SELECT</span> 이름, 점수</span></div>
        <div class="q-ln"><span><span class="q-k">FROM</span> 학생</span></div>
        <div class="s05-slot"><div class="q-hi" id="s05-hi"></div>
          <div class="s05-ws" data-layout-allow-overlap>
            <div class="q-ln" id="s05-w1"><span><span class="q-k">WHERE</span> 점수 = NULL;</span></div>
            <div class="q-ln" id="s05-w2"><span><span class="q-k">WHERE</span> 점수 <span class="q-k">IS NULL</span>;</span></div>
            <div class="q-ln" id="s05-w3"><span><span class="q-k">WHERE</span> 점수 &lt;&gt; 80;</span></div>
            <div class="q-ln" id="s05-w4"><span><span class="q-k">WHERE</span> 점수 <span class="q-k">IN</span> (80, NULL);</span></div>
            <div class="q-ln" id="s05-w5"><span><span class="q-k">WHERE</span> 점수 <span class="q-k">NOT IN</span> (80, NULL);</span></div>
          </div>
        </div>
      </div>
      <div id="s05-note" class="x-card x-hide" data-layout-allow-overlap>
        <div class="s05-n" id="s05-na"><div>참 · 거짓 · <span class="x-acc">알 수 없음</span></div><div class="s05-sm" id="s05-na2" style="opacity:0">WHERE는 참인 행만 남긴다</div></div>
        <div class="s05-n" id="s05-nb"><div>NULL을 찾을 때 <span class="x-acc">IS NULL</span></div><div class="s05-sm" id="s05-nb2" style="opacity:0">아닌 것은 IS NOT NULL</div></div>
        <div class="s05-n" id="s05-nc"><div>NULL &lt;&gt; 80 → <span class="x-acc">알 수 없음</span></div><div class="s05-sm">그래서 동훈은 빠진다</div></div>
        <div class="s05-n" id="s05-nd"><div>80과 다르다</div><div id="s05-nd1" style="opacity:0">AND <span id="s05-nd2">NULL과 다르다</span></div><div class="s05-sm" id="s05-nd3" style="opacity:0">늘 알 수 없음 → 참이 될 수 없다</div></div>
        <div class="s05-n" id="s05-ne"><div class="s05-sm" style="margin-top:0">목록에 NULL이 하나라도 있으면</div><div>NOT IN은 <span class="x-acc">0행</span></div></div>
      </div>
      <div id="s05-tb" class="x-card q-tb x-hide">
        <div class="q-th" style="top:30px"><div>이름</div><div>점수</div><div>조건</div>
          <div class="s05-cnt" data-layout-allow-overlap><span id="s05-c0">0행</span><span id="s05-c1">1행</span><span id="s05-c2">2행</span></div></div>
        <div class="q-tr x-hide" id="s05-r0" style="top:120px"><div id="s05-a0">민수</div><div id="s05-b0">90</div>
          <div class="s05-m" data-layout-allow-overlap><span class="y" id="s05-m0y">✓</span><span class="n" id="s05-m0n">✕</span><span class="u" id="s05-m0u">?</span></div><div></div></div>
        <div class="q-tr x-hide" id="s05-r1" style="top:204px"><div id="s05-a1">지영</div><div id="s05-b1">80</div>
          <div class="s05-m" data-layout-allow-overlap><span class="y" id="s05-m1y">✓</span><span class="n" id="s05-m1n">✕</span><span class="u" id="s05-m1u">?</span></div><div></div></div>
        <div class="q-tr x-hide" id="s05-r2" style="top:288px"><div id="s05-a2">현우</div><div id="s05-b2">70</div>
          <div class="s05-m" data-layout-allow-overlap><span class="y" id="s05-m2y">✓</span><span class="n" id="s05-m2n">✕</span><span class="u" id="s05-m2u">?</span></div><div></div></div>
        <div class="q-tr x-hide" id="s05-r3" style="top:372px"><div id="s05-a3">수진</div><div id="s05-b3">80</div>
          <div class="s05-m" data-layout-allow-overlap><span class="y" id="s05-m3y">✓</span><span class="n" id="s05-m3n">✕</span><span class="u" id="s05-m3u">?</span></div><div></div></div>
        <div class="q-tr x-hide" id="s05-r4" style="top:456px"><div id="s05-a4">동훈</div><div class="q-null" id="s05-b4">NULL</div>
          <div class="s05-m" data-layout-allow-overlap><span class="y" id="s05-m4y">✓</span><span class="n" id="s05-m4n">✕</span><span class="u" id="s05-m4u">?</span></div><div></div></div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 65.501;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const pop = (sel, t) => ft(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, t);
    const head = (id, prev, t) => { if (prev) fade(prev, t, 1, 0); ft(id, { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, t + (prev ? 0.2 : 0)); };
    const num = (k, fallback) => Number(V[k]) || fallback;
    // WHERE 줄 바꾸기(0 = 비움)
    let w = 0;
    const where = (k, t) => {
      if (w) fade(`#s05-w${w}`, t, 1, 0);
      if (k) fade(`#s05-w${k}`, t + (w ? 0.2 : 0), 0, 1);
      if (!w && k) fade("#s05-hi", t, 0, 1);
      if (w && !k) fade("#s05-hi", t, 1, 0);
      w = k;
    };
    // 행마다 조건 판정: y = 참(남음), n = 거짓, u = 알 수 없음, "" = 비움
    const M = ["", "", "", "", ""];
    const mark = (r, k, t) => { if (M[r] === k) return; if (M[r]) fade(`#s05-m${r}${M[r]}`, t, 1, 0); if (k) pop(`#s05-m${r}${k}`, t + 0.1); M[r] = k; };
    const marks = (ks, t, step = 0.12) => ks.forEach((k, r) => mark(r, k, t + r * step));
    // 행 흐리기(이름·점수 칸만, 판정 기호는 그대로)
    const O = [1, 1, 1, 1, 1];
    const dim = (r, v, t) => { if (O[r] === v) return; fade([`#s05-a${r}`, `#s05-b${r}`], t, O[r], v); O[r] = v; };
    const dims = (vs, t) => vs.forEach((v, r) => dim(r, v, t));
    let cnt = "";
    const count = (k, t) => { if (cnt === k) return; if (cnt) fade(`#s05-c${cnt}`, t, 1, 0); if (k) fade(`#s05-c${k}`, t + 0.1, 0, 1); cnt = k; };
    // 설명 카드: 글이 없을 때는 카드째 숨긴다
    let note = null, card = false;
    const say = (id, t) => {
      if (note) fade(note, t, 1, 0);
      if (id && !card) ft("#s05-note", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, t);
      if (!id && card) fade("#s05-note", t, 1, 0);
      card = !!id;
      if (id) fade(id, t + 0.15, 0, 1);
      note = id;
    };
    const LO = 0.25;

    // 22 이번에는 WHERE 절
    head("#s05-ha", null, at(0, 0));
    ft("#s05-code", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.2));
    ft("#s05-tb", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.4));
    [0, 1, 2, 3, 4].forEach((r, j) => ft(`#s05-r${r}`, { opacity: 0, y: 8 }, { opacity: 1, y: 0 }, at(0, 0.8 + j * 0.12)));
    // 23 ‘점수 = NULL’ → 0행
    where(1, at(1, 0.4));
    dims([LO, LO, LO, LO, LO], at(1, 3.4));
    count("0", at(1, 3.8));
    // 24 NULL과 비교하면 알 수 없음, WHERE는 참인 행만
    say("#s05-na", at(2, 0.2));
    marks(["u", "u", "u", "u", "u"], at(2, 2.6));
    fade("#s05-na2", num("e1", at(2, 3.4)), 0, 1);
    // 25 NULL은 IS NULL로, 아닌 것은 IS NOT NULL
    where(2, at(3, 0.3));
    say("#s05-nb", at(3, 0.3));
    marks(["n", "n", "n", "n", "y"], at(3, 1.4));
    dims([LO, LO, LO, LO, 1], at(3, 1.6));
    count("1", at(3, 1.8));
    fade("#s05-nb2", num("e2", at(3, 1.9)), 0, 1);
    // 26 비슷한 함정 하나 더 — 판정을 비운다
    where(0, at(4, 0.2));
    marks(["", "", "", "", ""], at(4, 0.2), 0);
    dims([1, 1, 1, 1, 1], at(4, 0.3));
    count("", at(4, 0.2));
    say(null, at(4, 0.2));
    // 27 점수가 80이 아닌 학생 → 셋이 아니라 둘, 90점과 70점
    where(3, at(5, 0.3));
    marks(["y", "n", "y", "n", ""], at(5, 2.0));
    dims([1, LO, 1, LO, LO], num("e3", at(5, 3.8)));
    count("2", num("e3", at(5, 3.8)) + 0.2);
    // 28 동훈은 80이 아닌지도 알 수 없어 빠진다
    mark(4, "u", at(6, 0.4));
    say("#s05-nc", at(6, 0.4));

    // 29 가장 자주 나오는 함정, NOT IN — 판정을 비운다
    head("#s05-hb", "#s05-ha", at(7, 0));
    where(0, at(7, 0.2));
    marks(["", "", "", "", ""], at(7, 0.2), 0);
    dims([1, 1, 1, 1, 1], at(7, 0.3));
    count("", at(7, 0.2));
    say(null, at(7, 0.2));
    // 30 IN (80, NULL) → 80점 두 명만, 동훈은 못 찾는다
    where(4, at(8, 0.3));
    marks(["n", "y", "n", "y", ""], at(8, 2.4));
    dims([LO, 1, LO, 1, 1], at(8, 2.8));
    count("2", at(8, 3.0));
    mark(4, "u", num("e4", at(8, 4.8)));
    dim(4, LO, num("e4", at(8, 4.8)) + 0.2);
    // 31 NOT IN (80, NULL) → 한 명도 없다
    marks(["", "", "", "", ""], at(9, 0.2), 0);
    where(5, at(9, 0.3));
    dims([LO, LO, LO, LO, LO], at(9, 2.8));
    count("0", at(9, 3.0));
    // 32 80과 다르고, 그리고 NULL과도 다르다
    say("#s05-nd", at(10, 0.3));
    fade("#s05-nd1", num("e5", at(10, 1.8)), 0, 1);
    // 33 NULL과의 비교는 늘 알 수 없음 → 조건 전체가 참이 될 수 없다
    ft("#s05-nd2", { color: "#18181B" }, { color: "#6B3FE6" }, at(11, 0.6));
    fade("#s05-nd3", at(11, 1.4), 0, 1);
    marks(["u", "n", "u", "n", "u"], at(11, 2.8));
    // 34 NULL이 하나라도 섞이면 NOT IN은 빈 결과
    say("#s05-ne", at(12, 0.4));
    if (String(V.exit) !== "false") ft("#s05-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s05"] = tl;
  </script>
</template>
