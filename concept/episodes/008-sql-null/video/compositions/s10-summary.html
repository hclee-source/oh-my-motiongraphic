<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .s10-c { position: absolute; left: 192px; width: 1536px; height: 160px; padding: 0 64px; box-sizing: border-box;
      display: flex; align-items: center; font-size: 64px; font-weight: 800; white-space: nowrap; }
    .s10-k { width: 360px; color: var(--color-ink2, #71717A); font-size: 44px; font-weight: 800; }
    .s10-c .x-acc { font-weight: 900; }
  </style>
  <div id="root" data-composition-id="s10" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,3.444]"},{"id":"dur","type":"number","label":"장면 길이","default":10.41},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":false},{"id":"y2","type":"number","label":"집계에서는 시각","default":5.121},{"id":"y3","type":"number","label":"비교하면 시각","default":6.63},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s10-all">
      <div id="s10-head" class="x-head">한 줄 정리</div>
      <div class="s10-c x-card x-hide" id="s10-c1" style="top:282px"><div class="s10-k">NULL은</div><div class="x-acc">모르는 값</div></div>
      <div class="s10-c x-card x-hide" id="s10-c2" style="top:472px"><div class="s10-k">집계에서는</div><div><span class="x-acc">빠지고</span></div></div>
      <div class="s10-c x-card x-hide" id="s10-c3" style="top:662px"><div class="s10-k">비교하면</div><div class="x-acc">알 수 없음</div></div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);

    // 47 한 줄로 정리하면
    ft("#s10-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    // 48 NULL은 모르는 값, 집계에서는 빠지고, 비교하면 알 수 없음 — 낱말이 나올 때 한 장씩
    const t1 = at(1, 0.1);
    const t2 = Math.max(Number(V.y2) || at(1, 1.7), t1 + 0.6);
    const t3 = Math.max(Number(V.y3) || at(1, 3.2), t2 + 0.6);
    [[1, t1], [2, t2], [3, t3]].forEach(([k, t]) => ft(`#s10-c${k}`, { opacity: 0, x: -20 }, { opacity: 1, x: 0 }, t));
    window.__timelines["s10"] = tl;
  </script>
</template>
