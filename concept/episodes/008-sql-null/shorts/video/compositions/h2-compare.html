<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .h2-code { left: 80px; width: 640px; height: 136px; }
    .h2-code .q-ln { height: 84px; font-size: 46px; padding: 0 44px; }
    #h2-q1 { top: 330px; }
    #h2-q2 { top: 820px; }
    .h2-chip { left: 752px; width: 248px; font-size: 38px; }
    #h2-x { top: 362px; }
    #h2-o { top: 852px; }
    .h2-v { position: absolute; top: 550px; height: 190px; display: flex; align-items: center; justify-content: center;
      font-size: 52px; font-weight: 900; white-space: nowrap; color: var(--color-ink2, #71717A); }
    .h2-ring { position: absolute; inset: -2px; border-radius: 32px; border: 5px solid var(--color-accent, #6B3FE6); opacity: 0; }
  </style>
  <div id="root" data-composition-id="h2" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.45,3.295,7.031]"},{"id":"dur","type":"number","label":"장면 길이","default":8.787},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h2-all">
      <div id="h2-q1" class="x-dark q-code h2-code x-hide">
        <div class="q-ln"><span><span class="q-k">WHERE</span> 열 = NULL</span></div>
      </div>
      <div id="h2-x" class="q-chip q-ng h2-chip">✕ 못 찾음</div>
      <div class="h2-v x-card x-hide" id="h2-v1" style="left:80px;width:250px">참</div>
      <div class="h2-v x-card x-hide" id="h2-v2" style="left:360px;width:250px">거짓</div>
      <div class="h2-v x-card x-hide" id="h2-v3" style="left:640px;width:360px"><div class="h2-ring" id="h2-r3"></div><span class="x-acc">알 수 없음</span></div>
      <div id="h2-q2" class="x-dark q-code h2-code x-hide">
        <div class="q-ln"><span><span class="q-k">WHERE</span> 열 <span class="q-k">IS NULL</span></span></div>
      </div>
      <div id="h2-o" class="q-chip q-ok h2-chip">✓ 찾음</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 8.787;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);

    // 4 ‘= NULL’로는 아무것도 못 찾는다
    ft("#h2-q1", { opacity: 0, x: -20 }, { opacity: 1, x: 0 }, at(0, -0.2));
    stamp("#h2-x", at(0, 1.1));
    // 5 NULL과 비교하면 참도 거짓도 아닌 알 수 없음
    stamp("#h2-v1", at(1, 1.0));
    stamp("#h2-v2", at(1, 1.4));
    stamp("#h2-v3", at(1, 2.1));
    fade("#h2-r3", at(1, 2.3), 0, 1);
    // 6 NULL은 IS NULL로 찾는다 — 앞 줄은 흐리게
    fade(["#h2-q1", "#h2-x", "#h2-v1", "#h2-v2", "#h2-v3"], at(2, 0.0), 1, 0.4);
    ft("#h2-q2", { opacity: 0, x: -20 }, { opacity: 1, x: 0 }, at(2, 0.0));
    stamp("#h2-o", at(2, 0.6));
    if (String(V.exit) !== "false") ft("#h2-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h2"] = tl;
  </script>
