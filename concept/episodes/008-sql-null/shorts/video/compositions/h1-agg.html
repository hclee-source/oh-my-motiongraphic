<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .h1-t { position: absolute; top: 320px; width: 200px; height: 140px; display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: 800; color: var(--color-ink2, #71717A); }
    .h1-t.q-null { color: #8A8A93; }
    .h1-ring { position: absolute; inset: -2px; border-radius: 32px; border: 5px solid var(--color-accent, #6B3FE6); opacity: 0; }
    .h1-c { position: absolute; left: 80px; width: 920px; padding: 0 56px; box-sizing: border-box;
      display: flex; flex-direction: column; justify-content: center; }
    #h1-a { top: 510px; height: 230px; }
    #h1-b { top: 790px; height: 330px; }
    .h1-k { font-size: 60px; font-weight: 900; color: var(--color-accent, #6B3FE6); white-space: nowrap; }
    .h1-d { margin-top: 14px; font-size: 46px; font-weight: 800; white-space: nowrap; }
    #h1-x { margin-top: 22px; font-size: 36px; font-weight: 800; color: var(--color-ink2, #71717A); white-space: nowrap; opacity: 0; }
  </style>
  <div id="root" data-composition-id="h1" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.0,4.516,7.136]"},{"id":"dur","type":"number","label":"장면 길이","default":10.076},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"c2","type":"number","label":"COUNT(열) 시각","default":2.211},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h1-all">
      <div class="h1-t x-card x-hide" id="h1-t1" style="left:80px"><div class="h1-ring" id="h1-o1"></div>값</div>
      <div class="h1-t x-card x-hide" id="h1-t2" style="left:320px"><div class="h1-ring" id="h1-o2"></div>값</div>
      <div class="h1-t x-card q-null x-hide" id="h1-t3" style="left:560px"><div class="h1-ring" id="h1-o3"></div>NULL</div>
      <div class="h1-t x-card x-hide" id="h1-t4" style="left:800px"><div class="h1-ring" id="h1-o4"></div>값</div>
      <div class="h1-c x-card x-hide" id="h1-a">
        <div class="h1-k">COUNT(*)</div>
        <div class="h1-d">NULL인 행도 센다</div>
      </div>
      <div class="h1-c x-card x-hide" id="h1-b">
        <div class="h1-k">COUNT(열)<span id="h1-k2" style="opacity:0"> · SUM · AVG</span></div>
        <div class="h1-d">NULL은 건너뛴다</div>
        <div id="h1-x">AVG는 NULL을 뺀 개수로 나눈다</div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 10.076;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, ease: "back.out(1.8)" }, t);

    // 1 COUNT(*)는 NULL인 행도 센다 — 네 칸 모두 테두리
    [1, 2, 3, 4].forEach((k, j) => stamp(`#h1-t${k}`, at(0, j * 0.1)));
    ft("#h1-a", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(0, 0.3));
    fade(["#h1-o1", "#h1-o2", "#h1-o3", "#h1-o4"], at(0, 0.9), 0, 1);
    // COUNT(열)은 NULL을 빼고 센다 — NULL 칸만 빠진다
    const c2 = Number(V.c2) || at(0, 2.2);
    fade("#h1-a", c2, 1, 0.45);
    ft("#h1-b", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, c2);
    fade("#h1-o3", c2 + 0.3, 1, 0);
    fade("#h1-t3", c2 + 0.3, 1, 0.35);
    // 2 SUM과 AVG도 NULL을 건너뛴다
    fade("#h1-k2", at(1, 0.2), 0, 1);
    // 3 그래서 AVG는 NULL을 뺀 개수로 나눈다
    fade("#h1-x", at(2, 0.3), 0, 1);
    if (String(V.exit) !== "false") ft("#h1-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines["h1"] = tl;
  </script>
</template>
