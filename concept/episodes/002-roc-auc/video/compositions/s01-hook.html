<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    #s01-a { position: absolute; left: 192px; top: 262px; width: 700px; height: 520px; padding: 44px 52px; box-sizing: border-box; }
    .s01-cap { font-size: 32px; font-weight: 700; color: var(--color-ink2, #71717A); }
    .s01-big { margin-top: 10px; font-size: 200px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
    /* 0~1 눈금 막대: 폭 596 px */
    #s01-gauge { position: absolute; left: 52px; top: 380px; width: 596px; height: 20px; border-radius: 10px; background: #ECEDF1; }
    #s01-fill { position: absolute; left: 0; top: 0; height: 20px; width: 381px; border-radius: 10px; background: var(--color-ink, #18181B);
      transform-origin: left center; transform: scaleX(0); }
    .s01-t0, .s01-t1 { position: absolute; top: 420px; font-size: 28px; font-weight: 700; color: var(--color-ink2, #71717A); }
    .s01-t0 { left: 52px; }
    .s01-t1 { left: 632px; }
    #s01-tick { position: absolute; left: 347px; top: 362px; width: 6px; height: 56px; border-radius: 3px; background: var(--color-accent, #6B3FE6); opacity: 0; }
    #s01-tlab { position: absolute; left: 290px; top: 420px; font-size: 28px; font-weight: 800; color: var(--color-accent, #6B3FE6); opacity: 0; white-space: nowrap; }
    #s01-verdict { position: absolute; left: 520px; top: 170px; font-size: 56px; font-weight: 900; color: var(--color-accent, #6B3FE6); opacity: 0; }
    #s01-q { position: absolute; left: 540px; top: 120px; font-size: 120px; font-weight: 900; color: var(--color-accent, #6B3FE6); opacity: 0; }
    #s01-b { position: absolute; left: 1028px; top: 262px; width: 700px; height: 520px; padding: 44px 52px; box-sizing: border-box; }
    .s01-row { display: grid; grid-template-columns: 250px 1fr; align-items: baseline; height: 150px; opacity: 0; }
    .s01-k { font-size: 36px; font-weight: 700; color: var(--color-ink2, #71717A); }
    .s01-v { font-size: 112px; font-weight: 900; letter-spacing: -0.02em; }
    #s01-arrow { margin: 4px 0 12px 250px; font-size: 48px; font-weight: 900; color: var(--color-ink2, #71717A); opacity: 0; }
    #s01-ask { position: absolute; left: 192px; top: 120px; font-size: 64px; font-weight: 800; letter-spacing: -0.01em; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s01" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0,4,7,10,15,21]"},{"id":"dur","type":"number","label":"장면 길이","default":26},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s01-all">
      <div id="s01-ask">ROC 곡선과 AUC</div>
      <div id="s01-a" class="x-card x-hide">
        <div class="s01-cap">환자일 가능성(점수)</div>
        <div class="s01-big" id="s01-score">0.00</div>
        <div id="s01-verdict">→ 환자</div>
        <div id="s01-q">?</div>
        <div id="s01-gauge"><div id="s01-fill"></div></div>
        <div id="s01-tick"></div>
        <div class="s01-t0">0</div>
        <div class="s01-t1">1</div>
        <div id="s01-tlab">기준 0.5</div>
      </div>
      <div id="s01-b" class="x-card x-hide">
        <div class="s01-cap">같은 모델의 재현율</div>
        <div class="s01-row" id="s01-r1"><div class="s01-k">기준 0.5</div><div class="s01-v">0.6</div></div>
        <div id="s01-arrow">↓</div>
        <div class="s01-row" id="s01-r2"><div class="s01-k">기준 0.3</div><div class="s01-v x-acc">0.8</div></div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 26;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const stamp = (sel, t) => ft(sel, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, t);
    const count = (el, t, a, b, d, fmt) => { const o = { v: a }; tl.fromTo(o, { v: a }, { v: b, duration: d * S, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t); };

    // 1 0~1 사이 점수
    stamp("#s01-a", at(0, 0.1));
    count(document.getElementById("s01-score"), at(0, 0.6), 0, 0.64, 0.8, v => v.toFixed(2));
    tl.fromTo("#s01-fill", { scaleX: 0 }, { scaleX: 1, duration: 0.8 * S, ease: "power2.out", immediateRender: false }, at(0, 0.6));
    // 2 0.5를 넘으면 환자
    fade("#s01-tick, #s01-tlab", at(1, 0.4), 0, 1);
    ft("#s01-verdict", { opacity: 0, x: -16 }, { opacity: 1, x: 0 }, at(1, 1.6));
    // 3 이 0.5는 누가?
    fade("#s01-verdict", at(2, 0), 1, 0);
    ft("#s01-q", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, at(2, 0.3));
    // 4 0.3으로 내리면 재현율 0.6 → 0.8
    fade("#s01-q", at(3, 0), 1, 0);
    ft("#s01-b", { opacity: 0, x: 24 }, { opacity: 1, x: 0 }, at(3, 0.1));
    fade("#s01-r1", at(3, 0.6), 0, 1);
    fade("#s01-arrow", at(3, 1.8), 0, 1);
    ft("#s01-r2", { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, at(3, 2.4));
    // 5 오늘은 ROC 곡선과 AUC — 카드는 물러나고 주제 이름
    ft("#s01-a, #s01-b", { y: 0, opacity: 1 }, { y: 40, opacity: 0.35, duration: 0.5 * S, ease: "power2.inOut" }, at(4, 0.2));
    ft("#s01-ask", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(4, 2.4));
    if (String(V.exit) !== "false") ft("#s01-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s01"] = tl;
  </script>
</template>
