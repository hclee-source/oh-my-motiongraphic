<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    /* 그래프: 왼쪽 위 (200, 360), 한 변 680 px — h3과 같은 자리 */
    #h1-svg { position: absolute; left: 200px; top: 360px; width: 680px; height: 680px; overflow: visible; }
    #h1-ylab { position: absolute; left: 200px; top: 290px; font-size: 48px; font-weight: 900; opacity: 0; white-space: nowrap; }
    #h1-q { position: absolute; left: 200px; top: 1070px; font-size: 64px; font-weight: 900; color: var(--color-accent, #6B3FE6); opacity: 0; }
    #h1-x { position: absolute; left: 200px; top: 1070px; font-size: 56px; font-weight: 900; opacity: 0; white-space: nowrap; }
    #h1-x2 { position: absolute; left: 200px; top: 1150px; font-size: 40px; font-weight: 800; color: var(--color-ink2, #71717A); opacity: 0; white-space: nowrap; }
    #h1-no { position: absolute; left: 330px; top: 560px; font-size: 52px; font-weight: 900; color: var(--color-ink2, #71717A); opacity: 0; white-space: nowrap; }
    #h1-strike { position: absolute; left: 320px; top: 590px; width: 180px; height: 7px; border-radius: 4px; background: var(--color-accent, #6B3FE6);
      transform-origin: left center; transform: scaleX(0); }
  </style>
  <div id="root" data-composition-id="h1" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.3,3.5,8]"},{"id":"dur","type":"number","label":"장면 길이","default":11},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h1-all">
      <svg id="h1-svg" viewBox="0 0 680 680">
        <path id="h1-axes" d="M0 0 L0 680 L680 680" stroke="#18181B" stroke-width="6" fill="none" stroke-dasharray="1360" stroke-dashoffset="1360" />
      </svg>
      <div id="h1-ylab">민감도</div>
      <div id="h1-q">가로축 = ?</div>
      <div data-layout-allow-overlap id="h1-wrong"><div id="h1-no">특이도</div><div id="h1-strike"></div></div>
      <div id="h1-x">1 − 특이도</div>
      <div id="h1-x2">= 거짓 양성률</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 11;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);

    // 1 가로축, 답할 수 있나요?
    tl.fromTo("#h1-axes", { strokeDashoffset: 1360 }, { strokeDashoffset: 0, duration: 0.7 * S, ease: "power2.inOut", immediateRender: false }, at(0, 0));
    ft("#h1-q", { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, at(0, 0.8));
    // 2 특이도가 아니라 1 − 특이도, 거짓 양성률
    fade("#h1-no", at(1, 0.1), 0, 1);
    tl.fromTo("#h1-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.3 * S, ease: "power3.out", immediateRender: false }, at(1, 0.9));
    fade("#h1-q", at(1, 1.4), 1, 0);
    ft("#h1-x", { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, at(1, 1.6));
    fade("#h1-x2", at(1, 3.2), 0, 1);
    // 3 세로축은 민감도
    fade("#h1-no, #h1-strike", at(2, 0), 1, 0);
    ft("#h1-ylab", { opacity: 0, y: -10 }, { opacity: 1, y: 0 }, at(2, 0.3));
    if (String(V.exit) !== "false") ft("#h1-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.35);
    window.__timelines["h1"] = tl;
  </script>
</template>
