<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .h1-seg { position: absolute; left: 80px; width: 920px; border-radius: 28px; padding: 0 48px; box-sizing: border-box;
      display: flex; align-items: center; justify-content: space-between; color: #FFFFFF; transform-origin: center top; }
    .h1-n { font-size: 64px; font-weight: 900; }
    .h1-r { font-size: 40px; font-weight: 800; opacity: 0.85; }
    #h1-tr { top: 360px; height: 420px; background: var(--color-ink, #18181B); }
    #h1-va { top: 800px; height: 150px; background: var(--color-accent, #6B3FE6); }
    #h1-te { top: 970px; height: 150px; background: var(--color-ink2, #71717A); }
    #h1-q { position: absolute; left: 80px; top: 560px; width: 920px; height: 300px; padding: 50px 56px; opacity: 0; }
    #h1-q1 { font-size: 56px; font-weight: 900; }
    #h1-q2 { margin-top: 18px; font-size: 56px; font-weight: 900; color: var(--color-accent, #6B3FE6); }
  </style>
  <div id="root" data-composition-id="h1" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.3,3.5]"},{"id":"dur","type":"number","label":"장면 길이","default":7},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.0}]'>
    <div id="h1-all">
      <div id="h1-q" class="x-card"><div id="h1-q1">공부한 문제 = 시험 문제</div><div id="h1-q2">→ 실력은 ?</div></div>
      <div class="h1-seg" id="h1-tr"><div class="h1-n">훈련</div><div class="h1-r">학습</div></div>
      <div class="h1-seg" id="h1-va"><div class="h1-n">검증</div><div class="h1-r">모델 고르기</div></div>
      <div class="h1-seg" id="h1-te"><div class="h1-n">테스트</div><div class="h1-r">마지막 한 번</div></div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.0;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 7;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    gsap.set(".h1-seg", { opacity: 0 });

    // 1 공부한 문제로 시험을 보면
    ft("#h1-q", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, ease: "back.out(1.6)" }, at(0, 0.1));
    // 2 훈련, 검증, 테스트로 나눈다
    ft("#h1-q", { opacity: 1 }, { opacity: 0, duration: 0.3 * S }, at(1, 0.1));
    ft("#h1-tr", { opacity: 0, scaleY: 0.6 }, { opacity: 1, scaleY: 1 }, at(1, 0.4));
    ft("#h1-va", { opacity: 0, y: 20 }, { opacity: 1, y: 0 }, at(1, 1.0));
    ft("#h1-te", { opacity: 0, y: 20 }, { opacity: 1, y: 0 }, at(1, 1.5));
    if (String(V.exit) !== "false") ft("#h1-all", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.35);
    window.__timelines["h1"] = tl;
  </script>
</template>
