<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }
    .s05-row { position: absolute; left: 192px; height: 40px; opacity: 0; }
    .s05-k { position: absolute; left: 0; top: 2px; font-size: 30px; font-weight: 800; color: var(--color-ink2, #71717A); white-space: nowrap; }
    .s05-d { position: absolute; top: 6px; width: 26px; height: 26px; border-radius: 50%; background: var(--color-ink, #18181B); }
    .s05-d.on { background: var(--color-accent, #6B3FE6); }
    #s05-dots { position: absolute; left: 400px; top: 470px; font-size: 48px; font-weight: 900; color: var(--color-ink2, #71717A); opacity: 0; }
    #s05-card { position: absolute; left: 1180px; top: 290px; width: 548px; height: 480px; padding: 40px 44px; box-sizing: border-box; }
    #s05-c1 { font-size: 34px; font-weight: 800; color: #A1A1AA; }
    #s05-c2 { margin-top: 10px; font-size: 46px; font-weight: 900; white-space: nowrap; }
    #s05-c3 { margin-top: 24px; font-size: 40px; font-weight: 900; color: var(--color-accent-dark, #A68CFF); opacity: 0; }
    #s05-c4 { margin-top: 30px; font-size: 32px; font-weight: 700; line-height: 1.6; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s05" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.5,4,8,12,15]"},{"id":"dur","type":"number","label":"장면 길이","default":20},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s05-all">
      <div id="s05-head" class="x-head">LOOCV · 하나씩 빼는 교차 검증</div>
      <div class="s05-row" id="s05-r1" style="top: 310px; width: 900px"><div class="s05-k">1번째</div></div>
      <div class="s05-row" id="s05-r2" style="top: 380px; width: 900px"><div class="s05-k">2번째</div></div>
      <div id="s05-dots">⋮</div>
      <div class="s05-row" id="s05-r3" style="top: 560px; width: 900px"><div class="s05-k">n번째</div></div>
      <div id="s05-card" class="x-dark x-hide">
        <div id="s05-c1">k를 키우면</div>
        <div id="s05-c2">k = 데이터 개수 n</div>
        <div id="s05-c3">1000개면 1000번 학습</div>
        <div id="s05-c4">+ 거의 다 학습에 쓴다<br /><span class="x-accd">− 계산이 아주 많다</span></div>
      </div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 20;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    // 줄마다 점 20개(데이터 n개를 줄여 그림), 보라 점 하나만 검증
    [["s05-r1", 0], ["s05-r2", 1], ["s05-r3", 19]].forEach(([id, on]) => {
      const row = document.getElementById(id);
      for (let j = 0; j < 20; j++) {
        const d = document.createElement("div");
        d.className = "s05-d" + (j === on ? " on" : "");
        d.style.left = 140 + j * 36 + "px";
        row.appendChild(d);
      }
    });

    // 25 k를 데이터 개수만큼
    ft("#s05-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    ft("#s05-card", { opacity: 0, x: 24 }, { opacity: 1, x: 0 }, at(0, 0.6));
    // 26 하나만 빼서 검증, 나머지 전부로 학습
    ft("#s05-r1", { opacity: 0, x: -16 }, { opacity: 1, x: 0 }, at(1, 0.3));
    ft("#s05-r2", { opacity: 0, x: -16 }, { opacity: 1, x: 0 }, at(1, 1.6));
    fade("#s05-dots", at(1, 2.6), 0, 1);
    ft("#s05-r3", { opacity: 0, x: -16 }, { opacity: 1, x: 0 }, at(1, 3.0));
    // 28 1000개면 1000번
    fade("#s05-c3", at(3, 0.3), 0, 1);
    // 29 거의 다 학습에, 계산은 많이
    fade("#s05-c4", at(4, 0.3), 0, 1);
    if (String(V.exit) !== "false") ft("#s05-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s05"] = tl;
  </script>
</template>
