<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }

    #s01-p { position: absolute; left: 1360px; top: 680px; font-size: 104px; font-weight: 900; color: var(--color-accent, #6B3FE6); opacity: 0; }
  </style>
  <div id="root" data-composition-id="s01" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0,4,8,13,19]"},{"id":"dur","type":"number","label":"장면 길이","default":24},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s01-all">
      <div class="s01-box x-card x-hide" id="s01-a" style="left: 192px"><div class="s01-cap">공부한 것</div><div class="s01-lab">모의고사 1회</div></div>
      <div id="s01-arrow">→</div>
      <div class="s01-box x-card x-hide" id="s01-b" style="left: 1028px"><div class="s01-cap">채점한 것</div><div class="s01-lab">같은 모의고사 1회</div><div class="s01-big" id="s01-n">0점</div><div id="s01-x">?</div></div>
      <div class="s01-w" id="s01-w1" style="left: 192px">홀드아웃</div>

      <div class="s01-w" id="s01-w3" style="left: 860px">부트스트랩</div>
      <div id="s01-p">36.8%</div>
    </div>
  </div>
  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 24;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);

    const el = document.getElementById("s01-n"), o = { v: 0 };

    // 1 공부한 문제로 실력을 재면

    fade("#s01-arrow", at(0, 2.0), 0, 1);
    stamp("#s01-b", at(0, 2.4));
    // 2 점수는 좋지만 진짜 실력은 아니다
    tl.fromTo(o, { v: 0 }, { v: 100, duration: 0.8 * S, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = Math.round(o.v) + "점"; } }, at(1, 0.2));

    ft("#s01-w1", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(3, 2.0));
    ft("#s01-w2", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(3, 2.7));
    ft("#s01-w3", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(3, 3.6));
    // 5 36.8%
    ft("#s01-p", { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, at(4, 1.4));
    if (String(V.exit) !== "false") ft("#s01-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s01"] = tl;
