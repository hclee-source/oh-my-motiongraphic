<template>
  <link rel="stylesheet" href="assets/scene.css" />
  <style>
    #root { position: absolute; inset: 0; font-family: var(--font-main, "Paperlogy"), sans-serif; color: var(--color-ink, #18181B); }

  </style>
  <div id="root" data-composition-id="s06" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"cues","type":"string","label":"문장 시작 시각","default":"[0.5,3,8,12,18,22,26,30,34,38,44]"},{"id":"dur","type":"number","label":"장면 길이","default":52},{"id":"exit","type":"boolean","label":"끝에서 사라짐","default":true},{"id":"motion-scale","type":"number","label":"움직임 속도 배율","default":1.6}]'>
    <div id="s06-all">
      <div id="s06-head" class="x-head">부트스트랩</div>
      <div class="s06-lab" id="s06-l1" style="top: 252px">데이터 5개</div>
      <div class="s06-ball s06-src" style="left: 192px; top: 298px">1</div><div class="s06-ball s06-src" style="left: 300px; top: 298px">2</div>
      <div class="s06-ball s06-src" style="left: 408px; top: 298px">3</div><div class="s06-ball s06-src" style="left: 516px; top: 298px">4</div>
      <div class="s06-ball s06-src" style="left: 624px; top: 298px">5</div>

      <div class="s06-ball s06-draw" style="left: 192px; top: 468px">1</div><div class="s06-ball s06-draw" style="left: 300px; top: 468px">3</div>

        <div class="s06-f" id="s06-f1">한 번에 안 뽑힐 확률 <b>1 − 1/n</b></div>
        <div class="s06-f" id="s06-f2">n번 내내 안 뽑힐 확률 <b>(1 − 1/n)ⁿ</b></div>
        <div class="s06-f" id="s06-f3">n = 5 → <b>(4/5)⁵ ≈ 0.33</b></div>

  <script>
    const V = window.__hyperframes?.getVariables?.() || {};
    const S = Number(V["motion-scale"]) || 1.6;
    const C = JSON.parse(V.cues || "[]");
    const D = Number(V.dur) || 52;
    const at = (i, d = 0) => (C[i] ?? 0) + d;
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { duration: 0.4 * S, ease: "power3.out", immediateRender: false, ...to }, t);
    const fade = (sel, t, a, b) => ft(sel, { opacity: a }, { opacity: b, ease: "power2.out" }, t);
    const pop = (el, t) => ft(el, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, ease: "back.out(2)" }, t);
    const src = gsap.utils.toArray(".s06-src"), draws = gsap.utils.toArray(".s06-draw");

    // 30 부트스트랩
    ft("#s06-head", { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, at(0, 0));
    fade("#s06-l1", at(0, 0.4), 0, 1);
    src.forEach((b, j) => pop(b, at(0, 0.6 + j * 0.15)));
    // 31 하나 뽑아 기록, 다시 넣고 또 뽑는다 / 32 데이터 개수만큼 = 복원 추출
    fade("#s06-l2", at(1, 0.3), 0, 1);
    draws.forEach((b, j) => pop(b, at(1, 0.8 + j * 0.9)));
    // 33 여러 번 뽑힌 것, 한 번도 안 뽑힌 것 — 2와 4는 흐리게
    tl.fromTo([src[1], src[3]], { opacity: 1 }, { opacity: 0.3, duration: 0.4 * S, immediateRender: false }, at(3, 2.4));
    fade(".s06-ring", at(3, 2.6), 0, 1);
    // 34 안 뽑힌 데이터로 검증
    fade("#s06-oob", at(4, 0.3), 0, 1);
    // 35 안 뽑힐 확률은?
    ft("#s06-card", { opacity: 0, x: 24 }, { opacity: 1, x: 0 }, at(5, 0.3));
    // 36 한 번에 1 − 1/n / 37 n번 곱한다 / 38 n = 5 → 0.33 / 39 → 0.368
    fade("#s06-f1", at(6, 0.4), 0, 1);
    fade("#s06-f2", at(7, 0.4), 0, 1);
    fade("#s06-f3", at(8, 0.4), 0, 1);
    ft("#s06-f4", { opacity: 0, y: 10 }, { opacity: 1, y: 0 }, at(9, 0.4));
    // 40 63.2%는 학습, 36.8%는 검증
    ft("#s06-bar", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, at(10, 0.4));
    if (String(V.exit) !== "false") ft("#s06-all", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["s06"] = tl;
  </script>
