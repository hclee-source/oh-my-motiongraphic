<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- paper-pop KIT — verified building blocks for paper-pop frames (rendered + snapshotted 2026-10-07).
         Copy what you need into your frame and RENAME every `f1_` id / `f1-` class / `F1` JS name to your own frame tag.
         Everything here is seek-safe: one paused timeline, index-seeded variation (no Math.random), transforms only. -->
  </head>
  <body>
    <template id="01-f1-template">
      <style>
        @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-8ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: block; }
        @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-7Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
        @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-6SemiBold.ttf") format("truetype"); font-weight: 600; font-display: block; }
        @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-5Medium.ttf") format("truetype"); font-weight: 500; font-display: block; }

        #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F4EEE1; font-family: "Paperlogy", sans-serif; color: #1A1A22; }

        /* graph-paper board (方眼) — paper colour + grid lines, layered paper shadow */
        .f1-board { position: absolute; background-color: #F7F2E7;
          background-image: repeating-linear-gradient(0deg, #E3D9C4 0 2px, transparent 2px 84px), repeating-linear-gradient(90deg, #E3D9C4 0 2px, transparent 2px 84px);
          box-shadow: 0 2px 0 rgba(0,0,0,.08), 0 14px 26px rgba(60,40,10,.18); }
        /* gingham ground: two crossing translucent yellow stripe sets */
        .f1-gingham { position: absolute; inset: 0; background-color: #FFF4C2;
          background-image: repeating-linear-gradient(0deg, rgba(255,225,58,.55) 0 48px, transparent 48px 96px), repeating-linear-gradient(90deg, rgba(255,225,58,.55) 0 48px, transparent 48px 96px); }

        /* TELOP — double outline (二重袋文字) as three stacked copies: outer stroke (+offset shadow) / ink stroke / fill.
           -webkit-text-stroke is centred on the glyph edge, so 36px ≈ 18px outside. */
        /* weight 600 + em strokes + positive tracking: 800 with px-thick strokes closed the gaps inside Hangul and was unreadable */
        .f1-telop { position: absolute; white-space: nowrap; font-family: "Paperlogy"; font-weight: 600; letter-spacing: 0.02em; line-height: 1.1; }
        .f1-telop > span { display: block; }
        .f1-telop > span + span { position: absolute; left: 0; top: 0; }
        /* LIGHT-ground recipe (paper / yellow / gingham): ink fill + white halo + yellow outer + soft offset shadow.
           For a NAVY ground flip it: fill #FFFFFF, mid = ink 0.07em, outer = #10124F 0.13em. Never white fill on a light ground. */
        .f1-t-shadow { color: rgba(26,26,34,.32); -webkit-text-stroke: 0.15em rgba(26,26,34,.32); transform: translate(0.03em, 0.045em); }  /* text-shadow would only shadow the fill */
        .f1-t-outer { color: #FFE13A; -webkit-text-stroke: 0.15em #FFE13A; }
        .f1-t-mid { color: #FFFFFF; -webkit-text-stroke: 0.1em #FFFFFF; }
        .f1-t-fill { color: #1A1A22; }
        .f1-telop em { font-style: normal; }                         /* ALL three layers — an italic em misaligns the outlines */
        .f1-t-fill em { color: #E5352B; }                           /* key word in red */
        .f1-t-fill small { font-size: 0.8em; }                      /* particles at 80% */
        /* NUMERAL / MEGA variant: the light outer stroke leaves odd specks inside counters of 8, %, 0 — for big numbers use
           red (or yellow) fill + white inline + thick ink outline instead:  <div class="f1-telop f1-num" data-text="8.8%"> */
        .f1-num { font-weight: 800; letter-spacing: -0.02em; }   /* numerals have open counters: 800 is fine here */
        .f1-num .f1-t-shadow { color: rgba(26,26,34,.28); -webkit-text-stroke: 0.1em rgba(26,26,34,.28); transform: translate(0.035em, 0.04em); }
        .f1-num .f1-t-outer { color: #1A1A22; -webkit-text-stroke: 0.1em #1A1A22; }
        .f1-num .f1-t-mid { color: #FFFFFF; -webkit-text-stroke: 0.04em #FFFFFF; }
        .f1-num .f1-t-fill { color: #E5352B; }

        /* CUSHION (座布団) behind telop — scaleX 0→1 from the left */
        .f1-cushion { position: absolute; background: #23268C; color: #fff; font-family: "Paperlogy"; font-weight: 600; padding: 14px 30px 10px; border-radius: 6px;
          box-shadow: 0 2px 0 rgba(0,0,0,.1), 0 10px 18px rgba(60,40,10,.22); transform-origin: 0% 50%; }

        /* SIDE LABEL pill (サイドテロップ) */
        .f1-side { position: absolute; left: 96px; top: 56px; display: flex; align-items: center; gap: 14px; font-family: "Paperlogy"; font-weight: 600; font-size: 32px; }
        .f1-side b { font-weight: 700; background: #FFE13A; color: #1A1A22; padding: 8px 20px 4px; border-radius: 999px; border: 4px solid #1A1A22; }

        /* SPEECH BUBBLE — white paper, ink outline, tail, paper shadow */
        .f1-bubble { position: absolute; background: #fff; border: 4px solid #1A1A22; border-radius: 30px; padding: 18px 28px 12px;
          font-family: "Paperlogy"; font-weight: 600; font-size: 44px; white-space: nowrap; box-shadow: 0 10px 18px rgba(60,40,10,.2); }
        .f1-bubble::after { content: ""; position: absolute; left: 50%; bottom: -19px; width: 30px; height: 30px; background: #fff;
          border-right: 4px solid #1A1A22; border-bottom: 4px solid #1A1A22; transform: translateX(-50%) rotate(45deg); }

        /* PAPER CARD (white sheet) and NOTEBOOK ruling */
        .f1-card { position: absolute; background: #FFFDF8; border-radius: 10px; box-shadow: 0 2px 0 rgba(0,0,0,.06), 0 18px 34px rgba(60,40,10,.20); }
        .f1-note { background-color: #FFFDF8; background-image: linear-gradient(90deg, transparent 96px, rgba(229,53,43,.55) 96px 99px, transparent 99px),
          repeating-linear-gradient(0deg, transparent 0 62px, rgba(159,211,242,.9) 62px 64px); }

        /* BOOK COVER in a white padded wrapper (never filter/tint/overlay the cover itself) */
        .f1-book { position: absolute; background: #fff; padding: 12px; border-radius: 6px; box-shadow: 0 3px 0 rgba(0,0,0,.08), 0 26px 46px rgba(40,30,10,.32); }
        .f1-book img { display: block; width: 100%; height: auto; }

        /* FACE: wrapper takes the big moves, the <img> takes the 8 fps boil */
        .f1-face { position: absolute; }
        .f1-face img { display: block; width: 100%; height: 100%; }

        /* RED SHEET (赤シート) over red text */
        .f1-redsheet { position: absolute; background: rgba(214,0,38,.82); mix-blend-mode: multiply; border-radius: 10px; box-shadow: 0 8px 16px rgba(80,0,10,.25); }

        /* MASKING TAPE (マステ) with zig-zag torn ends */
        .f1-tape { position: absolute; width: 120px; height: 30px; background: rgba(255,225,58,.82);
          background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.25) 0 6px, transparent 6px 14px);
          clip-path: polygon(0 0,4% 18%,0 36%,4% 54%,0 72%,4% 90%,0 100%,100% 100%,96% 82%,100% 64%,96% 46%,100% 28%,96% 10%,100% 0); }
        .f1-tape.f1-sky { background-color: rgba(159,211,242,.85); }

        /* ONOMATOPOEIA */
        .f1-sfx { position: absolute; font-family: "Paperlogy"; font-weight: 800; color: #fff; -webkit-text-stroke: 12px #1A1A22; paint-order: stroke fill; text-shadow: 8px 10px 0 #1A1A22; }

        /* FOOTNOTE ※ */
        .f1-note-band { position: absolute; left: 96px; top: 1018px; font-family: "Paperlogy"; font-weight: 500; font-size: 20px; color: rgba(26,26,34,.55); }

        .f1-svg { position: absolute; left: 0; top: 0; overflow: visible; }
      </style>

      <div id="stage" data-composition-id="01-f1" data-width="1920" data-height="1080" data-duration="4">
        <div id="f1_board" class="f1-board" style="left:1000px;top:120px;width:840px;height:840px;"></div>
        <svg id="f1_burst" class="f1-svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>

        <div id="f1_side" class="f1-side"><b>POINT 1</b><span>빈출 족보</span></div>
        <div id="f1_tel1" class="f1-telop" style="left:110px;top:170px;font-size:120px;" data-text="컴활 1급,"></div>
        <div id="f1_tel2" class="f1-telop f1-num" style="left:110px;top:330px;font-size:104px;" data-text="8.8%<small>의 시험</small>"></div>
        <div id="f1_cush" class="f1-cushion" style="left:110px;top:500px;font-size:56px;">실기 합격률은?</div>

        <div id="f1_note" class="f1-card f1-note" style="left:130px;top:640px;width:760px;height:300px;">
          <div style="position:absolute;left:130px;top:118px;font-weight:800;font-size:84px;white-space:nowrap;">
            <span id="f1_key" style="color:#E5352B;">나올 것만</span> 외우기
          </div>
          <div id="f1_sheet" class="f1-redsheet" style="left:112px;top:104px;width:420px;height:118px;"></div>
          <svg id="f1_hana" class="f1-svg" width="760" height="300" viewBox="0 0 760 300"><path id="f1_hana_p" fill="none" stroke="#E5352B" stroke-width="9" stroke-linecap="round" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000"/></svg>
        </div>

        <div id="f1_bub" class="f1-bubble" style="left:1150px;top:170px;">노베이스인데 될까?</div>
        <div id="f1_face" class="f1-face" style="left:1250px;top:330px;width:420px;height:420px;"><img id="f1_face_w" src="assets/faces/worry/benny.png" alt="" /><img id="f1_face_h" src="assets/faces/happy/benny.png" alt="" style="position:absolute;left:0;top:0;opacity:0" /></div>
        <div id="f1_tape1" class="f1-tape" style="left:1380px;top:330px;transform:rotate(-12deg)"></div>
        <div id="f1_tape2" class="f1-tape f1-sky" style="left:1520px;top:360px;transform:rotate(18deg)"></div>

        <div id="f1_book" class="f1-book" style="left:1700px;top:640px;width:200px;"><img src="assets/covers/9791124516614.jpg" alt="" /></div>
        <div id="f1_sfx" class="f1-sfx" style="left:980px;top:700px;font-size:180px;transform:rotate(-10deg)">딱!</div>
        <div class="f1-note-band" id="f1_fn">※ 2025년 컴퓨터활용능력 1급 실기 합격률 · 국가기술자격 통계연보(대한상공회의소) · 응시 건 기준</div>
      </div>

      <script>
        (function () {
          var D = 4;
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); };
          // deterministic pseudo-random in [0,1) from an integer
          function rnd(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

          // TELOP builder: 4 stacked copies (offset shadow / outer / mid / fill). Supports <em> (red key word) and <small> (80% particles).
          function telop(el) {
            var t = el.getAttribute("data-text");
            el.innerHTML = '<span class="f1-t-shadow">' + t + '</span><span class="f1-t-outer">' + t + '</span><span class="f1-t-mid">' + t + '</span><span class="f1-t-fill">' + t + '</span>';
          }
          ["#f1_tel1", "#f1_tel2"].forEach(function (s) { telop(q(s)); });

          // POP-IN (ぽよん): 0 → 1.2 (5f) → 1 (2f) → squash
          function popIn(target, at) {
            var f = 1 / 30;
            tl.set(target, { autoAlpha: 0 }, 0);
            tl.fromTo(target, { scale: 0, autoAlpha: 1 }, { scale: 1.2, autoAlpha: 1, duration: 5 * f, ease: "power2.out", immediateRender: false }, at);
            tl.to(target, { scale: 1, duration: 2 * f, ease: "power1.in" }, at + 5 * f);
            tl.to(target, { scaleX: 1.08, scaleY: 0.95, duration: 2 * f }, at + 7 * f);
            tl.to(target, { scaleX: 1, scaleY: 1, duration: 3 * f, ease: "power1.out" }, at + 9 * f);
          }
          // PLACE: a sheet of paper laid down (tilt −6 → +1.5 → 0, from y+40)
          function place(target, at, rot) {
            rot = rot || 0;
            tl.set(target, { autoAlpha: 0 }, 0);
            tl.fromTo(target, { y: 40, rotation: rot - 6, autoAlpha: 0 }, { y: 0, rotation: rot + 1.5, autoAlpha: 1, duration: 0.17, ease: "power2.out", immediateRender: false }, at);
            tl.to(target, { rotation: rot, duration: 0.08, ease: "power1.inOut" }, at + 0.17);
          }
          // BOIL (カクカク): 8 fps rotation/offset jitter on the <img> (never on the wrapper you animate)
          function boil(target, idx, from, to, amp) {
            amp = amp || 1;
            for (var k = Math.floor(from * 8); k <= Math.ceil(to * 8); k++) {
              var s = idx * 131 + k * 7;
              tl.set(target, { rotation: (rnd(s) - 0.5) * 3 * amp, x: Math.round((rnd(s + 1) - 0.5) * 4 * amp), y: Math.round((rnd(s + 2) - 0.5) * 4 * amp) }, k / 8);
            }
          }
          // CONCENTRATION LINES: K pre-built line sets, one visible per 1/8 s (re-seeding look)
          function burst(svg, cx, cy, inner, n, sets, color, from, to) {
            var ns = "http://www.w3.org/2000/svg", R = 1500, groups = [];
            for (var g = 0; g < sets; g++) {
              var G = document.createElementNS(ns, "g"); G.setAttribute("fill", color); G.setAttribute("opacity", "0");
              for (var i = 0; i < n; i++) {
                var a = (i + rnd(g * 1000 + i) * 0.8) / n * Math.PI * 2, w = 0.004 + rnd(g * 1000 + i + 500) * 0.012;
                var r0 = inner * (1 + rnd(g * 77 + i) * 0.35);
                var p = [[cx + Math.cos(a) * r0, cy + Math.sin(a) * r0], [cx + Math.cos(a - w) * R, cy + Math.sin(a - w) * R], [cx + Math.cos(a + w) * R, cy + Math.sin(a + w) * R]];
                var poly = document.createElementNS(ns, "polygon"); poly.setAttribute("points", p.map(function (x) { return x[0].toFixed(1) + "," + x[1].toFixed(1); }).join(" "));
                G.appendChild(poly);
              }
              svg.appendChild(G); groups.push(G);
            }
            for (var k = Math.floor(from * 8); k < Math.floor(to * 8); k++) {
              groups.forEach(function (G, gi) { tl.set(G, { opacity: gi === k % sets ? 1 : 0 }, k / 8); });
            }
            groups.forEach(function (G) { tl.set(G, { opacity: 0 }, to); });
          }
          // HANAMARU (はなまる): scalloped spiral circle as one path (pathLength 1000 so the dash tween animates)
          function hanamaru(path, cx, cy, rx, ry) {
            var d = "", N = 220, turns = 1.35;
            for (var i = 0; i <= N; i++) {
              var t = i / N, a = -Math.PI * 0.6 + t * turns * Math.PI * 2, s = 1 - t * 0.18 + Math.sin(a * 6) * 0.05;
              d += (i ? "L" : "M") + (cx + Math.cos(a) * rx * s).toFixed(1) + "," + (cy + Math.sin(a) * ry * s).toFixed(1);
            }
            path.setAttribute("d", d);
          }
          hanamaru(q("#f1_hana_p"), 300, 162, 250, 92);

          // ---- demo timeline
          burst(q("#f1_burst"), 1060, 780, 260, 110, 4, "#1A1A22", 0.0, 1.2);
          tl.set("#f1_side", { autoAlpha: 1 }, 0);
          popIn("#f1_tel1", 0.2);
          popIn("#f1_tel2", 0.6);
          tl.fromTo("#f1_cush", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power3.out" }, 0.9);
          place("#f1_note", 1.0, -2);
          // slide the red sheet fully OFF (out of the card / frame) — a parked sheet elsewhere reads as a bug
          tl.to("#f1_sheet", { x: 1500, rotation: 8, duration: 0.35, ease: "power2.inOut" }, 2.0);
          tl.to("#f1_hana_p", { strokeDashoffset: 0, duration: 0.4, ease: "power1.inOut" }, 2.3);
          popIn("#f1_bub", 0.4);
          popIn("#f1_face", 0.1);
          tl.set("#f1_face_h", { opacity: 1 }, 2.4); tl.set("#f1_face_w", { opacity: 0 }, 2.4);
          boil("#f1_face_w", 1, 0, D); boil("#f1_face_h", 1, 0, D);
          place("#f1_book", 0.5, 4);
          popIn("#f1_sfx", 0.3);
          tl.set({}, {}, D);
          tl.seek(0.001); tl.seek(0);   // prime: a fresh paused timeline ignores seek(0), so time-0 sets would not render on frame 0
          window.__timelines = window.__timelines || {};
          window.__timelines["01-f1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
