        (function () {
          const tl = gsap.timeline({ paused: true });

          // ---- palette (frame.md) ----
          const INK = "#0f0e0c";
          const GOLD = "#ceae73";
          const CREAM = "#f4efe6";

          // ---- frame-local anchors (track_t - 22.98) ----
          const T_FLIP = 1.08; // 24.06  palette-flip to dark, title snaps top-left
          const T_C1 = 1.56; //   24.54  cover 1 arcs in
          const T_C2 = 2.49; //   25.47  cover 2 arcs in + VS
          const T_HIT = 3.44; //  26.42  screen-shake + ring burst
          const T_END = 4.72; //  27.70  frame end
          // short hi-hat roll 23.127-23.704 → sub words accumulate one per hit
          const ROLL = [0.147, 0.356, 0.472, 0.588, 0.704];

          // ---- group visibility (single group spans the whole frame) ----
          tl.set("#f4_g1", { autoAlpha: 1 }, 0);
          tl.set("#f4_g1", { autoAlpha: 0 }, T_END);

          // ===== 0.00 system-replace → GOLD register statement =====
          tl.fromTo("#f4_g1_title", { scale: 1.07 }, { scale: 1, duration: 0.3, ease: "expo.out" }, 0);
          tl.fromTo("#f4_g1_stub", { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 0);
          ROLL.forEach((t, i) => {
            tl.fromTo(
              "#f4_g1_w" + (i + 1),
              { autoAlpha: 0, y: 14 },
              { autoAlpha: 1, y: 0, duration: 0.16, ease: "power3.out", immediateRender: false },
              t,
            );
          });

          // ===== 1.08 palette-flip (0ms) + title snaps to top-left as h2 =====
          tl.set("#f4_g1_bg", { backgroundColor: INK }, T_FLIP);
          tl.set("#f4_g1_title", { color: CREAM }, T_FLIP);
          tl.set("#f4_g1_kicker", { color: GOLD }, T_FLIP);
          tl.set("#f4_g1_stub", { backgroundColor: GOLD }, T_FLIP);
          tl.set("#f4_g1_sub", { color: GOLD }, T_FLIP);
          const SNAP = { duration: 0.24, ease: "expo.out", immediateRender: false };
          // display 220px → h2 96px (scale 96/220); header stack lands at pad-y 96:
          // kicker 370→96, title 427→136, sub 655→240
          tl.fromTo("#f4_g1_title", { y: 0, scale: 1 }, { y: -291, scale: 96 / 220, ...SNAP, immediateRender: false }, T_FLIP);
          tl.fromTo("#f4_g1_kicker", { y: 0 }, { y: -274, ...SNAP }, T_FLIP);
          tl.fromTo("#f4_g1_sub", { y: 0 }, { y: -415, ...SNAP }, T_FLIP);

          // ===== cover arcs (parabolic: y settles fast with overshoot, x drifts in slower) =====
          function arcIn(sel, t, dir, restRot) {
            tl.set(sel, { autoAlpha: 1 }, t);
            tl.fromTo(sel, { x: 640 * dir }, { x: 0, duration: 0.62, ease: "power2.out", immediateRender: false }, t);
            tl.fromTo(sel, { y: 760 }, { y: 0, duration: 0.46, ease: "back.out(1.6)", immediateRender: false }, t);
            tl.fromTo(
              sel,
              { rotation: 22 * dir, scale: 0.86 },
              { rotation: restRot, scale: 1, duration: 0.6, ease: "back.out(1.5)", immediateRender: false },
              t,
            );
          }
          function capPop(sel, t) {
            tl.fromTo(
              sel,
              { autoAlpha: 0, y: 18, scale: 0.9 },
              { autoAlpha: 1, y: 0, scale: 1, duration: 0.32, ease: "back.out(2)", immediateRender: false },
              t,
            );
          }

          // ===== 1.56 cover 1 from bottom-left =====
          arcIn("#f4_g1_c1", T_C1, -1, -2.5);
          capPop("#f4_g1_cap1", T_C1 + 0.2);
          // first (only) scale tween on the badge → immediateRender keeps it at 0 until its pop
          tl.fromTo("#f4_g1_badge", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, T_C1 + 0.3);

          // ===== 2.49 cover 2 from bottom-right + VS hairline/disc =====
          arcIn("#f4_g1_c2", T_C2, 1, 2.5);
          capPop("#f4_g1_cap2", T_C2 + 0.2);
          // first tweens on these elements → immediateRender holds the from-state until they fire
          tl.fromTo("#f4_g1_vsline", { scaleY: 0 }, { scaleY: 1, duration: 0.32, ease: "expo.out" }, T_C2 + 0.06);
          tl.fromTo(
            "#f4_g1_vs",
            { autoAlpha: 0, scale: 0 },
            { autoAlpha: 1, scale: 1, duration: 0.34, ease: "back.out(2.6)" },
            T_C2 + 0.14,
          );

          // ===== 3.44 screen-shake (≤8px, 0ms steps) + gold ring burst behind both =====
          const AMPS = [8, -7, 6, -6, 5, -4, 3, -2];
          AMPS.forEach((a, i) => {
            tl.set("#f4_g1_shake", { x: a, y: a * 0.6 * (i % 2 ? 1 : -1) }, T_HIT + i * 0.03);
          });
          tl.set("#f4_g1_shake", { x: 0, y: 0 }, T_HIT + AMPS.length * 0.03);

          tl.fromTo("#f4_g1_ringA", { scale: 0.32 }, { scale: 1.45, duration: 0.85, ease: "power2.out", immediateRender: false }, T_HIT);
          tl.fromTo("#f4_g1_ringA", { opacity: 1 }, { opacity: 0, duration: 0.85, ease: "power1.in", immediateRender: false }, T_HIT);
          tl.fromTo("#f4_g1_ringB", { scale: 0.28 }, { scale: 1.2, duration: 0.8, ease: "power2.out", immediateRender: false }, T_HIT + 0.09);
          tl.fromTo("#f4_g1_ringB", { opacity: 0.8 }, { opacity: 0, duration: 0.8, ease: "power1.in", immediateRender: false }, T_HIT + 0.09);
          tl.fromTo("#f4_g1_vs", { scale: 1.3 }, { scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, T_HIT);

          // 3.44 → 4.72: hold (the ring fades out by ~4.33)

          window.__timelines["04-f4"] = tl;

        })();
