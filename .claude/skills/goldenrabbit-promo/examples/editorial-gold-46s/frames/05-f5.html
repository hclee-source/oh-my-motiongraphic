              { x: SMALL[i].x, y: SMALL[i].y, rotation: SMALL[i].r, scale: 0.62, duration: 0.38, ease: "expo.out" },
              T.slam + 0.02 * i,
            );
          });
          tl.set(g2line, { opacity: 1 }, T.slam);
          tl.fromTo(g2line, { scale: 0.88 }, { scale: 1.14, duration: 0.1, ease: "power4.out", immediateRender: false }, T.slam);
          tl.to(g2line, { scale: 1, duration: 0.62, ease: "elastic.out(1, 0.5)" }, T.slam + 0.1);

          lines.forEach(function (ln, i) {
            var t0 = T.slam + 0.015 + (i % 5) * 0.016;
            tl.to(ln, { scaleY: 1, duration: 0.13, ease: "power4.out" }, t0);
            tl.set(ln, { transformOrigin: "50% 0%" }, t0 + 0.13);
            tl.to(ln, { scaleY: 0, y: -60, duration: 0.34, ease: "power2.in" }, t0 + 0.13);
          });

          // 34.97 — second hit: screen-shake (≤10px, one offset per video frame), gold-deep ring burst, micro punch
          var SH = [10, -9, 7, -6, 4, -3, 2, -1];
          SH.forEach(function (a, k) {
            tl.set(shake, { x: a, y: (k % 2 ? -1 : 1) * Math.round(Math.abs(a) * 0.6) }, T.hit2 + k * 0.034);
          });
          tl.set(shake, { x: 0, y: 0 }, T.hit2 + SH.length * 0.034);

          tl.set(gringA, { opacity: 1, scale: 0.3 }, T.hit2);
          tl.to(gringA, { opacity: 0, scale: 2.7, duration: 0.72, ease: "expo.out" }, T.hit2);
          tl.set(gringB, { opacity: 1, scale: 0.3 }, T.hit2 + 0.09);
          tl.to(gringB, { opacity: 0, scale: 2.0, duration: 0.62, ease: "expo.out" }, T.hit2 + 0.09);

          tl.to(g2line, { scale: 1.05, duration: 0.06, ease: "power3.out" }, T.hit2);
          tl.to(g2line, { scale: 1, duration: 0.32, ease: "power2.out" }, T.hit2 + 0.06);
          tl.to(covers, { scale: 0.665, duration: 0.06, ease: "power3.out" }, T.hit2);
          tl.to(covers, { scale: 0.62, duration: 0.3, ease: "power2.out" }, T.hit2 + 0.06);

          // slow creep that dies dead on 35.88 — the freeze-hold reads as a stop, then holds to the frame end
          tl.to(cam, { scale: 1.03, duration: T.freeze - (T.slam + 0.34), ease: "none" }, T.slam + 0.34);
          tl.to(g2drift, { scale: 1.04, duration: T.freeze - 6.99, ease: "none" }, 6.99);

          window.__timelines[FID] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
