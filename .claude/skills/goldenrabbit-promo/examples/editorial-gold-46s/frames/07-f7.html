        <script>
          (function () {
            window.__timelines = window.__timelines || {};
            var $ = function (id) {

            var K1 = 1.493; // 42.493 kick — the "팡": line out, 16 covers burst, sparkles
            var K2 = 1.957; // 42.957 kick — cover bump + gold ring wave

            var END = 5.6; // frame span length

            // ---- grid geometry (must match the CSS) ----
            var SLOT = 156,
              GAP = 24,
              COLS = 8,
              H = 200;
            var GRID_LEFT = (1920 - (COLS * SLOT + (COLS - 1) * GAP)) / 2; // 252
            var ROW_TOP = [326, 554];
            var CX = 960,
              CY = 540;

            var g1 = $("f7_g1");
            var line = $("f7_g1_line");
            var lineWrap = $("f7_g1_lineWrap");
            var grid = $("f7_g1_grid");
            var rows = [$("f7_g1_row0"), $("f7_g1_row1")];
            var pBox = $("f7_g1_particles");
            var ring1 = $("f7_g1_ring1");
            var ring2 = $("f7_g1_ring2");
            var disc = $("f7_g1_disc");
            var markRes = $("f7_g1_markRes");

            var nameEl = $("f7_g1_name");

            // group g1 spans the whole frame

            tl.fromTo(
              line,

              0.04,

            // implode into the center right on the kick — the covers are born from that point

              line,

                opacity: 0,
                filter: "blur(6px)",
                duration: 0.2,
                ease: "power3.in",
                immediateRender: false,
              },
              K1 - 0.16,

            // ============ K1 · mosaic-pack burst — 16 covers pop out from center ============
            var cells = [];
            rows.forEach(function (row, r) {
              Array.prototype.forEach.call(row.querySelectorAll(".f7-cell"), function (cell, c) {
                cells.push({ el: cell, bump: cell.querySelector(".f7-bump"), row: r, col: c });
              });
            });
            cells.forEach(function (o, i) {
              var ring = Math.floor(Math.abs(o.col - 3.5)); // 0 (center) … 3 (outer)
              var cx = GRID_LEFT + o.col * (SLOT + GAP) + SLOT / 2;
              var cy = ROW_TOP[o.row] + H / 2;
              var t0 = K1 + ring * 0.035 + o.row * 0.012;
              var rot0 = ((i * 37) % 29) - 14; // deterministic spin-in
              tl.fromTo(
                o.el,
                { x: CX - cx, y: CY - cy, scale: 0.18, rotation: rot0 },
                { x: 0, y: 0, scale: 1, rotation: 0, duration: 0.3, ease: "back.out(1.8)" },
                t0,
              );
              tl.fromTo(o.el, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, t0);
              o.ring = ring;
            });

            // ============ K1 · particle-burst — gold sparkles (behind the covers) ============
            var N = 36;
            for (var i = 0; i < N; i++) {
              var p = document.createElement("div");
              var isSpark = i % 3 === 0;
              var sz = isSpark ? 18 + (i % 4) * 5 : 6 + (i % 4) * 2;
              p.className = "f7-pt" + (isSpark ? " f7-spark" : "") + (i % 4 === 3 ? " f7-deep" : "");
              p.style.width = sz + "px";
              p.style.height = sz + "px";
              p.style.left = -sz / 2 + "px";
              p.style.top = -sz / 2 + "px";
              pBox.appendChild(p);
              var ang = (i / N) * Math.PI * 2 + i * 0.137; // golden-angle jitter
              var rad = 380 + (i % 5) * 110 + (i % 3) * 50;
              var dur = 0.95 + (i % 5) * 0.07;
              tl.fromTo(
                p,
                { x: 0, y: 0, scale: 1, rotation: 0, opacity: 1 },
                {
                  x: Math.cos(ang) * rad,
                  y: Math.sin(ang) * rad,
                  scale: 0,
                  rotation: isSpark ? ((i * 47) % 180) - 90 : 0,
                  opacity: 0,
                  duration: dur,
                  ease: "expo.out",

                K1 + (i % 6) * 0.01,

            cells.forEach(function (o) {

              tl.fromTo(o.bump, { scale: 1 }, { scale: 1.06, duration: 0.08, ease: "power2.out" }, tb);
              tl.fromTo(
                o.bump,
                { scale: 1.06 },
                { scale: 1, duration: 0.32, ease: "power2.out", immediateRender: false },
                tb + 0.08,

            });
            [ring1, ring2].forEach(function (rg, k) {
              var tr = K2 + k * 0.1;
              tl.fromTo(
                rg,
                { xPercent: -50, yPercent: -50, width: 140, height: 140 },
                {
                  xPercent: -50,
                  yPercent: -50,
                  width: 2600,
                  height: 2600,
                  duration: 1.05,
                  ease: "power2.out",
                },
                tr,
              );
              tl.fromTo(rg, { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none" }, tr);
              tl.fromTo(
                rg,
                { opacity: 1 },
                { opacity: 0, duration: 1.0, ease: "power1.in", immediateRender: false },
                tr + 0.03,
              );
            });

            // ============ K3 · grid recedes and parts; lockup blur-resolves in the cleared band ============
            tl.fromTo(
              grid,
              { scale: 1, opacity: 1 },
              { scale: 0.85, opacity: 0.35, duration: 0.9, ease: "power2.out" },
              K3,
            );
            // rows part to the top / bottom edges (inside the 96px safe area) so no text sits on a cover
            tl.fromTo(rows[0], { y: 0 }, { y: -300, duration: 0.9, ease: "power3.out" }, K3);
            tl.fromTo(rows[1], { y: 0 }, { y: 300, duration: 0.9, ease: "power3.out" }, K3);
            // slow counter-drift through the swell, settling dead still on the final kick
            tl.fromTo(rows[0], { x: 0 }, { x: -28, duration: K4 - K3, ease: "sine.inOut" }, K3);
            tl.fromTo(rows[1], { x: 0 }, { x: 28, duration: K4 - K3, ease: "sine.inOut" }, K3);

            // blur-resolve: heavy blur + slight scale-up + dim → crisp
            [
              [markRes, 0],
              [nameEl, 0.1],
              [wordEl, 0.18],
            ].forEach(function (pair) {
              tl.fromTo(
                pair[0],
                { filter: "blur(30px)", scale: 1.1, opacity: 0 },
                { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.75, ease: "power2.out" },
                K3 + pair[1],
              );
            });

            // ============ K4 · final kick — URL pops, gold disc pulse behind the mark ============
            tl.fromTo(
              urlEl,
              { scale: 0.7, y: 14 },
              { scale: 1, y: 0, duration: 0.42, ease: "back.out(2.2)" },

            );
            tl.fromTo(urlEl, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, K4);

            tl.fromTo(disc, { scale: 0.9 }, { scale: 1.75, duration: 0.72, ease: "power2.out" }, K4);
            tl.fromTo(disc, { opacity: 0 }, { opacity: 0.55, duration: 0.03, ease: "none" }, K4);
            tl.fromTo(

              { opacity: 0.55 },
              { opacity: 0, duration: 0.69, ease: "power2.out", immediateRender: false },

            tl.fromTo(markBump, { scale: 1 }, { scale: 1.04, duration: 0.08, ease: "power2.out" }, K4);

              { scale: 1.04 },
              { scale: 1, duration: 0.4, ease: "power2.out", immediateRender: false },
              K4 + 0.08,

            tl.set(g1, { autoAlpha: 0 }, END);

            tl.seek(0);
