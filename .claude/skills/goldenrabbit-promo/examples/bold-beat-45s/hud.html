        (function () {
          var D = 46.6;

          var BOOT = 0.906;
          var KICKS = [1.393, 1.858, 3.274, 3.762, 4.226, 6.107, 7.059, 11.308, 11.773, 12.237, 12.701, 13.189, 13.677, 14.141, 14.605, 15.07, 16.022, 16.486, 16.974, 17.438, 18.39, 18.878, 19.342, 19.807, 20.271, 20.735, 21.687, 22.639, 23.127, 24.056, 24.543, 25.472, 25.937, 26.424, 27.841, 28.305, 28.77, 29.257, 29.722, 30.186, 31.138, 31.602, 32.09, 32.554, 33.042, 33.506, 33.971, 34.435, 34.923, 35.387, 35.875, 36.339, 36.827, 37.268, 37.756, 38.22, 38.708, 39.172, 39.66, 40.124, 40.588, 42.493, 42.957, 45.325];
          var SERIES = [11.0, 16.6, 22.98, 27.7, 36.47];
          var END_SERIES = 41.0;
          var tl = gsap.timeline({ paused: true });

          // resting state (HUD hidden until the first downbeat)
          tl.set(["#hud_brand", "#hud_tcbox"], { scaleX: 0 }, 0);
          tl.set("#hud_band", { y: 80 }, 0);
          tl.set("#hud_prog", { scaleX: 0 }, 0);
          tl.set("#hud_markx", { x: 0 }, 0);

          // boot on the first downbeat
          tl.to("#hud_band", { y: 0, duration: 0.32, ease: "expo.out" }, BOOT);
          tl.to("#hud_brand", { scaleX: 1, duration: 0.18, ease: "power3.out" }, BOOT + 0.06);
          tl.to("#hud_tcbox", { scaleX: 1, duration: 0.18, ease: "power3.out" }, BOOT + 0.12);

          // continuous systems over the whole piece (transform-only, seek-safe)
          tl.to("#hud_prog", { scaleX: 1, duration: D, ease: "none" }, 0);
          tl.to("#hud_markx", { x: 1840, duration: D, ease: "none" }, 0);
          tl.fromTo("#hud_ticker", { x: 0 }, { x: -2600, duration: D, ease: "none" }, 0);

          // odometer timecode SS:FF at 30fps
          tl.to("#hud_f1", { y: -10 * H, duration: 1 / 3, ease: "steps(10)", repeat: 140 }, 0);
          // coarser digits switch with exact 0ms sets (no long stepped tweens)
          for (var k = 0; k * (1 / 3) < D; k++) {
            tl.set("#hud_f10", { y: -(k % 3) * H }, k / 3);
          }
          for (var sec = 0; sec < D; sec++) {
            tl.set("#hud_s1", { y: -(sec % 10) * H }, sec);
            if (sec % 10 === 0) tl.set("#hud_s10", { y: -(sec / 10) * H }, sec);
          }

          // beat pip: lights on every measured strong kick/snare
          KICKS.forEach(function (t) {
            tl.set("#hud_pip", { opacity: 1 }, t);
            tl.set("#hud_pip", { opacity: 0.18 }, t + 0.12);
          });

          // series indicator — 0ms swaps at frame boundaries
          SERIES.forEach(function (t, i) {
            var id = "#hud_ser" + i;
            var end = i + 1 < SERIES.length ? SERIES[i + 1] : END_SERIES;
            tl.set(id, { opacity: 1, scaleX: 0 }, t);
            tl.to(id, { scaleX: 1, duration: 0.14, ease: "power3.out" }, t);
            tl.set(id, { opacity: 0 }, end);
          });

          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["hud"] = tl;
        })();
