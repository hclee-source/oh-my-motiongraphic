          var MIX_POP = 0.838; // 17.438 snare: BARO·baro chip snaps in one beat after card 1
          var CONFETTI = 6.04; // 22.64 kick
          var HOLD_FROM = LAND[N - 1]; // hold 21.69 → 22.98

          // Template transition duration: gap × 0.32, clamped 0.12–0.42. Card 1 is capped by its
          // lead-in (it must land ON 16.97), and durations never grow so the deck keeps accelerating.
          var TD = [];
          for (var i = 0; i < N; i++) {
            var gap = i === 0 ? LAND[1] - LAND[0] : LAND[i] - LAND[i - 1];
            var d = Math.max(0.12, Math.min(0.42, gap * 0.32));
            if (i === 0) d = Math.min(d, LAND[0]);
            else d = Math.min(d, TD[i - 1]);
            TD.push(d);
          }

          // Template SLOT poses (depth column; behind cards tilt back, exit tumbles toward camera).
          var SLOT = {
            far: { x: 360, y: 380, z: -1080, rotX: 84, scale: 0.74, opacity: 0, zi: 60 },
            s3: { x: 280, y: 290, z: -820, rotX: 66, scale: 0.8, opacity: 0.32, zi: 70 },
            s2: { x: 195, y: 200, z: -560, rotX: 46, scale: 0.86, opacity: 0.58, zi: 80 },
            s1: { x: 105, y: 105, z: -290, rotX: 22, scale: 0.93, opacity: 0.85, zi: 90 },
            s0: { x: 0, y: 0, z: 0, rotX: 0, scale: 1.0, opacity: 1.0, zi: 100 },
            exit: { x: -90, y: 620, z: 420, rotX: -88, scale: 1.1, opacity: 0, zi: 110 },
          };
          function poseForRel(rel) {
            if (rel <= -1) return SLOT.exit;
            if (rel === 0) return SLOT.s0;
            if (rel === 1) return SLOT.s1;
            if (rel === 2) return SLOT.s2;
            if (rel === 3) return SLOT.s3;
            return SLOT.far;
          }
          function cardSel(k) {
            return "#f3_g1_card" + k;
          }

          var tl = gsap.timeline({ paused: true });

          // group gate (single group spans the whole frame; the host window closes it at 6.38)
          tl.set("#f3_g1", { autoAlpha: 1 }, 0);

          function poseTween(k, slot, t, dur, ease) {
            tl.set(cardSel(k), { zIndex: slot.zi }, t);
            tl.to(
              cardSel(k),
              {
                x: slot.x,
                y: slot.y,
                z: slot.z,
                rotationX: slot.rotX,
                scale: slot.scale,
                opacity: slot.opacity,
                force3D: true,
                duration: dur,
                ease: ease || "power2.inOut",
              },
              t,
            );
          }

          // ── initial pose: nothing landed; card j waits at rel j+1 (card 1 at s1) ──
          for (var j = 0; j < N; j++) {
            var s = poseForRel(j + 1);
            var props = {
              x: s.x,
              y: s.y,
              z: s.z,
              rotationX: s.rotX,
              scale: s.scale,
              opacity: s.opacity,
              zIndex: s.zi,
              force3D: true,
              "--wipe": 0,
            };
            gsap.set(cardSel(j), props);
            tl.set(cardSel(j), props, 0);
          }

          // initial hidden states for chips, counter digits, confetti; push at rest
          var chipBgs = ["#f3_g1_tag0_bg", "#f3_g1_mix0_bg", "#f3_g1_tag1_bg", "#f3_g1_tag2_bg", "#f3_g1_tag3_bg", "#f3_g1_tag4_bg"];
          var chipTxs = ["#f3_g1_tag0_tx", "#f3_g1_mix0_tx", "#f3_g1_tag1_tx", "#f3_g1_tag2_tx", "#f3_g1_tag3_tx", "#f3_g1_tag4_tx"];
          var counts = ["#f3_g1_count0", "#f3_g1_count1", "#f3_g1_count2", "#f3_g1_count3", "#f3_g1_count4"];
          var init = [
            [chipBgs, { scaleX: 0 }],
            [chipTxs, { opacity: 0 }],
            [counts, { opacity: 0, scale: 1 }],
            [["#f3_g1_cfx", "#f3_g1_cfdot"], { opacity: 0, scale: 0, x: 0, y: 0, rotation: 0 }],
            [["#f3_g1_push"], { scale: 1 }],
          ];
          for (var q = 0; q < init.length; q++) {
            gsap.set(init[q][0], init[q][1]);
            tl.set(init[q][0], init[q][1], 0);
          }

          // label-box pop: ink box scaleX 0→1 from the left edge (~0.12s), text cuts in at 0ms
          function chipPop(bg, tx, t) {
            tl.fromTo(bg, { scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out", immediateRender: false }, t);
            tl.set(tx, { opacity: 1 }, t + 0.05);
          }

          // ── per-landing orchestration (template): window [L-1 .. L+4] ──
          for (var L = 0; L < N; L++) {
            var dur = TD[L];
            var t = Math.max(0, LAND[L] - dur);
            for (var k = L - 1; k <= L + 4; k++) {
              if (k < 0 || k >= N) continue;
              var rel = k - L;
              var ease = rel === 0 ? "power3.out" : rel < 0 ? "power2.in" : "power2.inOut";
              poseTween(k, poseForRel(rel), t, dur, ease);
            }
            // solid face wipes in (ink band sweeps across it) as the card rolls up; done ON the landing
            tl.to(cardSel(L), { "--wipe": 1, duration: dur * 0.85, ease: "power2.inOut" }, t + dur * 0.15);

            // counter ticks at 0ms on the landing (each digit punches its own scale: seek-safe)
            if (L > 0) tl.set(counts[L - 1], { opacity: 0 }, LAND[L]);
            tl.set(counts[L], { opacity: 1 }, LAND[L]);
            tl.fromTo(counts[L], { scale: 1.16 }, { scale: 1, duration: 0.14, ease: "power3.out", immediateRender: false }, LAND[L]);
          }

          // chips snap in on their beats
          chipPop("#f3_g1_tag0_bg", "#f3_g1_tag0_tx", LAND[0]);
          chipPop("#f3_g1_mix0_bg", "#f3_g1_mix0_tx", MIX_POP);
          chipPop("#f3_g1_tag1_bg", "#f3_g1_tag1_tx", LAND[1]);
          chipPop("#f3_g1_tag2_bg", "#f3_g1_tag2_tx", LAND[2]);
          chipPop("#f3_g1_tag3_bg", "#f3_g1_tag3_tx", LAND[3]);
          chipPop("#f3_g1_tag4_bg", "#f3_g1_tag4_tx", LAND[4]);

          // ── hold 21.69 → 22.98: final card holds while the deck pushes in a hair ──
          tl.to("#f3_g1_push", { scale: 1.02, duration: DUR - HOLD_FROM, ease: "none" }, HOLD_FROM);

          // ── confetti ✕ ● pop with overshoot on 22.64, then drift slightly to the cut ──
          tl.set(["#f3_g1_cfx", "#f3_g1_cfdot"], { opacity: 1 }, CONFETTI);
          tl.fromTo("#f3_g1_cfx", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.22, ease: "back.out(2.4)", immediateRender: false }, CONFETTI);
          tl.fromTo("#f3_g1_cfdot", { scale: 0 }, { scale: 1, duration: 0.22, ease: "back.out(2.4)", immediateRender: false }, CONFETTI + 0.03);
          tl.to("#f3_g1_cfx", { x: 8, y: -12, duration: DUR - CONFETTI, ease: "none" }, CONFETTI);
          tl.to("#f3_g1_cfdot", { x: -6, y: -10, duration: DUR - CONFETTI, ease: "none" }, CONFETTI);

          window.__timelines[FID] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
