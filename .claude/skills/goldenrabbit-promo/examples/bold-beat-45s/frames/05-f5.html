      <script>
        (function () {
          var FID = "05-f5";
          function $(id) {
            return document.getElementById(id);

          // Frame-local anchors (track seconds − 27.70)
          var T = {
            title: 0.6, //   28.30 kick — '빠따' lands
            k: [1.56, 2.49, 3.44, 4.39], // 29.26 / 30.19 / 31.14 / 32.09 kicks — numeral + cover + caption
            cut: 4.98, //    32.68 g1 → g2 cut
            fill: 5.11, //   32.81 sustained fill starts — compress + marquee
            kickA: 5.342, // 33.042 kick
            kickB: 5.806, // 33.506 kick
            surge: 6.27, //  33.97 SURGE — yellow, statement slam, burst, confetti
            hit: 7.27, //    34.97 — ink, label-box snap, shake
            freeze: 8.18, // 35.88 — freeze-hold to 36.47 (frame end 8.77)
          };

          var REG = {
            ink: {
              "--f5-bg": "#0B0B0B",
              "--f5-title": "#FFE500",
              "--f5-fg": "#F2F0EA",
              "--f5-dim": "rgba(242,240,234,0.6)",
              "--f5-chipbg": "#F2F0EA",
              "--f5-chipfg": "#0B0B0B",
              "--f5-boxbg": "#FFE500",
              "--f5-boxfg": "#0B0B0B",
              "--f5-stroke": "#F2F0EA",
              "--f5-shadow": "0px 24px 60px rgba(0,0,0,0.6)",
              "--f5-conf": "#FFE500",
            },
            yellow: {
              "--f5-bg": "#FFE500",
              "--f5-title": "#0B0B0B",
              "--f5-fg": "#0B0B0B",
              "--f5-dim": "rgba(11,11,11,0.6)",
              "--f5-chipbg": "#0B0B0B",
              "--f5-chipfg": "#FFE500",
              "--f5-boxbg": "#0B0B0B",
              "--f5-boxfg": "#FFE500",
              "--f5-stroke": "#0B0B0B",
              "--f5-shadow": "14px 14px 0px rgba(11,11,11,1)",
              "--f5-conf": "#0B0B0B",
            },
            paper: {
              "--f5-bg": "#F2F0EA",
              "--f5-title": "#0B0B0B",
              "--f5-fg": "#0B0B0B",
              "--f5-dim": "rgba(11,11,11,0.6)",
              "--f5-chipbg": "#0B0B0B",
              "--f5-chipfg": "#F2F0EA",
              "--f5-boxbg": "#0B0B0B",
              "--f5-boxfg": "#F2F0EA",
              "--f5-stroke": "#0B0B0B",
              "--f5-shadow": "14px 14px 0px rgba(11,11,11,1)",
              "--f5-conf": "#0B0B0B",
            },
          };

          var tl = gsap.timeline({ paused: true });
          var frame = $("f5_frame");

          // 0ms palette flip: swap every register token at once
          function reg(name, t) {
            var v = {};
            for (var key in REG[name]) v[key] = REG[name][key];
            tl.set(frame, v, t);
          }

          var covers = [$("f5_cov1"), $("f5_cov2"), $("f5_cov3"), $("f5_cov4")];
          var nums = [$("f5_num1"), $("f5_num2"), $("f5_num3"), $("f5_num4")];
          var caps = [$("f5_cap1"), $("f5_cap2"), $("f5_cap3"), $("f5_cap4")];
          var capTitles = [$("f5_cap1t"), $("f5_cap2t"), $("f5_cap3t"), $("f5_cap4t")];
          var capBadges = [$("f5_cap1b"), $("f5_cap2b"), null, $("f5_cap4b")];

          // Cover poses, as offsets from the covers anchor (960, 600)
          var FAN = [ // g1: fanned stack, lower-centre, each tilted differently
            { x: -150, y: 110, r: -7 },
            { x: -50, y: 92, r: 4 },
            { x: 50, y: 106, r: -3 },
            { x: 150, y: 88, r: 6 },
          ];
          var TOSS = [ // where each card is thrown from (relative to its fan pose)
            { dx: -1100, dy: 520, r: -40 },
            { dx: 1100, dy: 480, r: 34 },
            { dx: -1000, dy: 560, r: -30 },
            { dx: 1000, dy: 520, r: 38 },
          ];
          var TIGHT = [ // g2 roll: compressed stack, centre
            { x: -36, y: -6, r: -6 },
            { x: -12, y: 6, r: -2 },
            { x: 12, y: -4, r: 2.5 },
            { x: 36, y: 8, r: 6 },
          ];
          var SMALL = [ // g2 surge: shrunk under the statement (centres ≈ y 812)
            { x: -66, y: 216, r: -8 },
            { x: -22, y: 208, r: -3 },
            { x: 22, y: 214, r: 3 },
            { x: 66, y: 206, r: 8 },
          ];
          var SMALL_SCALE = 0.56;

          // ============================ g1 — count-in ============================
          tl.set("#f5_g1", { autoAlpha: 1 }, 0);

          // 28.30: '빠따' slams, chip pops (label-box scaleX from the left), sub lands
          tl.set("#f5_title", { autoAlpha: 1 }, T.title);
          tl.fromTo("#f5_title", { scale: 1.28 }, { scale: 1, duration: 0.18, ease: "power4.out", immediateRender: false }, T.title);
          tl.set("#f5_chip", { autoAlpha: 1 }, T.title + 0.06);
          tl.fromTo("#f5_chip", { scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "expo.out", immediateRender: false }, T.title + 0.06);
          tl.set("#f5_sub", { autoAlpha: 1 }, T.title + 0.12);
          tl.fromTo("#f5_sub", { y: 14 }, { y: 0, duration: 0.18, ease: "power3.out", immediateRender: false }, T.title + 0.12);

          // 29.26 / 30.19 / 31.14 / 32.09: ground flips, numeral punches, a cover is tossed, caption swaps
          var REGSEQ = ["yellow", "ink", "paper", "yellow"];
          for (var i = 0; i < 4; i++) {
            var t = T.k[i];
            reg(REGSEQ[i], t);

            // counting-punch: replace the numeral at 0ms, punch-and-lock
            if (i > 0) tl.set(nums[i - 1], { autoAlpha: 0 }, t);
            tl.set(nums[i], { autoAlpha: 1 }, t);
            tl.fromTo(nums[i], { scale: 1.38 }, { scale: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, t);

            // tossed card: x and y on different eases so the path curves in like a thrown card
            var c = covers[i];
            tl.set(c, { autoAlpha: 1 }, t);
            tl.fromTo(c, { x: FAN[i].x + TOSS[i].dx, rotation: TOSS[i].r }, { x: FAN[i].x, rotation: FAN[i].r, duration: 0.34, ease: "power3.out", immediateRender: false }, t);
            tl.fromTo(c, { y: FAN[i].y + TOSS[i].dy }, { y: FAN[i].y, duration: 0.34, ease: "power2.out", immediateRender: false }, t);

            // overlay-pop: newest caption swaps at 0ms, its label box snaps open from the left
            if (i > 0) tl.set(caps[i - 1], { autoAlpha: 0 }, t);
            tl.set(caps[i], { autoAlpha: 1 }, t);
            tl.fromTo(capTitles[i], { scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "expo.out", immediateRender: false }, t);
            if (capBadges[i]) {
              tl.set(capBadges[i], { scale: 0 }, t);
              tl.fromTo(capBadges[i], { scale: 0 }, { scale: 1, duration: 0.22, ease: "back.out(2.4)", immediateRender: false }, t + 0.05);
            }
          }

          // ============================ g1 → g2 (0ms cut) ============================
          tl.set("#f5_g1", { autoAlpha: 0 }, T.cut);
          tl.set("#f5_g2b", { autoAlpha: 1 }, T.cut);
          tl.set("#f5_g2f", { autoAlpha: 1 }, T.cut);
          reg("ink", T.cut);

          // ============================ g2 — climax ============================
          // 32.81: covers compress into a tight stack (the same four objects)
          covers.forEach(function (cv, j) {
            tl.fromTo(
              cv,
              { x: FAN[j].x, y: FAN[j].y, rotation: FAN[j].r },
              { x: TIGHT[j].x, y: TIGHT[j].y, rotation: TIGHT[j].r, duration: 0.3, ease: "power3.inOut", immediateRender: false },
              T.fill + j * 0.02
            );
          });
          // kicks inside the fill: the stack thumps (set + settle, so earlier time stays at scale 1)
          [T.kickA, T.kickB].forEach(function (tk) {
            tl.set("#f5_covers", { scale: 1.06 }, tk);
            tl.to("#f5_covers", { scale: 1, duration: 0.22, ease: "power3.out" }, tk);
          });

          // marquee rows slide in behind the stack, then scroll ever faster (offsets are timeline tweens)
          tl.set("#f5_mq", { autoAlpha: 1 }, T.fill);
          var MQ = [
            { row: "#f5_mrow1", strip: "#f5_mstrip1", from: 2000, s0: 0, s1: -1500 }, //     ← left
            { row: "#f5_mrow2", strip: "#f5_mstrip2", from: -5400, s0: -1600, s1: -100 }, // → right
            { row: "#f5_mrow3", strip: "#f5_mstrip3", from: 2000, s0: 0, s1: -1500 }, //     ← left
          ];
          var mqSpan = T.surge - T.fill;
          MQ.forEach(function (m, j) {
            tl.set(m.row, { x: m.from }, T.fill); // parked off-frame until its staggered slide-in
            tl.fromTo(m.row, { x: m.from }, { x: 0, duration: 0.32, ease: "expo.out", immediateRender: false }, T.fill + j * 0.08);
            tl.fromTo(m.strip, { x: m.s0 }, { x: m.s1, duration: mqSpan, ease: "power2.in", immediateRender: false }, T.fill);
          });

          // 33.97 SURGE: system-replace — marquee gone, flip to YELLOW, statement slams
          tl.set("#f5_mq", { autoAlpha: 0 }, T.surge);
          reg("yellow", T.surge);
          tl.set("#f5_stmt", { autoAlpha: 1 }, T.surge);
          tl.fromTo("#f5_l1", { y: -70, scale: 1.3 }, { y: 0, scale: 1, duration: 0.16, ease: "power4.out", immediateRender: false }, T.surge);
          tl.fromTo("#f5_l2", { y: 70, scale: 1.3 }, { y: 0, scale: 1, duration: 0.16, ease: "power4.out", immediateRender: false }, T.surge);

          // the stack shrinks below the line
          covers.forEach(function (cv, j) {
            tl.fromTo(
              cv,
              { x: TIGHT[j].x, y: TIGHT[j].y, rotation: TIGHT[j].r, scale: 1 },
              { x: SMALL[j].x, y: SMALL[j].y, rotation: SMALL[j].r, scale: SMALL_SCALE, duration: 0.22, ease: "expo.out", immediateRender: false },
              T.surge
            );
          });

          // radial burst lines (ink) on an ellipse that clears the statement
          var burst = $("f5_burst");
          burst.innerHTML = ""; // idempotent if the frame script is ever evaluated twice
          var rays = [];
          var NR = 22;
          for (var r = 0; r < NR; r++) {
            var ang = r * (360 / NR) + 8;
            var rad = (ang * Math.PI) / 180;
            var rx = 480;
            var ry = 270;
            var rr = 1 / Math.sqrt(Math.pow(Math.sin(rad) / rx, 2) + Math.pow(Math.cos(rad) / ry, 2));
            var len = 90 + (r % 4) * 30 + (r % 3) * 14;
            var arm = document.createElement("div");
            arm.className = "f5-arm";
            arm.style.transform = "rotate(" + ang + "deg)";
            var ray = document.createElement("div");
            ray.className = "f5-ray";
            ray.style.height = len + "px";
            ray.style.top = -(rr + len) + "px";
            arm.appendChild(ray);
            burst.appendChild(arm);
            rays.push(ray);
          }
          rays.forEach(function (ry0, j) {
            var t0 = T.surge + (j % 5) * 0.014;
            tl.fromTo(ry0, { scaleY: 0, y: 0, opacity: 1 }, { scaleY: 1, y: -36, duration: 0.2, ease: "power4.out", immediateRender: false }, t0);
            tl.to(ry0, { y: -110, opacity: 0, duration: 0.34, ease: "power2.in" }, t0 + 0.26);
          });
          tl.set("#f5_burst", { autoAlpha: 0 }, T.surge + 0.75);

          // confetti ● ■ ▲ ◆ ✕ — pops outward with overshoot, then drifts until the freeze
          var CONF = [
            [230, 210], [420, 380], [180, 560], [400, 720], [250, 890], [620, 860], [1690, 200],
            [1500, 370], [1760, 560], [1520, 720], [1700, 880], [1310, 860], [546, 166], [1410, 178],
          ];
          CONF.forEach(function (p, j) {
            var el = $("f5_cf" + j);
            var dx = p[0] - 960;
            var dy = p[1] - 360;
            var d = Math.sqrt(dx * dx + dy * dy) || 1;
            var t0 = T.surge + 0.02 + (j % 6) * 0.012;
            var spin = (j % 2 ? -1 : 1) * (30 + (j % 3) * 15);
            tl.fromTo(
              el,
              { x: (-dx / d) * 110, y: (-dy / d) * 110, scale: 0, rotation: spin },
              { x: 0, y: 0, scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2.2)", immediateRender: false },
              t0
            );
            tl.fromTo(
              el,
              { y: 0, rotation: 0 },
              { y: 16 + (j % 3) * 9, rotation: (j % 2 ? 1 : -1) * (18 + (j % 4) * 9), duration: T.freeze - (t0 + 0.42), ease: "none", immediateRender: false },
              t0 + 0.42
            );
          });

          // 34.97: flip to INK, '빠르게.' snaps into a yellow label box, screen shake (≤10px)
          reg("ink", T.hit);
          tl.fromTo("#f5_l2box", { scaleX: 0 }, { scaleX: 1, duration: 0.1, ease: "expo.out", immediateRender: false }, T.hit);
          var AMP = [10, -8, 8, -6, 6, -4, 4, -2];
          AMP.forEach(function (a, j) {
            tl.to("#f5_shake", { x: a, y: a * 0.6 * (j % 2 ? 1 : -1), duration: 0.03, ease: "steps(1)" }, T.hit + j * 0.03);
          });
          tl.to("#f5_shake", { x: 0, y: 0, duration: 0.08, ease: "power2.out" }, T.hit + AMP.length * 0.03);

          // slow push on the statement, cut dead at 35.88 → freeze-hold to the frame end
          tl.fromTo("#f5_stmt", { scale: 1 }, { scale: 1.035, duration: T.freeze - T.hit, ease: "none", immediateRender: false }, T.hit);

          window.__timelines = window.__timelines || {};
          window.__timelines[FID] = tl;
          tl.seek(0);
        })();
      </script>
