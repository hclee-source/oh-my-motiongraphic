            yellow: { "--f2-bg": Y, "--f2-fg": K, "--f2-box-bg": K, "--f2-box-fg": Y, "--f2-chip-bg": K, "--f2-chip-fg": Y, "--f2-shadow": HARD },
            paper:  { "--f2-bg": P, "--f2-fg": K, "--f2-box-bg": K, "--f2-box-fg": P, "--f2-chip-bg": K, "--f2-chip-fg": Y, "--f2-shadow": HARD }
          };

          var tl = gsap.timeline({ paused: true });

          // ---- registers: 0ms flips ON the hits ----
          function reg(name, t) { tl.set("#f2_root", REG[name], t); }
          reg("ink", 0);
          reg("yellow", A_IGE);
          reg("ink", A_INK);
          reg("paper", A_PAPER);
          reg("yellow", A_YELLOW);

          // ---- group window (single group spans the whole frame) ----
          tl.set("#f2_g1", { autoAlpha: 1 }, 0);
          tl.set("#f2_g1", { autoAlpha: 0 }, D);

          // ---- phase A: hero lockup ----
          tl.set("#f2_hero", { autoAlpha: 1 }, 0);
          // '이게' — ink label box (yellow text) slams top-left
          tl.set("#f2_ige", { autoAlpha: 1 }, A_IGE);
          tl.fromTo("#f2_ige", { scale: 1.32, y: -24 }, { scale: 1, y: 0, duration: 0.18, ease: "expo.out", immediateRender: false }, A_IGE);
          tl.fromTo("#f2_ige_bg", { scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out", immediateRender: false }, A_IGE);
          // '되네?' — display crash beside it
          tl.set("#f2_dwrap", { autoAlpha: 1 }, A_DENE);
          tl.fromTo("#f2_dwrap", { scale: 1.7, x: 90 }, { scale: 1, x: 0, duration: 0.2, ease: "expo.out", immediateRender: false }, A_DENE);
          var shake = [10, -7, 4, 0];
          for (var s = 0; s < shake.length; s++) {
            tl.to("#f2_dene", { x: shake[s], duration: 0.035, ease: "none" }, A_DENE + 0.17 + s * 0.035);
          }
          // the '?' wobbles
          var wob = [-24, 18, -12, 7, -3, 0];
          for (var w = 0; w < wob.length; w++) {
            tl.to("#f2_q", { rotation: wob[w], duration: 0.065, ease: "sine.inOut" }, A_DENE + 0.06 + w * 0.065);
          }
          // pair chip 'IT WORKS?' under it
          tl.set("#f2_hero_chip", { autoAlpha: 1 }, A_DENE + 0.08);
          tl.fromTo("#f2_hero_chip_bg", { scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out", immediateRender: false }, A_DENE + 0.08);
          // cut
          tl.set("#f2_hero", { autoAlpha: 0 }, A_INK);

          // ---- phase B: title shrinks into the left column ----
          tl.set("#f2_col", { autoAlpha: 1 }, A_INK);
          tl.fromTo("#f2_col", { scale: 1.5, y: -170 }, { scale: 1, y: 0, duration: 0.3, ease: "expo.out", immediateRender: false }, A_INK);
          // '되네?' box re-snaps on each later flip (set + to keeps it seek-safe)
          var repop = [A_PAPER, A_YELLOW];
          for (var r = 0; r < repop.length; r++) {
            tl.set("#f2_col_dene_bg", { scaleX: 0 }, repop[r]);
            tl.to("#f2_col_dene_bg", { scaleX: 1, duration: 0.1, ease: "power3.out" }, repop[r]);
          }

          // ---- marquee texture: offsets are timeline tweens, accelerating into the 17s surge ----
          tl.set("#f2_mq", { autoAlpha: 0.18 }, A_INK);
          var MQ = [[0, -1000], [-1400, -400]];
          for (var m = 0; m < MQ.length; m++) {
            tl.fromTo("#f2_mq_r" + m, { x: MQ[m][0] }, { x: MQ[m][1], duration: D - A_INK, ease: "power1.in", immediateRender: false }, A_INK);
          }

          // ---- covers: tossed in from bottom-right, arc out up-left, ghost speed trails ----
          var IN = [
            { x: 1050, y: 820, r: 28 },
            { x: 1100, y: 700, r: -20 },
            { x: 1000, y: 860, r: 32 }
          ];
          var REST_R = [-6, 5, -3];
          var T_IN = [A_INK, A_PAPER, A_YELLOW];
          var T_OUT = [A_PAPER, A_YELLOW, null];
          var DUR_IN = 0.42, DUR_OUT = 0.38;
          var LAG = 0.028;
          var GHOST_OP = [0.35, 0.2, 0.1];

          function tossIn(sel, i, t) {
            tl.fromTo(sel,
              { x: IN[i].x, y: IN[i].y, rotation: IN[i].r },
              { x: 0, y: 0, rotation: REST_R[i], duration: DUR_IN, ease: "back.out(1.4)", immediateRender: false }, t);
          }
          function arcOut(sel, i, t) {
            // y ∝ t² (power1.in) and x ∝ t³ (power2.in): rises first, then bends left — a parabolic exit
            tl.fromTo(sel, { y: 0 }, { y: -1250, duration: DUR_OUT, ease: "power1.in", immediateRender: false }, t);
            tl.fromTo(sel, { x: 0, rotation: REST_R[i] }, { x: -1350, rotation: REST_R[i] - 34, duration: DUR_OUT, ease: "power2.in", immediateRender: false }, t);
          }

          for (var c = 0; c < 3; c++) {
            var main = "#f2_c" + (c + 1);
            var tIn = T_IN[c], tOut = T_OUT[c];
            // main card
            tl.set(main, { autoAlpha: 1 }, tIn);
            tossIn(main, c, tIn);
            if (tOut !== null) {
              arcOut(main, c, tOut);
              tl.set(main, { autoAlpha: 0 }, tOut + DUR_OUT);
            }
            // ghosts trail the same path, lagged by index
            for (var g = 1; g <= 3; g++) {
              var gs = "#f2_c" + (c + 1) + "_g" + g;
              var lag = LAG * g;
              tl.set(gs, { autoAlpha: GHOST_OP[g - 1] }, tIn + lag);
              tossIn(gs, c, tIn + lag);
              tl.set(gs, { autoAlpha: 0 }, tIn + 0.2);
              if (tOut !== null) {
                tl.set(gs, { autoAlpha: GHOST_OP[g - 1] }, tOut + lag);
                arcOut(gs, c, tOut + lag);
                tl.set(gs, { autoAlpha: 0 }, tOut + DUR_OUT + lag);
              }
            }
          }
          // kick pulses on the resting cover
          for (var k = 0; k < E_KICKS.length; k++) {
            var ks = "#f2_c" + E_KICKS[k][0], kt = E_KICKS[k][1];
            tl.to(ks, { scale: 1.035, duration: 0.06, ease: "power2.out" }, kt);
            tl.to(ks, { scale: 1, duration: 0.14, ease: "power2.out" }, kt + 0.06);
          }

          // ---- captions: label box + title + author, swapped at 0ms ----
          var CAP_IN = [E_CAP1, A_PAPER, A_YELLOW];
          var CAP_OUT = [A_PAPER, A_YELLOW, null];
          for (var q = 0; q < 3; q++) {
            var cap = "#f2_cap" + (q + 1);
            tl.set(cap, { autoAlpha: 1 }, CAP_IN[q]);
            tl.fromTo(cap + "_chip_bg", { scaleX: 0 }, { scaleX: 1, duration: 0.1, ease: "power3.out", immediateRender: false }, CAP_IN[q]);
            if (CAP_OUT[q] !== null) tl.set(cap, { autoAlpha: 0 }, CAP_OUT[q]);
          }

          // ---- 16.02: confetti ■ ▲ pop + whole stage punches in 4% ----
          tl.to("#f2_cam", { scale: 1.04, duration: 0.14, ease: "power3.out" }, A_PUNCH);
          tl.set("#f2_cf_sq", { autoAlpha: 1 }, A_PUNCH);
          tl.fromTo("#f2_cf_sq", { scale: 0, rotation: -60 }, { scale: 1, rotation: 12, duration: 0.26, ease: "back.out(2.4)", immediateRender: false }, A_PUNCH);
          tl.to("#f2_cf_sq", { y: -14, rotation: 22, duration: D - (A_PUNCH + 0.26), ease: "none" }, A_PUNCH + 0.26);
          tl.set("#f2_cf_tri", { autoAlpha: 1 }, E_TRI);
          tl.fromTo("#f2_cf_tri", { scale: 0, rotation: 70 }, { scale: 1, rotation: -8, duration: 0.26, ease: "back.out(2.4)", immediateRender: false }, E_TRI);
          tl.to("#f2_cf_tri", { y: -10, rotation: -16, duration: D - (E_TRI + 0.26), ease: "none" }, E_TRI + 0.26);

          window.__timelines["02-f2"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
