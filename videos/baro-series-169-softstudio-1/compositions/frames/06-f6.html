        <script>
          (function () {
            window.__timelines = window.__timelines || {};
            const tl = gsap.timeline({ paused: true });

            // ---- frame-local anchors (track second - 25.01) ----
            const T0 = 25.01;
            const loc = (t) => Math.round((t - T0) * 1000) / 1000;
            const DROP = [loc(25.5), loc(26.01), loc(26.49), loc(27.0)]; // 0.49 1.00 1.48 1.99 — one book per beat
            const KICK = loc(27.45); // 2.44 — un-stack into the row
            const LINE = loc(28.49); // 3.48 — slogan slides in
            const LOCK = loc(29.0);  // 3.99 — downbeat: lockup resolves (blur-resolve)
            const HOP = loc(29.49);  // 4.48 — hop sequence (ends 4.98), then hold still
            const END = 5.74;

            // ---- geometry ----
            const RAD = Math.PI / 180;
            const PSI = 12;          // pile pitched 12deg toward camera: rotationZ -90 + rotationY (90 - PSI)
            const THICK = 48;        // recipe thickness T
            const PILE_SY = 40;      // scene y in the pile (shared camera at 960,580)
            const PILE_Z = 340;      // pile pushed toward camera -> ~1.18x, uniform incl. thickness
            const SR = 0.68;         // row scale
            const ROW_X = [450, 790, 1130, 1470];
            const ROW_Y = 676;
            const JX = [-18, 14, -8, 20];       // x jitter by index
            const JR = [1.2, -0.8, 0.6, -1.4];  // resting roll jitter by index
            const TILT = [-7, 6, -5, 8];        // extra roll while falling
            const SH_Y = Math.round(287 * SR - 6 - 285); // per-book contact shadow under the scaled book
            const books = [1, 2, 3, 4].map((n) => ({
              scene: "#f6_bk" + n + "_scene",
              book: "#f6_bk" + n + "_book",
              shadow: "#f6_bk" + n + "_shadow",
            }));

            // ---- t = 0 state ----
            tl.set("#f6_g1", { autoAlpha: 1 }, 0);
            tl.set("#f6_pile_shadow", { opacity: 0, scaleX: 0.4 }, 0);
            tl.set("#f6_slogan", { y: 0, scale: 1 }, 0);
            tl.set("#f6_sl_a", { opacity: 0, y: 56 }, 0);
            tl.set("#f6_sl_b", { opacity: 0, y: 56 }, 0);
            tl.set("#f6_lockup", { autoAlpha: 0, scale: 1.08, filter: "blur(36px)" }, 0);
            books.forEach((b, i) => {
              const off = i - 1.5;
              tl.set(b.scene, { x: 0, y: PILE_SY - 900 }, 0); // waiting above the frame
              tl.set(
                b.book,
                {
                  x: JX[i],
                  y: -off * THICK * Math.cos(PSI * RAD),
                  z: PILE_Z + off * THICK * Math.sin(PSI * RAD),
                  rotationZ: -90 + JR[i] + TILT[i],
                  rotationY: 90 - PSI,
                  rotationX: 0,
                  scale: 1,
                },
                0,
              );
              tl.set(b.shadow, { opacity: 0, y: SH_Y, scaleX: 0.3 * SR, scaleY: SR }, 0);
            });

            // ---- 0.49 / 1.00 / 1.48 / 1.99: four books DROP into the pile, spines to camera ----
            const PS_SX = [0.6, 0.74, 0.87, 1];
            const PS_OP = [0.55, 0.72, 0.86, 1];
            books.forEach((b, i) => {
              const t = DROP[i];
              tl.to(b.scene, { y: PILE_SY, duration: 0.32, ease: "power2.in" }, t - 0.32);
              tl.to(b.book, { rotationZ: -90 + JR[i], duration: 0.36, ease: "power2.out" }, t - 0.32);
              // soft rebound on the beat
              tl.to(b.scene, { y: PILE_SY - 14, duration: 0.09, ease: "power2.out" }, t);
              tl.to(b.scene, { y: PILE_SY, duration: 0.14, ease: "power2.in" }, t + 0.09);
              // the books underneath give a little
              for (let j = 0; j < i; j++) {
                tl.to(books[j].scene, { y: PILE_SY + 4, duration: 0.05, ease: "power1.out" }, t);
                tl.to(books[j].scene, { y: PILE_SY, duration: 0.16, ease: "power2.out" }, t + 0.05);
              }
              tl.to("#f6_pile_shadow", { opacity: PS_OP[i], scaleX: PS_SX[i], duration: 0.22, ease: "power2.out" }, t - 0.03);
            });

            // ---- 2.44 kick: un-stack — each book stands up, turns to its FRONT, lands in the row ----
            tl.to("#f6_pile_shadow", { opacity: 0, scaleX: 1.12, duration: 0.3, ease: "power2.out" }, KICK);
            [3, 2, 1, 0].forEach((i, k) => {
              const t = KICK + k * 0.08; // top book leaves first
              const b = books[i];
              // x leads; the descent eases in so the book stays high while it rotates upright (keeps corners above y 960)
              tl.to(b.scene, { x: ROW_X[i] - 960, duration: 0.72, ease: "power3.out" }, t);
              tl.to(b.scene, { y: ROW_Y - 540, duration: 0.72, ease: "power2.inOut" }, t);
              tl.to(
                b.book,
                { x: 0, y: 0, z: 0, rotationZ: 0, rotationY: -18, rotationX: 6, scale: SR, duration: 0.72, ease: "power3.out" },
                t,
              );
              tl.to(b.shadow, { opacity: 1, scaleX: SR, duration: 0.45, ease: "power2.out" }, t + 0.25);
            });

            // ---- 3.48: '시작은,' (300) + '바로바로.' (700) slide in above the row ----
            tl.to("#f6_sl_a", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, LINE);
            tl.to("#f6_sl_b", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, LINE + 0.1);

            // ---- 3.99 downbeat: lockup blur-resolves top-center; slogan settles smaller between lockup and books ----
            tl.to("#f6_slogan", { y: 80, scale: 0.56, duration: 0.55, ease: "power3.out" }, LOCK - 0.06);
            tl.fromTo(
              "#f6_lockup",
              { autoAlpha: 0.25, scale: 1.08, filter: "blur(36px)" },
              { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power2.out", immediateRender: false },
              LOCK,
            );

            // ---- 4.48: tiny hop, left to right (book moves, its floor shadow stays and tightens) ----
            books.forEach((b, i) => {
