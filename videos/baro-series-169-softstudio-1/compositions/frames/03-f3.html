      <script>
        (function () {
          var D = 4.99;    // frame span length (track 11.01 → 16.00)
          var T0 = 11.01;  // span_sec[0]
          function L(trackT) { return Math.round((trackT - T0) * 1000) / 1000; }

          // audiomap anchors → frame-local seconds
          var A_KICK = L(11.45);  // 0.44  book turns in, column slides in
          var A_SPIN = L(11.96);  // 0.95  full 360° spin
          var A_LAND = L(13.0);   // 1.99  spin lands on the downbeat
          var A_OPEN = L(13.49);  // 2.48  cover opens on the hinge
          var A_LOCK = L(14.0);   // 2.99  count locks on 82 → HOLD starts
          var A_POP = L(15.21);   // 4.20  stickers pop (hold ends)

          var SCALE = 1.05;       // book scale (GSAP scale on #f3_book; face math untouched)
          var OPEN_X = 280;       // once open, the spread re-centres right of the title column (spine ≈ x 1235)
          var COUNT_START = A_OPEN + 0.08;
          var N_STEPS = 13;       // count steps (≈1 per frame), values baked into #f3_n0…#f3_n13
          var N_DOTS = 40;

          function ft(tl, target, from, to, at) {
            to.immediateRender = false;
            tl.fromTo(target, from, to, at);
          }

          // start pose, applied immediately so t=0 renders the right state even before any seek
          gsap.set("#f3_book", { x: 1350, y: 0, z: -900, rotationY: -120, rotationX: 18, scale: SCALE });
          gsap.set("#f3_bk_hinge", { rotationY: 0 });
          gsap.set("#f3_bk_shadow", { x: 0, scaleX: 0.3, opacity: 0 });
          gsap.set("#f3_behind_w", { x: 80 });

          var tl = gsap.timeline({ paused: true });

          // ---- g1 shown across the whole frame span ----
          tl.set("#f3_g1", { autoAlpha: 1 }, 0);

          // ---- DEPTH-TYPE drift (parallax against the book), comes to rest before the hold ----
          ft(tl, "#f3_behind_w", { x: 80 }, { x: 0, duration: A_LOCK - 0.05, ease: "power2.out" }, 0);

          // ---- left column slides in on the 11.45 kick ----
          var COL = ["#f3_kick", "#f3_title", "#f3_sub"];
          for (var c = 0; c < COL.length; c++) {
            ft(tl, COL[c], { x: -70, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.6, ease: "expo.out" }, A_KICK + c * 0.07);
          }

          // ---- ENTER: book turns in from the right (fully off-frame before), settles at rest ----
          ft(tl, "#f3_book",
            { x: 1350, z: -900, rotationY: -120, rotationX: 18 },
            { x: 0, z: 0, rotationY: -28, rotationX: 8, duration: A_SPIN - (A_KICK - 0.08), ease: "expo.out" },
            A_KICK - 0.08);
          ft(tl, "#f3_bk_shadow",
            { scaleX: 0.3, opacity: 0 },
            { scaleX: 1, opacity: 1, duration: A_SPIN - (A_KICK - 0.08), ease: "expo.out" },
            A_KICK - 0.08);

          // ---- SPIN: full 360° (spine → back → pages → front), small hop, lands on the 13.0 downbeat ----
          var SPIN_D = A_LAND - A_SPIN;          // 1.04
          var HALF = SPIN_D / 2;
          ft(tl, "#f3_book", { rotationY: -28 }, { rotationY: 332, duration: SPIN_D, ease: "power3.inOut" }, A_SPIN);
          ft(tl, "#f3_book", { y: 0 }, { y: -26, duration: HALF, ease: "power2.out" }, A_SPIN);
          ft(tl, "#f3_book", { y: -26 }, { y: 0, duration: HALF, ease: "power2.in" }, A_SPIN + HALF);
          ft(tl, "#f3_bk_shadow", { scaleX: 1, opacity: 1 }, { scaleX: 0.8, opacity: 0.7, duration: HALF, ease: "power2.out" }, A_SPIN);
          ft(tl, "#f3_bk_shadow", { scaleX: 0.8, opacity: 0.7 }, { scaleX: 1, opacity: 1, duration: HALF, ease: "power2.in" }, A_SPIN + HALF);

          // ---- OPEN: cover swings on the hinge; book eases to the open rest pose and re-centres ----
          var OPEN_D = A_LOCK - 0.01 - A_OPEN;   // 0.50 — fully settled before the hold
          ft(tl, "#f3_bk_hinge", { rotationY: 0 }, { rotationY: -155, duration: OPEN_D, ease: "power3.out" }, A_OPEN);
          ft(tl, "#f3_book",
            { rotationY: 332, rotationX: 8, x: 0 },
            { rotationY: 348, rotationX: 4, x: OPEN_X, duration: OPEN_D, ease: "power3.out" },
            A_OPEN);
          ft(tl, "#f3_bk_shadow",
            { x: 0, scaleX: 1 },
            { x: OPEN_X - 215, scaleX: 1.75, duration: OPEN_D, ease: "power3.out" },
            A_OPEN);

          // ---- STAT RING + COUNT-UP on page 1 (counting-punch), locks on 82 at the 14.0 downbeat ----
          var COUNT_D = A_LOCK - COUNT_START;    // 0.43
          for (var i = 1; i <= N_STEPS; i++) {
            var ts = (i === N_STEPS) ? A_LOCK : COUNT_START + COUNT_D * (i / N_STEPS);
            tl.set("#f3_n" + (i - 1), { autoAlpha: 0 }, ts);
            tl.set("#f3_n" + i, { autoAlpha: 1 }, ts);
          }
          // dot k fills when the eased count progress (quad-out) reaches (k+1)/40
          for (var k = 0; k < N_DOTS; k++) {
            var p = (k + 1) / N_DOTS;
            var x = 1 - Math.sqrt(1 - p);        // inverse of 1-(1-x)^2

          ft(tl, "#f3_bk_shadow", { scaleX: 1.78, opacity: 1 }, { scaleX: 1.73, opacity: 0.94, duration: D - 0.02 - F3, ease: "sine.inOut" }, F3);

          // ---- 15.21 kick: two pill stickers pop near the book ----
          ft(tl, "#f3_best", { autoAlpha: 0, scale: 0.2, rotation: -18 }, { autoAlpha: 1, scale: 1, rotation: -6, duration: 0.4, ease: "back.out(2.2)" }, A_POP);
          ft(tl, "#f3_author", { autoAlpha: 0, scale: 0.2, rotation: 14 }, { autoAlpha: 1, scale: 1, rotation: 4, duration: 0.4, ease: "back.out(2.2)" }, A_POP + 0.07);
