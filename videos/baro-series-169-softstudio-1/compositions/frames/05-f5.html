        (function () {
          var FID = "05-f5";
          var tl = gsap.timeline({ paused: true });

          // ---- frame-local anchors (track − 21.01) ----
          var T_ED = 0.26;                    // 21.36 editor rises
          var LSTART = [0.49, 0.98, 1.49];    // 21.50 / 21.99 / 22.50 one line per beat
          var LDUR = [0.40, 0.36, 0.34];      // each line finishes before the next beat
          var COUNTS = [18, 12, 10];            // chars per line
          var RUN = 1.95;                     // 22.96 kick: ▶ 실행
          var LAUNCH = 2.04;                  // 23.05 book launches
          var CAP = 2.30;                     // title rises as the book lands (holds ≥ 3 beats before the iris)
          var PILL = 2.49;                    // 23.50 pop: author sticker
          var NOD = 2.98;                     // 23.99 kick: book turns toward camera, avatar hops
          var BUMP = 3.66;                    // swell peaking ~3.82, before the iris (24.72→) hides the book
          var END = 4.0;

          // ---- group window ----
          tl.set("#f5_g1", { autoAlpha: 1 }, 0);
          tl.set("#f5_g1", { autoAlpha: 0 }, END);

          // ---- start states ----
          tl.set("#f5_ed", { y: 150, rotation: -1.5, autoAlpha: 0 }, 0);
          tl.set("#f5_av", { scale: 0 }, 0);
          tl.set(["#f5_mm1", "#f5_mm2", "#f5_mm3"], { scaleX: 0, transformOrigin: "0% 50%" }, 0);
          tl.set("#f5_prog", { scaleX: 0, transformOrigin: "0% 50%", autoAlpha: 1 }, 0);
          tl.set(["#f5_cap_a", "#f5_cap_b"], { y: 28, opacity: 0 }, 0);
          tl.set("#f5_pill", { scale: 0.3, opacity: 0 }, 0);
          tl.set("#f5_bkwrap", { autoAlpha: 0 }, 0);
          tl.set("#f5_book", { x: -830, y: 170, z: -600, scale: 0.12, rotationY: -200, rotationX: 26, rotationZ: -14 }, 0);
          tl.set("#f5_bk_hinge", { rotationY: 0 }, 0);
          tl.set(["#f5_bk_shadow", "#f5_bk_gh1", "#f5_bk_gh2"], { x: -830, y: -57, scaleX: 0.25, scaleY: 0.5, opacity: 0 }, 0);

          // ---- editor slides up into the left 60% ----
          tl.to("#f5_ed", { y: 0, rotation: 0, autoAlpha: 1, duration: 0.6, ease: "expo.out" }, T_ED);
          tl.to("#f5_av", { scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 0.42);
          tl.set("#f5_hl", { autoAlpha: 1, y: 0 }, 0.3);
          tl.set("#f5_l1r_", { autoAlpha: 1 }, 0.3);
          tl.set("#f5_l1r_", { autoAlpha: 0 }, LSTART[0]);

          // ---- typewriter: one line per beat, caret rides the last typed char ----
          for (var L = 0; L < 3; L++) {

              tl.set("#f5_l" + ln + "r" + i, { autoAlpha: 1 }, t);
              if (i < n - 1) tl.set("#f5_l" + ln + "r" + i, { autoAlpha: 0 }, t + step);
              else if (L < 2) tl.set("#f5_l" + ln + "r" + i, { autoAlpha: 0 }, LSTART[L + 1]);

          // final caret blinks on the beat grid (on at a beat, off half a beat later)
          var lastCaret = "#f5_l3r" + (COUNTS[2] - 1);
          [[2.24, 0], [2.49, 1], [2.73, 0], [2.98, 1], [3.22, 0], [3.49, 1], [3.73, 0]].forEach(function (b) {
            tl.set(lastCaret, { autoAlpha: b[1] }, b[0]);
          });

          // ---- 22.96 kick: ▶ 실행 depresses, terminal prints ----
          tl.to("#f5_run", { scale: 0.9, y: 2, duration: 0.06, ease: "power2.out" }, RUN);
          tl.to("#f5_run", { scale: 1, y: 0, duration: 0.35, ease: "back.out(3)" }, RUN + 0.06);
          tl.set("#f5_ring", { autoAlpha: 0.9, scale: 1 }, RUN);
          tl.to("#f5_ring", { autoAlpha: 0, scale: 1.3, duration: 0.45, ease: "power2.out" }, RUN);
          tl.set("#f5_tabdot", { autoAlpha: 0 }, RUN);
          tl.to("#f5_prog", { scaleX: 1, duration: 0.12, ease: "power2.in" }, RUN);
          tl.to("#f5_prog", { autoAlpha: 0, duration: 0.25, ease: "power1.out" }, RUN + 0.17);
          for (var k = 0; k < 15; k++) {
            tl.set("#f5_tc" + k, { opacity: 1 }, 2.02 + k * 0.012);
          }

          // ---- 23.05: book launches out of the editor toward camera (crash-zoom-in, soft landing) ----
          tl.set("#f5_bkwrap", { autoAlpha: 1 }, LAUNCH);
          tl.to("#f5_ed", { x: -14, duration: 0.07, ease: "power2.out" }, LAUNCH);
          tl.to("#f5_ed", { x: 0, duration: 0.4, ease: "back.out(2.5)" }, LAUNCH + 0.07);
          tl.to("#f5_book", { x: 0, z: 0, duration: 0.46, ease: "power3.out" }, LAUNCH);
          tl.to("#f5_book", { scale: 0.8, duration: 0.46, ease: "back.out(1.5)" }, LAUNCH);
          tl.to("#f5_book", { rotationY: -28, rotationX: 8, rotationZ: 0, duration: 0.52, ease: "power3.out" }, LAUNCH);
          tl.to("#f5_book", { y: -50, duration: 0.22, ease: "power2.out" }, LAUNCH);
          tl.to("#f5_book", { y: 0, duration: 0.32, ease: "back.out(2)" }, LAUNCH + 0.22);
          // flat contact shadow travels on the floor; two trailing ghost copies (flat only) = motion-blur feel
          tl.to("#f5_bk_shadow", { x: 0, duration: 0.46, ease: "power3.out" }, LAUNCH);
          tl.to("#f5_bk_shadow", { scaleX: 0.8, scaleY: 0.8, duration: 0.46, ease: "power2.out" }, LAUNCH);
          tl.to("#f5_bk_shadow", { opacity: 1, duration: 0.3, ease: "power1.out" }, LAUNCH);
          [["#f5_bk_gh1", 0.05, 0.5], ["#f5_bk_gh2", 0.1, 0.28]].forEach(function (g) {
            tl.to(g[0], { x: 0, duration: 0.46, ease: "power3.out" }, LAUNCH + g[1]);
            tl.to(g[0], { scaleX: 0.8, scaleY: 0.8, duration: 0.46, ease: "power2.out" }, LAUNCH + g[1]);
            tl.to(g[0], { opacity: g[2], duration: 0.14, ease: "power1.out" }, LAUNCH + g[1]);
            tl.to(g[0], { opacity: 0, duration: 0.22, ease: "power1.in" }, LAUNCH + g[1] + 0.18);
          });

          // ---- caption as the book lands, 23.50 sticker pop, 23.99 nod + avatar hop ----
          tl.to("#f5_cap_a", { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, CAP);
          tl.to("#f5_cap_b", { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, CAP + 0.07);
          tl.to("#f5_pill", { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.4)" }, PILL);
          tl.to("#f5_av", { y: -10, duration: 0.12, ease: "power2.out" }, NOD);
          tl.to("#f5_av", { y: 0, duration: 0.35, ease: "bounce.out" }, NOD + 0.12);
          tl.to("#f5_book", { rotationY: -18, duration: 0.22, ease: "power2.out" }, NOD);
          tl.to("#f5_book", { rotationY: -28, duration: 0.45, ease: "sine.inOut" }, NOD + 0.22);

          // ---- idle float, then the bump into the 24.96 snare ----
          tl.to("#f5_book", { y: -6, duration: 0.5, ease: "sine.inOut" }, NOD);
          tl.to("#f5_book", { y: 0, duration: 0.5, ease: "sine.inOut" }, NOD + 0.5);
          tl.to("#f5_book", { scale: 0.87, duration: 0.16, ease: "power2.out" }, BUMP);
          tl.to("#f5_book", { scale: 0.8, duration: 0.16, ease: "power2.inOut" }, BUMP + 0.16);
          tl.to("#f5_bk_shadow", { scaleX: 0.87, scaleY: 0.87, duration: 0.16, ease: "power2.out" }, BUMP);
          tl.to("#f5_bk_shadow", { scaleX: 0.8, scaleY: 0.8, duration: 0.16, ease: "power2.inOut" }, BUMP + 0.16);

          window.__timelines = window.__timelines || {};
          window.__timelines["05-f5"] = tl;
          tl.seek(0);
        })();
