      <script>
        (function () {
          var FID = "05-f5";
          function $(id) {
            return document.getElementById(id);
          }
          var INK = "#1E2687";
          var ACC = "#FFE500";
          var PAP = "#F2F0EA";

          // Frame-local anchors (track seconds − 25.19)
          var T = {
            tok: [0.0, 0.49, 0.98, 1.54, 2.07], // 25.19 25.68 26.17 26.73 27.26 — one token per beat
            ticket: 3.14, // 28.33 — ticket slides up, stamp thumps
            cut: 4.09, //   29.28 SURGE — 0ms flip to INK
            slam: 4.3, //   29.49 kick — '한방에!' MEGA slam, burst, confetti
            spark: 4.58, // 29.77 sparkle — second confetti wave
            hit: 5.07, //   30.26 — label-box pulse + shake
            freeze: 5.53, // 30.72 — freeze to frame end 6.02
          };

          // flat confetti shapes: ● ■ ▲ ○ ✕ ◆
          var SHAPES = [
            '<circle cx="50" cy="50" r="50" fill="currentColor"/>',
            '<rect x="6" y="6" width="88" height="88" fill="currentColor"/>',
            '<polygon points="50,4 98,92 2,92" fill="currentColor"/>',
            '<circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="18"/>',
            '<path d="M16 0 L50 34 L84 0 L100 16 L66 50 L100 84 L84 100 L50 66 L16 100 L0 84 L34 50 L0 16Z" fill="currentColor"/>',
            '<polygon points="50,0 100,50 50,100 0,50" fill="currentColor"/>',
          ];
          function makeShape(cls, shape, size, color) {
            var d = document.createElement("div");
            d.className = cls;
            d.style.width = size + "px";
            d.style.height = size + "px";
            d.style.color = color;
            d.innerHTML = '<svg viewBox="0 0 100 100">' + SHAPES[shape] + "</svg>";
            return d;
          }

          var tl = gsap.timeline({ paused: true });

          // ============================ g1 — package equation ============================
          tl.set("#f5_g1", { autoAlpha: 1 }, 0);

          var toks = [$("f5_tok0"), $("f5_tok1"), $("f5_tok2"), $("f5_tok3"), $("f5_tok4")];
          var pluses = [null, $("f5_plus1"), $("f5_plus2"), $("f5_plus3"), $("f5_plus4")];

          // one small confetti puff (● ■ ▲) only on the 5th token, placed above its box, index-derived
          var TCF = [
            { l: -6, t: -46, s: 26, sh: 0 },
            { l: 46, t: -78, s: 22, sh: 1 },
            { l: 98, t: -40, s: 28, sh: 2 },
          ];
          toks.forEach(function (tk, i) {
            var old = tk.querySelectorAll(".f5-tcf");
            for (var q = 0; q < old.length; q++) tk.removeChild(old[q]); // idempotent
            var t = T.tok[i];

            if (pluses[i]) {
              tl.set(pluses[i], { autoAlpha: 1 }, t);
              tl.fromTo(pluses[i], { scale: 0.5, filter: "blur(8px)" }, { scale: 1, filter: "blur(0px)", duration: 0.26, ease: "back.out(1.7)", immediateRender: false }, t);
            }
            // token 0 is visible by default (a 0→0 seek never fires a set at t=0); its entrance starts at t=0.
            // entrance = spring + blur-in (no scale slam)
            if (i > 0) tl.set(tk, { autoAlpha: 1 }, t);
            tl.fromTo(
              tk,
              { scale: 0.82, y: 36, filter: "blur(14px)" },
              { scale: 1, y: 0, filter: "blur(0px)", duration: 0.36, ease: "back.out(1.6)", immediateRender: i === 0 },
              i === 0 ? 0 : t + 0.02
            );

            if (i !== 4) return;
            TCF.forEach(function (c, j) {
              var k = i * 3 + j;
              var el = makeShape("f5-tcf", (c.sh + i) % 3, c.s, k % 3 === 1 ? ACC : INK);
              el.style.left = c.l + "%";
              el.style.top = c.t + "px";
              tk.appendChild(el);
              var dx = (j - 1) * 26;
              var spin = (k % 2 ? -1 : 1) * (40 + (k % 4) * 20);
              tl.fromTo(el, { scale: 0, x: 0, y: 30, rotation: 0, opacity: 1 }, { scale: 1, x: dx, y: 0, rotation: spin, duration: 0.24, ease: "back.out(2.4)", immediateRender: false }, t + 0.06 + j * 0.02);
              tl.to(el, { y: -26, opacity: 0, duration: 0.26, ease: "power2.in" }, t + 0.36 + j * 0.02);
            });
          });

          // 28.33: ticket slides up from the bottom, then the red 합격 stamp thumps onto its corner
          tl.set("#f5_ticketwrap", { autoAlpha: 1 }, T.ticket);
          tl.fromTo("#f5_ticket", { y: 420, rotation: 3 }, { y: 0, rotation: -1.2, duration: 0.3, ease: "power3.out", immediateRender: false }, T.ticket);
          var tStamp = T.ticket + 0.22;
          tl.set("#f5_stamp", { autoAlpha: 1 }, tStamp);
          tl.fromTo("#f5_stamp", { scale: 1.6, rotation: -24 }, { scale: 1, rotation: -14, duration: 0.12, ease: "power3.in", immediateRender: false }, tStamp);
          var SAMP = [8, -6, 6, -4, 3, -2];
          SAMP.forEach(function (a, j) {
            tl.to("#f5_g1shake", { x: a, y: a * 0.5 * (j % 2 ? 1 : -1), duration: 0.03, ease: "steps(1)" }, tStamp + 0.12 + j * 0.03);
          });
          tl.to("#f5_g1shake", { x: 0, y: 0, duration: 0.06, ease: "power2.out" }, tStamp + 0.12 + SAMP.length * 0.03);

          // ============================ g1 → g2 (0ms cut, flip to INK) ============================
          tl.set("#f5_g1", { autoAlpha: 0 }, T.cut);
          tl.set("#f5_g2", { autoAlpha: 1 }, T.cut);

          // 29.28: '노베이스도' lands upper-left
          tl.set("#f5_c1", { autoAlpha: 1 }, T.cut);
          tl.fromTo("#f5_c1", { x: -60, scale: 1.18 }, { x: 0, scale: 1, duration: 0.16, ease: "power4.out", immediateRender: false }, T.cut);

          // 29.49: '한방에!' MEGA slam (braam-punch)
          tl.set("#f5_c2", { autoAlpha: 1 }, T.slam);
          tl.fromTo("#f5_c2", { scale: 1.42 }, { scale: 1, duration: 0.16, ease: "power4.out", immediateRender: false }, T.slam);

          // two thin concentric accent rings expand from behind the word (anchor 960,660 = word centre), fading out
          var CX = 960;
          var CY = 660;
          ["#f5_ring0", "#f5_ring1"].forEach(function (rg, j) {
            var t0 = T.slam + j * 0.12;
            tl.set(rg, { autoAlpha: 1 }, t0);
            tl.fromTo(rg, { scale: 0.7, opacity: 1 }, { scale: 1.5, opacity: 0, duration: 0.75, ease: "power2.out", immediateRender: false }, t0);
          });

          // confetti ● ■ ▲ ○ ✕ ◆ — 10 pieces evenly spaced on an ellipse around the word (word box ≈ 1120×380
          // centred on 960,660; ellipse 820×290 clears its corners and stays below '노베이스도').
          // position / size / rotation derived from the index. even pieces on the kick, odd on the 29.77 sparkle.
          var conf = $("f5_conf");
          conf.innerHTML = "";
          var NC = 10;
          for (var k = 0; k < NC; k++) {
            var a = ((k * (360 / NC) + 18) * Math.PI) / 180;
            var px = CX + Math.sin(a) * 820;
            var py = CY - Math.cos(a) * 290;
            var size = 30 + ((k * 7) % 4) * 7;
            var col = k % 3 === 2 ? PAP : ACC;
            var el2 = makeShape("f5-cf", k % 6, size, col);
            el2.style.left = Math.round(px - size / 2) + "px";
            el2.style.top = Math.round(py - size / 2) + "px";
            conf.appendChild(el2);

            var t1 = (k % 2 ? T.spark : T.slam + 0.02) + (k % 5) * 0.012;
            var dx2 = px - CX;
            var dy2 = py - CY;
            var dd = Math.sqrt(dx2 * dx2 + dy2 * dy2) || 1;
            var rot0 = (k * 53) % 360;
            var spin2 = (k % 2 ? -1 : 1) * (30 + (k % 3) * 15);
            tl.fromTo(
              el2,
              { x: (-dx2 / dd) * 200, y: (-dy2 / dd) * 200, scale: 0, rotation: rot0 - spin2 },
              { x: 0, y: 0, scale: 1, rotation: rot0, duration: 0.4, ease: "back.out(1.8)", immediateRender: false },
              t1
            );
            tl.fromTo(

              { y: 0, rotation: rot0 },
              { y: 6 + (k % 3) * 4, rotation: rot0 + (k % 2 ? 1 : -1) * (16 + (k % 4) * 8), duration: T.freeze - (t1 + 0.4), ease: "none", immediateRender: false },
              t1 + 0.4
            );
          }

          tl.set("#f5_c2txt", { color: INK }, T.hit);
          tl.fromTo("#f5_c2box", { scaleX: 0 }, { scaleX: 1, duration: 0.1, ease: "expo.out", immediateRender: false }, T.hit);
          tl.fromTo("#f5_c2", { scale: 1.08 }, { scale: 1, duration: 0.26, ease: "power3.out", immediateRender: false }, T.hit);
          var AMP = [10, -8, 8, -6, 5, -3, 2];
          AMP.forEach(function (am, j) {
            tl.to("#f5_g2shake", { x: am, y: am * 0.6 * (j % 2 ? 1 : -1), duration: 0.03, ease: "steps(1)" }, T.hit + j * 0.03);
          });

          tl.set({}, {}, 6.02);

        })();
