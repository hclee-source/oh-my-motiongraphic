          // ---------------- group on (single group spans the whole frame) ----------------
          tl.set("#f4_g1", { autoAlpha: 1 }, 0);

          // 19.46: phone rises in with the -6deg tilt (settles after the wipe clears)
          tl.set("#f4_phone", { autoAlpha: 1, rotation: -12, y: 760 }, 0);
          tl.fromTo("#f4_phone", { y: 760 }, { y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 0);
          tl.fromTo("#f4_phone", { rotation: -12 }, { rotation: -6, duration: 0.62, ease: "back.out(1.6)", immediateRender: false }, 0);
          tl.set("#f4_q1", { autoAlpha: 1 }, 0);

          // 19.46: t1 types in (typewriter-reveal), done right as the wipe clears
          var chars = $("f4_t1").querySelectorAll(".f4-ch");
          var STEP = 0.06;
          for (var c = 0; c < chars.length; c++) {
            tl.set(chars[c], { opacity: 1 }, c * STEP);
          }
          tl.set("#f4_caret", { opacity: 1 }, 0);
          var caretBlinks = [0.42, 0.58, 0.74, 0.9, 1.06];
          caretBlinks.forEach(function (t, j) {
            tl.set("#f4_caret", { opacity: j % 2 ? 1 : 0 }, t);
          });
          tl.set("#f4_caret", { opacity: 0 }, 1.06);

          // timer: 0ms digit swaps on beats until the pause feature lands
          tl.set("#f4_timer", { textContent: "89:59", opacity: 1 }, 0);
          var TICKS = ["89:58", "89:57", "89:56", "89:55", "89:54", "89:53", "89:52", "89:51"];
          TICKS.forEach(function (txt, j) {
            tl.set("#f4_timer", { textContent: txt }, B[j + 1]);
          });

          // OMR marks: fill one bubble per beat, then advance the screen at 0ms on the off-beat
          function mark(id, t) {
            tl.set(id, { autoAlpha: 1 }, t);
            tl.fromTo(id, { scale: 0.3 }, { scale: 1, duration: 0.16, ease: "back.out(2.6)", immediateRender: false }, t);
          }
          mark("#f4_m1", B[1]);
          tl.set("#f4_q1", { autoAlpha: 0 }, B[1] + 0.24);
          tl.set("#f4_q2", { autoAlpha: 1 }, B[1] + 0.24);
          mark("#f4_m2", B[2]);
          tl.set("#f4_q2", { autoAlpha: 0 }, B[2] + 0.24);
          tl.set("#f4_q3", { autoAlpha: 1 }, B[2] + 0.24);
          mark("#f4_m3", B[3]);

          // 20.41: t2 lands, accent underline draws under '실전처럼'
          tl.set("#f4_t2", { autoAlpha: 1 }, B[2]);
          tl.fromTo("#f4_t2", { y: 46 }, { y: 0, duration: 0.2, ease: "power4.out", immediateRender: false }, B[2]);
          tl.fromTo("#f4_ul", { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: "expo.out", immediateRender: false }, B[2] + 0.1);

          // 22.31: REPLACE — t1 + t2 slide up and fade out (≤ 2 text chunks on screen at any time)
          var TC = B[6];
          tl.fromTo(["#f4_t1", "#f4_t2"], { y: 0, autoAlpha: 1 }, { y: -60, autoAlpha: 0, duration: 0.22, ease: "power2.in", stagger: 0.04, immediateRender: false }, TC - 0.12);

          // 22.31: counts blur-in on the same centre line — numerals tick 0 -> 5 with 0ms text swaps, then punch-and-lock
          tl.set("#f4_counts", { autoAlpha: 1 }, TC);
          tl.fromTo("#f4_counts", { y: 40, opacity: 0, filter: "blur(10px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false }, TC);
          [["#f4_na", 0], ["#f4_nb", 0.1]].forEach(function (n) {
            var t0 = TC + n[1];
            for (var k = 0; k <= 5; k++) {
              tl.set(n[0], { textContent: String(k) }, t0 + k * 0.065);
            }
            var tLand = t0 + 5 * 0.065;
            tl.fromTo(n[0], { scale: 1.35 }, { scale: 1, duration: 0.24, ease: "power4.out", immediateRender: false }, tLand);
          });
          // seek-safe: before the count starts both numerals read 0
          tl.set("#f4_na", { textContent: "0" }, 0);
          tl.set("#f4_nb", { textContent: "0" }, 0);

          // 23.29 / 23.75 / 24.24: phone toolbar icons light up one per beat, toast matches each
          [B[8], B[9], B[10]].forEach(function (t, j) {
            var on = "#f4_on" + j;
            tl.set(on, { autoAlpha: 1 }, t);
            tl.fromTo(on, { scale: 1.2 }, { scale: 1, duration: 0.22, ease: "back.out(2)", immediateRender: false }, t);
            if (j > 0) tl.set("#f4_on" + (j - 1), { autoAlpha: 0 }, t);

            if (j > 0) tl.set("#f4_toast" + (j - 1), { autoAlpha: 0 }, t);
            var toast = "#f4_toast" + j;
            tl.set(toast, { autoAlpha: 1 }, t);
            tl.fromTo(toast, { y: 18, scale: 0.9 }, { y: 0, scale: 1, duration: 0.22, ease: "back.out(1.8)", immediateRender: false }, t);
          });
          // pause lands: the timer stops at 89:51 and dims
          tl.set("#f4_timer", { opacity: 0.45 }, B[9]);

          // hold the full layout to the end (last ~0.3 s calm under the iris)
          tl.set({}, {}, DUR);

          window.__timelines = window.__timelines || {};
          window.__timelines[FID] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
