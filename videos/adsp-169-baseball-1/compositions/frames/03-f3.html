          tl.to("#f3_shake", { x: 0, duration: 0.06, ease: "power2.out" }, T_E3 + 0.33);

            const card = "#f3_card" + i;

            tl.fromTo(card, { x: 0 }, { x: -520 - k * 80, duration: EX_DUR, ease: "power2.in", immediateRender: false }, ex);

          (function (inner) {

            var OLD = 5.7800, NEW = 6.3600;
            function warp(p) {
              var t = p * NEW;
              for (var i = 1; i < MAP.length; i++) {
                if (t <= MAP[i][0] || i === MAP.length - 1) {
                  var a = MAP[i - 1], b = MAP[i], u = (t - a[0]) / (b[0] - a[0]);
                  return (a[1] + (b[1] - a[1]) * Math.max(0, Math.min(1, u))) / OLD;
