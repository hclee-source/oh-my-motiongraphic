            { y: 40, filter: "blur(14px)" },
            { y: 0, filter: "blur(0px)", duration: 1.2, ease: "power3.out", immediateRender: false },
            0);
          tl.fromTo("#f4_laptop",
            { opacity: 0 },
            { opacity: 1, duration: 0.6, ease: "power2.out", immediateRender: false },
            0);
          tl.fromTo("#f4_phone",
            { y: 40, filter: "blur(14px)" },
            { y: 0, filter: "blur(0px)", duration: 1.2, ease: "power3.out", immediateRender: false },
            0.15);
          tl.fromTo("#f4_phone",
            { opacity: 0 },
            { opacity: 1, duration: 0.6, ease: "power2.out", immediateRender: false },
            0.15);

          // whole frame: slow camera drift 1 → 1.03
          tl.fromTo("#f4_cam",
            { scale: 1 },
            { scale: 1.03, duration: DUR, ease: "power1.inOut", immediateRender: false },
            0);

          // 0.16 (15.90): 'a' resolves — blur 14→0, y 24→0, opacity 0→1
          tl.fromTo("#f4_ta",
            { opacity: 0, y: 24, filter: "blur(14px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.0, ease: "power3.out", immediateRender: false },
            0.16);

          // timer ticks down on both screens, one second per beat (0 ms swaps)
          BEATS.forEach(function (t, j) {
            var txt = "89:" + String(58 - j);
            tl.set(["#f4_ltimer", "#f4_ptimer"], { textContent: txt }, t);
          });

          // answer marks: same option fills on phone, laptop question and laptop sheet at once
          function mark(n, t) {
            ["#f4_lm" + n, "#f4_pm" + n].forEach(function (id) {
              tl.fromTo(id,
                { opacity: 0, scale: 0.6 },
                { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out", immediateRender: false },
                t);
            });
            tl.fromTo("#f4_s" + n,
              { opacity: 0, scale: 0.6 },
              { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out", immediateRender: false },
              t);
          }
          // progress bars (2/5 → 5/5) follow each mark
          function progress(from, to, t) {
            tl.fromTo(["#f4_lfill", "#f4_pfill"],
              { scaleX: from },
              { scaleX: to, duration: 0.25, ease: "power2.out", immediateRender: false },
              t);
          }
          // calm next-question swap (soft 0.18 s crossfade)
          function nextQ(a, b, t) {
            ["#f4_l", "#f4_p"].forEach(function (p) {
              tl.fromTo(p + "q" + a,
                { autoAlpha: 1 },
                { autoAlpha: 0, duration: 0.18, ease: "power2.out", immediateRender: false },
                t);
              tl.fromTo(p + "q" + b,
                { autoAlpha: 0 },
                { autoAlpha: 1, duration: 0.18, ease: "power2.out", immediateRender: false },
                t);
            });
          }

          mark(3, M1);
          progress(0.4, 0.6, M1);
          nextQ(3, 4, M1 + 0.42);

          mark(4, M2);
          progress(0.6, 0.8, M2);
          nextQ(4, 5, M2 + 0.40);

          mark(5, M3);
          progress(0.8, 1.0, M3);

          // 18.65: 'a' fades up and out; 'b' resolves in its place
          tl.fromTo("#f4_ta",
            { opacity: 1, y: 0, filter: "blur(0px)" },
            { opacity: 0, y: -20, filter: "blur(8px)", duration: 0.35, ease: "power2.in", immediateRender: false },
            SWAP - 0.2);
          tl.fromTo("#f4_tb",
            { opacity: 0, y: 24, filter: "blur(14px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.0, ease: "power3.out", immediateRender: false },
            SWAP);
          // counting 0 → 5 on both numerals with 0 ms text swaps over 0.4 s (no punch, no overshoot)
          for (var k = 1; k <= 5; k++) {
            tl.set(["#f4_n1", "#f4_n2"], { textContent: String(k) }, SWAP + k * 0.08);
          }

          // 20.65 → 21.08: dip everything to NIGHT; the line also defocuses
          tl.fromTo("#f4_tb",
            { filter: "blur(0px)" },
            { filter: "blur(8px)", duration: DUR - OUT, ease: "power2.in", immediateRender: false },
            OUT);
          tl.fromTo("#f4_fade",
            { opacity: 1 },
            { opacity: 0, duration: DUR - OUT, ease: "power2.in", immediateRender: false },
            OUT);

          window.__timelines = window.__timelines || {};
          window.__timelines[FID] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
