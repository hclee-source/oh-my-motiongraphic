        /* ---------- CSS-3D book (recipes/book3d.md, fN → f6; 430×588, T = 44; real back + spine images;
                       page block + top face SOLID #F4EFE6 per build_notes) ---------- */
        .f6-bk-scene { position: absolute; left: 640px; top: 520px; width: 0; height: 0; perspective: 2200px; }
        .f6-bk-shadow { position: absolute; left: -250px; top: 268px; width: 500px; height: 66px; border-radius: 50%;
          background: rgba(0, 0, 0, 0.45); filter: blur(22px); }
        .f6-bk-book { position: absolute; left: -215px; top: -294px; width: 430px; height: 588px; transform-style: preserve-3d; }
        .f6-bk-book > div, .f6-bk-hinge > div { position: absolute; }
        .f6-bk-back   { inset: 0; background: #A8364F; transform: rotateY(180deg) translateZ(22px); }
        .f6-bk-back img, .f6-bk-spine img { display: block; width: 100%; height: 100%; }
        .f6-bk-spine  { left: 193px; top: 0; width: 44px; height: 588px; background: #A8364F; transform: rotateY(-90deg) translateZ(215px); }
        .f6-bk-edge   { left: 193px; top: 0; width: 44px; height: 588px; transform: rotateY(90deg) translateZ(215px); background: #F4EFE6; }
        .f6-bk-top    { left: 0; top: 272px; width: 430px; height: 44px; transform: rotateX(90deg) translateZ(294px); background: #F4EFE6; }
        .f6-bk-bottom { left: 0; top: 272px; width: 430px; height: 44px; transform: rotateX(-90deg) translateZ(294px); background: #E9E1D2; }
        .f6-bk-page   { inset: 0; background: #F4EFE6; transform: translateZ(21px); }
        .f6-bk-hinge  { inset: 0; transform-origin: 0% 50%; transform: translateZ(22px); transform-style: preserve-3d; }
        .f6-bk-front  { position: absolute; inset: 0; width: 430px; height: 588px; object-fit: cover; backface-visibility: hidden; }
        .f6-bk-inside { inset: 0; background: #F4EFE6; transform: rotateY(180deg); backface-visibility: hidden; }

        /* light sweep: a leaf clip on the cover plane (inside the hinge, in front of the cover) —
           overflow:hidden sits on this leaf only, never on an ancestor of the 3D chain */
        .f6-bk-sweep  { inset: 0; overflow: hidden; transform: translateZ(1px); backface-visibility: hidden; pointer-events: none; }
        #f6_sweepband {
          position: absolute;
          left: 0;
          top: -120px;
          width: 230px;
          height: 828px;

        /* NIGHT plate in front of the book layer (darkness without touching the 3D chain) */
        #f6_plate {

          top: 0;
          width: 1920px;
          height: 1080px;

      <script>
        (function () {
          var D = 5.82;   // frame span length (track 26.00 → 31.82)
          var T0 = 26.0;  // span_sec[0]
          function L(trackT) { return Math.round((trackT - T0) * 1000) / 1000; }
          function R(t) { return Math.round(t * 1000) / 1000; }

          var A_IN = L(26.0);     // 0    — drop: book rises out of the night plate
          var A_SURGE = L(27.03); // 1.03 — light sweep + title
          var A_WHERE = L(29.0);  // 2.98→3.0 — where-to-buy
          var A_LOGO = L(30.02);  // 4.02 — logo lockup

          var tl = gsap.timeline({ paused: true });

          // ---- group span (single group covers the whole frame; no fade out — ends on the lockup) ----
          tl.set("#f6_g1", { autoAlpha: 1 }, 0);

          // ---- start states (t = 0) ----
          tl.set("#f6_book", { x: 0, y: 30, rotationY: -14, rotationX: 5, scale: 1 }, 0);
          tl.set("#f6_bk_hinge", { rotationY: 0 }, 0);
          tl.set("#f6_bk_shadow", { scaleX: 0.9, opacity: 0.6 }, 0);
          tl.set("#f6_plate", { opacity: 0.9 }, 0);
          tl.set("#f6_sweepband", { x: -330, rotation: 16 }, 0);
          tl.set(["#f6_t1", "#f6_t2", "#f6_where", "#f6_mark", "#f6_brand"], { autoAlpha: 0, y: 24, filter: "blur(14px)" }, 0);

          // ---- the product: continuous slow turn over the whole frame, never stops, no overshoot ----
          tl.to("#f6_book", { rotationY: -6, duration: D, ease: "power2.inOut" }, 0);
          // 26.00 — rises 30 px while the NIGHT plate lifts (0.9 → 0, 1.0 s)
          tl.to("#f6_book", { y: 0, duration: 1.0, ease: "power3.out" }, A_IN);
          tl.to("#f6_bk_shadow", { scaleX: 1, opacity: 1, duration: 1.0, ease: "power3.out" }, A_IN);
          tl.to("#f6_plate", { opacity: 0, duration: 1.0, ease: "power2.out" }, A_IN);

          // 27.03 (SURGE) — one light sweep across the cover, 1.4 s, then gone off the far edge
          tl.to("#f6_sweepband", { x: 560, duration: 1.4, ease: "power2.inOut" }, A_SURGE);

          // 27.03 — title resolves (blur 14 → 0, y 24 → 0), second line a breath later
          tl.to("#f6_t1", { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 1.0, ease: "power3.out" }, A_SURGE);
          tl.to("#f6_t2", { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 1.0, ease: "power3.out" }, R(A_SURGE + 0.14));

          // 29.00 — where-to-buy under it
          tl.to("#f6_where", { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, A_WHERE);

          // 30.02 — logo lockup (gold mark + wordmark) at the bottom of the column
          tl.to("#f6_mark", { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, A_LOGO);
          tl.to("#f6_brand", { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, R(A_LOGO + 0.08));

          // calm hold to the end; marker pins the timeline length to the span
          tl.set("#f6_g1", { autoAlpha: 1 }, D);

          window.__timelines = window.__timelines || {};
          window.__timelines["06-f6"] = tl;
          tl.seek(0);
        })();
