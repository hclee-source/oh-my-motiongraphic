            var el2 = makeShape("f5-cf", k % 6, size, col);
            el2.style.left = Math.round(px - size / 2) + "px";
            el2.style.top = Math.round(py - size / 2) + "px";
            conf.appendChild(el2);

            var t1 = (n >= 16 ? T.spark : T.slam + 0.02) + (k % 6) * 0.012;
            n++;
            var dx2 = px - CX;
            var dy2 = py - CY;
            var dd = Math.sqrt(dx2 * dx2 + dy2 * dy2) || 1;
            var rot0 = (k * 53) % 360;
            var spin2 = (k % 2 ? -1 : 1) * (30 + (k % 3) * 15);
            tl.fromTo(
              el2,
              { x: (-dx2 / dd) * 220, y: (-dy2 / dd) * 220, scale: 0, rotation: rot0 - spin2 },
              { x: 0, y: 0, scale: 1, rotation: rot0, duration: 0.4, ease: "back.out(2.2)", immediateRender: false },
              t1
            );
            tl.fromTo(
              el2,
              { y: 0, rotation: rot0 },
              { y: 10 + (k % 3) * 6, rotation: rot0 + (k % 2 ? 1 : -1) * (16 + (k % 4) * 8), duration: T.freeze - (t1 + 0.4), ease: "none", immediateRender: false },
              t1 + 0.4
            );
          }

          // 30.26: accent label-box snaps behind '한방에!' (text → ink), pulse + one screen-shake
          tl.set("#f5_c2txt", { color: INK }, T.hit);
          tl.fromTo("#f5_c2box", { scaleX: 0 }, { scaleX: 1, duration: 0.1, ease: "expo.out", immediateRender: false }, T.hit);
          tl.fromTo("#f5_c2", { scale: 1.08 }, { scale: 1, duration: 0.26, ease: "power3.out", immediateRender: false }, T.hit);
          var AMP = [10, -8, 8, -6, 5, -3, 2];
          AMP.forEach(function (am, j) {
            tl.to("#f5_g2shake", { x: am, y: am * 0.6 * (j % 2 ? 1 : -1), duration: 0.03, ease: "steps(1)" }, T.hit + j * 0.03);
          });
          tl.to("#f5_g2shake", { x: 0, y: 0, duration: 0.08, ease: "power2.out" }, T.hit + AMP.length * 0.03);

          // 30.72 → 31.21 freeze: everything stays on screen to the last frame (hard cut to finale)
          tl.set({}, {}, 6.02);

          window.__timelines = window.__timelines || {};
          window.__timelines[FID] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
