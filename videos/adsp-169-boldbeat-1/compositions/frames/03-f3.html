      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          // Frame-local anchors (track_t − 13.68)
          const T_E1 = 0.48; //   14.16 '완독' slam
          const T_E3 = 0.97; //   14.65 '= 2회독' slam + shake
          const T_SUB = 1.44; //  15.12 sub caption
          const STEP = [1.92, 2.41, 2.88, 3.36]; // 15.60 / 16.09 / 16.56 / 17.04 step cards
          const T_G2 = 3.85; //   17.53 steps clear, back cover tossed in
          const T_CAP2 = 4.80; // 18.48 cap2
          const T_CALM = 5.49; // last ~0.29 s calm (wipe out)
          const END = 5.78;

          // ---- group windows ----
          tl.set("#f3_g1", { autoAlpha: 1 }, 0);
          tl.set("#f3_g2", { autoAlpha: 1 }, T_G2); // 0ms cut in; g1's leftovers clear on arcs underneath
          tl.set("#f3_g1", { autoAlpha: 0 }, 4.3);
          tl.set("#f3_g2", { autoAlpha: 0 }, END);

          // ---- g1: POINT 01 label (non-essential, under the stripes) ----
          tl.set("#f3_label", { autoAlpha: 1 }, 0.2);
          tl.fromTo("#f3_label", { scaleX: 0 }, { scaleX: 1, duration: 0.14, ease: "power3.out" }, 0.2);

          // ---- braam-punch: '완독' slams ----
          tl.set("#f3_e1", { autoAlpha: 1 }, T_E1);
          tl.fromTo("#f3_e1", { scale: 1.45, x: -60 }, { scale: 0.96, x: 0, duration: 0.1, ease: "power4.out" }, T_E1);
          tl.to("#f3_e1", { scale: 1, duration: 0.3, ease: "elastic.out(1, 0.5)" }, T_E1 + 0.1);

          // '=' + '2회독' slam right, highlighter box sweeps from the left
          tl.set(["#f3_e2", "#f3_e3"], { autoAlpha: 1 }, T_E3);
          tl.fromTo("#f3_e2", { scale: 1.6 }, { scale: 1, duration: 0.12, ease: "power4.out" }, T_E3);
          tl.fromTo("#f3_e3", { scale: 1.45, x: 60 }, { scale: 0.96, x: 0, duration: 0.1, ease: "power4.out" }, T_E3);
          tl.to("#f3_e3", { scale: 1, duration: 0.3, ease: "elastic.out(1, 0.5)" }, T_E3 + 0.1);
          tl.fromTo("#f3_e3_box", { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, T_E3 + 0.04);
          // one short shake
          const SH = [12, -9, 6, -4, 2, 0];
          for (let i = 0; i < SH.length; i++) {
            tl.to("#f3_shake", { x: SH[i], y: (i % 2 ? -1 : 1) * SH[i] * 0.4, duration: 0.03, ease: "steps(1)" }, T_E3 + 0.02 + i * 0.03);
          }

          // sub caption
          tl.set("#f3_sub", { autoAlpha: 1 }, T_SUB);
          tl.fromTo("#f3_sub", { y: 30 }, { y: 0, duration: 0.2, ease: "power3.out" }, T_SUB);

          // ---- equation shrinks up to y≈230, sub follows to y≈350 ----
          const T_SHR = 1.72;
          tl.fromTo("#f3_eq", { y: 0, scale: 1 }, { y: -250, scale: 0.46, duration: 0.26, ease: "power3.inOut" }, T_SHR);
          tl.fromTo("#f3_sub", { y: 0 }, { y: -300, duration: 0.26, ease: "power3.inOut", immediateRender: false }, T_SHR);

          // ---- 4-step path: one card per beat, highlighter sweep + red ✓ + dashed connector ----
          for (let i = 0; i < 4; i++) {
            const t = STEP[i];
            const card = "#f3_card" + i;
            if (i > 0) {
              tl.fromTo("#f3_conn" + i, { scaleX: 0 }, { scaleX: 1, duration: 0.14, ease: "power2.out" }, t - 0.1);
            }
            tl.set(card, { autoAlpha: 1 }, t);
            tl.fromTo(card, { y: 70, scale: 0.9, rotation: i % 2 ? 2 : -2 }, { y: 0, scale: 1, rotation: 0, duration: 0.22, ease: "expo.out" }, t);
            tl.fromTo("#f3_hl" + i, { scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: "power2.out" }, t + 0.1);
            tl.fromTo("#f3_tag" + i, { scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out" }, t + 0.14);
            tl.fromTo("#f3_chkp" + i, { strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 0.18, ease: "power2.inOut" }, t + 0.2);
          }

          // ---- 3.85 staggered-exit: right-most card first, parabolic arcs up-left ----
          const EX_DUR = 0.32;
          for (let k = 0; k < 4; k++) {
            const i = 3 - k;
            const card = "#f3_card" + i;
            const ex = T_G2 + k * 0.05;
            tl.fromTo(card, { x: 0 }, { x: -520 - k * 80, duration: EX_DUR, ease: "power2.in", immediateRender: false }, ex);
            tl.fromTo(card, { y: 0 }, { y: -1000, duration: EX_DUR, ease: "power1.in", immediateRender: false }, ex);
            tl.fromTo(card, { rotation: 0 }, { rotation: -24 - k * 4, duration: EX_DUR, ease: "power1.in", immediateRender: false }, ex);
          }
          tl.fromTo(["#f3_conn1", "#f3_conn2", "#f3_conn3"], { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.08, ease: "none", immediateRender: false }, T_G2);
          tl.fromTo("#f3_eq", { y: -250 }, { y: -760, duration: 0.28, ease: "power3.in", immediateRender: false }, T_G2 + 0.04);
          tl.fromTo("#f3_sub", { y: -300 }, { y: -820, duration: 0.28, ease: "power3.in", immediateRender: false }, T_G2 + 0.08);
          tl.fromTo("#f3_label", { x: 0 }, { x: -420, duration: 0.24, ease: "power3.in", immediateRender: false }, T_G2 + 0.1);

          // ---- g2: back cover tossed in from the right, then a slow push ----
          const IN_DUR = 0.4;
          tl.set("#f3_cover_toss", { autoAlpha: 1 }, T_G2);
          tl.fromTo("#f3_cover_toss", { x: 1000, y: 120, rotation: 22 }, { x: 0, y: 0, rotation: -4, duration: IN_DUR, ease: "expo.out" }, T_G2);
          tl.fromTo("#f3_cover", { scale: 1 }, { scale: 1.08, duration: T_CALM - (T_G2 + IN_DUR), ease: "sine.inOut" }, T_G2 + IN_DUR);

          // cap1: mask slide-up per line, '다 있다' accent box sweeps from the left
          tl.fromTo("#f3_c1a", { y: 180 }, { y: 0, duration: 0.24, ease: "expo.out" }, T_G2 + 0.06);
          tl.fromTo("#f3_c1b", { y: 200 }, { y: 0, duration: 0.24, ease: "expo.out" }, T_G2 + 0.14);
          tl.fromTo("#f3_c1b_box", { scaleX: 0 }, { scaleX: 1, duration: 0.14, ease: "power3.out" }, T_G2 + 0.26);

          // cap2: three lines, staggered
          const C2 = ["#f3_c2a", "#f3_c2b", "#f3_c2c"];
          for (let i = 0; i < C2.length; i++) {
            const t = T_CAP2 + i * 0.08;
            tl.set(C2[i], { autoAlpha: 1 }, t);
            tl.fromTo(C2[i], { x: -40 }, { x: 0, duration: 0.2, ease: "power3.out" }, t);
          }

          // 5.49–5.78: calm hold for the wipe
          tl.set({}, {}, END);

          window.__timelines["03-f3"] = tl;
          tl.seek(0);
        })();
