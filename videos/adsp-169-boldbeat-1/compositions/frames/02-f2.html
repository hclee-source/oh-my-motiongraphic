      <script>
        (function () {
          var D = 5.76;   // frame span length (track 7.92 → 13.68)
          var T0 = 7.92;  // span_sec[0]
          function L(trackT) { return Math.round((trackT - T0) * 1000) / 1000; }
          function r3(v) { return Math.round(v * 1000) / 1000; }

          // storyboard anchors (track seconds → frame-local)
          var A_HIT = L(7.92);    // drop: accent ground + burst
          var A_BOOK = L(7.99);   // book crashes in
          var A_B2 = L(8.41);     // beat: burst retracts
          var A_A1 = L(8.45);     // '된다.' slams
          var A_B3 = L(8.87);     // beat: book pulse
          var A_A2 = L(9.36);     // '빠르게 따면.'
          var A_G2 = L(9.85);     // group cut: text clears left, book glides, kicker
          var A_T = L(10.31);     // title mask wipe
          var A_SUB = L(10.80);   // sub caption
          var A_SPIN = L(11.75);  // 360° Y-spin start
          var A_BACK = L(12.24);  // back cover facing
          var A_B12 = L(12.72);   // beat: spin resumes
          var A_LAND = L(13.21);  // spin lands on the front

          // ---- build burst wedges + tick ring (geometry from indices; deterministic) ----
          var NS = "http://www.w3.org/2000/svg";
          var bg = document.getElementById("f2_burst_g");
          var NW = 18;
          for (var i = 0; i < NW; i++) {
            var a = (i * 360 / NW + 4) * Math.PI / 180;
            var r0 = 300, r1 = (i % 2 === 0) ? 1550 : 1120;
            var h0 = 0.006, h1 = (i % 2 === 0) ? 0.06 : 0.045;
            var pts = [
              [Math.cos(a - h0) * r0, Math.sin(a - h0) * r0],
              [Math.cos(a - h1) * r1, Math.sin(a - h1) * r1],
              [Math.cos(a + h1) * r1, Math.sin(a + h1) * r1],
              [Math.cos(a + h0) * r0, Math.sin(a + h0) * r0]
            ].map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
            var poly = document.createElementNS(NS, "polygon");
            poly.setAttribute("points", pts);
            bg.appendChild(poly);
          }
          var rg = document.getElementById("f2_ring_g");
          var NT = 28;
          for (var j = 0; j < NT; j++) {
            var rect = document.createElementNS(NS, "rect");
            var len = (j % 2 === 0) ? 64 : 34;
            rect.setAttribute("x", "-5");
            rect.setAttribute("y", String(-430));
            rect.setAttribute("width", "10");
            rect.setAttribute("height", String(len));
            rect.setAttribute("transform", "rotate(" + (j * 360 / NT) + ")");
            rg.appendChild(rect);
          }

          var tl = gsap.timeline({ paused: true });

          // ---- group spans (0ms cut in; g1 stays up 0.3s past 9.85 only to finish the arc exit) ----
          tl.set("#f2_g1", { autoAlpha: 1 }, 0);
          tl.set("#f2_g2", { autoAlpha: 0 }, 0);
          tl.set("#f2_g2", { autoAlpha: 1 }, A_G2);
          tl.set("#f2_g2", { autoAlpha: 0 }, D);

          // ---- start states ----
          tl.set("#f2_cam", { scale: 1 }, 0);
          tl.set("#f2_burst", { autoAlpha: 1, scale: 0.34, rotation: 0 }, 0);
          tl.set("#f2_ring", { autoAlpha: 0, scale: 0.7, rotation: 0 }, 0);
          tl.set("#f2_g1_text", { x: 0, y: 0, rotation: 0 }, 0);
          tl.set("#f2_a1", { autoAlpha: 0, scale: 1, x: 0 }, 0);
          tl.set(["#f2_a2a", "#f2_a2b"], { autoAlpha: 0, scale: 1, y: 0 }, 0);
          tl.set("#f2_kicker", { autoAlpha: 0 }, 0);
          tl.set("#f2_kicker_bg", { scaleX: 0 }, 0);
          tl.set("#f2_t1", { clipPath: "inset(0% 100% 0% 0%)" }, 0);
          tl.set("#f2_t2", { autoAlpha: 0, scale: 1 }, 0);
          tl.set("#f2_t2_bg", { scaleX: 0 }, 0);
          tl.set("#f2_t2_tx", { clipPath: "inset(0% 100% 0% 0%)" }, 0);
          tl.set("#f2_sub", { autoAlpha: 0, y: 24 }, 0);
          tl.set("#f2_bk_scene", { x: 0, y: 0 }, 0);
          tl.set("#f2_book", { x: 0, y: 0, z: -1400, scale: 0.12, rotationY: -388, rotationX: 22 }, 0);
          tl.set("#f2_bk_hinge", { rotationY: 0 }, 0);
          
          // ---- 7.92 drop: ink burst wedges explode from the book's spot ----
          tl.to("#f2_burst", { scale: 1, duration: 0.34, ease: "expo.out" }, A_HIT);
          tl.to("#f2_burst", { rotation: 7, duration: 0.49, ease: "none" }, A_HIT);
          // 8.41: wedges retract behind the book, replaced by a settled tick ring
          tl.to("#f2_burst", { scale: 0.22, rotation: 12, duration: 0.16, ease: "power3.in" }, A_B2);
          tl.set("#f2_burst", { autoAlpha: 0 }, r3(A_B2 + 0.16));
          tl.set("#f2_ring", { autoAlpha: 1 }, A_A1);
          tl.to("#f2_ring", { scale: 1, duration: 0.3, ease: "back.out(2)" }, A_A1);
          tl.to("#f2_ring", { rotation: 16, duration: r3(A_G2 - A_A1), ease: "none" }, A_A1);
          tl.set("#f2_ring", { autoAlpha: 0 }, A_G2);

          // ---- 7.99 book crash-zoom from deep z, spinning in, lands in rest pose ----
          var B_LAND = r3(A_BOOK + 0.36);
          tl.to("#f2_book", { z: 0, scale: 1.1, duration: 0.36, ease: "power3.in" }, A_BOOK);
          tl.to("#f2_book", { rotationY: -28, rotationX: 8, duration: 0.36, ease: "power2.out" }, A_BOOK);
          tl.to("#f2_book", { scale: 0.96, duration: 0.07, ease: "power3.out" }, B_LAND);
          tl.to("#f2_book", { scale: 1, duration: 0.4, ease: "elastic.out(1, 0.55)" }, r3(B_LAND + 0.07));
                    
          // ---- 8.45 '된다.' braam slam (+ camera punch, short shake) ----
          tl.set("#f2_a1", { autoAlpha: 1 }, A_A1);
          tl.fromTo("#f2_a1", { scale: 1.42 }, { scale: 1, duration: 0.16, ease: "expo.out", immediateRender: false }, A_A1);
          var SH = [14, -10, 6, -3, 0];
          for (var s = 0; s < SH.length; s++) {
            tl.to("#f2_a1", { x: SH[s], duration: 0.035, ease: "none" }, r3(A_A1 + 0.14 + s * 0.035));
          }
          tl.fromTo("#f2_cam", { scale: 1.03 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, A_A1);

          // book kick pulses + idle bob while g1 holds
          var PUL = [A_B3, A_A2];
          for (var p = 0; p < PUL.length; p++) {
            tl.to("#f2_book", { scale: 1.04, duration: 0.06, ease: "power2.out" }, PUL[p]);
            tl.to("#f2_book", { scale: 1, duration: 0.16, ease: "power2.out" }, r3(PUL[p] + 0.06));
          }
          tl.to("#f2_book", { y: -6, duration: 0.44, ease: "sine.inOut" }, A_B3);
          tl.to("#f2_book", { y: 0, duration: 0.44, ease: "sine.inOut" }, r3(A_B3 + 0.44));

          // ---- 9.36 '빠르게' 800 / '따면.' 400 ----
          tl.set("#f2_a2a", { autoAlpha: 1 }, A_A2);
          tl.fromTo("#f2_a2a", { scale: 1.3, y: -16 }, { scale: 1, y: 0, duration: 0.16, ease: "expo.out", immediateRender: false }, A_A2);
          tl.set("#f2_a2b", { autoAlpha: 1 }, r3(A_A2 + 0.12));
          tl.fromTo("#f2_a2b", { scale: 1.3, y: -16 }, { scale: 1, y: 0, duration: 0.16, ease: "expo.out", immediateRender: false }, r3(A_A2 + 0.12));

          // ---- 9.85 cut: g1 text clears left on a parabolic arc (y ∝ t², x ∝ t³) ----
          var EX = 0.3;
          tl.to("#f2_g1_text", { y: -900, duration: EX, ease: "power1.in" }, A_G2);
          tl.to("#f2_g1_text", { x: -1500, rotation: -14, duration: EX, ease: "power2.in" }, A_G2);
          tl.set("#f2_g1", { autoAlpha: 0 }, r3(A_G2 + EX));

          // book glides to x≈1320
          tl.to("#f2_bk_scene", { x: 60, duration: 0.6, ease: "power3.inOut" }, A_G2);
          tl.to("#f2_book", { rotationY: -24, rotationX: 7, duration: 0.6, ease: "power3.inOut" }, A_G2);
          // idle bob until the spin
          var BOB0 = r3(A_G2 + 0.6);
          tl.to("#f2_book", { y: -6, duration: 0.65, ease: "sine.inOut" }, BOB0);
          tl.to("#f2_book", { y: 0, duration: 0.65, ease: "sine.inOut" }, r3(BOB0 + 0.65));

          // ---- g2: kicker label box at 9.85 ----
          tl.set("#f2_kicker", { autoAlpha: 1 }, r3(A_G2 + 0.04));
          tl.to("#f2_kicker_bg", { scaleX: 1, duration: 0.12, ease: "power3.out" }, r3(A_G2 + 0.04));

          // ---- 10.31 title mask wipe: line 1, then the ADsP ink box + text ----
          tl.to("#f2_t1", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "expo.out" }, A_T);
          tl.set("#f2_t2", { autoAlpha: 1 }, r3(A_T + 0.1));
          tl.to("#f2_t2_bg", { scaleX: 1, duration: 0.14, ease: "power3.out" }, r3(A_T + 0.1));
          tl.to("#f2_t2_tx", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "expo.out" }, r3(A_T + 0.16));

          // ---- 10.80 sub caption fades up ----
          tl.to("#f2_sub", { autoAlpha: 1, y: 0, duration: 0.36, ease: "power3.out" }, A_SUB);

          // ---- 11.75 one slow 360° Y-spin: front → spine → back (held a beat) → front at 13.21 ----
          tl.to("#f2_book", { rotationY: 165, duration: r3(A_BACK - A_SPIN + 0.08), ease: "power3.inOut" }, A_SPIN);
          tl.to("#f2_book", { rotationY: 196, duration: r3(A_B12 - A_BACK - 0.08), ease: "none" }, r3(A_BACK + 0.08));
          tl.to("#f2_book", { rotationY: 336, duration: r3(A_LAND - A_B12), ease: "power3.inOut" }, A_B12);
                    
          // 12.72 beat: ADsP lockup pulse
          tl.to("#f2_t2", { scale: 1.04, duration: 0.06, ease: "power2.out" }, A_B12);
          tl.to("#f2_t2", { scale: 1, duration: 0.2, ease: "power2.out" }, r3(A_B12 + 0.06));

          // 13.21 → end: calm hold (stripes transition overlay covers the last ~0.29s)

          window.__timelines = window.__timelines || {};
          window.__timelines["02-f2"] = tl;
          tl.seek(0);
        })();
      </script>
