<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .frame { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="32"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-f1"
        class="frame"
        data-composition-id="01-f1"
        data-composition-src="compositions/frames/01-f1.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-02-f2"
        class="frame"
        data-composition-id="02-f2"
        data-composition-src="compositions/frames/02-f2.html"
        data-start="5"
        data-duration="5.85"
        data-track-index="1"
      ></div>

      <div
        id="el-03-f3"
        class="frame"
        data-composition-id="03-f3"
        data-composition-src="compositions/frames/03-f3.html"
        data-start="10.85"

        data-track-index="1"
      ></div>

      <div
        id="el-04-f4"
        class="frame"

      ></div>

      <div
        id="el-05-f5"
        class="frame"
        data-composition-id="05-f5"

        data-track-index="1"
      ></div>

      <div
        id="el-06-f6"
        class="frame"
        data-composition-id="06-f6"
        data-composition-src="compositions/frames/06-f6.html"
        data-start="27.61"
        data-duration="4.39"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <div
        id="el-hud"
        class="frame"
        data-composition-id="hud"
        data-composition-src="compositions/hud.html"
        data-start="0"
        data-duration="32.0"
        data-track-index="2"
      ></div>

      <audio id="el-bgm" src="assets/bgm.mp3" data-start="0" data-duration="32"
        data-track-index="11" data-volume="0.9"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
