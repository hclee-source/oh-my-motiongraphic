              "--f5-mono": "#040404",
              "--f5-boxbg": "#040404",
              "--f5-boxfg": "#F2F0EA",
              "--f5-conf": "#040404",
            },
            yellow: {
              "--f5-bg": "#FFE500",
              "--f5-fg": "#040404",
              "--f5-dim": "rgba(4,4,4,0.6)",
              "--f5-mono": "#040404",
              "--f5-boxbg": "#040404",
              "--f5-boxfg": "#FFE500",
              "--f5-conf": "#040404",
            },
          };

          var tl = gsap.timeline({ paused: true });
          var frame = $("f5_frame");

          // palette-flip: swap every register token at once, 0ms
          function reg(name, t) {
            var v = {};
            for (var key in REG[name]) v[key] = REG[name][key];
            tl.set(frame, v, t);
          }

          // ============================ g1 — type → toss ============================
          // t=0: INK, kicker + ready caret already on (CSS); g1 visible from 0.

          // typewriter: one syllable per hit; the caret rides just past the newest syllable
          var syl = [$("f5_s0"), $("f5_s1"), $("f5_s2"), $("f5_s3"), $("f5_s4")];
          var car = [$("f5_c0"), $("f5_c1"), $("f5_c2"), $("f5_c3"), $("f5_c4")];
          var typeT = T.type1.concat(T.type2);
          var prevCaret = $("f5_cpre");
          for (var i = 0; i < syl.length; i++) {
            var ts = typeT[i];
            tl.set(syl[i], { autoAlpha: 1 }, ts);
            tl.set(prevCaret, { autoAlpha: 0 }, ts);
            tl.set(car[i], { autoAlpha: 1 }, ts);
            prevCaret = car[i];
          }
          // caret blinks on the 16ths after '딩', then hands over to the mono line
          var tc = typeT[4];
          tl.set(car[4], { autoAlpha: 0 }, tc + SIXT);
          tl.set(car[4], { autoAlpha: 1 }, tc + 2 * SIXT);
          tl.set(car[4], { autoAlpha: 0 }, T.mono);

          // mono line types char by char
          var NM = 13;
          for (var m = 0; m < NM; m++) {
            tl.set($("f5_m" + m), { autoAlpha: 1 }, T.mono + m * 0.024);
          }
          // the trailing '_' blinks on half-beats until the surge (finite tl.set toggles)
          var under = $("f5_m12");
          for (var k = 1; T.chip + k * HALF < T.surge - 0.05; k++) {
            tl.set(under, { autoAlpha: k % 2 ? 0 : 1 }, T.chip + k * HALF);
          }

          // pair chip pops on the riser (label-box scaleX from the left)
          tl.set("#f5_chip", { autoAlpha: 1 }, T.chip);
          tl.fromTo("#f5_chip", { scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "expo.out", immediateRender: false }, T.chip);

          // sprite pops in on the right with the first syllable, bumps on the next hits
          tl.set("#f5_spr", { autoAlpha: 1 }, T.type1[0]);
          tl.fromTo("#f5_spr", { scale: 0.4, rotation: -10 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(1.7)", immediateRender: false }, T.type1[0]);
          // bumps = 0ms set + settle (a backward seek reverts the set, so the gap stays at rest)
          [T.type2[0], T.mono].forEach(function (tb) {
            tl.set("#f5_spr", { scale: 1.07 }, tb);
            tl.to("#f5_spr", { scale: 1, duration: 0.22, ease: "power2.out" }, tb);
          });
          tl.set("#f5_spr", { y: -22, rotation: 4 }, T.chip);
          tl.to("#f5_spr", { y: 0, rotation: 0, duration: 0.13, ease: "power2.out" }, T.chip);

          // ---- 23.57 kick: 0ms flip to PAPER; the feathered sprite cuts out; text re-inks ----
          reg("paper", T.flip);
          tl.set("#f5_spr", { autoAlpha: 0 }, T.flip);

          // cover tossed in centre-right: x and y on different eases so the path curves
          tl.set("#f5_cover", { autoAlpha: 1 }, T.flip);
          tl.fromTo("#f5_cover", { x: 1100, rotation: 30 }, { x: 0, rotation: -4, duration: 0.34, ease: "power3.out", immediateRender: false }, T.flip);
          tl.fromTo("#f5_cover", { y: 520 }, { y: 0, duration: 0.34, ease: "power2.out", immediateRender: false }, T.flip);

          // caption label box snaps open under it (holds 4 beats to the surge)
          tl.set("#f5_cap", { autoAlpha: 1 }, T.flip + 0.06);
          tl.fromTo("#f5_capt", { scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "expo.out", immediateRender: false }, T.flip + 0.06);
          tl.fromTo("#f5_capa", { y: 14 }, { y: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, T.flip + 0.06);

          // the cover thumps on the two marquee kicks
          [T.mq1, T.mq2].forEach(function (tk) {
            tl.set("#f5_cvpos", { scale: 1.05 }, tk);
            tl.to("#f5_cvpos", { scale: 1, duration: 0.22, ease: "power3.out" }, tk);
          });

          // ---- outline marquee rows slide in behind, opposite directions, accelerating into the surge ----
          var MQ = [
            { row: "#f5_mrow1", strip: "#f5_mstrip1", t: T.mq1, from: 1920, s0: 0, s1: -1200 }, //     ← left
            { row: "#f5_mrow2", strip: "#f5_mstrip2", t: T.mq2, from: -5600, s0: -2400, s1: -1500 }, // → right
          ];
          MQ.forEach(function (q) {
            tl.set(q.row, { autoAlpha: 1 }, q.t);
            tl.fromTo(q.row, { x: q.from }, { x: 0, duration: 0.32, ease: "expo.out", immediateRender: false }, q.t);
            tl.fromTo(q.strip, { x: q.s0 }, { x: q.s1, duration: T.surge - q.t, ease: "power2.in", immediateRender: false }, q.t);
          });

          // ============================ g1 → g2 (0ms cut on the SURGE) ============================
          tl.set("#f5_g1", { autoAlpha: 0 }, T.surge);
          tl.set("#f5_g2", { autoAlpha: 1 }, T.surge);
          reg("yellow", T.surge);

          // ============================ g2 — climax ============================
          // braam-punch: the two halves slam together (400 over 800 weight contrast)
          tl.fromTo("#f5_l1", { y: -70, scale: 1.3 }, { y: 0, scale: 1, duration: 0.16, ease: "power4.out", immediateRender: false }, T.surge);
          tl.fromTo("#f5_l2", { y: 70, scale: 1.3 }, { y: 0, scale: 1, duration: 0.16, ease: "power4.out", immediateRender: false }, T.surge);
          // snare thumps keep the HIGH phase alive
          [T.snA, T.snB].forEach(function (tn) {
            tl.set("#f5_l2", { scale: 1.04 }, tn);
            tl.to("#f5_l2", { scale: 1, duration: 0.2, ease: "power2.out" }, tn);
          });

          // radial burst lines (ink) on an ellipse that clears the statement
          var burst = $("f5_burst");
          burst.innerHTML = ""; // idempotent if the frame script is ever evaluated twice
          var rays = [];
          var NR = 22;
          var RX = 720;
          var RY = 310;
          var DRIFT = 36;
          for (var r = 0; r < NR; r++) {
            var ang = r * (360 / NR) + 8;
            var rad = (ang * Math.PI) / 180;
            var sn = Math.sin(rad);
            var cs = Math.cos(rad);
            var rr = 1 / Math.sqrt(Math.pow(sn / RX, 2) + Math.pow(cs / RY, 2));
            var len = 90 + (r % 4) * 30 + (r % 3) * 14;
            // keep the peak ray inside y 110–975 / x 40–1880 (HUD band + edges)
            var lim = 1e9;
            if (cs > 0.01) lim = Math.min(lim, (540 - 110) / cs);
            if (cs < -0.01) lim = Math.min(lim, (975 - 540) / -cs);
            if (Math.abs(sn) > 0.01) lim = Math.min(lim, (960 - 40) / Math.abs(sn));
            len = Math.max(40, Math.min(len, lim - rr - DRIFT));
            var arm = document.createElement("div");
            arm.className = "f5-arm";
            arm.style.transform = "rotate(" + ang + "deg)";
            var ray = document.createElement("div");
            ray.className = "f5-ray";
            ray.style.height = len + "px";
            ray.style.top = -(rr + len) + "px";
            arm.appendChild(ray);
            burst.appendChild(arm);
            rays.push(ray);
          }
          rays.forEach(function (ry0, j) {
            var t0 = T.surge + (j % 5) * 0.014;
            tl.fromTo(ry0, { scaleY: 0, y: 0, opacity: 1 }, { scaleY: 1, y: -DRIFT, duration: 0.2, ease: "power4.out", immediateRender: false }, t0);
            tl.to(ry0, { y: -110, opacity: 0, duration: 0.34, ease: "power2.in" }, t0 + 0.26);
          });
          tl.set("#f5_burst", { autoAlpha: 0 }, T.surge + 0.8);

          // particle-burst: geometric confetti ● ■ ▲ ◆ ✕ pops outward with overshoot, then drifts
          var CONF = [
            [200, 230], [390, 360], [170, 540], [370, 700], [240, 870], [640, 880], [1690, 220],
            [1550, 360], [1760, 550], [1560, 720], [1700, 880], [1300, 870], [560, 170], [1400, 175],
          ];
          CONF.forEach(function (p, j) {
            var el = $("f5_cf" + j);
            var dx = p[0] - 960;
            var dy = p[1] - 540;
            var d = Math.sqrt(dx * dx + dy * dy) || 1;
            var t0 = T.surge + 0.02 + (j % 6) * 0.012;
            var spin = (j % 2 ? -1 : 1) * (30 + (j % 3) * 15);
            tl.fromTo(
              el,
              { x: (-dx / d) * 110, y: (-dy / d) * 110, scale: 0, rotation: spin },
              { x: 0, y: 0, scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2.2)", immediateRender: false },
              t0
            );
            tl.fromTo(
              el,
              { y: 0, rotation: 0 },
              { y: 16 + (j % 3) * 9, rotation: (j % 2 ? 1 : -1) * (18 + (j % 4) * 9), duration: T.bump - (t0 + 0.42), ease: "none", immediateRender: false },
              t0 + 0.42
            );
            // 27.35 kick: one bump, then everything holds still
            var tb2 = T.bump + (j % 4) * 0.008;
            tl.set(el, { scale: 1.3 }, tb2);
            tl.to(el, { scale: 1, duration: 0.18, ease: "power3.out" }, tb2);
          });

          // ---- 26.4 kick: 0ms flip to INK, text turns paper, '바로 쓴다.' snaps into a yellow label box ----
          reg("ink", T.hit);
          tl.fromTo("#f5_l2box", { scaleX: 0 }, { scaleX: 1, duration: 0.1, ease: "expo.out", immediateRender: false }, T.hit);
          // screen-shake ≤10px on the g2 layers only (anchor, so no canvas edge is exposed)
          var AMP = [10, -8, 8, -6, 6, -4, 4, -2];
          AMP.forEach(function (a, j) {
            tl.to("#f5_shake", { x: a, y: a * 0.6 * (j % 2 ? 1 : -1), duration: 0.03, ease: "steps(1)" }, T.hit + j * 0.03);
          });
          tl.to("#f5_shake", { x: 0, y: 0, duration: 0.08, ease: "power2.out" }, T.hit + AMP.length * 0.03);

          // slow push on the statement, cut dead on the last kick → freeze-hold to the frame end
          tl.fromTo("#f5_stmt", { scale: 1 }, { scale: 1.035, duration: T.bump - T.hit, ease: "none", immediateRender: false }, T.hit);

          window.__timelines = window.__timelines || {};
          window.__timelines[FID] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
