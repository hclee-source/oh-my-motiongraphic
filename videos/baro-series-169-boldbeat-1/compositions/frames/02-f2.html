  <body>
    <template id="02-f2-template">
      <style>
        @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-8ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: block; }
        @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-5Medium.ttf") format("truetype"); font-weight: 500; font-display: block; }
        @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-4Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }

        /* ---------- root (plain #stage — the compiler scopes it) ---------- */
        #stage {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #040404;
        }

        /* register variables; 0ms tl.set flips swap them on the hits */
        #f2_root {
          --f2-bg: #040404;
          --f2-fg: #F2F0EA;
          --f2-box-bg: #FFE500;
          --f2-box-fg: #040404;
          --f2-chip-bg: #FFE500;
          --f2-chip-fg: #040404;
          position: absolute;
          inset: 0;
          font-family: "Paperlogy", sans-serif;
          color: var(--f2-fg);
        }
        #f2_bg {
          position: absolute;
          inset: 0;
          background: var(--f2-bg);
        }
        #f2_g1 {
          position: absolute;
          inset: 0;
        }

        /* ---------- shared pieces ---------- */
        .f2-lbox {
          position: relative;
          display: inline-block;
          transform-origin: 0% 50%;
        }
        .f2-lbox-bg {
          position: absolute;
          inset: 0;
          background: var(--f2-box-bg);
          transform-origin: 0% 50%;
        }
        .f2-lbox-tx {
          position: relative;
          display: block;
          padding: 0.08em 0.18em;
          color: var(--f2-box-fg);
          white-space: nowrap;
        }
        .f2-chip {
          position: relative;
          display: inline-block;
          font-family: "Archivo Black", sans-serif;
          font-size: 30px;
          letter-spacing: 0.02em;
          line-height: 1;
          text-transform: uppercase;
          white-space: nowrap;
        }
        .f2-chip-bg {
          position: absolute;
          inset: 0;
          background: var(--f2-chip-bg);
          transform-origin: 0% 50%;
        }
        .f2-chip-tx {
          position: relative;
          display: block;
          padding: 10px 16px 9px;
          color: var(--f2-chip-fg);
        }
        .f2-lat {
          font-family: "Archivo Black", sans-serif;
          font-weight: 400;
        }

        /* ---------- crash-zoom: KV laptop (feathered, INK only) ---------- */
        /* 580px = 1.036x native; zoom 1 -> 1.35 peaks at 1.40x native (cap) */
        #f2_lap {
          position: absolute;
          left: 670px;
          top: 395px;

        /* ---------- green chat-bubble character (feathered, INK only) ---------- */

        #f2_bub {

          top: 263px;
          width: 525px;

          transform-origin: 50% 60%;
          visibility: hidden;
          opacity: 0;
        }
        #f2_bub img {
          display: block;
          width: 100%;
          height: 100%;
        }

        /* ---------- title column (left) ---------- */
        #f2_col {
          position: absolute;
          left: 96px;
          top: 104px;
          height: 880px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: flex-start;
          transform-origin: 0% 40%;
          visibility: hidden;
          opacity: 0;
        }
        #f2_kick {

        #f2_title .f2-lat {

        #f2_chip {

        #f2_sub1 { margin-top: 34px; }

        .f2-sub .f2-lat {
          letter-spacing: 0;
          margin-right: 0.22em;
        }

        /* ---------- tossed cover (YELLOW register) ---------- */
        /* 454x620 at the rest pose; rotated bbox ~x 1100–1600, y 118–782 */
        .f2-card {
          position: absolute;
          left: 1123px;
          top: 140px;
          width: 454px;

        }
        .f2-card img {

        }

          box-shadow: 14px 14px 0px #040404;

        /* ---------- caption under the cover ---------- */
        #f2_cap {
          position: absolute;
          left: 950px;
          top: 812px;
          width: 800px;
          display: flex;
          flex-direction: column;
          align-items: center;
          visibility: hidden;
          opacity: 0;
        }
        #f2_cap_box {
          font-weight: 800;

        }
        #f2_cap_box .f2-lat {

        #f2_cap_author {
          margin-top: 12px;

          color: var(--f2-fg);
        }

        /* ---------- confetti ● ▲ (ink, clear of cover + words) ---------- */
        #f2_cf_dot {
          position: absolute;
          left: 1690px;
          top: 560px;
          width: 64px;
          height: 64px;
          border-radius: 50%;
          background: var(--f2-fg);
          visibility: hidden;
          opacity: 0;
        }
        #f2_cf_tri {
          position: absolute;
          left: 944px;
          top: 170px;
          width: 80px;
          height: 70px;
          color: var(--f2-fg);
          visibility: hidden;
          opacity: 0;
        }
        #f2_cf_tri svg {
          display: block;
          width: 100%;
          height: 100%;
          fill: currentColor;
        }
      </style>

      <div id="stage" data-composition-id="02-f2" data-width="1920" data-height="1080" data-duration="5.85">

            <!-- tossed cover: 3 speed-trail ghosts + main card -->
            <div class="f2-card f2-ghost" id="f2_cv_g3" data-layout-ignore=""><img src="assets/covers/9791124516294.jpg" alt=""></div>

            <div class="f2-card" id="f2_cv" data-layout-allow-overflow=""><img src="assets/covers/9791124516294.jpg" alt="바로바로 챗GPT X 덕테이프 X 코덱스"></div>

      <script>
        (function () {
          var D = 5.85;  // frame span length (track 5.0 → 10.85)
          var T0 = 5.0;  // span_sec[0]
          function L(trackT) { return Math.round((trackT - T0) * 1000) / 1000; }

          // storyboard anchors (track seconds → frame-local)
          var A_CUT = L(5.11);   // snare: hard cut · bubble + title slam
          var A_BUMP = L(5.62);  // kick: bubble bumps 6%
          var A_SUB1 = L(6.55);  // snare: 'X 덕테이프'
          var A_SUB2 = L(7.01);  // snare: 'X 코덱스'
          var A_FLIP = L(7.99);  // strongest snare: YELLOW · sprite out · cover toss
          var A_CF1 = L(8.45);   // kick: confetti ●
          var A_CF2 = L(8.92);   // kick: confetti ▲
          var A_OUT = L(10.33);  // kick: cover arcs out up-right
          var A_END = L(10.8);   // snare: flip INK · title clears
          // measured onsets for micro-timing (audiomap events[])
          var E_CHIP = L(5.387);               // hi-hat: 'CHATGPT' chip
          var E_KICKS_BUB = [L(6.084), L(7.5)]; // small bubble pulses
          var E_CAP = L(8.22);                 // hi-hat: caption label box
          var E_KICK_CV = L(9.381);            // kick: cover pulse

          var Y = "#FFE500", K = "#040404", P = "#F2F0EA";
          var REG = {
            ink:    { "--f2-bg": K, "--f2-fg": P, "--f2-box-bg": Y, "--f2-box-fg": K, "--f2-chip-bg": Y, "--f2-chip-fg": K },
            yellow: { "--f2-bg": Y, "--f2-fg": K, "--f2-box-bg": K, "--f2-box-fg": Y, "--f2-chip-bg": K, "--f2-chip-fg": Y }
          };

          var tl = gsap.timeline({ paused: true });

          // ---- registers: 0ms palette flips ON the hits ----
          tl.set("#f2_root", REG.ink, 0);
          tl.set("#f2_root", REG.yellow, A_FLIP);
          tl.set("#f2_root", REG.ink, A_END);

          // ---- group window (single group spans the whole frame) ----
          tl.set("#f2_g1", { autoAlpha: 1 }, 0);
          tl.set("#f2_g1", { autoAlpha: 0 }, D);

          // ---- 0 → 0.11: crash-zoom into the laptop logo (1.036x → 1.40x native) ----
          tl.fromTo("#f2_lap",
            { scale: 1, filter: "blur(0px)" },
            { scale: 1.35, filter: "blur(5px)", duration: A_CUT, ease: "power2.in" }, 0);
          // hard cut
          tl.set("#f2_lap", { autoAlpha: 0 }, A_CUT);

          // ---- 0.11: bubble pops on the right with overshoot ----
          tl.set("#f2_bub", { autoAlpha: 1 }, A_CUT);
          tl.fromTo("#f2_bub",
            { scale: 0.4, rotation: 12 },
            { scale: 1, rotation: 0, duration: 0.32, ease: "back.out(1.8)", immediateRender: false }, A_CUT);
          // slow float while it holds
          tl.fromTo("#f2_bub", { y: 0 },
            { y: -18, duration: A_FLIP - (A_CUT + 0.32), ease: "sine.inOut", immediateRender: false }, A_CUT + 0.32);
          // bumps: 6% on the 5.62 kick, 3% on the later kicks
          function bump(t, s) {
            tl.to("#f2_bub", { scale: s, duration: 0.06, ease: "power2.out" }, t);
            tl.to("#f2_bub", { scale: 1, duration: 0.16, ease: "power2.out" }, t + 0.06);
          }
          bump(A_BUMP, 1.06);
          for (var b = 0; b < E_KICKS_BUB.length; b++) bump(E_KICKS_BUB[b], 1.03);
          // yellow register: feathered layer cuts out at 0ms
          tl.set("#f2_bub", { autoAlpha: 0 }, A_FLIP);

          // ---- 0.11: title column slams in ----
          tl.set("#f2_col", { autoAlpha: 1 }, A_CUT);
          tl.fromTo("#f2_kick", { x: -90 }, { x: 0, duration: 0.16, ease: "expo.out", immediateRender: false }, A_CUT);
          tl.fromTo("#f2_title", { scale: 1.45 }, { scale: 1, duration: 0.2, ease: "expo.out", immediateRender: false }, A_CUT);
          var shake = [10, -7, 4, 0];
          for (var s = 0; s < shake.length; s++) {
            tl.to("#f2_title", { x: shake[s], duration: 0.035, ease: "none" }, A_CUT + 0.19 + s * 0.035);
          }
          // pair chip 'CHATGPT'
          tl.set("#f2_chip", { autoAlpha: 1 }, E_CHIP);
          tl.fromTo("#f2_chip_bg", { scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out", immediateRender: false }, E_CHIP);

          // ---- 1.55 / 2.01: 'X 덕테이프', 'X 코덱스' label boxes, one per snare ----
          var SUBS = [["#f2_sub1", A_SUB1], ["#f2_sub2", A_SUB2]];
          for (var u = 0; u < SUBS.length; u++) {
            var sel = SUBS[u][0], t = SUBS[u][1];
            tl.set(sel, { autoAlpha: 1 }, t);
            tl.fromTo(sel, { scale: 1.18 }, { scale: 1, duration: 0.16, ease: "expo.out", immediateRender: false }, t);
            tl.fromTo(sel + "_bg", { scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out", immediateRender: false }, t);
          }

          // ---- 2.99: YELLOW flip — column punches, boxes re-snap ----
          tl.fromTo("#f2_col", { scale: 1.05 }, { scale: 1, duration: 0.2, ease: "expo.out", immediateRender: false }, A_FLIP);
          var RESNAP = ["#f2_chip_bg", "#f2_sub1_bg", "#f2_sub2_bg"];
          for (var r = 0; r < RESNAP.length; r++) {
            tl.set(RESNAP[r], { scaleX: 0 }, A_FLIP);
            tl.to(RESNAP[r], { scaleX: 1, duration: 0.1, ease: "power3.out" }, A_FLIP + r * 0.03);
          }

          // ---- cover: tossed in from bottom-right, arcs out up-right, ghost speed trails ----
          var IN = { x: 760, y: 700, r: 30 };
          var REST_R = -6;
          var DUR_IN = 0.42, DUR_OUT = 0.38;
          var LAG = 0.028;
          var GHOST_OP = [0.35, 0.2, 0.1];

          function tossIn(sel, t) {
            tl.fromTo(sel,
              { x: IN.x, y: IN.y, rotation: IN.r },
              { x: 0, y: 0, rotation: REST_R, duration: DUR_IN, ease: "back.out(1.4)", immediateRender: false }, t);
          }
          function arcOut(sel, t) {
            // y ∝ t² rises first, x ∝ t³ bends right — a parabolic exit up-right
            tl.fromTo(sel, { y: 0 }, { y: -1250, duration: DUR_OUT, ease: "power1.in", immediateRender: false }, t);
            tl.fromTo(sel, { x: 0, rotation: REST_R }, { x: 1000, rotation: REST_R + 30, duration: DUR_OUT, ease: "power2.in", immediateRender: false }, t);
          }

          tl.set("#f2_cv", { autoAlpha: 1 }, A_FLIP);
          tossIn("#f2_cv", A_FLIP);
          arcOut("#f2_cv", A_OUT);
          tl.set("#f2_cv", { autoAlpha: 0 }, A_OUT + DUR_OUT);
          for (var g = 1; g <= 3; g++) {
            var gs = "#f2_cv_g" + g;
            var lag = LAG * g;
            tl.set(gs, { autoAlpha: GHOST_OP[g - 1] }, A_FLIP + lag);
            tossIn(gs, A_FLIP + lag);
            tl.set(gs, { autoAlpha: 0 }, A_FLIP + 0.2);
            tl.set(gs, { autoAlpha: GHOST_OP[g - 1] }, A_OUT + lag);
            arcOut(gs, A_OUT + lag);
            tl.set(gs, { autoAlpha: 0 }, A_OUT + DUR_OUT + lag);
          }
          // kick pulses on the resting cover
          var CV_PULSE = [A_CF1, A_CF2, E_KICK_CV];
          for (var k = 0; k < CV_PULSE.length; k++) {
            tl.to("#f2_cv", { scale: 1.035, duration: 0.06, ease: "power2.out" }, CV_PULSE[k]);
            tl.to("#f2_cv", { scale: 1, duration: 0.14, ease: "power2.out" }, CV_PULSE[k] + 0.06);
          }

          // ---- caption: label box + author ----
          tl.set("#f2_cap", { autoAlpha: 1 }, E_CAP);
          tl.fromTo("#f2_cap_bg", { scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out", immediateRender: false }, E_CAP);
          tl.fromTo("#f2_cap_author", { y: 14 }, { y: 0, duration: 0.18, ease: "expo.out", immediateRender: false }, E_CAP + 0.04);

          // ---- confetti ● ▲ ----
          tl.set("#f2_cf_dot", { autoAlpha: 1 }, A_CF1);
          tl.fromTo("#f2_cf_dot", { scale: 0 }, { scale: 1, duration: 0.26, ease: "back.out(2.4)", immediateRender: false }, A_CF1);
          tl.fromTo("#f2_cf_dot", { y: 0 }, { y: -16, duration: A_OUT - (A_CF1 + 0.26), ease: "none", immediateRender: false }, A_CF1 + 0.26);
          tl.set("#f2_cf_tri", { autoAlpha: 1 }, A_CF2);
          tl.fromTo("#f2_cf_tri", { scale: 0, rotation: 70 }, { scale: 1, rotation: -8, duration: 0.26, ease: "back.out(2.4)", immediateRender: false }, A_CF2);
          tl.fromTo("#f2_cf_tri", { y: 0, rotation: -8 }, { y: -10, rotation: -18, duration: A_OUT - (A_CF2 + 0.26), ease: "none", immediateRender: false }, A_CF2 + 0.26);

          // ---- 5.33 →: staggered exit (confetti, caption, boxes, chip); title holds to the cut ----
          var POP_OUT = ["#f2_cf_dot", "#f2_cf_tri"];
          for (var p = 0; p < POP_OUT.length; p++) {
            tl.to(POP_OUT[p], { scale: 0, duration: 0.14, ease: "power2.in" }, A_OUT);
            tl.set(POP_OUT[p], { autoAlpha: 0 }, A_OUT + 0.14);
          }
          var EXIT = ["#f2_cap", "#f2_sub2", "#f2_sub1", "#f2_chip"];
          var EX0 = A_OUT + 0.03, EX_STEP = 0.06, EX_DUR = 0.22;
          for (var e = 0; e < EXIT.length; e++) {
            tl.to(EXIT[e], { y: 70, autoAlpha: 0, duration: EX_DUR, ease: "power3.in" }, EX0 + e * EX_STEP);
          }

          // ---- 5.8: flip INK, the title clears at 0ms ----
          tl.set("#f2_col", { autoAlpha: 0 }, A_END);

          window.__timelines["02-f2"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
