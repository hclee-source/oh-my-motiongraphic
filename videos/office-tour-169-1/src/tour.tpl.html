  <script>

    const spineColors = ["#F07AA0", "#8FD4C4", "#FFD34D", "#A9DBF5", "#6CC28F", "#FFFFFF", "#F7B6C8"];
    for (let i = 0; i < 15; i++) {
      const h = 100 + (i * 37) % 36;

      add("books", `<div class="abs spine" style="left:${4600 + i * 46}px; top:${920 - h}px; height:${h}px; background:${spineColors[(i + 3) % 7]}"></div>`);
    }
    [[0, 180], [130, 260], [260, 140], [390, 220], [520, 300], [650, 160], [780, 240], [910, 200], [1040, 280], [1170, 150], [1300, 230]].forEach(([x, h]) =>
      add("city", `<div class="abs city" style="left:${x}px; height:${h}px"></div>`));
    for (let i = 0; i < 8; i++) add("steams", `<div class="abs steam" id="st${i}"></div>`);

    // ───── 캐릭터 ─────
    document.getElementById("stuSvg").innerHTML = PPATTA.student("stu");
    document.getElementById("rabSvg").innerHTML = PPATTA.rabbit("rab");
    const INK = "#2B2B3A";
    // 소품: 수험생 오른손 머그, 왼손 책(처음엔 숨김), 토끼 오른손 컵(처음엔 숨김)
    document.getElementById("stu-armR").insertAdjacentHTML("beforeend",
      `<g id="stu-mug"><path d="M300,378 L344,378 L340,430 Q338,440 328,440 L316,440 Q306,440 304,430 Z" fill="#FFF" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
       <path d="M342,392 Q362,394 360,410 Q358,424 340,422" fill="none" stroke="${INK}" stroke-width="6"/>
       <ellipse cx="322" cy="382" rx="18" ry="5" fill="#7A4A2A"/></g>`);
    document.getElementById("stu-armL").insertAdjacentHTML("beforeend",
      `<g id="stu-book" opacity="0"><image href="assets/cover-adsp.jpg" x="40" y="318" width="84" height="116" preserveAspectRatio="none"/>
       <rect x="40" y="318" width="84" height="116" fill="none" stroke="${INK}" stroke-width="6" rx="4"/></g>`);
    document.getElementById("rab-armL").insertAdjacentHTML("beforeend",
      `<g id="rab-cup" opacity="0"><path d="M70,384 L112,384 L108,430 Q106,440 96,440 L86,440 Q76,440 74,430 Z" fill="#FFF" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
       <ellipse cx="91" cy="388" rx="17" ry="5" fill="#7A4A2A"/></g>`);
    const PS = PPATTA.pivots.student, PR = PPATTA.pivots.rabbit;
    Object.entries(PS).forEach(([k, v]) => gsap.set(`#stu-${k}`, { svgOrigin: v }));
    Object.entries(PR).forEach(([k, v]) => gsap.set(`#rab-${k}`, { svgOrigin: v }));

    // ───── 시간표 ─────
    const tl = gsap.timeline({ paused: true });
    const ft = (sel, from, to, t) => tl.fromTo(sel, from, { immediateRender: false, ...to }, t);
    const SCALE = 0.75;                 // SVG 1단위 = 0.75px
    const TOP = 538;                    // 인형 위쪽 y(발끝 y=960)
    const VIEW = 608;                   // 수험생을 화면 x 760 근처에 둔다(세계 608 × 1.25)
    const camAt = (x) => Math.max(0, x - VIEW);
    const setCam = (t0, t1, x0, x1) => {
      ft("#world", { x: -camAt(x0) }, { x: -camAt(x1), duration: t1 - t0, ease: "none" }, t0);
      ft("#bg", { x: -camAt(x0) * 0.75 }, { x: -camAt(x1) * 0.75, duration: t1 - t0, ease: "none" }, t0);
    };
    const place = (id, x) => tl.set(`#${id}W`, { x: x - 150 }, 0);

    // 걷기: 다리·팔 흔들기 + 몸 들썩임 + 토끼 귀 흔들기. 끝나면 제자리 자세로.
    const STEP = 0.32;
    const steps = [];
    function walk(id, t0, t1, x0, x1, cam = false) {
      const n = Math.max(2, Math.round((t1 - t0) / STEP));
      const d = (t1 - t0) / n;
      ft(`#${id}W`, { x: x0 - 150 }, { x: x1 - 150, duration: t1 - t0, ease: "none" }, t0);
      const end = n % 2 ? 1 : -1;
      const swing = (part, a) => {
        ft(`#${id}-${part}`, { rotation: -a }, { rotation: a, duration: d, ease: "sine.inOut", yoyo: true, repeat: n - 1 }, t0);
        ft(`#${id}-${part}`, { rotation: a * end }, { rotation: 0, duration: 0.15, ease: "power1.out" }, t1);
      };
      swing("legL", 15); swing("legR", -15); swing("armL", -14);
      if (id === "rab") { swing("armR", 14); swing("earL", -6); swing("earR", 6); } else { swing("armR", 6); }
      ft(`#${id}-body`, { y: 0 }, { y: -6, duration: d / 2, ease: "sine.inOut", yoyo: true, repeat: 2 * n - 1 }, t0);
      ft(`#${id}-head`, { y: 0 }, { y: -8, duration: d / 2, ease: "sine.inOut", yoyo: true, repeat: 2 * n - 1 }, t0);
      if (cam) setCam(t0, t1, x0, x1);
      if (id === "stu") for (let i = 0; i < n; i++) steps.push(+(t0 + i * d).toFixed(3));
    }
    const pose = (id, part, a, t, dur = 0.3, ease = "back.out(1.6)") => ft(`#${id}-${part}`, { rotation: 0 }, { rotation: a, duration: dur, ease }, t);
    const unpose = (id, part, a, t, dur = 0.25) => ft(`#${id}-${part}`, { rotation: a }, { rotation: 0, duration: dur, ease: "power2.inOut" }, t);
    // 뛰어오르기: 위로 갔다가 내려온다(두 움직임으로 나눠 시간 이동에도 안전하게)
    const hop = (sel, t, y0, peak, y1, dur) => {
      ft(sel, { y: y0 }, { y: peak, duration: dur / 2, ease: "sine.out" }, t);
      ft(sel, { y: peak }, { y: y1, duration: dur / 2, ease: "sine.in" }, t + dur / 2);
    };
    const pop = (sel, t) => ft(sel, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, t);
