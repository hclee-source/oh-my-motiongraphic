          tl.set("#f1_g1_bg", { backgroundColor: INK }, 3.274);
          tl.set("#f1_g1_bg", { backgroundColor: PAPER }, 3.762);

            "#f1_g1_sq",

          for (var w = 0; w < 5; w++) {
