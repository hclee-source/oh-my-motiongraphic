            <div data-hf-id="hf-ld81" class="f7-ic" id="f7_ic5"><svg data-hf-id="hf-tc6d" viewBox="0 0 60 60" fill="none" stroke="#FFE500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path data-hf-id="hf-4jhb" d="M9 13 H51 V40 H28 L18 49 V40 H9 Z" /><path data-hf-id="hf-5m1r" d="M18 23 H42 M18 30 H34" /></svg></div>
            <!-- bookmark -->
            <div data-hf-id="hf-pbc2" class="f7-ic" id="f7_ic6"><svg data-hf-id="hf-uj3g" viewBox="0 0 60 60" fill="none" stroke="#FFE500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path data-hf-id="hf-5j9c" d="M18 8 H42 V52 L30 42 L18 52 Z" /></svg></div>
            <!-- star -->
            <div data-hf-id="hf-t9g3" class="f7-ic" id="f7_ic7"><svg data-hf-id="hf-u4sf" viewBox="0 0 60 60" fill="none" stroke="#FFE500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path data-hf-id="hf-p0dy" d="M30 9 L35.29 23.72 L50.92 24.2 L38.56 33.78 L42.93 48.8 L30 40 L17.07 48.8 L21.44 33.78 L9.08 24.2 L24.71 23.72 Z" /></svg></div>
          </div>

          <!-- logo lockup: gold mark + GOLDEN·rabbit + [골든래빗] [goldenrabbit.co.kr] -->
          <div data-hf-id="hf-ig1n" id="f7_lockup" class="f7-layer">
            <div data-hf-id="hf-dp7c" id="f7_markbump"><img data-hf-id="hf-454f" id="f7_markres" src="assets/brand/icon.png" alt=""></div>
            <div data-hf-id="hf-aeoj" id="f7_word"><span data-hf-id="hf-ohb4" class="f7-wpart" id="f7_wgolden">GOLDEN</span><span data-hf-id="hf-x1os" class="f7-wpart" id="f7_wdot">·</span><span data-hf-id="hf-hlry" class="f7-wpart" id="f7_wrabbit">rabbit</span></div>
            <div data-hf-id="hf-zynz" id="f7_tagrow">
              <div data-hf-id="hf-alkr" class="f7-box" id="f7_chip"><span data-hf-id="hf-zyp6" class="f7-boxbg" id="f7_chipbg"></span><span data-hf-id="hf-2udl" class="f7-boxtx" id="f7_chiptx">골든래빗</span></div>
              <div data-hf-id="hf-e75o" class="f7-box" id="f7_url"><span data-hf-id="hf-1uuh" class="f7-boxbg" id="f7_urlbg"></span><span data-hf-id="hf-di7n" class="f7-boxtx" id="f7_urltx">goldenrabbit.co.kr</span></div>
            </div>
          </div>

          <!-- the question: 다음 한 권은? -->
          <div data-hf-id="hf-5ev6" id="f7_q" class="f7-layer">
            <div data-hf-id="hf-0wna" id="f7_qline"><span data-hf-id="hf-digv" class="f7-syl"><i data-hf-id="hf-0l5l" class="f7-caret" id="f7_cpre"></i><span data-hf-id="hf-zulp" class="f7-gl" id="f7_s0">다</span><i data-hf-id="hf-t02y" class="f7-caret" id="f7_c0"></i></span><span data-hf-id="hf-yn5r" class="f7-syl"><span data-hf-id="hf-sq4y" class="f7-gl" id="f7_s1">음</span><i data-hf-id="hf-wy6z" class="f7-caret" id="f7_c1"></i></span> <span data-hf-id="hf-y8uq" class="f7-syl"><span data-hf-id="hf-t7b3" class="f7-gl" id="f7_s2">한</span><i data-hf-id="hf-m2pc" class="f7-caret" id="f7_c2"></i></span> <span data-hf-id="hf-xujp" class="f7-syl"><span data-hf-id="hf-4b78" class="f7-gl" id="f7_s3">권</span><i data-hf-id="hf-mud5" class="f7-caret" id="f7_c3"></i></span><span data-hf-id="hf-0mow" class="f7-syl"><span data-hf-id="hf-bgz1" class="f7-gl" id="f7_s4">은</span><i data-hf-id="hf-e6ha" class="f7-caret" id="f7_c4"></i></span><span data-hf-id="hf-1l56" id="f7_qbox"><span data-hf-id="hf-97e6" id="f7_qbg"></span><span data-hf-id="hf-ayw8" id="f7_qtx">?</span></span></div>
          </div>

          <div data-hf-id="hf-cah5" id="f7_flash" class="f7-layer"></div>
        </div>

        <script>
          (function () {
            var $ = function (id) {
              return document.getElementById(id);
            };
            var tl = gsap.timeline({ paused: true });

            // ---- frame-local anchors (track_t − 41.0), measured from audiomap.events ----
            var K1 = 1.493; // 42.493 kick — 0ms flip to YELLOW, covers + confetti burst
            var K2 = 1.957; // 42.957 kick — flip to INK, cover bump, confetti reverses
            var K3 = 2.421; // 43.421 kick — grid parts + dims, logo resolves (swell 43–44)
            var K4 = 4.325; // 45.325 final kick — URL pops, icons + particles burst
            var END = 5.6; // frame span length
            var F2 = 0.067; // two frames at 30fps (flash-cut)

            var YELLOW = "#FFE500",
              INK = "#0B0B0B",
              PAPER = "#F2F0EA";
            var CX = 960,
              CY = 540;

            // group g1 spans the whole frame
            tl.set($("f7_g1"), { autoAlpha: 1 }, 0);

            // ================= 0 → K1 · negative-space-hold: the question types in =================
            // syllables land on the measured micro-onsets of the silence; '?' box on the 41.982 snare
            var SYL = [0.053, 0.23, 0.42, 0.6, 0.773];
            var QBOX = 0.982;
            var WOBBLE = 1.237; // 42.237 snare
            tl.set($("f7_cpre"), { autoAlpha: 0 }, SYL[0]);
            for (var s = 0; s < SYL.length; s++) {
              tl.set($("f7_s" + s), { autoAlpha: 1 }, SYL[s]);
              tl.set($("f7_c" + s), { autoAlpha: 1 }, SYL[s]);
              tl.set($("f7_c" + s), { autoAlpha: 0 }, s + 1 < SYL.length ? SYL[s + 1] : QBOX);
            }
            // label-box snaps open from the left, then the '?' appears in it
            tl.fromTo(
              $("f7_qbg"),
              { autoAlpha: 1, scaleX: 0 },
              { autoAlpha: 1, scaleX: 1, duration: 0.12, ease: "power3.out", immediateRender: false },
              QBOX,
            );
            tl.set($("f7_qtx"), { autoAlpha: 1 }, QBOX + 0.05);
            // '?' wobbles once on the snare
            var qbox = $("f7_qbox");
            tl.fromTo(qbox, { rotation: 0 }, { rotation: -9, duration: 0.06, ease: "power2.out", immediateRender: false }, WOBBLE);
            tl.fromTo(qbox, { rotation: -9 }, { rotation: 6, duration: 0.08, ease: "power2.inOut", immediateRender: false }, WOBBLE + 0.06);
            tl.fromTo(qbox, { rotation: 6 }, { rotation: 0, duration: 0.14, ease: "power2.out", immediateRender: false }, WOBBLE + 0.14);
            // hard cut out on the kick
            tl.set($("f7_q"), { autoAlpha: 0 }, K1);

            // ================= register flips (0ms on the hits) =================
            var bg = $("f7_bg");
            tl.set(bg, { backgroundColor: YELLOW }, K1);
            tl.set(bg, { backgroundColor: INK }, K2);

            // ================= K1 · mosaic-pack: 16 covers burst out of the center =================
            var SLOT = 156,
              GAP = 32,
              ROW_CY = [418, 662];
            var ROT = [-3, 2.5, -1.5, 4, -4, 1, -2.5, 3, 2, -3.5, 3.5, -1, 1.5, -2, 4, -3];
            var flies = [];
            var bumps = [];
            for (var i = 0; i < 16; i++) {
              var r = i < 8 ? 0 : 1;
              var c = i % 8;
              var cx = CX + (c - 3.5) * (SLOT + GAP);
              var cy = ROW_CY[r];
              var ring = Math.floor(Math.abs(c - 3.5)); // 0 = center columns, 3 = outer
              var delay = ring * 0.032 + r * 0.012;
              var fly = $("f7_fly" + i);
              flies.push(fly);
              bumps.push(fly.firstElementChild);
              tl.fromTo(
                fly,
                { autoAlpha: 1, x: CX - cx, y: CY - cy, scale: 0.25, rotation: ROT[i] + (c < 4 ? -28 : 28) },
                {
                  autoAlpha: 1,
                  x: 0,
                  y: 0,
                  scale: 1,
                  rotation: ROT[i],
                  duration: 0.34,
                  ease: "back.out(1.5)",
                  immediateRender: false,
                },
                K1 + delay,
              );
            }

            // ================= K1 · particle-burst: ink confetti =================
            var CF = [
              // [centerX, centerY, finalRotation]
              [230, 186, -20], [430, 250, 15], [690, 160, 30], [1000, 226, -10],
              [1270, 150, 45], [1520, 248, 0], [1712, 190, -25], [180, 876, 20],
              [420, 830, 10], [700, 930, 0], [950, 854, -15], [1200, 920, 35],
              [1470, 840, 0], [1740, 890, 25], [164, 540, -30], [1760, 540, 0],
            ];
            for (var k = 0; k < CF.length; k++) {
              var cf = $("f7_cf" + k);
              var tx = CX - CF[k][0]; // offset back to the frame center
              var ty = CY - CF[k][1];
              var rot = CF[k][2];
              var d = (k % 4) * 0.012;
              // burst out from center (ink on yellow)
              tl.fromTo(
                cf,
                { autoAlpha: 1, x: tx, y: ty, scale: 0, rotation: rot - 90 },
                { autoAlpha: 1, x: 0, y: 0, scale: 1, rotation: rot, duration: 0.4, ease: "back.out(1.3)", immediateRender: false },
                K1 + d,
              );
              // K2: colors reverse to yellow / paper, pop, and drift back a touch toward center
              tl.set(cf, { color: k % 2 === 0 ? YELLOW : PAPER }, K2);
              tl.fromTo(cf, { scale: 1 }, { scale: 1.25, duration: 0.07, ease: "power2.out", immediateRender: false }, K2);
              tl.fromTo(cf, { scale: 1.25 }, { scale: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, K2 + 0.07);
              tl.fromTo(
                cf,
                { x: 0, y: 0, rotation: rot },
                { x: tx * 0.08, y: ty * 0.08, rotation: rot - 25, duration: K3 - K2, ease: "power1.out", immediateRender: false },
                K2,
              );
              // shrink out so the field is clear ON K3 — the parting rows sweep through these bands
              // and dim to 40%, so nothing may sit behind them
              tl.fromTo(cf, { scale: 1 }, { scale: 0, duration: 0.15, ease: "power2.in", immediateRender: false }, K3 - 0.15);
              tl.set(cf, { autoAlpha: 0 }, K3);
            }

            // ================= K2 · flash-cut + every cover bumps +6% =================
            var flash = $("f7_flash");
            tl.set(flash, { autoAlpha: 1, backgroundColor: PAPER }, K2);
            tl.set(flash, { autoAlpha: 0 }, K2 + F2);
            tl.fromTo(bumps, { scale: 1 }, { scale: 1.06, duration: 0.08, ease: "power2.out", immediateRender: false }, K2);
            tl.fromTo(bumps, { scale: 1.06 }, { scale: 1, duration: 0.32, ease: "power2.out", immediateRender: false }, K2 + 0.08);

            // ================= K3 · grid parts to top / bottom and dims to 40% =================
            // row0 top 318 → 112 (bbox ≥ 106), row1 top 562 → 768 (bottom 968, bbox ≤ 974)
            var row0 = $("f7_row0"),
              row1 = $("f7_row1");
            tl.fromTo(row0, { y: 0 }, { y: -206, duration: 0.5, ease: "expo.out", immediateRender: false }, K3);
            tl.fromTo(row1, { y: 0 }, { y: 206, duration: 0.5, ease: "expo.out", immediateRender: false }, K3);
            tl.fromTo([row0, row1], { opacity: 1 }, { opacity: 0.4, duration: 0.35, ease: "power2.out", immediateRender: false }, K3);
            // rows drift apart sideways through the swell, then freeze on the final kick
            tl.fromTo(row0, { x: 0 }, { x: -24, duration: K4 - K3, ease: "none", immediateRender: false }, K3);
            tl.fromTo(row1, { x: 0 }, { x: 24, duration: K4 - K3, ease: "none", immediateRender: false }, K3);

            // ================= K3 · blur-resolve: the gold mark + wordmark =================
            tl.fromTo(
              $("f7_markres"),
              { autoAlpha: 0, scale: 1.12, filter: "blur(16px)" },
              { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out", immediateRender: false },
              K3 + 0.04,
            );
            tl.fromTo(
              $("f7_wgolden"),
              { autoAlpha: 0.2, x: -60, filter: "blur(18px)" },
              { autoAlpha: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out", immediateRender: false },
              K3 + 0.08,
            );
            tl.fromTo(
              $("f7_wrabbit"),
              { autoAlpha: 0.2, x: 60, filter: "blur(18px)" },
              { autoAlpha: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out", immediateRender: false },
              2.63, // 43.63 hi-hat
            );
            tl.fromTo(
              $("f7_wdot"),
              { autoAlpha: 1, scale: 0 },
              { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)", immediateRender: false },
              2.75,
            );

            // chip '골든래빗' snaps open on the 43.886 snare, centered alone (URL slot still empty)
            var CHIP_T = 2.886;
            var URL_W = 470,
              ROW_GAP = 20;
            var chip = $("f7_chip");
            tl.set(chip, { x: (URL_W + ROW_GAP) / 2 }, CHIP_T);
            tl.fromTo(
              $("f7_chipbg"),
              { autoAlpha: 1, scaleX: 0 },
              { autoAlpha: 1, scaleX: 1, duration: 0.12, ease: "power3.out", immediateRender: false },
              CHIP_T,
            );
            tl.set($("f7_chiptx"), { autoAlpha: 1 }, CHIP_T + 0.06);

            // ================= K4 · final kick: flash, URL pops, icons + particles burst =================
            tl.set(flash, { autoAlpha: 1, backgroundColor: YELLOW }, K4);
            tl.set(flash, { autoAlpha: 0 }, K4 + F2);

            // chip slides left to make room; URL label-box snaps open beside it
            tl.fromTo(chip, { x: (URL_W + ROW_GAP) / 2 }, { x: 0, duration: 0.28, ease: "power3.out", immediateRender: false }, K4);
            var urlBox = $("f7_url");
            tl.fromTo(urlBox, { y: 14 }, { y: 0, duration: 0.32, ease: "back.out(2)", immediateRender: false }, K4);
            tl.fromTo(
              $("f7_urlbg"),
              { autoAlpha: 1, scaleX: 0 },
              { autoAlpha: 1, scaleX: 1, duration: 0.12, ease: "power3.out", immediateRender: false },
              K4,
            );
            tl.set($("f7_urltx"), { autoAlpha: 1 }, K4 + 0.06);

            // mark punches on the hit
            var markBump = $("f7_markbump");
            tl.fromTo(markBump, { scale: 1.08 }, { scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, K4);

            // eight icons burst outward from the lockup center and settle
            var IC = [
              [420, 392, -1], [262, 486, -1], [262, 610, -1], [420, 704, -1],
              [1500, 392, 1], [1658, 486, 1], [1658, 610, 1], [1500, 704, 1],
            ];
            for (var n = 0; n < IC.length; n++) {
              tl.fromTo(
                $("f7_ic" + n),
                { autoAlpha: 1, x: CX - IC[n][0], y: CY - IC[n][1], scale: 0.2, rotation: IC[n][2] * 120 },
                {
                  autoAlpha: 1,
                  x: 0,
                  y: 0,
                  scale: 1,
                  rotation: 0,
                  duration: 0.62,
                  ease: "back.out(1.7)",
                  immediateRender: false,
                },
                K4 + (n % 4) * 0.02,
              );
            }

            // small flat particles burst out and vanish (gone by ~5.2 → still hold to END)
            var parts = $("f7_parts");
            var NP = 18;
            for (var p = 0; p < NP; p++) {
              var el = document.createElement("i");
              el.className = "f7-pt";
              var sz = 8 + (p % 3) * 4;
              el.style.width = sz + "px";
              el.style.height = sz + "px";
              el.style.marginLeft = -sz / 2 + "px";
              el.style.marginTop = -sz / 2 + "px";
              el.style.background = p % 3 === 1 ? PAPER : YELLOW;
              el.style.borderRadius = p % 2 === 0 ? "0" : "50%";
              parts.appendChild(el);
              var ang = (p / NP) * Math.PI * 2 + 0.3;
              var rx = 400 + (p % 4) * 70;
              var ry = 150 + (p % 3) * 25;
              tl.fromTo(
                el,
                { autoAlpha: 1, x: 0, y: 0, scale: 1 },
                {
                  autoAlpha: 1,
                  x: Math.cos(ang) * rx,
                  y: Math.sin(ang) * ry,
                  scale: 0,
                  duration: 0.72 + (p % 4) * 0.04,
                  ease: "expo.out",
                  immediateRender: false,
                },
                K4 + (p % 5) * 0.01,
              );
            }

            // hold perfectly still to the end (the audio fades 45.6–46.6)
            tl.set($("f7_g1"), { autoAlpha: 0 }, END);

            window.__timelines["07-f7"] = tl;
            tl.seek(0);
          })();
        </script>
      </div>
    </template>
  </body>
