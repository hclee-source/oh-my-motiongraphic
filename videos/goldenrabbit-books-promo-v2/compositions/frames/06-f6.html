      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          const PAPER = "#F2F0EA";
          const INK = "#0B0B0B";
          const YEL = "#FFE500";

          // Frame-local anchors (track_t − 36.47)
          const T_CUT = 0.0; //   36.47 hard cut to PAPER
          const KICK = [0.36, 1.29, 2.24]; // 36.83 / 37.76 / 38.71 kicks: verb lands + cover tossed in
          const T_YEL = 3.19; //  39.66 kick: flip to YELLOW + confetti pop
          const T_EXIT = 3.65; // 40.12 snare: covers leave on staggered parabolic arcs
          const T_INK = 4.12; //  40.59 kick (hard stop): flip to INK, the rest wipes off
          const END = 4.53; //    41.0 frame end, drop to silence

          // ---- group window: f6_g1 spans the whole frame [0, 4.53) ----
          tl.set("#f6_g1", { autoAlpha: 1 }, T_CUT);
          tl.set("#f6_bg", { backgroundColor: PAPER }, T_CUT);

          // ---- 0.00 hard cut: INSIGHT rises into place (reading direction), label + rule pop ----
          tl.fromTo("#f6_vert_wrap", { y: 220 }, { y: 0, duration: KICK[0], ease: "expo.out" }, T_CUT);
          tl.fromTo("#f6_vert_wrap", { y: 0 }, { y: -40, duration: 4.18 - KICK[0], ease: "none", immediateRender: false }, KICK[0]);
          tl.fromTo("#f6_series_wrap", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.22, ease: "power3.out" }, 0.1);
          tl.fromTo("#f6_series_rule", { scaleY: 0 }, { scaleY: 1, duration: 0.2, ease: "power3.out" }, 0.16);

          // ---- verbs: one per kick, each replacing the last (0ms swap + mask slide-up) ----
          const VERB = ["#f6_verb1", "#f6_verb2", "#f6_verb3"];
          for (let i = 0; i < 3; i++) {
            const k = KICK[i];
            if (i > 0) tl.set(VERB[i - 1] + "_m", { autoAlpha: 0 }, k);
            tl.set(VERB[i] + "_m", { autoAlpha: 1 }, k);
            tl.fromTo(VERB[i], { y: 200 }, { y: 0, duration: 0.22, ease: "expo.out" }, k);
          }
          // '읽는다.' gets its ink label-box, popping scaleX 0→1 from the left edge
          tl.fromTo("#f6_verb3_box", { scaleX: 0 }, { scaleX: 1, duration: 0.14, ease: "power3.out" }, KICK[2]);

          // ---- staggered-reveal: one cover tossed in per kick, caption label-box pops after landing ----
          const IN_DUR = 0.34;
          const LAG = [0.022, 0.044, 0.066]; // speed-trail ghost lags
          const GOP = [0.35, 0.2, 0.1]; //      speed-trail ghost opacities
          const EX_STEP = 0.06; //              staggered-exit per-card offset
          const EX_DUR = 0.36;
          const DRIFT_Y = -12;
          const CARDS = [
            { n: 1, rot: -6, dr: -0.8, from: { x: -760, y: 640, rotation: -40, scale: 1.12 }, out: { x: -920, y: -1260, rotation: -42 } },
            { n: 2, rot: 3, dr: 0.8, from: { x: 140, y: 860, rotation: 34, scale: 1.12 }, out: { x: 170, y: -1320, rotation: 30 } },
            { n: 3, rot: -2, dr: 0.8, from: { x: 860, y: 480, rotation: 44, scale: 1.12 }, out: { x: 900, y: -1260, rotation: 36 } },
          ];

          // one flight = entrance or exit; applied to the card and (lagged) to its ghosts
          function enter(target, c, t) {
            tl.fromTo(
              target,
              { x: c.from.x, y: c.from.y, rotation: c.from.rotation, scale: c.from.scale },
              { x: 0, y: 0, rotation: c.rot, scale: 1, duration: IN_DUR, ease: "expo.out" },
              t,
            );
          }
          function leave(target, c, t) {
            // y quad-in + x cubic-in: rises first, then bends outward on an accelerating arc
            tl.fromTo(target, { x: 0 }, { x: c.out.x, duration: EX_DUR, ease: "power2.in", immediateRender: false }, t);
            tl.fromTo(target, { y: DRIFT_Y }, { y: c.out.y, duration: EX_DUR, ease: "power1.in", immediateRender: false }, t);
            tl.fromTo(
              target,
              { rotation: c.rot + c.dr },
              { rotation: c.out.rotation, duration: EX_DUR, ease: "power1.in", immediateRender: false },
              t,
            );
          }

          for (let i = 0; i < CARDS.length; i++) {
            const c = CARDS[i];
            const a = KICK[i];
            const card = "#f6_card" + c.n;
            const ex = T_EXIT + i * EX_STEP;
            const holdStart = a + IN_DUR;

            // card: toss in on the kick, slow drift through the hold, parabolic exit
            tl.set(card, { autoAlpha: 1 }, a);
            enter(card, c, a);
            tl.fromTo(
              card,
              { y: 0, rotation: c.rot },
              { y: DRIFT_Y, rotation: c.rot + c.dr, duration: ex - holdStart, ease: "none", immediateRender: false },
              holdStart,
            );
            leave(card, c, ex);
            tl.set(card, { autoAlpha: 0 }, Math.min(ex + EX_DUR, T_INK));

            // speed trails: 3 ghost copies follow the same flight, lagged, only while moving
            for (let j = 0; j < 3; j++) {
              const g = "#f6_gh" + c.n + "_" + j;
              tl.set(g, { autoAlpha: GOP[j] }, a + LAG[j]);
              enter(g, c, a + LAG[j]);
              tl.set(g, { autoAlpha: 0 }, a + LAG[j] + 0.2);
              tl.set(g, { autoAlpha: GOP[j] }, ex + LAG[j]);
              leave(g, c, ex + LAG[j]);
              tl.set(g, { autoAlpha: 0 }, Math.min(ex + LAG[j] + EX_DUR, T_INK));
            }

            // caption label-box: scaleX 0→1 from the left edge, author follows
            tl.fromTo("#f6_cap" + c.n + "_title", { scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power3.out" }, a + 0.16);
            tl.fromTo("#f6_cap" + c.n + "_author", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.14, ease: "power2.out" }, a + 0.22);
          }
          // COMING SOON sticker on the second cover
          tl.fromTo("#f6_badge2", { scale: 0, rotation: -14 }, { scale: 1, rotation: 5, duration: 0.22, ease: "back.out(3)" }, KICK[1] + 0.26);

          // ---- 3.19 kick: 0ms flip to YELLOW; label boxes go ink + yellow; covers bump; confetti pops ----
          tl.set("#f6_bg", { backgroundColor: YEL }, T_YEL);
          tl.set(["#f6_cap1_title", "#f6_cap2_title", "#f6_cap3_title", "#f6_verb3_txt"], { color: YEL }, T_YEL);
          tl.set("#f6_badge2", { backgroundColor: INK, color: YEL }, T_YEL);
          tl.fromTo(["#f6_card1", "#f6_card2", "#f6_card3"], { scale: 1.05 }, { scale: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, T_YEL);

          const CONF = ["#f6_cf1", "#f6_cf2", "#f6_cf3", "#f6_cf4", "#f6_cf5", "#f6_cf6", "#f6_cf7", "#f6_cf8"];
          const IS_DIA = [true, false, false, true, false, true, false, true];
          for (let i = 0; i < CONF.length; i++) {
            const r0 = IS_DIA[i] ? 45 : 0;
            const t0 = T_YEL + i * 0.025;
            const popEnd = t0 + 0.26;
            tl.set(CONF[i], { autoAlpha: 1 }, t0);
            tl.fromTo(CONF[i], { scale: 0, rotation: r0 - 90 }, { scale: 1, rotation: r0, duration: 0.26, ease: "back.out(2.6)" }, t0);
            // slight drift, variation derived from the index
            tl.fromTo(
              CONF[i],
              { y: 0, rotation: r0 },
              { y: -10 - (i % 3) * 6, rotation: r0 + (i % 2 ? -12 : 12), duration: 4.15 - popEnd, ease: "none", immediateRender: false },
              popEnd,
            );
          }

          // ---- 4.12 kick: 0ms flip to INK; survivors re-skin to the ink register, then wipe off ----
          tl.set("#f6_bg", { backgroundColor: INK }, T_INK);
          tl.set("#f6_vert", { color: PAPER }, T_INK);
          tl.set("#f6_series", { color: PAPER }, T_INK);
          tl.set("#f6_series_rule", { backgroundColor: PAPER }, T_INK);
          tl.set("#f6_verb3_box", { backgroundColor: YEL }, T_INK);
          tl.set("#f6_verb3_txt", { color: INK }, T_INK);
          for (let i = 0; i < CONF.length; i++) {
            tl.set(CONF[i], { backgroundColor: IS_DIA[i] ? YEL : PAPER }, T_INK);
          }

          // staggered-exit: verb → confetti → label → INSIGHT, all clear by ~4.45
          tl.fromTo("#f6_verb3_m", { x: 0 }, { x: 1000, duration: 0.26, ease: "power3.in", immediateRender: false }, T_INK);
          for (let i = 0; i < CONF.length; i++) {
