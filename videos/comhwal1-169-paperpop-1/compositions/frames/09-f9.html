  <body>
    <template id="09-f9-template">
      <style>
        @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-8ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: block; }
        @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-7Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
        @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-6SemiBold.ttf") format("truetype"); font-weight: 600; font-display: block; }
        @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-5Medium.ttf") format("truetype"); font-weight: 500; font-display: block; }

        #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: #23268C; font-family: "Paperlogy", sans-serif; color: #FFFFFF; }
        .f9-g { position: absolute; inset: 0; }

        /* FACE: wrapper takes the big moves (peek / squash), the <img> takes the 8 fps boil */

        .f9-face img { display: block; width: 100%; height: 100%; }

        /* BOOK COVER in a white padded paper wrapper (never filter / tint / overlay the cover itself) */
        .f9-book { position: absolute; background: #FFFFFF; padding: 12px; border-radius: 6px;

        .f9-book img { display: block; width: 100%; height: auto; }

        /* TELOP — double outline (二重袋文字): white outer rim (+ ink offset shadow) / ink stroke / fill */
        .f9-telop { position: relative; white-space: nowrap; font-family: "Paperlogy"; font-weight: 600; letter-spacing: 0.02em; line-height: 1.05; }
        .f9-telop > span { display: block; }
        .f9-telop > span + span { position: absolute; left: 0; top: 0; }
        .f9-telop em { font-style: normal; font-size: 1.08em; }
        .f9-t-outer { color: #10124F; -webkit-text-stroke: 0.13em #10124F; text-shadow: 8px 10px 0 #1A1A22; }

        /* TITLE BLOCK (middle column) */
        .f9-kick { position: absolute; font-family: "Paperlogy"; font-size: 40px; color: #FFE13A; white-space: nowrap; line-height: 1.2; font-weight: 600; }
        .f9-title { position: absolute; font-family: "Paperlogy"; font-weight: 700; font-size: 84px; letter-spacing: -0.01em; line-height: 1.1;

        .f9-c2 { position: absolute; }

        .f9-c2tx { position: relative; display: block; padding: 10px 26px 4px; font-family: "Paperlogy"; font-weight: 700; font-size: 60px;

        .f9-auth { position: absolute; font-family: "Paperlogy"; font-size: 32px; color: rgba(255,255,255,.8); white-space: nowrap; line-height: 1.2; font-weight: 600; }

        /* SEARCH BAR — generic (no service logo): white paper pill, ink outline, yellow magnifier button */
        .f9-bar { position: absolute; box-sizing: border-box; background: #FFFDF8; border: 5px solid #1A1A22; border-radius: 999px;

        .f9-q { position: absolute; left: 44px; top: 0; bottom: 0; right: 110px; display: flex; align-items: center;

        .f9-ring { position: absolute; box-sizing: border-box; width: 92px; height: 92px; border-radius: 50%; border: 7px solid #FFE13A; }

        /* CURSOR — white paper arrow with ink outline */
        .f9-cur { position: absolute; width: 56px; height: 80px; transform-origin: 4px 4px; }

        .f9-logo { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; transform-origin: 50% 50%; }
        .f9-icon { display: block; width: 132px; height: auto; }

        .f9-brand { font-family: "Paperlogy"; font-weight: 800; font-size: 64px; letter-spacing: -0.02em; line-height: 1.05; color: #FFFFFF;
          text-shadow: 4px 6px 0 #1A1A22; white-space: nowrap; }
        .f9-url { font-family: "Paperlogy"; font-size: 34px; line-height: 1.2; color: #FFE13A; white-space: nowrap; font-weight: 600; }

        /* SPARKLES — yellow paper four-point stars */
        .f9-spark { position: absolute; }
        .f9-spark svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(3px 5px 0 rgba(8,8,36,.45)); }

      <div id="stage" data-composition-id="09-f9" data-width="1920" data-height="1080" data-duration="7.71">

      <script>
        (function () {
          var D = 7.71, T0 = 40.29;
          // track seconds → frame-local seconds
          function L(t) { return Math.round((t - T0) * 1000) / 1000; }
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); };
          function rnd(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

          // TELOP builder: 3 stacked copies (outer / mid / fill); outline-only copies are ignored by the layout audit
          function telop(el) {
            var t = el.getAttribute("data-text");
            el.innerHTML = '<span class="f9-t-outer" data-layout-ignore>' + t + '</span><span class="f9-t-mid" data-layout-ignore>' + t + '</span><span class="f9-t-fill">' + t + '</span>';
          }
          telop(q("#f9_v1t")); telop(q("#f9_v2t"));

          // SPARKLES (four-point stars) — built from a fixed table
          var SP = [[850, 742, 50], [922, 884, 34], [1378, 726, 42], [1416, 846, 56], [1172, 702, 28], [1058, 906, 30], [798, 830, 26]];
          var LC = [1112, 797];   // lockup centre
          (function () {
            var host = q("#f9_sparks"), html = "";
            SP.forEach(function (s, i) {
              html += '<div id="f9_sp' + i + '" class="f9-spark" style="left:' + (s[0] - s[2] / 2) + 'px;top:' + (s[1] - s[2] / 2) + 'px;width:' + s[2] + 'px;height:' + s[2] + 'px;">' +
                '<svg id="f9_spi' + i + '" viewBox="-1.1 -1.1 2.2 2.2"><path d="M0,-1 Q0.16,-0.16 1,0 Q0.16,0.16 0,1 Q-0.16,0.16 -1,0 Q-0.16,-0.16 0,-1 Z" fill="#FFE13A" stroke="#1A1A22" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round" /></svg></div>';
            });
            host.innerHTML = html;
          })();

          // POP-IN (ぽよん): 0 → 1.2 (5f) → 1 (2f) → squash
          function popIn(target, at) {
            var f = 1 / 30;
            tl.set(target, { autoAlpha: 0 }, 0);
            tl.fromTo(target, { scale: 0, autoAlpha: 1 }, { scale: 1.2, autoAlpha: 1, duration: 5 * f, ease: "power2.out", immediateRender: false }, at);
            tl.to(target, { scale: 1, duration: 2 * f, ease: "power1.in" }, at + 5 * f);
            tl.to(target, { scaleX: 1.08, scaleY: 0.95, duration: 2 * f }, at + 7 * f);
            tl.to(target, { scaleX: 1, scaleY: 1, duration: 3 * f, ease: "power1.out" }, at + 9 * f);
          }
          // PLACE: a sheet of paper laid down (tilt −6 → +1.5 → 0, from y+40)
          function place(target, at, rot) {
            rot = rot || 0;
            tl.set(target, { autoAlpha: 0 }, 0);
            tl.fromTo(target, { y: 40, rotation: rot - 6, autoAlpha: 0 }, { y: 0, rotation: rot + 1.5, autoAlpha: 1, duration: 0.17, ease: "power2.out", immediateRender: false }, at);
            tl.to(target, { rotation: rot, duration: 0.08, ease: "power1.inOut" }, at + 0.17);
          }
          // BOIL (カクカク): 8 fps rotation/offset jitter on an inner element, index-seeded
          function boil(target, idx, from, to, amp) {
            amp = amp || 1;
            for (var k = Math.ceil(from * 8); k / 8 < to; k++) {
              var s = idx * 131 + k * 7;
              tl.set(target, { rotation: (rnd(s) - 0.5) * 3 * amp, x: Math.round((rnd(s + 1) - 0.5) * 4 * amp), y: Math.round((rnd(s + 2) - 0.5) * 4 * amp) }, k / 8);
            }
          }
          // SQUASH (expression-change beat): 1 → 0.92 → 1.04 → 1 in 0.12 s
          function squash(target, at) {
            tl.to(target, { scale: 0.92, duration: 0.04, ease: "power1.out" }, at);
            tl.to(target, { scale: 1.04, duration: 0.04, ease: "power1.inOut" }, at + 0.04);
            tl.to(target, { scale: 1, duration: 0.04, ease: "power1.in" }, at + 0.08);
          }
          // CARET window: solid at s, blinks every 0.19 s (0 ms toggles), off at e
          function caret(sel, s, e) {
            tl.set(sel, { autoAlpha: 0 }, 0);
            tl.set(sel, { autoAlpha: 1 }, s);
            for (var i = 1; s + i * 0.19 < e - 0.01; i++) {
              tl.set(sel, { autoAlpha: i % 2 ? 0 : 1 }, Math.round((s + i * 0.19) * 1000) / 1000);
            }
            tl.set(sel, { autoAlpha: 0 }, e);
          }

          // ---- anchors (track seconds from the storyboard → local)
          var tBook = L(40.29), tV1 = L(40.66), tV2 = L(41.05), tBible = L(41.42), tTitle = L(41.82), tT2 = L(42.21), tAuth = L(42.61),
              tBar = L(43.38), tK1 = L(44.14), tK2 = L(44.52), tK3 = L(44.92), tCur = L(45.30), tClick = L(45.69), tFinal = L(46.46);

          tl.set("#f9_g1", { autoAlpha: 1 }, 0);

          // 40.29 — BOOK placed (tilt −3°)
          place("#f9_book", tBook, -3);

          // faces peek from behind the book's edges (start fully hidden behind it)
          tl.set("#f9_kate", { autoAlpha: 0, rotation: 10, x: -30, y: 150 }, 0);
          tl.set("#f9_kate", { autoAlpha: 1 }, tV1);
          tl.to("#f9_kate", { x: 0, y: 0, duration: 0.32, ease: "back.out(1.7)" }, tV1);
          tl.set("#f9_bible", { autoAlpha: 0, rotation: -12, x: 150, y: 10 }, 0);
          tl.set("#f9_bible", { autoAlpha: 1 }, tBible);
          tl.to("#f9_bible", { x: 0, y: 0, duration: 0.32, ease: "back.out(1.7)" }, tBible);
          boil("#f9_kate_i", 1, 0, D);
          boil("#f9_bible_i", 2, 0, D);

          // 40.66 / 41.05 — VERTICAL slogan, clip-path wipe top → bottom, yellow strip rides the edge
          [["#f9_v1", "#f9_v1sw", tV1], ["#f9_v2", "#f9_v2sw", tV2]].forEach(function (c) {
            tl.set(c[0], { clipPath: "inset(0% 0% 100% 0%)" }, 0);
            tl.set(c[1], { yPercent: 0, autoAlpha: 0 }, 0);
            tl.to(c[0], { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.inOut" }, c[2]);
            tl.set(c[1], { autoAlpha: 1 }, c[2]);
            tl.to(c[1], { yPercent: 100, duration: 0.6, ease: "power2.inOut" }, c[2]);
            tl.to(c[1], { autoAlpha: 0, duration: 0.12, ease: "power1.in" }, c[2] + 0.6);
          });

          // 41.82 — TITLE BLOCK: kicker slides, title slams; 42.21 title2 cushion; 42.61 author
          tl.set(["#f9_kick", "#f9_title", "#f9_c2tx", "#f9_auth"], { autoAlpha: 0 }, 0);
          tl.set("#f9_c2bg", { scaleX: 0 }, 0);
          tl.fromTo("#f9_kick", { x: -28, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, tTitle);
          tl.fromTo("#f9_title", { scale: 1.16, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, tTitle + 0.04);
          tl.to("#f9_c2bg", { scaleX: 1, duration: 0.2, ease: "power3.out" }, tT2);
          tl.fromTo("#f9_c2tx", { x: -18, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, tT2 + 0.06);
          tl.fromTo("#f9_auth", { y: 14, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, tAuth);

          // 43.38 — SEARCH BAR slides up (place-like settle)
          tl.set("#f9_bar", { autoAlpha: 0 }, 0);
          tl.fromTo("#f9_bar", { y: 110, rotation: -2.5, autoAlpha: 0 }, { y: 0, rotation: 0.8, autoAlpha: 1, duration: 0.24, ease: "power3.out", immediateRender: false }, tBar);
          tl.to("#f9_bar", { rotation: 0, duration: 0.1, ease: "power1.inOut" }, tBar + 0.24);

          // 44.14 / 44.52 / 44.92 — typed in three chunks on the stop-time hits
          tl.set(["#f9_k1", "#f9_k2", "#f9_k3"], { autoAlpha: 0 }, 0);
          [["#f9_k1", tK1], ["#f9_k2", tK2], ["#f9_k3", tK3]].forEach(function (k) {
            tl.set(k[0], { autoAlpha: 1 }, k[1]);
            tl.fromTo(k[0], { scale: 1.3, y: -6 }, { scale: 1, y: 0, duration: 0.14, ease: "back.out(2.5)", immediateRender: false }, k[1]);
            tl.fromTo("#f9_bar", { scale: 0.985 }, { scale: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, k[1]);
          });
          caret("#f9_c0", tBar, tK1);
          caret("#f9_c1", tK1, tK2);
          caret("#f9_c2c", tK2, tK3);
          caret("#f9_c3", tK3, tClick);

          // 45.30 → 45.69 — cursor glides in and CLICKS the magnifier
          tl.set("#f9_cur", { autoAlpha: 0 }, 0);
          tl.fromTo("#f9_cur", { x: 200, y: 360 }, { x: 0, y: 0, duration: 0.34, ease: "power3.out", immediateRender: false }, tCur);
          tl.fromTo("#f9_cur", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.08, ease: "none", immediateRender: false }, tCur);
          tl.to("#f9_cur", { scale: 0.82, duration: 0.04, ease: "power1.in" }, tClick - 0.04);
          tl.to("#f9_cur", { scale: 1, duration: 0.16, ease: "back.out(3)" }, tClick);
          tl.to("#f9_btn", { scale: 0.86, duration: 0.04, ease: "power1.in" }, tClick - 0.04);
          tl.to("#f9_btn", { scale: 1, duration: 0.2, ease: "back.out(3)" }, tClick);
          tl.set("#f9_ring", { autoAlpha: 0 }, 0);
          tl.fromTo("#f9_ring", { scale: 0.55, autoAlpha: 1 }, { scale: 2.2, autoAlpha: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, tClick);

          // 46.46 — FINAL HIT: logo lockup pops, yellow paper sparkles burst, faces squash
          popIn("#f9_logo", tFinal);
          SP.forEach(function (s, i) {
            var sel = "#f9_sp" + i, at = tFinal + i * 0.02;
            tl.set(sel, { autoAlpha: 0 }, 0);
            tl.fromTo(sel, { x: (LC[0] - s[0]) * 0.7, y: (LC[1] - s[1]) * 0.7, scale: 0, rotation: -40, autoAlpha: 1 },
              { x: 0, y: 0, scale: 1.2, rotation: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, at);
            tl.to(sel, { scale: 1, duration: 0.1, ease: "power1.inOut" }, at + 0.2);
            boil("#f9_spi" + i, 10 + i, tFinal + 0.32, D, 1.2);
          });
          squash("#f9_kate", tFinal);
          squash("#f9_bible", tFinal + 0.03);

          // 46.46 → 48.0 HOLD (only the boil moves)
          tl.set({}, {}, D);
          tl.seek(0.001); tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["09-f9"] = tl;
        })();
      </script>
