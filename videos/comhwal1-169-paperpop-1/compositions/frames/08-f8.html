        #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F4EEE1; font-family: "Paperlogy", sans-serif; color: #1A1A22; }
        .f8-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        .f8-svg { position: absolute; left: 0; top: 0; overflow: visible; }

        /* CROWD BOARD — identical to F1 (x 1000–1840, y 120–960, 10×10 cells of 84 px) */
        .f8-board { position: absolute; left: 1000px; top: 120px; width: 840px; height: 840px; background-color: #F7F2E7;
          background-image: repeating-linear-gradient(0deg, #E3D9C4 0 2px, transparent 2px 84px), repeating-linear-gradient(90deg, #E3D9C4 0 2px, transparent 2px 84px);
          box-shadow: 0 2px 0 rgba(0,0,0,.08), 0 14px 26px rgba(60,40,10,.18); transform-origin: 50% 50%; }
        /* empty slot: faint dashed outline where a face used to be */
        .f8-slot { position: absolute; width: 66px; height: 66px; border: 3px dashed rgba(26,26,34,.22); border-radius: 50%; }
        /* crowd face: wrapper takes the slap, inner takes the 8 fps boil (img + its tape) */
        .f8-cf { position: absolute; width: 76px; height: 76px; transform-origin: 50% 60%; }
        .f8-ci { position: absolute; left: 0; top: 0; width: 76px; height: 76px; }
        .f8-ci img { display: block; width: 76px; height: 76px; }
        /* MASKING TAPE (マステ), crowd size, with zig-zag torn ends */
        .f8-tape { position: absolute; left: 7px; top: -5px; width: 62px; height: 18px; background-color: rgba(255,225,58,.86);
          background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.28) 0 4px, transparent 4px 9px);
          box-shadow: 0 1px 2px rgba(60,40,10,.18);
          clip-path: polygon(0 0,5% 18%,0 36%,5% 54%,0 72%,5% 90%,0 100%,100% 100%,95% 82%,100% 64%,95% 46%,100% 28%,95% 10%,100% 0); }
        .f8-tape.f8-sky { background-color: rgba(159,211,242,.9); }
        /* initial state for everything that enters later (autoAlpha brings it back with visibility:inherit) */
        .f8-off, .f8-tape { opacity: 0; visibility: hidden; }

        /* TELOP — double outline as stacked copies (offset shadow / outer stroke / mid stroke / fill) */
        .f8-telop { position: absolute; white-space: nowrap; font-family: "Paperlogy"; font-weight: 600; letter-spacing: 0.02em; line-height: 1.05; }
        .f8-telop > span { display: block; }
        .f8-telop > span + span { position: absolute; left: 0; top: 0; }
        /* offset ink shadow = a full-silhouette copy (text-shadow only shadows the fill, which hides under the wide outer stroke) */
        .f8-ink .f8-t-shadow { color: #1A1A22; -webkit-text-stroke: 0.13em #1A1A22; transform: translate(0.03em, 0.04em); }
        .f8-mega .f8-t-shadow { color: #1A1A22; -webkit-text-stroke: 0.17em #1A1A22; transform: translate(0.04em, 0.05em); }
        /* l1: ink fill + white outer */
        .f8-ink .f8-t-outer { color: #FFFFFF; -webkit-text-stroke: 0.13em #FFFFFF; }
        .f8-ink .f8-t-mid { color: #1A1A22; -webkit-text-stroke: 4px #1A1A22; }
        .f8-ink .f8-t-fill { color: #1A1A22; }
        /* l2 MEGA: yellow fill / 12 px ink stroke / 22 px white outer / ink offset shadow */
        .f8-mega .f8-t-outer { color: #FFFFFF; -webkit-text-stroke: 0.17em #FFFFFF; }
        .f8-mega .f8-t-mid { color: #1A1A22; -webkit-text-stroke: 0.07em #1A1A22; } .f8-telop.f8-mega { font-weight: 700; }
        .f8-mega .f8-t-fill { color: #FFE13A; }

        /* CUSHION (座布団) — small yellow, ink Paperlogy */
        .f8-cushion { position: absolute; background: #FFE13A; color: #1A1A22; font-family: "Paperlogy";  white-space: nowrap;
          padding: 14px 32px 8px; border-radius: 6px; box-shadow: 0 2px 0 rgba(0,0,0,.1), 0 10px 18px rgba(60,40,10,.22); transform-origin: 0% 50%; font-weight: 600; }
        .f8-cushion > span { display: block; }

      <script>
        (function () {
          var D = 6.2, F = 1 / 30;
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); };
          function rnd(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

          // ---- TELOP builder (stacked copies: offset shadow / outer stroke / ink stroke / fill)
          function telop(el) {
            var t = el.getAttribute("data-text");
            el.innerHTML = '<span class="f8-t-shadow">' + t + '</span><span class="f8-t-outer">' + t + '</span><span class="f8-t-mid">' + t + '</span><span class="f8-t-fill">' + t + '</span>';
          }
          telop(q("#f8_l1")); telop(q("#f8_l2"));

          // ---- POP-IN (ぽよん)
          function popIn(target, at) {
            tl.set(target, { autoAlpha: 0 }, 0);
            tl.fromTo(target, { scale: 0, autoAlpha: 1 }, { scale: 1.2, autoAlpha: 1, duration: 5 * F, ease: "power2.out", immediateRender: false }, at);
            tl.to(target, { scale: 1, duration: 2 * F, ease: "power1.in" }, at + 5 * F);
            tl.to(target, { scaleX: 1.08, scaleY: 0.95, duration: 2 * F }, at + 7 * F);
            tl.to(target, { scaleX: 1, scaleY: 1, duration: 3 * F, ease: "power1.out" }, at + 9 * F);
          }
          // ---- BOIL (カクカク, 8 fps) — rotation keeps the element's seeded tilt
          function boil(target, idx, from, tilt, amp) {
            for (var k = Math.floor(from * 8); k / 8 < D; k++) {
              var s = idx * 131 + k * 7;
              tl.set(target, { rotation: tilt + (rnd(s) - 0.5) * 3 * amp, x: Math.round((rnd(s + 1) - 0.5) * 4 * amp), y: Math.round((rnd(s + 2) - 0.5) * 4 * amp) }, k / 8);
            }
          }
          // ---- SHAKE: per-frame stepped offsets, then rest
          function shake(target, at, amps) {
            for (var i = 0; i < amps.length; i++) {
              tl.set(target, { x: amps[i], y: Math.round(amps[i] * 0.6) * (i % 2 ? 1 : -1) }, at + i * F);
            }
            tl.set(target, { x: 0, y: 0 }, at + amps.length * F);
          }
          // ---- CONCENTRATION LINES (集中線): `sets` pre-built line sets, one visible per 1/8 s; elliptical empty centre
          function burst(svg, cx, cy, rx, ry, n, sets, color, from, to, fades) {
            var ns = "http://www.w3.org/2000/svg", R = 1700, groups = [];
            for (var g = 0; g < sets; g++) {
              var G = document.createElementNS(ns, "g");
              G.setAttribute("id", "f8_bst" + g); G.setAttribute("fill", color); G.setAttribute("opacity", "0");
              for (var i = 0; i < n; i++) {
                var a = (i + rnd(g * 1000 + i) * 0.8) / n * Math.PI * 2, w = 0.004 + rnd(g * 1000 + i + 500) * 0.012;
                var k0 = 1 + rnd(g * 77 + i) * 0.3;
                var p = [[cx + Math.cos(a) * rx * k0, cy + Math.sin(a) * ry * k0], [cx + Math.cos(a - w) * R, cy + Math.sin(a - w) * R], [cx + Math.cos(a + w) * R, cy + Math.sin(a + w) * R]];
                var poly = document.createElementNS(ns, "polygon");
                poly.setAttribute("points", p.map(function (x) { return x[0].toFixed(1) + "," + x[1].toFixed(1); }).join(" "));
                G.appendChild(poly);
              }
              svg.appendChild(G); groups.push(G);
            }
            // step times: exactly `from`, then every following 1/8 s boundary before `to`
            var times = [from];
            for (var k = Math.floor(from * 8) + 1; k / 8 < to - 1e-6; k++) times.push(k / 8);
            times.forEach(function (t, si) {
              var op = fades[Math.min(si, fades.length - 1)];
              groups.forEach(function (G, gi) { tl.set(G, { opacity: gi === si % sets ? op : 0 }, t); });
            });
            groups.forEach(function (G) { tl.set(G, { opacity: 0 }, to); });
          }

          // ---- anchors (frame-local = track − 34.09)
          var T_L1 = 0.21;                                         // 34.30
          var WAVES = [0.37, 0.76, 1.16, 1.92, 2.32, 2.69, 3.08];  // 34.46 34.85 35.25 | 36.01 36.41 36.78 | 37.17
          var T_L2 = 1.55;                                         // 35.64 downbeat — MEGA slam
          var T_END = 3.08;                                        // 37.17 downbeat — board bounce + sub

          // ---- CROWD: survivors already on the board (happy); 91 others return in 7 seeded waves of 13
          var SURV = [7, 13, 29, 35, 41, 56, 62, 78, 84];
          var rest = [];
          for (var i = 0; i < 100; i++) if (SURV.indexOf(i) < 0) rest.push(i);
          rest.sort(function (a, b) { return rnd(a * 7.13 + 27) - rnd(b * 7.13 + 27) || a - b; });   // seed 27
          function tiltOf(i) { return parseFloat(q("#f8_ci" + i).getAttribute("data-tilt")) || 0; }

          rest.forEach(function (i, k) {
            var w = Math.floor(k / 13), t = WAVES[w] + Math.floor(rnd(i + 900) * 3) * F;   // 0–2 frame scatter inside a wave
            var cf = "#f8_c" + i;

            tl.set(cf, { autoAlpha: 1 }, t);
            tl.fromTo(cf, { y: -30, scale: 1.15 }, { y: 0, scale: 1, duration: 3 * F, ease: "power2.in", immediateRender: false }, t);

            tl.set("#f8_t" + i, { autoAlpha: 1 }, t + 3 * F);   // tape slapped on at 0 ms
            boil("#f8_ci" + i, i, t, tiltOf(i), 0.8);

          tl.set("#f8_l2", { autoAlpha: 0 }, 0);

          // ---- 37.17: the whole board does one happy bounce; 'sub' fades up under l2 on its yellow cushion
          tl.to("#f8_board", { scale: 1.02, duration: 0.1, ease: "power2.out" }, T_END + 3 * F);
          tl.to("#f8_board", { scale: 1, duration: 0.26, ease: "power2.inOut" }, T_END + 3 * F + 0.1);
          tl.set("#f8_sub", { autoAlpha: 0 }, 0);

          // 37.6 → 40.0 HOLD: only the 8 fps boil moves (boil steps run to the frame end); last 0.3 s clean for the tear transition
          document.querySelectorAll(".f8-t-outer,.f8-t-mid,.f8-t-shadow,.f8-t-shd").forEach(function (e) { e.setAttribute("data-layout-ignore", ""); });
          tl.seek(0.001); tl.seek(0);
          window.__timelines["08-f8"] = tl;
        })();
