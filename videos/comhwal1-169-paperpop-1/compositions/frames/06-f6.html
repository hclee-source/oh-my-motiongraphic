      <script>
        (function () {
          var D = 4.64;               // frame span 24.80 → 29.44 (local = track − 24.80)
          var F = 1 / 30;
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); };
          function rnd(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

          // TELOP builder (3 stacked copies); perChar wraps each glyph in .f6-c<i> across all three layers
          function telop(el, perChar) {
            var t = el.getAttribute("data-text"), inner = t, n = 0;
            if (perChar) {
              inner = "";
              Array.from(t).forEach(function (c) {
                if (c === " ") { inner += " "; } else { inner += '<span class="f6-ch f6-c' + n + '">' + c + "</span>"; n++; }
              });
            }
            el.innerHTML = '<span class="f6-t-outer">' + inner + '</span><span class="f6-t-mid">' + inner + '</span><span class="f6-t-fill">' + inner + "</span>";
            return n;
          }
          telop(q("#f6_t1"));
          telop(q("#f6_t2"));

          // POP-IN (ぽよん)
          function popIn(target, at) {
            tl.set(target, { autoAlpha: 0 }, 0);
            tl.fromTo(target, { scale: 0, autoAlpha: 1 }, { scale: 1.2, autoAlpha: 1, duration: 5 * F, ease: "power2.out", immediateRender: false }, at);
            tl.to(target, { scale: 1, duration: 2 * F, ease: "power1.in" }, at + 5 * F);
            tl.to(target, { scaleX: 1.08, scaleY: 0.95, duration: 2 * F }, at + 7 * F);
            tl.to(target, { scaleX: 1, scaleY: 1, duration: 3 * F, ease: "power1.out" }, at + 9 * F);
          }
          // SQUASH on an expression swap (1 → 0.92 → 1.04 → 1, 0.12 s)
          function squash(target, at) {
            tl.to(target, { scale: 0.92, duration: 0.03, ease: "power1.out" }, at);
            tl.to(target, { scale: 1.04, duration: 0.04, ease: "power1.out" }, at + 0.03);
            tl.to(target, { scale: 1, duration: 0.05, ease: "power1.in" }, at + 0.07);
          }
          // BOIL (カクカク): 8 fps rotation/offset jitter from an index-seeded table
          function boil(target, idx, from, to, amp) {
            amp = amp || 1;
            for (var k = Math.floor(from * 8); k < Math.floor(to * 8); k++) {
              var s = idx * 131 + k * 7;
              tl.set(target, { rotation: (rnd(s) - 0.5) * 3 * amp, x: Math.round((rnd(s + 1) - 0.5) * 4 * amp), y: Math.round((rnd(s + 2) - 0.5) * 4 * amp) }, k / 8);
            }
          }
          // HANAMARU (はなまる): scalloped spiral circle as one path
          function hanamaru(path, cx, cy, rx, ry) {
            var d = "", N = 220, turns = 1.35;
            for (var i = 0; i <= N; i++) {
              var t = i / N, a = -Math.PI * 0.6 + t * turns * Math.PI * 2, s = 1 - t * 0.18 + Math.sin(a * 6) * 0.05;
              d += (i ? "L" : "M") + (cx + Math.cos(a) * rx * s).toFixed(1) + "," + (cy + Math.sin(a) * ry * s).toFixed(1);
            }
            path.setAttribute("d", d);

          tl.fromTo("#f6_side", { x: -40, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, 0.20);

          tl.to("#f6_tray", { y: 3, duration: 0.04, ease: "power1.out" }, 0.54);
