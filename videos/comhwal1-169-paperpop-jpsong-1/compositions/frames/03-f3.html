<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 3 — f3 · RED-SHEET (POINT 1 — 빈출 족보) · track 10.84–15.51 s (local 0–4.67 s)
         paper-pop kit helpers (popIn / place / boil / hanamaru) renamed f1 → f3.
         Primitives: kinetic-letter-in (l1 / l2 / l3_rest), mask-reveal (l3_key uncovered exactly at the
         sliding red sheet's edge), outline-to-fill (l3_key inks in after the reveal). -->
  </head>
  <body>
    <template id="03-f3-template">
      <style>
        @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-8ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: block; }
        @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-7Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
        @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-6SemiBold.ttf") format("truetype"); font-weight: 600; font-display: block; }
        @font-face { font-family: "Paperlogy"; src: url("assets/fonts/Paperlogy-5Medium.ttf") format("truetype"); font-weight: 500; font-display: block; }

        #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F4EEE1; font-family: "Paperlogy", sans-serif; color: #1A1A22; }

        /* SIDE LABEL pill (サイドテロップ) — stays for the whole frame */
        .f3-side { position: absolute; left: 96px; top: 56px; display: flex; align-items: center; gap: 14px; font-family: "Paperlogy"; font-size: 34px; color: #1A1A22; white-space: nowrap; font-weight: 600; }
        .f3-side b { font-weight: 700; background: #FFE13A; color: #1A1A22; padding: 8px 20px 4px; border-radius: 999px; border: 4px solid #1A1A22; }

        /* NOTEBOOK sheet: white paper, red margin line at 96 px, sky ruling every 64 px (lines at 30 + 64k, so the
           text baselines 158 / 286 / 478 sit on a rule) */
        .f3-card { position: absolute; background: #FFFDF8; border-radius: 10px; box-shadow: 0 2px 0 rgba(0,0,0,.06), 0 18px 34px rgba(60,40,10,.20); }
        .f3-note { background-color: #FFFDF8;
          background-image: linear-gradient(90deg, transparent 96px, rgba(229,53,43,.55) 96px 99px, transparent 99px),
            repeating-linear-gradient(180deg, transparent 0 30px, rgba(159,211,242,.9) 30px 32px, transparent 32px 64px); }

        /* notebook text: ink Paperlogy 800, line-height 1 (baseline = top + 0.89em) */
        .f3-txt { font-family: "Paperlogy"; font-weight: 700; letter-spacing: -0.02em; line-height: 1; color: #1A1A22; white-space: pre; }
        .f3-abs { position: absolute; }
        .f3-ch { display: inline-block; }
        .f3-row { position: absolute; display: flex; align-items: baseline; gap: 96px; white-space: nowrap; }

        /* l3_key: in-flow red outline layer + absolute red fill layer (outline-to-fill); the whole key is clipped
           left→right in lock-step with the red sheet's left edge (mask-reveal) */
        .f3-key { position: relative; width: 350px; font-size: 96px; clip-path: inset(-40px 350px -40px -40px); }
        .f3-key-o { display: block; color: transparent; -webkit-text-stroke: 3px #E5352B; }
        .f3-key-f { position: absolute; left: 0; top: 0; display: block; color: #E5352B; clip-path: inset(100% -5% -10% -5%); }

        /* RED SHEET (赤シート) — pivots on its left edge so the reveal edge stays put while it tilts */
        .f3-redsheet { position: absolute; background: rgba(214,0,38,.82); mix-blend-mode: multiply; border-radius: 10px; box-shadow: 0 8px 16px rgba(80,0,10,.25); transform-origin: 0% 50%; }

        /* red-pen handwriting */
        .f3-no { position: absolute; font-family: "Paperlogy"; font-size: 60px; line-height: 1; color: #E5352B; white-space: nowrap; transform: rotate(-6deg); clip-path: inset(-20% 100% -20% -10%); font-weight: 600; }
        .f3-svg { position: absolute; left: 0; top: 0; overflow: visible; }

        /* FACE: wrapper takes pop-in, .f3-lean takes lean/hop/squash, the <img>s take the 8 fps boil */
        .f3-face { position: absolute; }
        .f3-lean { position: absolute; inset: 0; transform-origin: 50% 92%; }
        .f3-face img { display: block; width: 100%; height: 100%; }

        /* CUSHION (座布団) caption */
        .f3-capwrap { position: absolute; transform: rotate(-1deg); }
        .f3-cushion { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 6px; background: #FFE13A;
          box-shadow: 0 2px 0 rgba(0,0,0,.1), 0 10px 18px rgba(60,40,10,.22); transform-origin: 0% 50%; }
        .f3-captx { position: absolute; font-family: "Paperlogy"; font-size: 40px; line-height: 1; color: #1A1A22; white-space: nowrap; font-weight: 600; }
      </style>

      <div id="stage" data-composition-id="03-f3" data-width="1920" data-height="1080" data-duration="5.010">
        <div id="f3_side" class="f3-side"><b>POINT 1</b><span>빈출 족보</span></div>

        <div id="f3_note" class="f3-card f3-note" style="left:130px;top:220px;width:1120px;height:620px;">
          <div id="f3_l1" class="f3-txt f3-abs" style="left:140px;top:83px;font-size:84px;" data-text="컴활 1급은"></div>
          <div id="f3_l2" class="f3-txt f3-abs" style="left:140px;top:211px;font-size:84px;" data-text="다 외우는 시험?"></div>
          <div id="f3_l3" class="f3-row" style="left:140px;top:393px;">
            <div id="f3_key" class="f3-txt f3-key"><span class="f3-key-o">나올 것만</span><span id="f3_key_f" class="f3-key-f">나올 것만</span></div>
            <div id="f3_rest" class="f3-txt" style="font-size:84px;" data-text="외우는 시험"></div>
          </div>
          <div id="f3_no" class="f3-no" style="left:700px;top:196px;">NO!</div>
          <div id="f3_sheet" class="f3-redsheet" style="left:116px;top:373px;width:398px;height:133px;"></div>
          <svg id="f3_pen" class="f3-svg" width="1120" height="620" viewBox="0 0 1120 620">
            <path id="f3_x1" d="M122,204 C250,226 330,236 420,254 C510,272 590,288 676,306" fill="none" stroke="#E5352B" stroke-width="10" stroke-linecap="round" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" />
            <path id="f3_x2" d="M668,196 C560,222 470,236 390,258 C300,282 210,300 126,316" fill="none" stroke="#E5352B" stroke-width="10" stroke-linecap="round" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" />
            <path id="f3_hana" fill="none" stroke="#E5352B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" />
          </svg>
        </div>

        <div id="f3_luc" class="f3-face" style="left:1370px;top:330px;width:380px;height:380px;">
          <div id="f3_luc_lean" class="f3-lean">
            <img id="f3_luc_w" src="assets/faces/worry/lucas.png" alt="" />
            <img id="f3_luc_h" src="assets/faces/happy/lucas.png" alt="" style="position:absolute;left:0;top:0;opacity:0" />
          </div>
        </div>

        <div id="f3_cap" class="f3-capwrap" style="left:160px;top:884px;width:584px;height:70px;">
          <div id="f3_cap_bg" class="f3-cushion"></div>
          <div id="f3_cap_tx" class="f3-captx" style="left:32px;top:19px;">빈출 족보 + 빈출 XO로 이론 2회독</div>
        </div>
      </div>

      <script>
        (function () {
          var D = 4.67;
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); };
          // deterministic pseudo-random in [0,1) from an integer
          function rnd(i) { var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
          // hidden start state: applied now (a fresh paused timeline does not render its t=0 sets on seek(0)) AND kept on the timeline
          function hide0(target) { gsap.set(target, { autoAlpha: 0 }); tl.set(target, { autoAlpha: 0 }, 0); }

          // split a data-text line into inline-block glyph spans (kinetic-letter-in)
          function splitChars(el) {
            var t = el.getAttribute("data-text"), h = "";
            for (var i = 0; i < t.length; i++) h += '<span class="f3-ch">' + (t[i] === " " ? "&nbsp;" : t[i]) + "</span>";
            el.innerHTML = h;
            return el.querySelectorAll(".f3-ch");
          }
          function letterIn(chars, at, stagger) {
            hide0(chars);
            tl.fromTo(chars, { y: 38, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.42, ease: "back.out(2)", stagger: stagger, immediateRender: false }, at);
          }
          // POP-IN (ぽよん): 0 → 1.2 (5f) → 1 (2f) → squash
          function popIn(target, at) {
            var f = 1 / 30;
            hide0(target);
            tl.fromTo(target, { scale: 0, autoAlpha: 1 }, { scale: 1.2, autoAlpha: 1, duration: 5 * f, ease: "power2.out", immediateRender: false }, at);
            tl.to(target, { scale: 1, duration: 2 * f, ease: "power1.in" }, at + 5 * f);
            tl.to(target, { scaleX: 1.08, scaleY: 0.95, duration: 2 * f }, at + 7 * f);
            tl.to(target, { scaleX: 1, scaleY: 1, duration: 3 * f, ease: "power1.out" }, at + 9 * f);
          }
          // PLACE: a sheet of paper laid down (tilt −6 → +1.5 → 0, from y+40)
          function place(target, at, rot) {
            rot = rot || 0;
            hide0(target);
            tl.fromTo(target, { y: 40, rotation: rot - 6, autoAlpha: 0 }, { y: 0, rotation: rot + 1.5, autoAlpha: 1, duration: 0.17, ease: "power2.out", immediateRender: false }, at);
            tl.to(target, { rotation: rot, duration: 0.08, ease: "power1.inOut" }, at + 0.17);
          }
          // BOIL (カクカク): 8 fps rotation/offset jitter on the <img>; clamped to the frame, last step lands on `to`
          function boil(target, idx, from, to, amp) {
            amp = amp || 1;
            function step(k, at) {
              var s = idx * 131 + k * 7;
              tl.set(target, { rotation: (rnd(s) - 0.5) * 3 * amp, x: Math.round((rnd(s + 1) - 0.5) * 4 * amp), y: Math.round((rnd(s + 2) - 0.5) * 4 * amp) }, at);
            }
            var k0 = Math.floor(from * 8), k1 = Math.floor(to * 8);
            for (var k = k0; k <= k1; k++) step(k, k / 8);
            if (k1 / 8 < to) step(k1 + 1, to);
          }
          // HANAMARU (はなまる): scalloped spiral circle (shrink kept small so the last lap still clears the word)
          function hanamaru(path, cx, cy, rx, ry, shrink) {
            var d = "", N = 220, turns = 1.35;
            for (var i = 0; i <= N; i++) {
              var t = i / N, a = -Math.PI * 0.6 + t * turns * Math.PI * 2, s = 1 - t * shrink + Math.sin(a * 6) * 0.05;
              d += (i ? "L" : "M") + (cx + Math.cos(a) * rx * s).toFixed(1) + "," + (cy + Math.sin(a) * ry * s).toFixed(1);
            }
            path.setAttribute("d", d);
          }
          function draw(target, at, dur, ease) {
            tl.fromTo(target, { strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.out", immediateRender: false }, at);
          }

          var l1 = splitChars(q("#f3_l1")), l2 = splitChars(q("#f3_l2")), l3r = splitChars(q("#f3_rest"));
          hanamaru(q("#f3_hana"), 313, 440, 245, 100, 0.10);   // key box x 140–490, glyphs y 397–482 (notebook coords)

          // 0.30 (11.14) side label slides in, stays
          hide0("#f3_side");
          tl.fromTo("#f3_side", { x: -40, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, 0.30);

          // 0.40 (11.24) notebook placed; l1 letters in · 0.79 (11.63) l2 letters in
          place("#f3_note", 0.40, -2);
          letterIn(l1, 0.44, 0.04);
          letterIn(l2, 0.79, 0.035);

          // 1.56 (12.40 downbeat) red-pen ✕ over l2 (two wobbly strokes) + handwritten NO!
          draw("#f3_x1", 1.56, 0.12, "power2.out");
          draw("#f3_x2", 1.70, 0.12, "power2.out");
          tl.fromTo("#f3_no", { clipPath: "inset(-20% 100% -20% -10%)" }, { clipPath: "inset(-20% -10% -20% -10%)", duration: 0.2, ease: "power1.out", immediateRender: false }, 1.78);

          // 1.95 (12.79) line 3: red sheet already over l3_key, l3_rest letters in; worried lucas pops and leans in
          place("#f3_sheet", 1.95, 2);
          letterIn(l3r, 1.97, 0.04);
          popIn("#f3_luc", 2.01);
          tl.to("#f3_luc_lean", { rotation: -9, x: -14, duration: 0.22, ease: "power2.out" }, 2.08);
          // nervous leans on 13.17 / 13.56
          [2.33, 2.72].forEach(function (t) {
            tl.to("#f3_luc_lean", { rotation: -13, duration: 0.07, ease: "power2.out" }, t);
            tl.to("#f3_luc_lean", { rotation: -9, duration: 0.12, ease: "power2.inOut" }, t + 0.07);
          });

          // 2.94 anticipation tug → 3.04 the red sheet is pulled off to the right (whoosh 13.90), clear of frame by 3.49
          var SX0 = -12, SX1 = 1750, SAT = 3.04, SDUR = 0.45, PAD = 24, KEYW = 350;
          tl.to("#f3_sheet", { x: SX0, duration: 0.1, ease: "power2.out" }, 2.94);
          tl.to("#f3_sheet", { x: SX1, duration: SDUR, ease: "power2.in" }, SAT);
          tl.to("#f3_sheet", { rotation: 11, duration: SDUR, ease: "power2.in" }, SAT);
          tl.set("#f3_sheet", { autoAlpha: 0 }, SAT + SDUR);
          // mask-reveal locked to the sheet's left edge: visible width v = sheetX − PAD (sampled at 60 Hz, same ease)
          var ez = gsap.parseEase("power2.in"), NS = Math.ceil(SDUR * 60);
          tl.set("#f3_key", { clipPath: "inset(-40px " + KEYW + "px -40px -40px)" }, 0);
          for (var i = 0; i <= NS; i++) {
            var p = i / NS, sx = SX0 + (SX1 - SX0) * ez(p), v = Math.max(0, Math.min(KEYW + 40, sx - PAD));
            tl.set("#f3_key", { clipPath: "inset(-40px " + (KEYW - v).toFixed(1) + "px -40px -40px)" }, SAT + p * SDUR);
          }
          // outline-to-fill: the revealed key inks in, full on the 14.35 beat
          tl.fromTo("#f3_key_f", { clipPath: "inset(100% -5% -10% -5%)" }, { clipPath: "inset(-10% -5% -10% -5%)", duration: 0.28, ease: "power2.out", immediateRender: false }, 3.22);
          // hanamaru around the answer (sparkle 14.05)
          draw("#f3_hana", 3.24, 0.40, "power1.inOut");

          // 3.21 lucas → happy (0 ms swap + squash), straightens up; 3.51 (14.35) happy hop
          tl.set("#f3_luc_h", { opacity: 1 }, 3.21);
          tl.set("#f3_luc_w", { opacity: 0 }, 3.21);
          tl.to("#f3_luc_lean", { rotation: 0, x: 0, duration: 0.22, ease: "back.out(2.5)" }, 3.21);
          tl.to("#f3_luc_lean", { scale: 0.92, duration: 0.04 }, 3.21);
          tl.to("#f3_luc_lean", { scale: 1.04, duration: 0.04 }, 3.25);
          tl.to("#f3_luc_lean", { scale: 1, duration: 0.05 }, 3.29);
          tl.to("#f3_luc_lean", { y: -28, duration: 0.12, ease: "power2.out" }, 3.51);
          tl.to("#f3_luc_lean", { y: 0, duration: 0.12, ease: "power2.in" }, 3.63);
          tl.to("#f3_luc_lean", { scaleX: 1.06, scaleY: 0.94, duration: 0.04 }, 3.75);
          tl.to("#f3_luc_lean", { scaleX: 1, scaleY: 1, duration: 0.07, ease: "power1.out" }, 3.79);
          boil("#f3_luc_w", 3, 0, D);
          boil("#f3_luc_h", 3, 0, D);

          // 3.90 (14.74) caption on a yellow cushion under the notebook; hold to the end
          hide0("#f3_cap");
          tl.set("#f3_cap", { autoAlpha: 1 }, 3.90);
          tl.fromTo("#f3_cap_bg", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power3.out", immediateRender: false }, 3.90);
          hide0("#f3_cap_tx");
          tl.fromTo("#f3_cap_tx", { x: -14, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, 3.96);

          tl.seek(0.001); tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines = window.__timelines || {};
          // ---- retimed by goldenrabbit-promo/scripts/retime.py: the authored timeline (OLD s) is driven through a
          // piecewise-linear warp so its bar lines land on the new track's downbeats (NEW s). Seek-safe: a tween on tl.time.
          (function (inner) {
            var MAP = [[0.0, 0.0], [1.67, 1.56], [3.36, 3.12], [5.01, 4.67]];   // [new local s, old local s]
            var OLD = 4.6700, NEW = 5.0100;
            function warp(p) {
              var t = p * NEW;
              for (var i = 1; i < MAP.length; i++) {
                if (t <= MAP[i][0] || i === MAP.length - 1) {
                  var a = MAP[i - 1], b = MAP[i], u = (t - a[0]) / (b[0] - a[0]);
                  return (a[1] + (b[1] - a[1]) * Math.max(0, Math.min(1, u))) / OLD;
                }
              }
              return 1;
            }
            inner.pause();
            var outer = gsap.timeline({ paused: true });
            outer.fromTo(inner, { time: 0 }, { time: OLD, duration: NEW, ease: warp, immediateRender: false }, 0);
            outer.seek(0.001); outer.seek(0);
            window.__timelines["03-f3"] = outer;
          })(tl);
        })();
      </script>
    </template>
  </body>
</html>
