        /* braam flash */

      <script>
        (function () {
          // Frame-local time: local_t = track_t − 11.0
          // anchors 11.31 / 12.24 / 13.68 / 15.07 / 16.02 → 0.31 / 1.24 / 2.68 / 4.07 / 5.02
          var A = [0.31, 1.24, 2.68, 4.07, 5.02];
          var END = 5.6;

          var root = document.querySelector('#stage[data-composition-id="02-f2"]');
          function $(id) {
            return (root && root.querySelector("#" + id)) || document.getElementById(id);
          }

          var tl = gsap.timeline({ paused: true });

          // Seek-safe fromTo: a 0ms set of the from-state at the same position, so a
          // backward seek past `at` reverts to the held state instead of the from-state.
          function ft(el, from, to, at) {
            tl.set(el, Object.assign({}, from), at); // clone: set() mutates its vars
            to.immediateRender = false;
            tl.fromTo(el, Object.assign({}, from), to, at);
          }

          var g1 = $("f2_g1");
          var cam = $("f2_g1_cam");
          var kicker = $("f2_g1_kicker");
          var title = $("f2_g1_title");
          var q = $("f2_g1_q");
          var bar = $("f2_g1_bar");
          var sub = $("f2_g1_sub");
          var tring = $("f2_g1_tring");
          var cring = $("f2_g1_cring");
          var flash = $("f2_g1_flash");
          var covers = [$("f2_g1_c1"), $("f2_g1_c2"), $("f2_g1_c3")];
          var caps = [$("f2_g1_cap1"), $("f2_g1_cap2"), $("f2_g1_cap3")];
          var chips = [$("f2_g1_chip1"), $("f2_g1_chip2"), $("f2_g1_chip3")];
          var ct1 = $("f2_g1_ct1");
          var ca1 = $("f2_g1_ca1");

          // rest / entry tilt alternate by index (deterministic)
          var REST = [-2, 2, -2];
          var FROMROT = [-8, 8, -8];

          // ---------- group gate (g1 spans the whole frame) ----------
          tl.set(g1, { autoAlpha: 1 }, 0);

          // ---------- t=0 state ----------
          // applied immediately (gsap.set) AND recorded at 0 on the timeline, so frame 0
          // is correct even when the first seek(0) is a no-op on a fresh timeline.
          function init(el, vars) {
            gsap.set(el, Object.assign({}, vars));
            tl.set(el, Object.assign({}, vars), 0);
          }
          init(cam, { scale: 1, transformOrigin: "50% 50%" });
          init(kicker, { autoAlpha: 1 }); // hard cut in on the kicker alone
          init(title, { autoAlpha: 0, scale: 1.45, transformOrigin: "0% 50%" });
          init(q, { y: 0, rotation: 0, transformOrigin: "50% 85%" });
          init(bar, { scaleX: 0, transformOrigin: "0% 50%" });
          init(sub, { autoAlpha: 0, y: 24 });
          init(tring, { autoAlpha: 0, scale: 0.45 });
          init(cring, { autoAlpha: 0, scale: 0.55 });
          init(flash, { opacity: 0 });
          for (var i = 0; i < 3; i++) {
            init(covers[i], { autoAlpha: 0, x: 0, y: 160, scale: 0.7, rotation: FROMROT[i] });
            init(caps[i], { autoAlpha: 0 });
            init(chips[i], { scale: 1, transformOrigin: "0% 50%" });
          }
          init([ct1, ca1], { autoAlpha: 0, y: 28 });

          // ---------- 0.31 (11.31): braam-punch title slam ----------
          var T0 = A[0];
          ft(title, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.05, ease: "none" }, T0 - 0.1);
          ft(title, { scale: 1.45 }, { scale: 1, duration: 0.1, ease: "power3.in" }, T0 - 0.1);
          ft(title, { scale: 1 }, { scale: 1.1, duration: 0.08, ease: "power4.out" }, T0);
          ft(title, { scale: 1.1 }, { scale: 1, duration: 0.7, ease: "elastic.out(1, 0.5)" }, T0 + 0.08);
          // flash (brand cream, brief)
          ft(flash, { opacity: 0 }, { opacity: 0.28, duration: 0.04, ease: "none" }, T0);
          ft(flash, { opacity: 0.28 }, { opacity: 0, duration: 0.28, ease: "power2.out" }, T0 + 0.04);
          // gold ring kicks out behind the title (replaces braam's glow)
          ft(tring, { scale: 0.45 }, { scale: 1.2, duration: 0.8, ease: "power3.out" }, T0);
          ft(tring, { autoAlpha: 0.9 }, { autoAlpha: 0, duration: 0.8, ease: "power2.out" }, T0);
          // stub bar wipes on the 11.40 hat, sub rises under it
          ft(bar, { scaleX: 0 }, { scaleX: 1, duration: 0.26, ease: "power3.out" }, 0.4);
          ft(sub, { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.46);

          // ---------- cover moves ----------
          function ringKick(t, dur) {
            ft(cring, { scale: 0.55 }, { scale: 1.2, duration: dur, ease: "power3.out" }, t);
            ft(cring, { autoAlpha: 1 }, { autoAlpha: 0, duration: dur, ease: "power2.out" }, t);
          }
          function popCover(n, t, holdEnd) {
            var c = covers[n];
            tl.set(c, { autoAlpha: 1 }, t);
            ft(
              c,
              { y: 160, scale: 0.7, rotation: FROMROT[n] },
              { y: 0, scale: 1, rotation: REST[n], duration: 0.55, ease: "back.out(1.8)" },
              t,
            );
            // slow float while it holds
            ft(c, { y: 0 }, { y: -12, duration: holdEnd - (t + 0.55), ease: "sine.inOut" }, t + 0.55);
          }
          // parabolic exit: x accelerates, y decelerates (quad arc), rotation winds up
          function exitCover(n, t) {
            var c = covers[n];
            var d = 0.6;
            ft(c, { x: 0 }, { x: 1200, duration: d, ease: "power1.in" }, t);
            ft(c, { y: -12 }, { y: -480, duration: d, ease: "power1.out" }, t);
            ft(c, { rotation: REST[n] }, { rotation: REST[n] + 32, duration: d, ease: "power1.in" }, t);
            ft(c, { scale: 1 }, { scale: 0.88, duration: d, ease: "none" }, t);
            tl.set(c, { autoAlpha: 0 }, t + d);
          }
          function swapCaption(n, t) {
            if (n > 0) tl.set(caps[n - 1], { autoAlpha: 0 }, t); // 0ms content-swap
            tl.set(caps[n], { autoAlpha: 1 }, t);
            ft(chips[n], { scale: 0.4 }, { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t);
          }

          // 1.24 (12.24): cover 1 pops, ring kicks, caption overlay-pops
          popCover(0, A[1], A[2]);
          ringKick(A[1], 0.75);
          swapCaption(0, A[1]);
          ft(ct1, { autoAlpha: 0, y: 28 }, { autoAlpha: 1, y: 0, duration: 0.32, ease: "power3.out" }, A[1] + 0.03);
          ft(ca1, { autoAlpha: 0, y: 28 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, A[1] + 0.09);

          // 2.68 (13.68): cover 1 arcs out, cover 2 pops in, caption swaps
          exitCover(0, A[2]);
          popCover(1, A[2], A[3]);
          ringKick(A[2], 0.75);
          swapCaption(1, A[2]);

          // 4.07 (15.07): same move for cover 3
          exitCover(1, A[3]);
          popCover(2, A[3], END);
          ringKick(A[3], 0.75);
          swapCaption(2, A[3]);

          // playful '?' hops on the in-between kicks (13.19, 14.14 downbeat)
          [2.189, 3.141].forEach(function (t) {
            ft(q, { y: 0, rotation: 0 }, { y: -22, rotation: 10, duration: 0.12, ease: "power2.out" }, t);
            ft(q, { y: -22, rotation: 10 }, { y: 0, rotation: 0, duration: 0.3, ease: "bounce.out" }, t + 0.12);
          });

          // ---------- 5.02 (16.02): ring pulse + push-in into the 17s surge ----------
          ringKick(A[4], 0.55);
          ft(cam, { scale: 1 }, { scale: 1.04, duration: END - A[4], ease: "power2.in" }, A[4]);

          tl.set(g1, { autoAlpha: 0 }, END);

          window.__timelines["02-f2"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
