          //  A depth column of cards rolls forward; on each landing the next card
          //  tumbles into the front slot and wipes in its face, the old front falls
          //  toward camera on a parabolic arc, and the deck advances one slot.
          //  Dwells shrink (1.42 → 1.42 → 0.92 → 0.96) into the held final card.
          // ══════════════════════════════════════════════════════════════════
          var ID = "03-f3";
          var DUR = 6.38; // == data-duration == span length
          var SPAN0 = 16.6; // frame start, track seconds

          function loc(t) {
            return Math.round((t - SPAN0) * 1000) / 1000;
          }
          // role_bindings.landing.times (track s) → frame-local: 0.37 1.79 3.21 4.13 5.09
          var LANDED = [16.97, 18.39, 19.81, 20.73, 21.69].map(loc);
          // strong kicks that fall inside a dwell (not on a landing) → ring pulse on the front card
          var KICKS = [18.878, 22.639].map(loc); // 2.278, 6.039
          var N = LANDED.length;

          function byId(id) {
            return document.getElementById(id);
          }
          var group = byId("f3_g1");
          var cards = [],
            rings = [],
            chips = [],
            covers = [],
            infos = [];
          for (var i = 0; i < N; i++) {
            cards.push(byId("f3_g1_card" + i));
            rings.push(byId("f3_g1_ring" + i));
            chips.push(byId("f3_g1_chip" + i));
            covers.push(byId("f3_g1_cover" + i)); // null on the type card
            infos.push(byId("f3_g1_info" + i));
          }

          // per-card transition duration from the gap into it (faster as the deck accelerates)
          function transDur(k) {
            var gap = k === 0 ? LANDED[1] - LANDED[0] : LANDED[k] - LANDED[k - 1];
            var d = Math.max(0.12, Math.min(0.42, gap * 0.32));
            // first card: start at t=0 and land exactly on its beat
            return k === 0 ? Math.min(d, LANDED[0]) : d;
          }

          // ── SLOT poses (template values; exit gains x travel + roll for a parabolic arc) ──
          var SLOT = {
            far: { x: 360, y: 380, z: -1080, rotX: 84, scale: 0.74, opacity: 0, zi: 60 },
            s3: { x: 280, y: 290, z: -820, rotX: 66, scale: 0.8, opacity: 0.32, zi: 70 },
            s2: { x: 195, y: 200, z: -560, rotX: 46, scale: 0.86, opacity: 0.58, zi: 80 },
            s1: { x: 105, y: 105, z: -290, rotX: 22, scale: 0.93, opacity: 0.85, zi: 90 },
            s0: { x: 0, y: 0, z: 0, rotX: 0, scale: 1.0, opacity: 1.0, zi: 100 },
            exit: { x: -240, y: 620, z: 420, rotX: -88, rotZ: -5, scale: 1.1, opacity: 0, zi: 110 },
          };
          function poseForRel(rel) {
            if (rel <= -1) return SLOT.exit;
            if (rel === 0) return SLOT.s0;
            if (rel === 1) return SLOT.s1;
            if (rel === 2) return SLOT.s2;
            if (rel === 3) return SLOT.s3;
            return SLOT.far;
          }

          var tl = gsap.timeline({ paused: true });

          // group window: g1 owns the whole frame
          gsap.set(group, { autoAlpha: 1 });
          tl.set(group, { autoAlpha: 1 }, 0);

          function poseTween(idx, slot, t, dur, ease) {
            tl.set(cards[idx], { zIndex: slot.zi }, t);
            tl.to(
              cards[idx],
              {
                x: slot.x,
                y: slot.y,
                z: slot.z,
                rotationX: slot.rotX,
                scale: slot.scale,
                opacity: slot.opacity,
                force3D: true,
                duration: dur,
                ease: ease,
              },
              t,
            );
          }
          // exit = tumble forward + fall toward camera, split so x eases out while y
          // accelerates in → the card (and its cover) leaves on a parabolic arc.
          function exitTween(idx, t, dur) {
            var e = SLOT.exit;
            tl.set(cards[idx], { zIndex: e.zi }, t);
            tl.to(cards[idx], { x: e.x, rotationZ: e.rotZ, duration: dur, ease: "power1.out" }, t);
            tl.to(
              cards[idx],
              {
                y: e.y,
                z: e.z,
                rotationX: e.rotX,
                scale: e.scale,
                opacity: e.opacity,
                force3D: true,
                duration: dur,
                ease: "power2.in",
              },
              t,
            );
          }

          // ── Initial pose: nothing landed; card j waits at rel = j + 1 ──
          for (var j = 0; j < N; j++) {
            var s = poseForRel(j + 1);
            var props = {
              x: s.x,
              y: s.y,
              z: s.z,
              rotationX: s.rotX,
              rotationZ: 0,
              scale: s.scale,
              opacity: s.opacity,
              zIndex: s.zi,
              force3D: true,
              "--wipe": 0,
            };
            gsap.set(cards[j], props);
            tl.set(cards[j], props, 0);
          }

          // ── Per-landing orchestration ──
          for (var L = 0; L < N; L++) {
            var dur = transDur(L);
            var t = Math.max(0, LANDED[L] - dur);
            var a = LANDED[L];

            for (var k = L - 1; k <= L + 4; k++) {
              if (k < 0 || k >= N) continue;
              var rel = k - L;
              if (rel < 0) exitTween(k, t, dur);
              else poseTween(k, poseForRel(rel), t, dur, rel === 0 ? "power3.out" : "power2.inOut");
            }

            // the landing card wipes in its face (band rides the leading edge)
            tl.to(cards[L], { "--wipe": 1, duration: dur * 0.85, ease: "power2.inOut" }, t + dur * 0.15);

            // content settles as the face arrives
            if (covers[L]) {
              tl.fromTo(
                covers[L],
                { y: 40, rotation: L % 2 ? -2.5 : 2.5 },
                { y: 0, rotation: 0, duration: dur + 0.3, ease: "power3.out" },
                t,
              );
              tl.fromTo(infos[L], { x: 40 }, { x: 0, duration: dur + 0.3, ease: "power3.out" }, t);
            } else {
              tl.fromTo(infos[L], { y: 28 }, { y: 0, duration: dur + 0.3, ease: "power3.out" }, t);
            }

            // percussion ON the landing: ring + tag chip pop
            tl.fromTo(
              rings[L],
              { scale: 0.3, opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(2.4)" },
              a - 0.02,
            );
            tl.fromTo(
              chips[L],
              { scale: 0.55, opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)" },
              a,
            );
          }

          // ── Strong kicks inside a dwell → the front card's ring pulses ──
          for (var q = 0; q < KICKS.length; q++) {
            var tk = KICKS[q];
            var front = -1;
            for (var f = 0; f < N; f++) if (LANDED[f] <= tk) front = f;
            if (front < 0) continue;
            tl.fromTo(
              rings[front],
              { scale: 1 },
              { scale: 1.35, duration: 0.08, ease: "power2.out", immediateRender: false },
              tk,
            );
            tl.fromTo(
              rings[front],
              { scale: 1.35 },
              { scale: 1, duration: 0.24, ease: "power2.inOut", immediateRender: false },
              tk + 0.08,
            );
          }

          // group window end (hard cut to f4 is the assembler's)
          tl.set(group, { autoAlpha: 0 }, DUR);

          window.__timelines = window.__timelines || {};
          window.__timelines[ID] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
