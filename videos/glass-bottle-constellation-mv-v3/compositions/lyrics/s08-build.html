        (function () {
          var D = 10.3; // track 128.70 → 139.00
          var tl = gsap.timeline({ paused: true });

          function $(id) { return document.getElementById(id); }
          function q(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
          // finite yoyo count that ends at or before `until`
          function reps(half, from, until) { return Math.max(0, Math.floor((until - from) / half) - 1); }
          // non-overlapping pulses on one property: ev = [[t, peak, base, up, down], ...]; each fall is clipped before the next rise
          function pulses(target, prop, ev, until) {
            ev.sort(function (a, b) { return a[0] - b[0]; });
            ev.forEach(function (e, i) {
              var t = e[0], next = i + 1 < ev.length ? ev[i + 1][0] : until;
              var up = {}; up[prop] = e[1]; up.duration = e[3]; up.ease = "power2.out";
              tl.to(target, up, t);
              var dn = Math.min(e[4], next - t - e[3] - 0.005);
              if (dn > 0.015) { var v = {}; v[prop] = e[2]; v.duration = dn; v.ease = "power2.inOut"; tl.to(target, v, t + e[3]); }
            });
          }
          function flare(sel, t, s) {
            tl.to(sel, { scale: s, duration: 0.1, ease: "power2.out" }, t);
            tl.to(sel, { scale: 1, duration: 0.5, ease: "power2.inOut" }, t + 0.1);

          // ---- anchors (local seconds = track − 128.70)

          var T_TTU = 5.07;     // 133.77 뚜껑을
          var T_YEOL = 5.79;    // 134.49 열어
          var T_BOLGE = 7.83;   // 136.53 볼게 · cut to s08d
          var T_END32 = 9.95;   // 138.65 L32 vocal_end
          var SN_M = [8.483, 8.971, 9.459, 9.784, 10.109]; // snare run 137.18 … 138.81 (= montage cuts)
          var T_POP = 10.16;    // 138.86 bloom peak
          // hits under the lid shot (audio events): kick 133.933, ~134.57, snare 135.07, kick 135.233, snares 135.558/135.883, kick 136.208, snare 136.348
