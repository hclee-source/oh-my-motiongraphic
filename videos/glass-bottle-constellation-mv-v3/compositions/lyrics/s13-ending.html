<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8" /><!-- s13-ending: transparent title/light layer over the ending montage (track 180.75 → 189.96). --></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Noto Serif KR"; src: url("assets/fonts/NotoSerifKR-VF.woff2") format("woff2"); font-weight: 200 900; font-style: normal; font-display: block; }
        @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/CormorantGaramond-Italic-VF.woff2") format("woff2"); font-weight: 300 700; font-style: italic; font-display: block; }

        #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
        #l13_fade, #l13_title { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

        /* Title axis: the gap between the two words sits on the REAL hero star of s13c/d (≈ 703,213 on screen).
           Drift scales about that point so the star stays in the gap. */
        #l13_title { transform-origin: 703.5px 213px; }

        /* soft dark scrim behind the lockup, with a hole on the hero star so the footage star stays bright */
        #l13_scrim { position: absolute; left: 83px; top: 20px; width: 1240px; height: 460px; opacity: 0;
                     background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(5,7,20,.56) 0%, rgba(5,7,20,.40) 42%, rgba(5,7,20,.14) 70%, rgba(5,7,20,0) 100%);
                     -webkit-mask-image: radial-gradient(circle at 620.5px 193px, transparent 0px, transparent 24px, #000 66px);
                     mask-image: radial-gradient(circle at 620.5px 193px, transparent 0px, transparent 24px, #000 66px); }

        /* ---- Korean title, hero 118 / 700 ---- */
        .l13-word { position: absolute; top: 140px; font-family: "Noto Serif KR", serif; font-weight: 700; font-size: 118px;
                    line-height: 1.12; letter-spacing: -0.01em; color: #F4F1EA; white-space: nowrap; }
        #l13_w1 { right: 1251px; text-align: right; }   /* right edge x = 669 */
        #l13_w2 { left: 739px; }                        /* left edge  x = 739 → 70px gap centred on x 704 */
        .l13-ch { position: relative; z-index: 0; display: inline-block; opacity: 0; filter: blur(10px);
                  text-shadow: rgba(5,7,20,.9) 0px 1px 3px, rgba(255,210,122,.45) 0px 0px 18px,
                               rgba(255,210,122,.18) 0px 0px 46px, rgba(5,7,20,.5) 0px 0px 30px; }
        /* glow-only twin of each glyph (transparent fill, gold shadow) — its opacity is the "light level" */
        .l13-gl { position: absolute; left: 0; top: 0; z-index: -1; opacity: 0; color: transparent;
                  text-shadow: rgba(255,228,160,.95) 0px 0px 24px, rgba(255,210,122,.55) 0px 0px 72px; }

        /* ---- English line, title-en ---- */
        #l13_en { position: absolute; left: 203px; top: 284px; width: 1000px; text-align: center;
                  font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 400; font-size: 44px;
                  line-height: 1.2; letter-spacing: 0.06em; color: #DCEBFF; white-space: nowrap; opacity: 0; filter: blur(6px);
                  text-shadow: rgba(5,7,20,.9) 0px 1px 3px, rgba(220,235,255,.25) 0px 0px 14px, rgba(5,7,20,.55) 0px 0px 22px; }

        /* ---- light accents on REAL light sources ---- */
        .l13-glow { position: absolute; border-radius: 50%; opacity: 0;
                    background: radial-gradient(circle at 50% 50%, rgba(255,244,214,.80) 0%, rgba(255,210,122,.36) 22%, rgba(255,210,122,.10) 46%, rgba(255,210,122,0) 70%); }
        #l13_halo  { left: 648.5px; top: 158.5px; width: 110px; height: 110px; }   /* hero star of s13c/d (703.5, 213.5) */
        #l13_bloom { left: 882px; top: 710px; width: 360px; height: 360px; }       /* landing star of s13e (1062, 890) */
        #l13_burst { position: absolute; left: 1062px; top: 888px; width: 0; height: 0; }
        .l13-mote { position: absolute; border-radius: 50%; opacity: 0;
                    background: radial-gradient(circle at 50% 50%, #FFF4D6 0%, rgba(255,210,122,.85) 38%, rgba(255,210,122,0) 72%); }
      </style>

      <div id="stage" data-composition-id="s13-ending" data-width="1920" data-height="1080" data-duration="9.21">
        <div id="l13_fade" data-layout-allow-overlap="">
          <div id="l13_scrim" data-layout-ignore=""></div>
          <div id="l13_halo" class="l13-glow" data-layout-ignore=""></div>
          <div id="l13_bloom" class="l13-glow" data-layout-ignore=""></div>
          <div id="l13_burst" data-layout-ignore=""></div>

          <div id="l13_title" data-layout-allow-overlap="">
            <div id="l13_w1" class="l13-word"><span class="l13-ch" id="l13_c0"><span class="l13-gl" id="l13_g0" data-layout-ignore="">유</span>유</span><span class="l13-ch" id="l13_c1"><span class="l13-gl" id="l13_g1" data-layout-ignore="">리</span>리</span><span class="l13-ch" id="l13_c2"><span class="l13-gl" id="l13_g2" data-layout-ignore="">병</span>병</span></div>
            <div id="l13_w2" class="l13-word"><span class="l13-ch" id="l13_c3"><span class="l13-gl" id="l13_g3" data-layout-ignore="">별</span>별</span><span class="l13-ch" id="l13_c4"><span class="l13-gl" id="l13_g4" data-layout-ignore="">자</span>자</span><span class="l13-ch" id="l13_c5"><span class="l13-gl" id="l13_g5" data-layout-ignore="">리</span>리</span></div>
            <div id="l13_en">Glass-Bottle Constellation</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });
          // local t = track t − 180.75

          var CH = [0, 1, 2, 3, 4, 5].map(function (i) { return document.getElementById("l13_c" + i); });
          var GL = [0, 1, 2, 3, 4, 5].map(function (i) { return document.getElementById("l13_g" + i); });

          var LIGHT = 0.10;   // 180.85 band lock-in: title lights char by char
          var EN = 0.65;      // 181.40 English line
          var DB1 = 1.898;    // 182.648 downbeat (cut to s13b)
          var DB2 = 4.499;    // 185.249 downbeat (cut to s13c)
          var S13C = 4.50;    // 185.25 hero star appears in the title gap
          var FREEZE = 6.00;  // 186.75 band STOP
          var HIT = 7.75;     // 188.50 final hit (cut to s13e, star lands)
          var OUT = 8.35;     // 189.10 → 189.60 fade

          // ---------- scrim ----------
          tl.fromTo("#l13_scrim", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, LIGHT);

          // ---------- title lights, char by char ----------
          CH.forEach(function (ch, i) {
            var t = LIGHT + i * 0.075;
            tl.fromTo(ch, { opacity: 0, y: 14, filter: "blur(10px)" },
                          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, t);
            tl.fromTo(GL[i], { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, t);
            tl.to(GL[i], { opacity: 0, duration: 0.9, ease: "power2.out" }, t + 0.15);
          });
          tl.fromTo("#l13_en", { opacity: 0, y: 12, filter: "blur(6px)" },
                               { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power2.out" }, EN);

          // slow push about the star point — linear, stops dead at the freeze
          tl.fromTo("#l13_title", { scale: 1 }, { scale: 1.018, duration: FREEZE - LIGHT, ease: "none" }, LIGHT);

          // ---------- downbeat glow ripples (light only, no motion) ----------
          [DB1, DB2].forEach(function (T) {
            GL.forEach(function (g, i) {
              var t = T + i * 0.04;
              tl.to(g, { opacity: 0.6, duration: 0.1, ease: "power2.out" }, t);
              tl.to(g, { opacity: 0, duration: 0.55, ease: "sine.out" }, t + 0.1);
            });
          });

          // ---------- hero star of s13c/d sits in the gap: a soft halo on it ----------
          tl.fromTo("#l13_halo", { opacity: 0, scale: 0.6 }, { opacity: 0.32, scale: 1, duration: 0.35, ease: "power2.out" }, S13C);
          tl.fromTo("#l13_halo", { x: 2.9, y: 2.5 }, { x: -2.9, y: -2.4, duration: FREEZE - S13C, ease: "none" }, S13C);  // star 706→700.6
          tl.set("#l13_halo", { opacity: 0 }, HIT);   // hard cut to s13e: that star is gone

          // ---------- 186.75 STOP: freeze, title dims ----------
          tl.to("#l13_title", { opacity: 0.85, duration: 0.25, ease: "power2.out" }, FREEZE);

          // ---------- 188.50 FINAL HIT: title to full glow + bloom on the real landing star ----------
          tl.to("#l13_title", { opacity: 1, duration: 0.2, ease: "power2.out" }, HIT);
          GL.forEach(function (g, i) {
            var t = HIT + i * 0.02;
            tl.to(g, { opacity: 1, duration: 0.1, ease: "power2.out" }, t);
            tl.to(g, { opacity: 0.4, duration: 0.9, ease: "power2.out" }, t + 0.1);
          });
          tl.fromTo("#l13_bloom", { opacity: 0, scale: 0.25 }, { opacity: 0.72, scale: 1, duration: 0.12, ease: "power2.out" }, HIT);
          tl.to("#l13_bloom", { scale: 1.6, duration: 1.0, ease: "expo.out" }, HIT + 0.12);
          tl.to("#l13_bloom", { opacity: 0, duration: 0.9, ease: "power1.in" }, HIT + 0.12);
          tl.fromTo("#l13_bloom", { x: 0, y: 0 }, { x: -12, y: 8, duration: 1.0, ease: "none" }, HIT);   // star settles 1062→1050

          // a few small light motes lifting off the landing point (fixed table — deterministic)
          var MOTES = [
            [-72, -96, 8, 1.10, 0.00], [56, -122, 6, 1.25, 0.02], [-124, -38, 7, 1.00, 0.03], [112, -58, 9, 1.15, 0.01],
            [-28, -152, 5, 1.30, 0.04], [22, -82, 10, 0.95, 0.02], [-96, -132, 6, 1.20, 0.05], [142, -108, 5, 1.05, 0.03]
          ];
          var burstEl = document.getElementById("l13_burst");
          MOTES.forEach(function (m, i) {
            var p = document.createElement("div");
            p.id = "l13_m" + i;
            p.className = "l13-mote";
            p.setAttribute("data-layout-ignore", "");
            p.style.width = m[2] + "px"; p.style.height = m[2] + "px";
            p.style.left = (-m[2] / 2) + "px"; p.style.top = (-m[2] / 2) + "px";
            burstEl.appendChild(p);
            var t = HIT + 0.04 + m[4];
            tl.fromTo(p, { x: 0, y: 0, scale: 1 },
                         { x: m[0], y: m[1], scale: 0.35, duration: m[3], ease: "expo.out" }, t);
            tl.to(p, { opacity: 1, duration: 0.06, ease: "none" }, t);
            tl.to(p, { opacity: 0, duration: m[3] - 0.06, ease: "power2.in" }, t + 0.06);
          });

          // ---------- 189.10 → 189.60: fade out with the band ----------
          tl.fromTo("#l13_fade", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "sine.inOut" }, OUT);

          window.__timelines["s13-ending"] = tl;
          tl.set({}, {}, 9.21);
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
