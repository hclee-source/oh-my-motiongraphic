          tl.fromTo("#f10_mouth", { opacity: 0.8 }, { opacity: 1, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, 0.8);
          tl.fromTo("#f10_mouth", { scale: 1 }, { scale: 1.3, duration: 0.2, ease: "power2.out", immediateRender: false }, 3.46);
          tl.fromTo("#f10_mouth", { scale: 1.3 }, { scale: 1, duration: 0.8, ease: "sine.out", immediateRender: false }, 3.7);

          tl.fromTo("#f10_mouth", { scale: 1.35 }, { scale: 1.05, duration: 0.8, ease: "sine.out", immediateRender: false }, 9.4);

          var KIND = [
