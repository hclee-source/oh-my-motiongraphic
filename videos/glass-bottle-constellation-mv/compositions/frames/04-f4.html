              var side = (i % 2) ? 1 : -1, ou = use(over, "f4_spkH"), osz = 6 + (i % 3) * 1.5, ot = 18.85 + i * 0.2;
              tl.set(ou, { svgOrigin: "0 0", x: 960 + side * 6, y: 521, scale: 0, opacity: 0 }, 0);
              tl.to(ou, { opacity: 1, scale: osz, duration: 0.12, ease: "power2.out" }, ot);
              tl.to(ou, { keyframes: OVR.map(function (k) { return { x: 960 + side * (k[0] - 960), y: k[1], duration: k[2], ease: k[3] }; }) }, ot);
              tl.to(ou, { opacity: 0, scale: osz * 0.4, duration: 0.4, ease: "power1.in" }, ot + OTOT - 0.4);
            })(i);
          }
          tl.to("#f4_L13", { autoAlpha: 0, filter: "blur(8px)", x: 16, duration: 0.22, ease: "power2.in" }, L(62.05) - 0.03);

          // ================= L14 — release =================
          tl.set("#f4_L14", { autoAlpha: 0, y: 14, filter: "blur(6px)" }, 0);
          tl.to("#f4_L14", { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power2.out" }, X14 - 0.25);
          var NAL = L(62.69);
          bloom("#f4_L14_kw", NAL, 1.1);

          // the kept stars inside rise to the neck and leave...
          for (i = 0; i < 6; i++) {
            var fo = IN[i], ft = NAL - 0.04 + i * 0.035;
            tl.to(fo.u, { x: 200, y: 84, scale: fo.s * 0.6, duration: 0.34, ease: "power2.in" }, ft);
            tl.to(fo.u, { opacity: 0, duration: 0.12, ease: "power1.in" }, ft + 0.24);
          }
          tl.to("#f4_fill", { attr: { transform: "scale(1 0.72)" }, duration: 0.8, ease: "power2.out" }, NAL);
          tl.to("#f4_glow", { opacity: 0.55, duration: 0.8, ease: "power2.out" }, NAL);
          tl.to("#f4_halo", { opacity: 0.6, duration: 0.1, ease: "power2.out" }, NAL);
          tl.to("#f4_halo", { opacity: 0.22, duration: 0.8, ease: "sine.inOut" }, NAL + 0.1);

          // ...and twelve sparkles fly out of the mouth in arcs (sideways first, then up)
          var fly = $("f4_fly"); clear(fly);
          var FT = [[330, 210, 1], [1590, 215, 1], [150, 380, 0], [1770, 430, 0], [600, 140, 1], [1330, 125, 1],
                    [430, 70, 0], [1500, 60, 0], [120, 160, 0], [1730, 330, 1], [720, 50, 0], [1220, 40, 0]];
          var keepers = [];
          FT.forEach(function (f, j) {
            var fu = use(fly, "f4_spkH"), t = NAL + j * 0.035, d = 1.0 + (j % 4) * 0.1, fsz = 9 + (j % 3) * 2;
            tl.set(fu, { svgOrigin: "0 0", x: 960, y: 522, scale: 0, opacity: 0 }, 0);
            tl.to(fu, { opacity: 1, scale: fsz, duration: 0.1, ease: "power2.out" }, t);
            tl.to(fu, { x: f[0], duration: d, ease: "power2.out" }, t);
            tl.to(fu, { y: f[1], duration: d, ease: "sine.inOut" }, t);
            if (f[2]) keepers.push({ u: fu, y: f[1], s: fsz, arrive: t + d });
            else tl.to(fu, { opacity: 0, scale: fsz * 0.3, duration: d * 0.45, ease: "power1.in" }, t + d * 0.55);
          });

          // 보낼게: the line's letters lift off and go
          var c14 = gsap.utils.toArray("#f4_L14 .f4-c");
          tl.set(c14, { filter: "blur(0px)" }, 19.4);
          c14.forEach(function (c, j) {
            var t = L(63.51) + j * 0.07;
            tl.to(c, { y: -110 - (j % 3) * 12, filter: "blur(8px)", duration: 0.95, ease: "power1.in" }, t);
            tl.to(c, { autoAlpha: 0, duration: 0.5, ease: "power1.in" }, t + 0.45);
          });
          tl.set("#f4_L14", { autoAlpha: 0 }, 22.6);

          // ================= interlude — each light hit settles one released sparkle as a new star =================
          [64.38, 65.04, 65.69, 66.01, 66.34].forEach(function (hit, j) {
            var k = keepers[j], h = L(hit);
            tl.to(k.u, { y: k.y - 8, duration: h - k.arrive, ease: "sine.inOut" }, k.arrive);
            tl.to(k.u, { scale: k.s * 1.9, duration: 0.08, ease: "power2.out" }, h);
            tl.to(k.u, { scale: k.s * 0.5, duration: Math.min(0.5, 24.28 - (h + 0.08)), ease: "power2.inOut" }, h + 0.08);
            tl.to(k.u, { opacity: 0, duration: 0.25, ease: "power1.in" }, 24.0);
          });
          // bottle sinks 60px and fades out by 66.4
          tl.to("#f4_bottle", { y: 60, duration: 1.6, ease: "sine.inOut" }, 22.4);
          tl.to("#f4_bottle", { autoAlpha: 0, duration: 1.6, ease: "power1.in" }, 22.4);

          tl.set("#f4_g1", { autoAlpha: 0 }, DUR);

          window.__timelines = window.__timelines || {};
          window.__timelines[FID] = tl;
          tl.seek(0);
        })();
      </script>
