                    <div class="f4-qbar" style="left: 22px; top: 219px; width: 168px"></div>
                    <div class="f4-opt" style="top: 290px"><div class="f4-bub">1</div><div class="f4-obar" style="width: 190px"></div></div>
                    <div class="f4-opt" style="top: 360px"><div class="f4-bub">2</div><div class="f4-obar" style="width: 230px"></div><div id="f4_m1" class="f4-mark" data-layout-allow-overlap="" data-layout-allow-occlusion="">2</div></div>
                    <div class="f4-opt" style="top: 430px"><div class="f4-bub">3</div><div class="f4-obar" style="width: 170px"></div></div>
                    <div class="f4-opt" style="top: 500px"><div class="f4-bub">4</div><div class="f4-obar" style="width: 210px"></div></div>
                  </div>
                  <div id="f4_q2" class="f4-qpanel">
                    <div class="f4-qnum">Q2.</div>
                    <div class="f4-qbar" style="left: 80px; top: 145px; width: 210px"></div>
                    <div class="f4-qbar" style="left: 22px; top: 182px; width: 290px"></div>
                    <div class="f4-qbar" style="left: 22px; top: 219px; width: 140px"></div>
                    <div class="f4-opt" style="top: 290px"><div class="f4-bub">1</div><div class="f4-obar" style="width: 220px"></div></div>
                    <div class="f4-opt" style="top: 360px"><div class="f4-bub">2</div><div class="f4-obar" style="width: 160px"></div></div>
                    <div class="f4-opt" style="top: 430px"><div class="f4-bub">3</div><div class="f4-obar" style="width: 240px"></div></div>
                    <div class="f4-opt" style="top: 500px"><div class="f4-bub">4</div><div class="f4-obar" style="width: 190px"></div><div id="f4_m2" class="f4-mark" data-layout-allow-overlap="" data-layout-allow-occlusion="">4</div></div>
                  </div>
                  <div id="f4_q3" class="f4-qpanel">
                    <div class="f4-qnum">Q3.</div>
                    <div class="f4-qbar" style="left: 80px; top: 145px; width: 200px"></div>
                    <div class="f4-qbar" style="left: 22px; top: 182px; width: 284px"></div>
                    <div class="f4-qbar" style="left: 22px; top: 219px; width: 220px"></div>
                    <div class="f4-opt" style="top: 290px"><div class="f4-bub">1</div><div class="f4-obar" style="width: 200px"></div><div id="f4_m3" class="f4-mark" data-layout-allow-overlap="" data-layout-allow-occlusion="">1</div></div>
                    <div class="f4-opt" style="top: 360px"><div class="f4-bub">2</div><div class="f4-obar" style="width: 250px"></div></div>
                    <div class="f4-opt" style="top: 430px"><div class="f4-bub">3</div><div class="f4-obar" style="width: 180px"></div></div>
                    <div class="f4-opt" style="top: 500px"><div class="f4-bub">4</div><div class="f4-obar" style="width: 226px"></div></div>

                  <!-- prev / next buttons (icons only) -->
                  <div class="f4-nav f4-navprev">
                    <svg viewBox="0 0 32 32" fill="none" stroke="rgba(34,38,133,0.6)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 8 L11 16 L19 24" /></svg>
                  </div>
                  <div class="f4-nav f4-navnext">
                    <svg viewBox="0 0 32 32" fill="none" stroke="#F2F0EA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8 L21 16 L13 24" /></svg>

            </div>
          </div>

          <!-- right column: t1 + t2, then 'n' replaces them -->
          <div id="f4_t1"><span class="f4-ch">P</span><span class="f4-ch">C</span><span class="f4-ch">도</span><span class="f4-ch">&nbsp;</span><span class="f4-ch">폰</span><span class="f4-ch">도</span><span id="f4_caret"></span></div>
          <div id="f4_t2"><span class="f4-ulwrap">실전처럼<span id="f4_ul"></span></span></div>
          <div id="f4_n">
            <div class="f4-nl"><span class="f4-nw">기출변형</span><span id="f4_na" class="f4-nn">4</span><span class="f4-nw">회</span><span class="f4-np">+</span></div>
            <div class="f4-nl"><span class="f4-nw">모의고사</span><span id="f4_nb" class="f4-nn">3</span><span class="f4-nw">회</span></div>
          </div>

          <!-- the user's character: flat crop sits on the frame's bottom edge -->
          <div id="f4_thumbpos" class="f4-anchor">
            <img id="f4_thumbs" src="assets/characters/thumbs.png" alt="">
          </div>
        </div>

        <!-- ============ g2: vocabulary card flip (24.20–26.15) ============ -->
        <div id="f4_g2" class="f4-group">
          <div id="f4_lblrow">
            <div id="f4_lbl"><div id="f4_lblbg"></div><span id="f4_lbltxt">CBT &amp; 용어 학습</span></div>
          </div>
          <div id="f4_cardpos">
            <div id="f4_card">
              <div class="f4-face f4-front"><div id="f4_term" data-layout-allow-overlap="">과적합</div></div>
              <div class="f4-face f4-back"><div id="f4_meaning" data-layout-allow-overlap="">학습 데이터에만<br>너무 잘 맞는 상태</div></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var FID = "04-f4";
          var DUR = 5.81;
          function $(id) {
            return document.getElementById(id);
          }

          // Frame-local beats (track seconds - 20.34)
          //       20.34 20.83 21.32 21.78 22.27 22.76 23.24 23.73 24.20 24.68 25.17 25.66
          var B = [0.0, 0.49, 0.98, 1.44, 1.93, 2.42, 2.9, 3.39, 3.86, 4.34, 4.83, 5.32];
          var G1_END = B[8]; // 24.20 → 0ms cut to g2

          var tl = gsap.timeline({ paused: true });

          // ================= group visibility (0ms cut at 24.20) =================
          tl.set("#f4_g1", { autoAlpha: 1 }, 0);
          tl.set("#f4_g1", { autoAlpha: 0 }, G1_END);
          tl.set("#f4_g2", { autoAlpha: 0 }, 0);
          tl.set("#f4_g2", { autoAlpha: 1 }, G1_END);

          // ================= g1 =================
          // 20.34: monitor springs up from y +60, phone rises in front 0.12 s later (-6deg tilt)
          tl.set("#f4_dev", { y: 0 }, 0);
          tl.set("#f4_mon", { autoAlpha: 1 }, 0);
          tl.fromTo("#f4_mon", { y: 60, scale: 0.94 }, { y: 0, scale: 1, duration: 0.45, ease: "back.out(1.4)", immediateRender: false }, 0);
          tl.set("#f4_phone", { autoAlpha: 1, rotation: -12, y: 1100 }, 0);
          tl.fromTo("#f4_phone", { y: 1100 }, { y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 0.12);
          tl.fromTo("#f4_phone", { rotation: -12 }, { rotation: -6, duration: 0.62, ease: "back.out(1.6)", immediateRender: false }, 0.12);
          tl.set(["#f4_q1", "#f4_mq1"], { autoAlpha: 1 }, 0);

          // 20.40: t1 types in (typewriter-reveal) with an accent caret
          var chars = $("f4_t1").querySelectorAll(".f4-ch");
          var T1 = 0.06;
          var STEP = 0.05;
          for (var c = 0; c < chars.length; c++) {
            tl.set(chars[c], { opacity: 0 }, 0);
            tl.set(chars[c], { opacity: 1 }, T1 + c * STEP);
          }
          tl.set("#f4_caret", { opacity: 0 }, 0);
          tl.set("#f4_caret", { opacity: 1 }, T1);
          [0.5, 0.66, 0.82, 0.98, 1.14].forEach(function (t, j) {
            tl.set("#f4_caret", { opacity: j % 2 ? 1 : 0 }, t);
          });
          tl.set("#f4_caret", { opacity: 0 }, 1.3);

          // t2 rises right after t1; the accent underline draws on 20.83
          var T2 = T1 + chars.length * STEP;
          tl.set("#f4_t2", { autoAlpha: 1 }, T2);
          tl.fromTo("#f4_t2", { y: 46 }, { y: 0, duration: 0.2, ease: "power4.out", immediateRender: false }, T2);
          gsap.set("#f4_ul", { scaleX: 0 });   // initial state lives in GSAP, not CSS (avoids the CSS/GSAP transform conflict)
          tl.set("#f4_ul", { scaleX: 0 }, 0);
          tl.fromTo("#f4_ul", { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: "expo.out", immediateRender: false }, B[1]);

          // 20.83 / 21.32 / 21.78: one answer per beat — phone + monitor question + monitor answer sheet together
          function pop(id, t) {
            tl.set(id, { autoAlpha: 1 }, t);
            tl.fromTo(id, { scale: 0.3 }, { scale: 1, duration: 0.16, ease: "back.out(2.6)", immediateRender: false }, t);
          }
          gsap.set(["#f4_pfill", "#f4_mfill"], { scaleX: 0.06 });
          tl.set(["#f4_pfill", "#f4_mfill"], { scaleX: 0.06 }, 0);
          [B[1], B[2], B[3]].forEach(function (t, j) {
            var i = j + 1;
            pop("#f4_m" + i, t);
            pop("#f4_mm" + i, t);
            pop("#f4_om" + i, t);
            tl.to(["#f4_pfill", "#f4_mfill"], { scaleX: 0.06 + i * 0.1, duration: 0.2, ease: "power2.out" }, t);
            if (i < 3) {
              // advance both screens to the next question at 0ms on the off-beat
              tl.set(["#f4_q" + i, "#f4_mq" + i], { autoAlpha: 0 }, t + 0.24);
              tl.set(["#f4_q" + (i + 1), "#f4_mq" + (i + 1)], { autoAlpha: 1 }, t + 0.24);
            }
          });

          // 22.27: REPLACE — t1 + t2 slide up and out, 'n' takes the same centre line
          var TC = B[4];
          tl.fromTo(["#f4_t1", "#f4_t2"], { y: 0, autoAlpha: 1 }, { y: -60, autoAlpha: 0, duration: 0.22, ease: "power2.in", stagger: 0.04, immediateRender: false }, TC - 0.12);
          tl.set("#f4_n", { autoAlpha: 1 }, TC);
          tl.fromTo("#f4_n", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, TC);

          // counting-punch: '4' and '3' tick up from 0 with 0ms text swaps, then punch-and-lock
          tl.set("#f4_na", { textContent: "0" }, 0);
          tl.set("#f4_nb", { textContent: "0" }, 0);
          [["#f4_na", 4, 0], ["#f4_nb", 3, 0.1]].forEach(function (n) {
            var t0 = TC + n[2];
            var TICK = 0.07;
            for (var k = 0; k <= n[1]; k++) {
              tl.set(n[0], { textContent: String(k) }, t0 + k * TICK);
            }
            var tLand = t0 + n[1] * TICK;
            tl.fromTo(n[0], { scale: 1.35 }, { scale: 1, duration: 0.24, ease: "power4.out", immediateRender: false }, tLand);
          });

          // 22.76: the user's thumbs character pops up from the bottom edge at x≈1700; drops out at 24.0
          tl.set("#f4_thumbs", { autoAlpha: 0, y: 380 }, 0);
          tl.set("#f4_thumbs", { autoAlpha: 1 }, B[5]);
          tl.fromTo("#f4_thumbs", { y: 380 }, { y: 0, duration: 0.4, ease: "back.out(1.5)", immediateRender: false }, B[5]);
          tl.fromTo("#f4_thumbs", { scale: 1 }, { scale: 1.06, duration: 0.12, ease: "power2.out", immediateRender: false }, B[6]);
          tl.to("#f4_thumbs", { scale: 1, duration: 0.2, ease: "power2.inOut" }, B[6] + 0.12);
          var TOUT = 3.66; // 24.00
          tl.to("#f4_thumbs", { y: 380, duration: 0.2, ease: "power2.in" }, TOUT);

          // 24.0 → 24.20: devices drop out the bottom, landing on the whoosh at 24.18
          tl.fromTo("#f4_dev", { y: 0 }, { y: 900, duration: G1_END - TOUT, ease: "power3.in", immediateRender: false }, TOUT);

          // ================= g2 =================
          // 24.20: label box snaps open from the left (accent box, ink text)
          tl.set("#f4_lblbg", { scaleX: 0.04 }, 0);
          tl.fromTo("#f4_lblbg", { scaleX: 0.04 }, { scaleX: 1, duration: 0.12, ease: "power3.out", immediateRender: false }, G1_END);
          tl.set("#f4_lbltxt", { opacity: 0, y: 20 }, 0);
          tl.fromTo("#f4_lbltxt", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.18, ease: "power3.out", immediateRender: false }, G1_END + 0.06);

          // 24.20: term card springs in centre-below
          tl.set("#f4_cardpos", { y: 120, scale: 0.6 }, 0);
          tl.fromTo("#f4_cardpos", { y: 120, scale: 0.6 }, { y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)", immediateRender: false }, G1_END);

          // 25.17: 3d-card-flip on Y — term → meaning (backface hidden)
          tl.set("#f4_card", { rotationY: 0 }, 0);
          tl.fromTo("#f4_card", { rotationY: 0 }, { rotationY: 180, duration: 0.4, ease: "power2.inOut", immediateRender: false }, B[10]);

          // 25.66: small landing settle on the next beat, then hold to the iris
          tl.fromTo("#f4_cardpos", { scale: 1 }, { scale: 1.03, duration: 0.1, ease: "power2.out", immediateRender: false }, B[11]);
          tl.to("#f4_cardpos", { scale: 1, duration: 0.25, ease: "power2.inOut" }, B[11] + 0.1);

          tl.set({}, {}, DUR);

          window.__timelines = window.__timelines || {};
          window.__timelines[FID] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
