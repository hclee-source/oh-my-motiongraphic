      <script>
        (function () {
          var T0 = 35.83; // span_sec[0]; frame span 35.83 → 42.71 (6.88 s)
          function L(trackT) { return Math.round((trackT - T0) * 1000) / 1000; }
          function R(t) { return Math.round(t * 1000) / 1000; }

          var A_IN = L(35.83);    // 0     — book turns in
          var A_T1 = L(36.78);    // 0.95  — title1
          var A_T2 = L(37.76);    // 1.93  — SURGE: title2 letters + title3 label box
          var A_WH = L(38.73);    // 2.90  — where-to-buy
          var A_LG = L(39.68);    // 3.85  — logo lockup
          var A_HIT = L(41.63);   // 5.80  — starburst sparkle, final hit
          var A_STILL = L(41.9);  // 6.07  — everything settled; held still to the end

          var tl = gsap.timeline({ paused: true });

          // ---- group span (single group covers the whole frame) ----
          tl.set("#f7_g1", { autoAlpha: 1 }, 0);

          // ---- start states ----
          // book starts off-left, back + spine toward camera; it swings through the spine to the front
          tl.set("#f7_book", { x: -820, y: 0, z: -600, rotationY: 150, rotationX: 14, scale: 1.08 }, 0);
          tl.set("#f7_bk_hinge", { rotationY: 0 }, 0);
          tl.set("#f7_bk_shadow", { scaleX: 0.3, opacity: 0, x: -820 }, 0);
          tl.set("#f7_t1", { yPercent: 105 }, 0);
          for (var i = 0; i < 8; i++) tl.set("#f7_c" + i, { autoAlpha: 0, y: 80 }, 0);
          tl.set("#f7_t3bg", { autoAlpha: 0, scaleX: 0 }, 0);
          tl.set("#f7_t3tx", { autoAlpha: 0 }, 0);
          tl.set("#f7_t3", { y: 0 }, 0);
          tl.set("#f7_rule", { autoAlpha: 0, scaleX: 0 }, 0);
          tl.set("#f7_where", { autoAlpha: 0, y: 26 }, 0);
          tl.set("#f7_mark", { autoAlpha: 0, scale: 0, rotation: -24 }, 0);
          tl.set("#f7_brand", { autoAlpha: 0, x: -24 }, 0);
          tl.set("#f7_burst", { autoAlpha: 0, scale: 0, rotation: -30 }, 0);

          // ---- 35.83 · book ENTER: slides in from the left, turning back → spine → front, finishing the −40° → −12° turn ----
          tl.to("#f7_book", { x: 0, z: 0, rotationY: -12, rotationX: 6, duration: 0.95, ease: "power3.out" }, A_IN);
          tl.to("#f7_bk_shadow", { x: 0, scaleX: 1.08, opacity: 1, duration: 0.95, ease: "power3.out" }, A_IN);

          // idle sway (explicit tweens, 2 beats each), returns to the rest pose on the final hit
          var SW = [
            [A_T1, A_T2, -16, -5],
            [A_T2, A_WH, -9, 0],
            [A_WH, A_LG, -15, -5],
            [A_LG, R(A_LG + 0.97), -10, 0],
            [R(A_LG + 0.97), A_HIT, -12, 0]
          ];
          for (var w = 0; w < SW.length; w++) {
            tl.to("#f7_book", { rotationY: SW[w][2], y: SW[w][3], duration: R(SW[w][1] - SW[w][0]), ease: "sine.inOut" }, SW[w][0]);
          }

          // ---- 36.78 · title1 mask reveal ----
          tl.to("#f7_t1", { yPercent: 0, duration: 0.5, ease: "expo.out" }, R(A_T1 - 0.04));

          // ---- 37.76 · SURGE · title2 kinetic-letter-in (y 80 → 0, back.out(2), 0.045 s stagger) ----
          for (i = 0; i < 8; i++) {
            var tc = R(A_T2 - 0.06 + i * 0.045);
            tl.to("#f7_c" + i, { autoAlpha: 1, y: 0, duration: 0.55, ease: "back.out(2)" }, tc);
          }
          // title3 label box snaps open from the left after the second line lands
          var A_T3 = R(A_T2 + 0.4);
          tl.set("#f7_t3bg", { autoAlpha: 1 }, A_T3);
          tl.to("#f7_t3bg", { scaleX: 1, duration: 0.12, ease: "power2.out" }, A_T3);
          tl.set("#f7_t3tx", { autoAlpha: 1 }, R(A_T3 + 0.06));
          tl.fromTo("#f7_t3", { y: 10 }, { y: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, A_T3);

          // ---- 38.73 · where-to-buy with the accent rule ----
          tl.set("#f7_rule", { autoAlpha: 1 }, R(A_WH - 0.04));
          tl.to("#f7_rule", { scaleX: 1, duration: 0.24, ease: "power3.out" }, R(A_WH - 0.04));
          tl.to("#f7_where", { autoAlpha: 1, y: 0, duration: 0.32, ease: "power3.out" }, A_WH);

          // ---- 39.68 · gold mark pops, wordmark slides in beside it ----
          tl.set("#f7_mark", { autoAlpha: 1 }, A_LG);
          tl.to("#f7_mark", { scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2.2)" }, A_LG);
          tl.to("#f7_brand", { autoAlpha: 1, x: 0, duration: 0.32, ease: "power3.out" }, R(A_LG + 0.08));

          // ---- 41.63 · final hit: starburst pops behind the book's corner, book punches ----
          tl.set("#f7_burst", { autoAlpha: 1 }, A_HIT);
          tl.to("#f7_burst", { scale: 1, rotation: 0, duration: R(A_STILL - A_HIT), ease: "back.out(1.8)" }, A_HIT);
          tl.to("#f7_book", { scale: 1.12, duration: 0.07, ease: "power2.out" }, A_HIT);
          tl.to("#f7_book", { scale: 1.08, duration: R(A_STILL - A_HIT - 0.07), ease: "power3.out" }, R(A_HIT + 0.07));

          // final pose composed and held still from 41.9 (local 6.07) to the end — no tweens after this point;
          // the host slot's data-duration (6.88) holds the last frame; the marker below makes the timeline span it too.
          tl.set({}, {}, 6.88);

          window.__timelines = window.__timelines || {};
          window.__timelines["07-f7"] = tl;
          tl.seek(0);
        })();
