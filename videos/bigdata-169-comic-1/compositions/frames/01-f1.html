        (function () {
          var FID = "01-f1";
          var DUR = 6.78;
          var F = 1 / 30;

          var tl = gsap.timeline({ paused: true });

          // ---------- 0.49 / 0.61 / 0.73: three typing dots pop on the hats ----------
          [0.49, 0.61, 0.73].forEach(function (t, i) {
            tl.fromTo("#f1_dot" + i,
              { autoAlpha: 0, scale: 0 },
              { autoAlpha: 1, scale: 1, duration: 0.16, ease: "back.out(2.4)", immediateRender: false },
              t);
          });
          tl.set(["#f1_dot0", "#f1_dot1", "#f1_dot2"], { autoAlpha: 0 }, 0.97);

          // ---------- balloon pop recipe (overlay-pop): scale 0.6→1 spring 0.3 s + blur-in text + tick ----------
          function popBalloon(sel, txtSel, tickSel, t) {
            tl.fromTo(sel, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.06, ease: "none", immediateRender: false }, t);
            tl.fromTo(sel, { scale: 0.6 }, { scale: 1, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, t);
            if (txtSel) {
              tl.fromTo(txtSel,
                { y: 14, filter: "blur(8px)" },
                { y: 0, filter: "blur(0px)", duration: 0.26, ease: "power3.out", immediateRender: false },
                t + 0.02);
              tl.set(txtSel, { filter: "none" }, t + 0.3);
            }
            if (tickSel) {
              tl.fromTo(tickSel, { scale: 0 }, { scale: 1, duration: 0.22, ease: "back.out(2.2)", immediateRender: false }, t + 0.08);
            }
          }

          // 0.97: balloon 1 '비전공자'
          popBalloon("#f1_b1", "#f1_b1_txt", "#f1_b1_tk", 0.97);
          // 1.95: balloon 2 '노베이스'
          popBalloon("#f1_b2", "#f1_b2_txt", "#f1_b2_tk", 1.95);

          // 2.93: the question balloon lands centre; letters kinetic-in, '걱정' highlighter sweep
          popBalloon("#f1_q", null, null, 2.93);
          tl.fromTo(["#f1_qc0", "#f1_qc1", "#f1_qc2", "#f1_qc3", "#f1_qc4", "#f1_qc5"],
            { opacity: 0, y: 40 },
            { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)", stagger: 0.045, immediateRender: false },
            2.97);
          tl.fromTo("#f1_q_hl", { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, 3.16);

          // 3.90: the three balloons wobble once (±2°, alternating direction by index)
          ["#f1_b1", "#f1_q", "#f1_b2"].forEach(function (sel, i) {
            var d = i % 2 === 0 ? 1 : -1;
            var t0 = 3.90 + i * 0.03;
            tl.to(sel, { rotation: 2 * d, duration: 0.1, ease: "power2.out" }, t0);
            tl.to(sel, { rotation: -2 * d, duration: 0.14, ease: "sine.inOut" }, t0 + 0.1);
            tl.to(sel, { rotation: 0, duration: 0.14, ease: "power2.out" }, t0 + 0.24);
          });

          // 4.73→4.85: the round stamp slams in (lands ON the 4.85 impact beat)
          tl.set("#f1_stamp", { autoAlpha: 1 }, 4.73);
          tl.fromTo("#f1_stamp",
            { scale: 1.6, rotation: -12 },
            { scale: 1, rotation: -12, duration: 0.12, ease: "power3.in", immediateRender: false },
            4.73);
          // landing ring
          tl.fromTo("#f1_ring",
            { autoAlpha: 0.9, scale: 1 },
            { autoAlpha: 0, scale: 1.45, duration: 0.4, ease: "power2.out", immediateRender: false },
            4.85);
          // balloons 1–2 deflate slightly
          tl.to(["#f1_b1", "#f1_b2"], { scale: 0.94, duration: 0.2, ease: "power2.out" }, 4.85);
          // 4-frame screen shake (0 ms steps)
          var shake = [[14, -9], [-12, 8], [8, -5], [-4, 3]];
          shake.forEach(function (p, i) {
            tl.set("#f1_cam", { x: p[0], y: p[1] }, 4.85 + i * F);
          });
          tl.set("#f1_cam", { x: 0, y: 0 }, 4.85 + shake.length * F);

          // 5.83: a small stamp re-punch on the beat, then hold
          tl.to("#f1_stamp", { scale: 1.05, duration: 0.08, ease: "power2.out" }, 5.83);
          tl.to("#f1_stamp", { scale: 1, duration: 0.18, ease: "power2.out" }, 5.91);

          // 6.50→6.77: speed lines streak, balloons whip off left → stamp alone on green
          for (var s = 0; s < 9; s++) {
            var ts = 6.50 + (s % 3) * 0.012 + Math.floor(s / 3) * 0.015;
            tl.fromTo("#f1_sl" + s,
              { autoAlpha: 1, scaleX: 0, x: 0 },
              { autoAlpha: 1, scaleX: 1, duration: 0.07, ease: "power2.out", immediateRender: false },
              ts);
            tl.to("#f1_sl" + s, { x: -520, autoAlpha: 0, duration: 0.12, ease: "power2.in" }, ts + 0.07);
          }
          tl.to("#f1_b1", { x: -1500, duration: 0.18, ease: "power3.in" }, 6.55);
          tl.to("#f1_q", { x: -1800, duration: 0.18, ease: "power3.in" }, 6.565);
          tl.to("#f1_b2", { x: -2300, duration: 0.18, ease: "power3.in" }, 6.58);
          tl.set(["#f1_b1", "#f1_q", "#f1_b2"], { autoAlpha: 0 }, 6.77);

          // hold the stamp alone into the hard cut
          tl.set({}, {}, DUR);

          window.__timelines = window.__timelines || {};
          window.__timelines[FID] = tl;
          tl.seek(0);
        })();
